<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballwechsel</title>
</head>
<body>
<div id="spiel"></div>
<script>
/*! spiele-kern v1 – gemeinsamer Rahmen für die Level-Spiele (TBW-Design, SCORM-tauglich, ohne Abhängigkeiten) */
(function (global) {
  'use strict';
  const VW = 960, VH = 540;
  const C = { petrol: '#003d99', petrolD: '#003585', petrol2: '#154ea5', ground: '#12438d', lime: '#2ee6a8', off: '#F5F6F4', hell: '#94a0b3', muted: '#b9c2d0', warn: '#E8A33D', err: '#F08A6E', font: 'Calibri, Carlito, "Segoe UI", Arial, sans-serif' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const CSS = `
*{box-sizing:border-box}
body{margin:0;background:#F5F6F4;color:#1f3b65;font-family:${C.font}}
.jr{max-width:1000px;margin:0 auto;padding:16px}
.jr-panel{background:${C.petrol};color:${C.off};border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.jr-hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.jr-title{flex:1;min-width:200px}
.jr-kicker{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:${C.muted}}
.jr-title strong{font-size:1.15rem}
.jr-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.jr-stats b{color:${C.lime}}
.jr-easy{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.jr-easy input{width:18px;height:18px;accent-color:${C.lime}}
.jr-pause{font:inherit;font-size:.85rem;color:${C.off};background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:.3em .7em;cursor:pointer}
.jr-stage{position:relative;border-radius:12px;overflow:hidden;background:${C.petrolD};aspect-ratio:16/9;outline:none;touch-action:manipulation}
.jr-stage:focus-visible{box-shadow:0 0 0 3px ${C.lime}}
.jr-stage canvas{display:block;width:100%;height:100%}
.jr-layer{position:absolute;inset:0;pointer-events:none}
.jr-layer>*{pointer-events:auto}
.jr-banner{margin:0 0 10px;padding:10px 16px;border-radius:10px;background:rgba(0,40,100,.45);border-left:4px solid ${C.lime};font-size:1.05rem;line-height:1.35}
.jr-banner[hidden]{display:none}
.jr-banner b{color:${C.lime}}
.jr-toast{position:absolute;left:50%;top:14px;translate:-50% 0;max-width:82%;padding:10px 16px;border-radius:12px;background:rgba(0,42,105,.92);border:1px solid ${C.lime};font-size:.98rem;line-height:1.35;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;z-index:5}
.jr-toast.on{opacity:1}
.jr-toast.err{border-color:${C.err}}
.jr-toast b{color:${C.lime}}
.jr-toast.err b{color:${C.err}}
.jr-overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,40,100,.72);z-index:10}
.jr-overlay[hidden]{display:none}
.jr-card{width:min(620px,100%);max-height:100%;overflow:auto;background:${C.petrol};border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px 22px;box-shadow:0 16px 40px rgba(0,0,0,.4);animation:jr-in .3s ease-out}
.jr-card h2{margin:.2em 0 .7em;font-size:1.25rem;line-height:1.3}
.jr-card p,.jr-card li{line-height:1.45}
.jr-card ul{padding-left:1.1em;margin:.4em 0 1em}
.jr-opts{display:grid;gap:8px}
.jr-btn{font:inherit;color:${C.off};background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:.65em 1em;cursor:pointer;text-align:left;line-height:1.3;transition:background .2s,border-color .2s}
.jr-btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.jr-btn:focus-visible,.jr-pause:focus-visible{outline:3px solid ${C.lime};outline-offset:2px}
.jr-btn:disabled{cursor:default;opacity:.5}
.jr-btn.right,.jr-btn.right:disabled{opacity:1;border-color:${C.lime};background:rgba(46,230,168,.22)}
.jr-btn.wrong{border-color:${C.err};text-decoration:line-through}
.jr-primary{background:${C.lime};color:${C.petrol};border-color:transparent;font-weight:700;text-align:center}
.jr-primary:hover:not(:disabled){background:#7bd5b7}
.jr-fb{display:flex;gap:10px;margin-top:12px}
.jr-fb:empty{display:none}
.jr-fb .sym{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.jr-fb.ok .sym{background:${C.lime};color:${C.petrol}}
.jr-fb.err .sym{background:${C.err};color:${C.petrol}}
.jr-fb.info .sym{background:rgba(255,255,255,.2)}
.jr-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.jr-actions .jr-btn{text-align:center}
.jr-list{list-style:none;padding:0;margin:.6em 0 1em}
.jr-list li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.jr-list .s{flex:none;width:1.2em;font-weight:700;color:${C.lime}}
.jr-list .miss .s{color:${C.muted}}
.jr-kpis{display:flex;gap:10px;flex-wrap:wrap;margin:.6em 0}
.jr-kpi{flex:1;min-width:120px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.2)}
.jr-kpi b{display:block;font-size:1.5rem;color:${C.lime}}
.jr-touch{display:none;justify-content:space-between;gap:10px;margin-top:10px;user-select:none;-webkit-user-select:none}
.jr-touch .grp{display:flex;gap:10px}
.jr-touch button{min-width:60px;height:56px;padding:0 10px;border-radius:14px;font:inherit;font-size:1.4rem;font-weight:700;color:${C.off};background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);touch-action:none}
.jr-touch button.on{background:${C.lime};color:${C.petrol}}
@media (hover:none),(pointer:coarse){.jr-touch{display:flex}}
.jr.easy .jr-touch{display:none}
.jr-help{margin:.7em 0 0;font-size:.85rem;color:${C.muted}}
kbd{font-family:inherit;padding:1px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.3);font-size:.85em}
@keyframes jr-in{from{opacity:0;translate:0 10px}}
@media (prefers-reduced-motion:reduce){.jr-card{animation:none}.jr-toast{transition:none}}
@media (max-width:700px){.jr-overlay{position:fixed}}
@media (max-width:560px){.jr-card{padding:14px}.jr-card h2{font-size:1.05rem}.jr-btn{padding:.5em .8em}.jr-banner{font-size:.92rem;padding:8px 12px}}
`;

  function Kern(cfg) {
    const L = cfg.level;
    const st = document.createElement('style'); st.textContent = CSS + (cfg.css || ''); document.head.appendChild(st);
    document.title = L.title || document.title;
    const host = document.getElementById('spiel') || document.body;
    const touchDef = { left: '◀', right: '▶', up: '▲', down: '▼', action: cfg.actionLabel || '●' };
    const touchL = (cfg.touch || []).filter(k => k === 'left' || k === 'right' || k === 'up' || k === 'down');
    const touchR = (cfg.touch || []).filter(k => k === 'action');
    host.innerHTML = `
<div class="jr" id="jr"><div class="jr-panel">
  <div class="jr-hud">
    <div class="jr-title"><span class="jr-kicker">${esc(cfg.kicker || 'Spiel')}</span><strong>${esc(L.title)}</strong></div>
    <div class="jr-stats" aria-live="polite">${(cfg.stats || []).map(s => `<span>${esc(s.label)} <b data-stat="${s.id}">${esc(s.init || '0')}</b></span>`).join('')}</div>
    <button class="jr-pause" type="button" data-pause>Pause</button>
    <label class="jr-easy"><input type="checkbox" data-easy> Leichter Modus</label>
  </div>
  <div class="jr-banner" hidden aria-live="polite"></div>
  <div class="jr-stage" tabindex="0" aria-label="Spielfläche">
    <canvas></canvas>
    <div class="jr-layer"></div>
    <div class="jr-toast" role="status"></div>
    <div class="jr-overlay" data-o="start"><div class="jr-card">
      <span class="jr-kicker">${esc(cfg.kicker || 'Spiel')}</span><h2>${esc(L.title)}</h2>
      <ul>${(cfg.startBullets || []).map(b => `<li>${b}</li>`).join('')}</ul>
      <p class="jr-help" style="color:inherit;opacity:.8">${cfg.controls || ''}</p>
      <div class="jr-actions">
        <button class="jr-btn" type="button" data-start="easy">${esc(cfg.easyLabel || 'Leichter Modus')}</button>
        <button class="jr-btn jr-primary" type="button" data-start="play">Los geht's</button>
      </div></div></div>
    <div class="jr-overlay" data-o="q" hidden role="dialog" aria-modal="true"><div class="jr-card">
      <span class="jr-kicker" data-q="kick"></span><h2 data-q="title"></h2>
      <div class="jr-opts" data-q="opts"></div><div class="jr-fb" data-q="fb" aria-live="polite"></div>
      <div class="jr-actions"><button class="jr-btn" type="button" data-q="solve" hidden>Lösung zeigen</button><button class="jr-btn jr-primary" type="button" data-q="go" hidden>Weiter</button></div>
    </div></div>
    <div class="jr-overlay" data-o="end" hidden><div class="jr-card">
      <span class="jr-kicker">Geschafft</span><h2 data-e="title"></h2>
      <div class="jr-kpis" data-e="kpis"></div><div data-e="list"></div>
      <div class="jr-actions"><button class="jr-btn" type="button" data-e="again">Nochmal spielen</button></div>
    </div></div>
    <div class="jr-overlay" data-o="pause" hidden><div class="jr-card" style="text-align:center"><h2>Pause</h2><div class="jr-actions" style="justify-content:center"><button class="jr-btn jr-primary" type="button" data-resume>Weiter</button></div></div></div>
  </div>
  <div class="jr-touch" aria-hidden="true">
    <div class="grp">${touchL.map(k => `<button type="button" data-k="${k}">${touchDef[k]}</button>`).join('')}</div>
    <div class="grp">${touchR.map(k => `<button type="button" data-k="${k}">${touchDef[k]}</button>`).join('')}</div>
  </div>
  <p class="jr-help">${cfg.help || 'Keine Leben, kein Zeitdruck: Fehler kosten nur einen neuen Versuch. Mit <kbd>P</kbd> pausieren.'}</p>
</div></div>`;
    const $ = s => host.querySelector(s);
    const root = $('#jr'), stage = $('.jr-stage'), cv = $('canvas'), ctx = cv.getContext('2d');
    const layer = $('.jr-layer'), bannerEl = $('.jr-banner'), toastEl = $('.jr-toast');
    const O = n => $(`[data-o="${n}"]`);

    const K = {
      VW, VH, C, ctx, layer, stage, root, level: L, esc, shuffle,
      rm: !!(global.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
      easy: false, running: false, paused: false, dialog: false, finished: false,
      keys: { left: false, right: false, up: false, down: false, action: false },
      errors: 0, firstTry: 0, revealed: false, t0: 0, t: 0,
      _edge: {}
    };
    K.take = k => { const v = !!K._edge[k]; K._edge[k] = false; return v; };

    /* Größe */
    function resize() {
      const r = stage.getBoundingClientRect(), dpr = Math.min(2, global.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
      K.scale = r.width / VW; ctx.setTransform(K.scale * dpr, 0, 0, K.scale * dpr, 0, 0);
    }
    if (global.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize', resize);

    /* HUD, Banner, Toast */
    K.stat = (id, v) => { const el = host.querySelector(`[data-stat="${id}"]`); if (el) el.textContent = v; };
    K.banner = html => { if (html) { bannerEl.innerHTML = html; bannerEl.hidden = false; stage.classList.add('has-banner'); } else { bannerEl.hidden = true; stage.classList.remove('has-banner'); } };
    let toastT;
    K.toast = (html, ms, kind) => { toastEl.innerHTML = html; toastEl.className = 'jr-toast on' + (kind === 'err' ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms || 3500); };
    K.right = (why, title) => K.toast(`<b>${esc(title || 'Richtig')}</b>${why ? '<br>' + esc(why) : ''}`, 4200);
    K.wrong = (why, title) => { K.errors++; K.toast(`<b>${esc(title || 'Nicht ganz')}</b>${why ? '<br>' + esc(why) : ''}`, 4800, 'err'); };

    /* Frage-Dialog */
    const qKick = $('[data-q="kick"]'), qTitle = $('[data-q="title"]'), qOpts = $('[data-q="opts"]'), qFb = $('[data-q="fb"]'), qSolve = $('[data-q="solve"]'), qGo = $('[data-q="go"]');
    function fb(kind, text) { qFb.className = 'jr-fb ' + kind; qFb.innerHTML = `<span class="sym" aria-hidden="true">${kind === 'ok' ? '✓' : kind === 'err' ? '✕' : 'i'}</span><span>${esc(text)}</span>`; }
    K.ask = function (q) {
      return new Promise(resolve => {
        K.dialog = true; clearKeys();
        let errs = 0, first = true, revealed = false;
        qKick.textContent = q.kicker || ''; qTitle.textContent = q.question;
        qOpts.innerHTML = ''; qFb.className = 'jr-fb'; qFb.innerHTML = ''; qSolve.hidden = true; qGo.hidden = true;
        const opts = shuffle(q.options || []);
        opts.forEach(o => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'jr-btn'; b.textContent = o.text;
          b.onclick = () => {
            if (o.correct) { b.classList.add('right'); qOpts.querySelectorAll('button').forEach(x => { x.disabled = true; }); fb('ok', o.why || 'Richtig.'); qSolve.hidden = true; qGo.hidden = false; qGo.focus(); }
            else { b.classList.add('wrong'); b.disabled = true; first = false; errs++; K.errors++; fb('err', o.why || 'Nicht ganz.'); if (errs >= 2) qSolve.hidden = false; }
          };
          qOpts.appendChild(b);
        });
        qSolve.onclick = () => {
          const ro = (q.options || []).find(o => o.correct) || {};
          qOpts.querySelectorAll('button').forEach(x => { x.disabled = true; if (x.textContent === ro.text) x.classList.add('right'); });
          fb('info', ro.why || 'Das ist die richtige Antwort.'); revealed = true; K.revealed = true; qSolve.hidden = true; qGo.hidden = false; qGo.focus();
        };
        qGo.onclick = () => { O('q').hidden = true; K.dialog = false; if (first) K.firstTry++; stage.focus(); resolve({ first, revealed }); };
        O('q').hidden = false; const f = qOpts.querySelector('button'); if (f) f.focus();
      });
    };

    /* Ende */
    K.finish = function (res) {
      if (K.finished) return; K.finished = true; K.running = false; K.banner(null);
      const ms = Date.now() - K.t0;
      const time = `${Math.floor(ms / 60000)}:${String(Math.round(ms / 1000) % 60).padStart(2, '0')}`;
      $('[data-e="title"]').textContent = res.title || 'Geschafft!';
      $('[data-e="kpis"]').innerHTML = (res.kpis || []).concat([{ v: time, l: 'Minuten' }]).map(k => `<div class="jr-kpi"><b>${esc(k.v)}</b>${esc(k.l)}</div>`).join('');
      $('[data-e="list"]').innerHTML = res.list && res.list.length ? `<p style="margin:.8em 0 .2em"><b>${esc(res.listTitle || 'Das nimmst du mit')}</b></p><ul class="jr-list">${res.list.map(x => `<li class="${x.ok === false ? 'miss' : ''}"><span class="s">${x.ok === false ? '○' : '✓'}</span><span>${esc(x.text)}</span></li>`).join('')}</ul>` : '';
      O('end').hidden = false; $('[data-e="again"]').focus();
      const detail = Object.assign({ id: L.id, type: cfg.type || 'SPIEL', solved: true, revealed: K.revealed, skipped: false, errors: K.errors, firstTry: K.firstTry, durationMs: ms }, res.detail || {});
      try { const all = JSON.parse(sessionStorage.getItem('mm-results') || '{}'); all[L.id] = { ok: 1, e: K.errors, r: K.revealed ? 1 : 0, k: 0 }; sessionStorage.setItem('mm-results', JSON.stringify(all)); } catch (e) { }
      root.dispatchEvent(new CustomEvent('minimission:complete', { bubbles: true, detail }));
      if (typeof global.onGameComplete === 'function') global.onGameComplete(detail);
      if (global.parent !== global) { try { global.parent.postMessage({ type: 'minimission:complete', detail }, '*'); } catch (e) { } }
    };

    /* Eingabe */
    const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'action', Enter: 'action' };
    function clearKeys() { Object.keys(K.keys).forEach(k => { K.keys[k] = false; }); K._edge = {}; paintTouch(); }
    addEventListener('keydown', e => {
      if (e.code === 'KeyP' && K.running) { togglePause(); return; }
      const k = KEYMAP[e.code]; if (!k || !K.running || K.dialog || K.paused) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (tag === 'BUTTON' && document.activeElement.closest('.jr-layer') && (k === 'action')) return;
      e.preventDefault();
      if (!K.keys[k]) K._edge[k] = true;
      K.keys[k] = true;
      if (cfg.key) cfg.key(K, k, true);
    });
    addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { K.keys[k] = false; if (cfg.key) cfg.key(K, k, false); } });
    addEventListener('blur', clearKeys);
    function paintTouch() { host.querySelectorAll('.jr-touch button').forEach(b => b.classList.toggle('on', !!K.keys[b.dataset.k])); }
    host.querySelectorAll('.jr-touch button').forEach(b => {
      const k = b.dataset.k;
      const on = e => { e.preventDefault(); if (!K.running || K.dialog || K.paused) return; if (!K.keys[k]) K._edge[k] = true; K.keys[k] = true; if (cfg.key) cfg.key(K, k, true); paintTouch(); };
      const off = () => { K.keys[k] = false; if (cfg.key) cfg.key(K, k, false); paintTouch(); };
      b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
    });
    cv.addEventListener('pointerdown', e => {
      if (!K.running || K.dialog || K.paused || !cfg.click) return;
      const r = cv.getBoundingClientRect(); cfg.click(K, (e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH);
    });
    cv.addEventListener('pointermove', e => {
      if (!K.running || K.dialog || K.paused || !cfg.move) return;
      const r = cv.getBoundingClientRect(); cfg.move(K, (e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH);
    });

    /* Pause, leichter Modus, Start */
    function togglePause() { if (!K.running || K.dialog) return; K.paused = !K.paused; O('pause').hidden = !K.paused; clearKeys(); if (K.paused) $('[data-resume]').focus(); else stage.focus(); }
    $('[data-pause]').onclick = togglePause; $('[data-resume]').onclick = togglePause;
    const easyBox = $('[data-easy]');
    K.setEasy = v => { K.easy = v; easyBox.checked = v; root.classList.toggle('easy', v); if (cfg.easyChanged) cfg.easyChanged(K, v); };
    easyBox.addEventListener('change', () => { K.setEasy(easyBox.checked); stage.focus(); });
    function start(easy) {
      O('start').hidden = true; O('end').hidden = true; K.setEasy(easy);
      K.running = true; K.finished = false; K.paused = false; K.errors = 0; K.firstTry = 0; K.revealed = false; K.t0 = Date.now();
      if (cfg.init) cfg.init(K);
      stage.focus();
      if (cfg.start) cfg.start(K);
    }
    host.querySelectorAll('[data-start]').forEach(b => { b.onclick = () => start(b.dataset.start === 'easy'); });
    $('[data-e="again"]').onclick = () => start(K.easy);

    /* Zeichenhilfen */
    K.rr = (x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
    K.lines = (text, maxW, size, weight) => {
      ctx.font = `${weight || 'normal'} ${size}px ${C.font}`;
      const words = String(text).split(/\s+/), out = []; let cur = '';
      words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; });
      if (cur) out.push(cur); return out;
    };
    K.textBox = (text, cx, cy, maxW, opt) => {
      opt = opt || {}; const size = opt.size || 16, lh = size * 1.22, pad = opt.pad == null ? 10 : opt.pad;
      const ls = K.lines(text, maxW - pad * 2, size, opt.weight);
      let w = 0; ls.forEach(l => { w = Math.max(w, ctx.measureText(l).width); });
      w = Math.min(maxW, w + pad * 2); const h = ls.length * lh + pad * 1.4;
      const x = cx - w / 2, y = cy - h / 2;
      if (opt.bg !== null) { ctx.fillStyle = opt.bg || C.petrol2; K.rr(x, y, w, h, opt.radius == null ? 10 : opt.radius); ctx.fill(); }
      if (opt.stroke) { ctx.strokeStyle = opt.stroke; ctx.lineWidth = opt.lw || 2; K.rr(x, y, w, h, opt.radius == null ? 10 : opt.radius); ctx.stroke(); }
      ctx.fillStyle = opt.color || C.off; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `${opt.weight || 'normal'} ${size}px ${C.font}`;
      ls.forEach((l, i) => ctx.fillText(l, cx, y + pad * .7 + lh * (i + .5)));
      return { x, y, w, h };
    };
    K.sky = () => { const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#00327f'); g.addColorStop(1, '#154ea5'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); };

    /* Schleife */
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(1 / 30, (now - last) / 1000); last = now; K.t = now / 1000;
      if (K.running && !K.paused && !K.dialog && !K.finished && cfg.update) cfg.update(K, dt);
      ctx.save(); if (cfg.draw) cfg.draw(K, K.t); ctx.restore();
      requestAnimationFrame(loop);
    }
    resize(); if (cfg.init) cfg.init(K); requestAnimationFrame(loop);
    global.Spiel = K;
    return K;
  }
  global.SpieleKern = Kern;
})(window);

</script>
<script>
/* =====================================================================
   BALLWECHSEL – Vorbild: Pong. Lernmechanik: auf Aussagen/Einwände die
   passende Antwort zurückspielen.
   Vor jedem Einwand ein echtes Aufschlagspiel: Der Ball fliegt, der
   Schläger folgt Tasten oder Maus, drei Rückschläge bringen den Einwand.
   Ein verpasster Ball kostet nichts außer einem neuen Aufschlag.
   Beim Einwand selbst gibt es kein Timing: Der Ball wartet in der Mitte,
   bis eine Antwort gewählt ist. Satzstand: Rückschlag 1, richtige
   Antwort 3 (nach Fehlversuch 1), Gegenüber punktet bei verpasstem Ball
   und unpassender Antwort. Jeder gewonnene Ballwechsel macht den Ball
   etwas schneller. Leichter Modus und „Bewegung reduzieren“: kein
   Aufschlagspiel, nur die Antworten.
   ===================================================================== */
/* LEVEL-START */
const LEVEL = {"rounds":[{"serve":"Wir brauchen je Lerntyp eine eigene Fassung des Kurses.","options":[{"text":"Vorlieben gibt es, den Nutzen dafür konnten Prüfungen nicht zeigen.","correct":true,"why":"Sachlich, ohne Vorwurf: Die Passung zum Inhalt zählt, nicht die zur Person."},{"text":"Das ist ein Mythos, den glaubt heute niemand mehr.","why":"Inhaltlich näher an der Sache, im Ton aber bloßstellend. Damit gewinnst du niemanden."},{"text":"Gute Idee, dann bauen wir drei Fassungen.","why":"Dreifacher Pflegeaufwand ohne besseren Lernerfolg."}]},{"serve":"Stell die Folien einfach online, das reicht für den Anfang.","options":[{"text":"Was sollen die Leute danach anders machen? Daran hänge ich es auf.","correct":true,"why":"Verschiebt das Gespräch vom Material zur Wirkung und bleibt anschlussfähig."},{"text":"Folien online sind reine Zeitverschwendung.","why":"Ein Urteil ohne Angebot. Der Fachbereich geht in die Verteidigung."},{"text":"In Ordnung, ich stelle sie als PDF ein.","why":"Schnell erledigt und ohne Wirkung auf das Handeln im Betrieb."}]},{"serve":"Für Übungen haben wir keine Zeit, der Kurs soll kurz sein.","options":[{"text":"Dann kürzen wir Inhalt, nicht Übung. Abrufen trägt den Rest.","correct":true,"why":"Hält die Zeit ein und schützt den Teil, der die Wirkung erzeugt."},{"text":"Ohne Übungen mache ich den Kurs nicht.","why":"Grundsätzlich richtig, als Antwort aber ein Machtwort statt eines Wegs."},{"text":"Wir lassen die Übungen weg und hängen einen Test an.","why":"Ein Test ohne vorheriges Üben misst nur, wer vorher schon Bescheid wusste."}]}],"id":"gba013","title":"Einwände im Auftragsgespräch - der Ballwechsel"};
/* LEVEL-ENDE */

SpieleKern({
  level: LEVEL, type: 'L02', kicker: 'Ballwechsel',
  stats: [{ id: 'p', label: 'Satzstand', init: '0 : 0' }, { id: 'r', label: 'Ballwechsel', init: '0/' + LEVEL.rounds.length }],
  touch: ['up', 'down', 'action'], actionLabel: 'Schlag',
  startBullets: [
    'Erst ein kurzer Ballwechsel: Halte den Ball dreimal im Spiel, dann kommt der Einwand.',
    'Dein Gegenüber spielt dir eine Aussage zu. Rechts stehen drei mögliche Antworten.',
    'Stell deinen Schläger vor die passende Antwort und schlag zurück – der Ball wartet so lange.',
    'Satzstand: Jeder Rückschlag zählt, die passende Antwort zählt dreifach. Mit jedem gewonnenen Ballwechsel wird der Ball schneller.'
  ],
  controls: 'Steuerung: <kbd>↑</kbd> <kbd>↓</kbd> oder Maus bewegen den Schläger, <kbd>Leertaste</kbd> schlägt zurück – Antworten lassen sich auch anklicken.',
  easyLabel: 'Leichter Modus (nur klicken, ohne Aufschlagspiel)',
  help: 'Keine Leben: Ein verpasster Ball bringt nur einen neuen Aufschlag, eine unpassende Antwort einen neuen Versuch. Mit <kbd>P</kbd> pausieren.',

  init(K) {
    K.s = { r: 0, slot: 1, py: 300, oy: 300, ball: { x: 70, y: 300 }, vx: 0, vy: 0, phase: 'serve', timer: .8, tw: null, opts: [], marks: [], flash: 0, flashKind: '',
      me: 0, them: 0, won: 0, rally: 0, mouseY: null };
    setRound(K);
  },
  start(K) {
    K.toast(rallyOn(K) ? 'Erst den Ball dreimal zurückschlagen: ↑ ↓ oder Maus.' : 'Klick die passende Antwort an.', 3200);
    K.stat('p', '0 : 0');
    if (rallyOn(K)) beginRally(K);
  },
  easyChanged(K, v) {
    // Umschalten mitten im Aufschlagspiel: sofort zum Einwand
    if (v && K.s.phase === 'rally') { K.s.rally = 0; K.s.mouseY = null; K.s.ball = { x: 70, y: 300 }; K.s.phase = 'serve'; K.s.timer = .5; }
  },

  update(K, dt) {
    const s = K.s;
    if (s.flash > 0) s.flash -= dt;
    if (s.phase === 'rally') { updateRally(K, dt); return; }
    if (K.take('up')) s.slot = Math.max(0, s.slot - 1);
    if (K.take('down')) s.slot = Math.min(s.opts.length - 1, s.slot + 1);
    const ty = slotY(s.slot);
    s.py += (ty - s.py) * Math.min(1, dt * 12);
    if (s.phase === 'serve') { s.timer -= dt; if (s.timer <= 0) tween(K, 'in', { x: 70, y: s.ball.y }, { x: 380, y: 300 }, .9, -60); }
    else if (s.phase === 'wait') { if (K.take('action')) hit(K); }
    if (s.tw) {
      const w = s.tw; w.u = Math.min(1, w.u + dt / w.d);
      const e = w.u < .5 ? 2 * w.u * w.u : 1 - Math.pow(-2 * w.u + 2, 2) / 2;
      s.ball.x = w.a.x + (w.b.x - w.a.x) * e; s.ball.y = w.a.y + (w.b.y - w.a.y) * e + Math.sin(Math.PI * e) * w.arc;
      if (w.u >= 1) { s.tw = null; arrive(K, w.name); }
    }
  },

  move(K, x, y) { if (K.s.phase === 'rally') K.s.mouseY = y; },
  click(K, x, y) {
    const s = K.s;
    if (s.phase === 'rally') { s.mouseY = y; return; }
    if (x < 600) return;
    for (let i = 0; i < s.opts.length; i++) if (Math.abs(y - slotY(i)) < 60) { if (s.marks[i] === 'x') return; s.slot = i; if (s.phase === 'wait') hit(K); }
  },

  draw(K, t) {
    const c = K.ctx, s = K.s, C = K.C;
    c.fillStyle = '#02327a'; c.fillRect(0, 0, 960, 540);
    c.fillStyle = 'rgba(255,255,255,.035)'; for (let x = 0; x < 600; x += 40) c.fillRect(x, 0, 1, 540);
    c.strokeStyle = 'rgba(245,246,244,.25)'; c.lineWidth = 3; c.setLineDash([12, 12]); c.beginPath(); c.moveTo(300, 80); c.lineTo(300, 530); c.stroke(); c.setLineDash([]);
    // Gegenüber
    const oy = s.phase === 'rally' ? s.oy : Math.max(120, Math.min(480, s.ball.y));
    c.fillStyle = C.hell; K.rr(40, oy - 45, 14, 90, 7); c.fill();
    // Satzstand auf der Platte
    c.fillStyle = 'rgba(245,246,244,.35)'; c.font = `bold 44px ${C.font}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(s.me + ' : ' + s.them, 300, 50);
    if (s.phase === 'rally') {
      c.fillStyle = 'rgba(245,246,244,.8)'; c.font = `bold 16px ${C.font}`;
      c.fillText(`Rückschlag ${s.rally} von ${RALLY}`, 300, 505);
    }
    // Antworten
    if (s.phase !== 'rally') s.opts.forEach((o, i) => {
      const y = slotY(i), sel = i === s.slot, m = s.marks[i];
      c.globalAlpha = m === 'x' ? .45 : 1;
      K.textBox((m === 'x' ? '✕ ' : m === 'ok' ? '✓ ' : '') + o.text, 780, y, 330, {
        size: 15, bg: m === 'ok' ? 'rgba(46,230,168,.3)' : sel ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.06)',
        stroke: m === 'ok' ? C.lime : m === 'x' ? C.err : sel ? C.lime : 'rgba(255,255,255,.2)', lw: sel ? 3 : 1.5, radius: 12, pad: 12
      });
      c.globalAlpha = 1;
    });
    // Schläger
    c.fillStyle = s.flash > 0 && s.flashKind === 'err' ? C.err : s.flash > 0 && s.flashKind === 'ok' ? C.off : C.lime;
    K.rr(572, s.py - 45, 14, 90, 7); c.fill();
    // Ball
    if (s.phase === 'rally' && !K.rm) { c.fillStyle = 'rgba(245,246,244,.25)'; c.beginPath(); c.arc(s.ball.x - s.vx * .03, s.ball.y - s.vy * .03, 9, 0, Math.PI * 2); c.fill(); }
    const bob = s.phase === 'wait' && !K.rm ? Math.sin(t * 4) * 5 : 0;
    c.fillStyle = C.off; c.beginPath(); c.arc(s.ball.x, s.ball.y + bob, 12, 0, Math.PI * 2); c.fill();
    if (s.phase === 'wait') { c.fillStyle = C.petrol; c.font = `bold 15px ${C.font}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', s.ball.x, s.ball.y + bob + 1); }
  }
});

function slotY(i) { return 170 + i * 125; }
const RALLY = 3, PADDLE = 45, PX = 572, OX = 54, TOP = 92, BOTTOM = 528;
function rallyOn(K) { return !K.easy && !K.rm; }
function speed(K) { return Math.min(700, 380 + K.s.won * 55); }
function score(K, me, them) { const s = K.s; s.me += me; s.them += them; K.stat('p', s.me + ' : ' + s.them); }
function serveBall(K) {
  const s = K.s, v = speed(K);
  s.ball = { x: OX + 20, y: s.oy }; s.vx = v; s.vy = (Math.random() * 2 - 1) * v * .45;
}
function beginRally(K) {
  const s = K.s; s.phase = 'rally'; s.rally = 0; s.oy = 300; s.py = 300; s.mouseY = null; s.tw = null;
  K.banner(`<b>Ballwechsel ${s.r + 1} von ${LEVEL.rounds.length}</b> · Aufschlag: Halte den Ball ${RALLY}-mal im Spiel, dann kommt der Einwand.`);
  serveBall(K);
}
function updateRally(K, dt) {
  const s = K.s, b = s.ball, v = speed(K);
  // Schläger: Tasten oder Maus
  if (K.keys.up || K.keys.down) s.mouseY = null; // Tasten übernehmen, sonst zieht die Maus dagegen
  if (K.keys.up) s.py -= 520 * dt;
  if (K.keys.down) s.py += 520 * dt;
  if (s.mouseY != null) s.py += (s.mouseY - s.py) * Math.min(1, dt * 14);
  s.py = Math.max(TOP + PADDLE, Math.min(BOTTOM - PADDLE, s.py));
  // Gegenüber folgt dem Ball, aber träge
  s.oy += (b.y - s.oy) * Math.min(1, dt * (b.vx < 0 ? 6 : 2.5));
  s.oy = Math.max(TOP + PADDLE, Math.min(BOTTOM - PADDLE, s.oy));
  b.x += s.vx * dt; b.y += s.vy * dt;
  if (b.y < TOP + 12) { b.y = TOP + 12; s.vy = Math.abs(s.vy); }
  if (b.y > BOTTOM - 12) { b.y = BOTTOM - 12; s.vy = -Math.abs(s.vy); }
  // Rückschlag: Ball erreicht den eigenen Schläger
  if (s.vx > 0 && b.x >= PX - 12 && b.x <= PX + 20) {
    if (Math.abs(b.y - s.py) <= PADDLE + 12) {
      const off = (b.y - s.py) / PADDLE; // Treffpunkt bestimmt den Winkel
      s.vx = -v; s.vy = off * v * .8; b.x = PX - 13; s.rally++; s.flash = .25; s.flashKind = 'ok';
      score(K, 1, 0);
      if (s.rally >= RALLY) { K.toast('Aufschlag gewonnen – jetzt kommt der Einwand.', 2200); s.phase = 'serve'; s.timer = .9; s.ball = { x: 70, y: 300 }; s.mouseY = null; K._edge = {}; K.banner(bannerText(K)); return; }
    }
  }
  // Gegenüber schlägt zurück
  if (s.vx < 0 && b.x <= OX + 12) {
    const off = (b.y - s.oy) / PADDLE;
    s.vx = v; s.vy = Math.max(-v * .8, Math.min(v * .8, off * v * .8 + (Math.random() - .5) * 80)); b.x = OX + 13;
  }
  // Verpasst: nur ein neuer Aufschlag
  if (b.x > 990) { score(K, 0, 1); s.rally = 0; s.flash = .5; s.flashKind = 'err'; K.toast('Durch – neuer Aufschlag.', 1500, 'err'); serveBall(K); }
}
function bannerText(K) { const s = K.s, r = LEVEL.rounds[s.r]; return `<b>Ballwechsel ${s.r + 1} von ${LEVEL.rounds.length}</b> · Dein Gegenüber: ${K.esc(r.serve)}`; }
function setRound(K) {
  const s = K.s, r = LEVEL.rounds[s.r];
  s.opts = K.shuffle(r.options); s.marks = s.opts.map(() => ''); s.slot = Math.min(1, s.opts.length - 1);
  K.banner(bannerText(K));
}
function tween(K, name, a, b, d, arc) { K.s.tw = { name, a, b, d: K.rm ? d * .5 : d, arc: arc || 0, u: 0 }; K.s.phase = name; }
function hit(K) {
  const s = K.s; if (s.phase !== 'wait' || s.marks[s.slot] === 'x') return;
  tween(K, 'out', { x: s.ball.x, y: s.ball.y }, { x: 560, y: slotY(s.slot) }, .6, 0);
}
function arrive(K, name) {
  const s = K.s, o = s.opts[s.slot];
  if (name === 'in') { s.phase = 'wait'; return; }
  if (name === 'out') {
    if (o.correct) {
      s.marks[s.slot] = 'ok'; const clean = !s.marks.includes('x'); if (clean) K.firstTry++;
      score(K, clean ? 3 : 1, 0); s.won++;
      K.right(o.why); tween(K, 'back', { x: 560, y: s.ball.y }, { x: 70, y: 300 }, 1.0, -80);
    } else {
      s.marks[s.slot] = 'x'; s.flash = .6; s.flashKind = 'err'; K.wrong(o.why, 'Durchgerutscht'); score(K, 0, 1);
      tween(K, 'miss', { x: 560, y: s.ball.y }, { x: 1000, y: s.ball.y + 30 }, .5, 0);
      const free = s.opts.findIndex((_, i) => s.marks[i] !== 'x'); s.slot = free;
    }
    return;
  }
  if (name === 'miss') { s.ball = { x: 70, y: 300 }; s.phase = 'serve'; s.timer = .8; return; }
  if (name === 'back') {
    s.r++; K.stat('r', s.r + '/' + LEVEL.rounds.length);
    if (s.r >= LEVEL.rounds.length) {
      K.finish({ title: s.me > s.them ? `Satz gewonnen ${s.me} : ${s.them}!` : `Satz beendet ${s.me} : ${s.them}`, detail: { rounds: LEVEL.rounds.length, score: [s.me, s.them] },
        kpis: [{ v: s.me + ' : ' + s.them, l: 'Satzstand' }, { v: K.firstTry + '/' + LEVEL.rounds.length, l: 'Ballwechsel beim ersten Versuch' }],
        listTitle: 'Deine besten Antworten', list: LEVEL.rounds.map(r => ({ text: (r.options.find(o => o.correct) || {}).text })) });
      return;
    }
    setRound(K);
    if (rallyOn(K)) beginRally(K); else { s.phase = 'serve'; s.timer = .5; }
  }
}
