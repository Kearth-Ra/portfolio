.kp-lev-bar { height: 12px; border-radius: 6px; background: var(--kp-line); overflow: hidden; }
.kp-lev-bar i { display: block; height: 100%; border-radius: 6px; background: color-mix(in srgb, var(--kp-accent) calc(var(--kp-lev-t, 1) * 100%), var(--kp-primary)); transition: width .25s var(--kp-ease-out, ease); }
.kp-lev-band { margin: 4px 0 0; font-weight: 700; font-size: 18px; }
.kp-lev-text { font-size: 15px; }
.kp-lev-hint { margin: 10px 0 0; font-size: 14px; color: var(--kp-muted); }
@media (max-width: 720px) { .kp-lev-split { grid-template-columns: 1fr; } }

/* ---------- Chat ---------- */
.kp-chat-intro { margin-bottom: 12px; }
.kp-chat-phone { max-width: none; border: 1px solid var(--kp-line); border-radius: calc(var(--kp-radius) + 6px); background: var(--kp-surface); overflow: hidden; }
.kp-chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--kp-line); }
.kp-chat-head b { display: block; }
.kp-chat-head small { display: block; font-size: 13px; color: var(--kp-muted); }
.kp-chat-av { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--kp-text); color: var(--kp-surface); font-weight: 700; font-size: 14px; }
.kp-chat-log { display: flex; flex-direction: column; gap: 8px; padding: 16px; max-height: min(420px, 48vh); overflow-y: auto; background: color-mix(in srgb, var(--kp-primary) 4%, var(--kp-surface)); }
.kp-chat-msg { max-width: min(78%, 640px); padding: 10px 14px; border-radius: 16px; line-height: 1.45; animation: kp-fade .3s both; }
.kp-chat-them { align-self: flex-start; background: var(--kp-surface); border: 1px solid var(--kp-line); border-bottom-left-radius: 4px; }
/* Eigene Nachricht: getönte Fläche mit Textfarbe, damit der Kontrast in jedem Stil reicht (Weiß auf hellem Blau wären nur 3,6 : 1) */
.kp-chat-me { align-self: flex-end; background: color-mix(in srgb, var(--kp-primary) 16%, var(--kp-surface)); color: var(--kp-text); border: 1px solid color-mix(in srgb, var(--kp-primary) 40%, var(--kp-surface)); border-bottom-right-radius: 4px; }
.kp-chat-undo { opacity: .6; text-decoration: line-through; }
.kp-chat-note { align-self: center; max-width: 92%; font-size: 14px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--kp-accent) 12%, var(--kp-surface)); }
.kp-chat-note p { margin: 4px 0 0; font-weight: 600; }
.kp-chat-choices { display: grid; gap: 8px; padding: 14px 16px 16px; border-top: 1px solid var(--kp-line); }
.kp-chat-ask { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-muted); }
.kp-chat-opt { font: inherit; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--kp-line); background: var(--kp-surface); color: var(--kp-text); cursor: pointer; }
.kp-chat-opt:hover:not(:disabled), .kp-chat-opt:focus-visible { border-color: var(--kp-accent); }
.kp-chat-opt:disabled { opacity: .45; cursor: default; text-decoration: line-through; }
.kp-chat-end { padding: 14px 16px 16px; border-top: 1px solid var(--kp-line); }

/* ---------- Matrix ---------- */
.kp-mx-split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, 1fr); gap: 20px; align-items: start; }
.kp-mx-wrap { position: relative; width: min(100%, calc(min(420px, 52vh) * 4 / 3 + 26px)); padding: 0 0 26px 26px; box-sizing: border-box; }
.kp-mx-field { position: relative; aspect-ratio: 4 / 3; width: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; border: 1px solid var(--kp-line); border-radius: var(--kp-radius); background: var(--kp-surface); overflow: hidden; }
.kp-mx-field.is-armed { cursor: crosshair; }
.kp-mx-quad { display: flex; align-items: flex-start; justify-content: flex-start; padding: 10px 12px; font-size: 13px; font-weight: 700; color: var(--kp-muted); pointer-events: none; }
.kp-mx-quad-0, .kp-mx-quad-2 { border-right: 1px dashed var(--kp-line); }
.kp-mx-quad-0, .kp-mx-quad-1 { border-bottom: 1px dashed var(--kp-line); }
.kp-mx-quad-1 { justify-content: flex-end; text-align: right; }
.kp-mx-quad-2 { align-items: flex-end; }
.kp-mx-quad-3 { align-items: flex-end; justify-content: flex-end; text-align: right; }
.kp-mx-ax { position: absolute; font-size: 12px; font-weight: 600; color: var(--kp-muted); }
.kp-mx-xl { left: 26px; bottom: 4px; } .kp-mx-xh { right: 0; bottom: 4px; }
.kp-mx-yh, .kp-mx-yl { left: 4px; writing-mode: vertical-rl; transform: rotate(180deg); }
.kp-mx-yh { top: 0; } .kp-mx-yl { bottom: 26px; }
.kp-mx-dot { position: absolute; display: inline-grid; place-items: center; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; font-size: 12px; font-weight: 700; pointer-events: none; z-index: 2; }
.kp-mx-mine { background: var(--kp-text); color: var(--kp-surface); }
.kp-mx-exp { background: var(--kp-surface); color: var(--kp-accent-ink, var(--kp-accent)); border: 2px solid var(--kp-accent); }
.kp-mx-legend .kp-mx-dot { position: static; margin: 0 4px 0 0; }
.kp-mx-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.kp-mx-lines line { stroke: var(--kp-accent); stroke-width: .5; stroke-dasharray: 1.5 1.5; vector-effect: non-scaling-stroke; }
.kp-mx-drop { position: absolute; z-index: 3; width: 50%; height: 50%; opacity: 0; font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--kp-text); cursor: crosshair; }
.kp-mx-drop:focus-visible { opacity: 1; background: color-mix(in srgb, var(--kp-accent) 14%, transparent); outline: 2px solid var(--kp-accent); outline-offset: -4px; }
.kp-mx-drop-0 { left: 0; top: 0; } .kp-mx-drop-1 { right: 0; top: 0; } .kp-mx-drop-2 { left: 0; bottom: 0; } .kp-mx-drop-3 { right: 0; bottom: 0; }
.kp-mx-side { display: grid; gap: 10px; }
.kp-mx-eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-muted); }
.kp-mx-help { margin: 0; font-size: 15px; }
.kp-mx-chips { display: grid; gap: 8px; }
.kp-mx-chip { display: flex; align-items: center; gap: 10px; font: inherit; text-align: left; padding: 9px 12px; border: 1px solid var(--kp-line); border-radius: 10px; background: var(--kp-surface); color: var(--kp-text); cursor: pointer; }
.kp-mx-chip span { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--kp-line); font-size: 12px; font-weight: 700; }
.kp-mx-chip.is-placed span { background: var(--kp-text); color: var(--kp-surface); }
.kp-mx-chip.is-sel { border-color: var(--kp-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--kp-accent) 35%, transparent); }
.kp-mx-list { margin: 0; padding-left: 1.2em; display: grid; gap: 10px; }
.kp-mx-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.kp-mx-tag.ok { background: color-mix(in srgb, var(--kp-ok) 18%, var(--kp-surface)); }
.kp-mx-tag.no { background: color-mix(in srgb, var(--kp-no) 16%, var(--kp-surface)); }
@media (max-width: 720px) { .kp-mx-split { grid-template-columns: 1fr; } }

/* ---------- Bereichsschätzung ---------- */
.kp-range-lead { margin: 4px 0 8px; font-weight: 600; }
.kp-range-end { min-width: 32px; font-size: 14px; color: var(--kp-muted); }
.kp-range-verdict { margin: 0 0 10px; font-weight: 700; }
.kp-range-verdict { color: var(--kp-text); }
.kp-range-verdict.ok::before { content: "✓ "; color: var(--kp-ok); } .kp-range-verdict.no::before { content: "✕ "; color: var(--kp-no); }
.kp-range-scale { position: relative; height: 14px; margin: 6px 0 8px; border-radius: 7px; background: var(--kp-line); }
.kp-range-band { position: absolute; top: 0; bottom: 0; border-radius: 7px; background: color-mix(in srgb, var(--kp-primary) 55%, transparent); }
.kp-range-true { position: absolute; top: -5px; width: 4px; height: 24px; margin-left: -2px; border-radius: 2px; background: var(--kp-accent); }
.kp-range-nums { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-size: 15px; }
.kp-range-calib { margin: 0 0 10px; font-size: 14px; color: var(--kp-muted); }

/* ---------- Umschreiben: Vorher, deine Fassung, Musterfassung ---------- */
.kp-rw-before { margin: 0 0 12px; padding: 12px 16px; border: 1px dashed var(--kp-line); border-radius: var(--kp-radius); }
.kp-rw-before .kp-text { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--kp-no) 60%, transparent); }
.kp-rw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.kp-rw-col { padding: 14px 16px; border-radius: var(--kp-radius); border: 1px solid var(--kp-line); background: var(--kp-surface); }
.kp-rw-col p { margin: 0; }
.kp-rw-old { opacity: .75; }
.kp-rw-model { border-color: var(--kp-accent); }
@media (max-width: 720px) { .kp-rw { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .kp-tri-split { grid-template-columns: 1fr; } .kp-tri-board { order: 2; } }
.kp-sortcats { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 22px 24px; box-shadow: var(--kp-shadow); }
.kp-sort-hint { color: var(--kp-muted); font-size: 14px; margin: 0 0 14px; }
.kp-sort-pool { border: 2px dashed var(--kp-line); border-radius: var(--kp-radius); padding: 10px; margin-bottom: 18px; min-height: 64px; }
.kp-sort-pool.kp-over, .kp-sort-cat.kp-over { border-color: var(--kp-primary); background: color-mix(in srgb, var(--kp-primary) 8%, white); }
.kp-sort-pool ul, .kp-sort-cat ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
.kp-sort-cat ul { flex-direction: column; }
.kp-sort-item { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--kp-line); border-radius: 10px; padding: 10px 12px; cursor: grab; font-size: 15px; }
.kp-sort-item.kp-dragging { opacity: .4; }
.kp-sort-item.kp-right { border-color: var(--kp-ok); background: #e9f5ee; }
.kp-sort-item.kp-wrong { border-color: var(--kp-no); background: #fbeceb; }
.kp-sort-fix { font-weight: 400; font-size: 13px; color: var(--kp-muted); }
.kp-sort-move { display: flex; gap: 4px; margin-left: auto; }
.kp-sort-move button { min-width: 28px; min-height: 28px; border: 1px solid var(--kp-line); background: var(--kp-bg); border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; color: var(--kp-primary); }
.kp-sort-move button:disabled { opacity: .35; cursor: default; }
.kp-sort-cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kp-sort-cat { border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 12px; background: var(--kp-bg); }
.kp-sort-cat-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-weight: 600; }
.kp-sort-empty { color: var(--kp-muted); font-size: 13px; list-style: none; }
.kp-process { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 22px 24px; box-shadow: var(--kp-shadow); }
.kp-proc-nav { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; }
.kp-proc-nav button { display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; background: var(--kp-bg); border: 1px solid var(--kp-line); border-radius: 999px; padding: 7px 14px; cursor: pointer; color: var(--kp-text); min-height: 32px; }
.kp-proc-nav button span { width: 22px; height: 22px; border-radius: 50%; background: var(--kp-line); color: var(--kp-text); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.kp-proc-nav button.current { border-color: var(--kp-primary); background: color-mix(in srgb, var(--kp-primary) 10%, white); font-weight: 600; }
.kp-proc-nav button.current span, .kp-proc-nav button.done span { background: var(--kp-primary); color: #fff; }
.kp-proc-body { display: grid; grid-template-columns: 1fr; gap: 18px; }
.kp-proc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.kp-proc-item { display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: start; padding-bottom: 14px; border-bottom: 1px solid var(--kp-line); }
.kp-proc-item:last-child { border-bottom: 0; padding-bottom: 0; }
.kp-proc-item .kp-proc-media { grid-column: 2; }
.kp-proc-num { width: 32px; height: 32px; border-radius: 50%; background: var(--kp-primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.kp-proc-item .kp-proc-title { margin: 4px 0 4px; }
.kp-proc-item .kp-text p { margin: 0; }
.kp-proc-new { animation: kp-fade .45s var(--kp-ease-out, ease-out) both; }
.kp-proc-count { opacity: .75; font-weight: 400; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { .kp-proc-new { animation: none; } }
.kp-proc-body:has(.kp-proc-media) { grid-template-columns: 1fr 1fr; align-items: center; }
.kp-proc-media img { width: 100%; border-radius: var(--kp-radius); display: block; object-fit: cover; }
.kp-proc-title { font-size: 20px; margin: 0 0 8px; font-family: var(--kp-font-head, var(--kp-font)); }
.kp-gate { text-align: center; padding: 22px; border-top: 1px solid var(--kp-line); border-bottom: 1px solid var(--kp-line); }
.kp-gate .kp-text { margin-bottom: 14px; color: var(--kp-muted); }
.kp-gate-open { display: none; }
.kp-block.kp-hidden { display: none; }
.kp-files ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.kp-files a { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); text-decoration: none; color: inherit; min-height: 44px; }
.kp-files a:hover { border-color: var(--kp-primary); }
.kp-files a > span { display: grid; }
.kp-files em { font-style: normal; color: var(--kp-muted); font-size: 14px; }
.kp-file-dl { margin-left: auto; color: var(--kp-primary); font-weight: 600; font-size: 14px; }

/* ---------- Karten in Farbe, Einschub, nummerierte Agenda ---------- */
.kp-card-primary { background: var(--kp-primary) !important; color: #fff; }
.kp-card-primary .kp-hero-title, .kp-card-primary .kp-guide-name, .kp-card-primary .kp-text, .kp-card-primary .kp-hero-meta { color: #fff; }
.kp-card-primary .kp-eyebrow, .kp-card-primary .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
.kp-card-primary .kp-ico-lg, .kp-card-primary .kp-hero-meta .kp-ico { color: #fff; }
.kp-card-dark { background: #10161f !important; color: #fff; }
.kp-card-dark .kp-hero-title, .kp-card-dark .kp-guide-name, .kp-card-dark .kp-text, .kp-card-dark .kp-hero-meta, .kp-card-dark .kp-ico-lg { color: #fff; }
.kp-card-dark .kp-eyebrow, .kp-card-dark .kp-accent { color: color-mix(in srgb, var(--kp-accent) 55%, white); }
.kp-card-glass { background: rgba(255,255,255,.82) !important; backdrop-filter: blur(10px); }
/* Helle Karte (weiß oder Glas) auf dunklem Abschnitt: die Schrift bleibt dunkel, sonst steht Weiß auf Weiß (Sichtpruefung) */
.kp-on-dark :is(.kp-card-white, .kp-card-glass), .kp-on-dark :is(.kp-card-white, .kp-card-glass) :is(.kp-text, .kp-hero-title, .kp-guide-name, .kp-hero-meta, .kp-label, h1, h2, h3, .kp-callout) { color: var(--kp-text); }
.kp-on-dark :is(.kp-card-white, .kp-card-glass) .kp-eyebrow, .kp-on-dark :is(.kp-card-white, .kp-card-glass) .kp-accent { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-on-dark :is(.kp-card-white, .kp-card-glass) .kp-text a { color: var(--kp-accent-ink, var(--kp-primary)); }
.kp-card-glassdark { background: rgba(14,20,30,.62) !important; backdrop-filter: blur(10px); color: #fff; }
.kp-card-glassdark .kp-hero-title, .kp-card-glassdark .kp-guide-name, .kp-card-glassdark .kp-text, .kp-card-glassdark .kp-hero-meta, .kp-card-glassdark .kp-ico-lg { color: #fff; }
.kp-card-glassdark .kp-eyebrow, .kp-card-glassdark .kp-accent { color: color-mix(in srgb, var(--kp-accent) 55%, white); }
.kp-callout { display: flex; gap: 12px; align-items: flex-start; margin-top: 18px; padding: 14px 18px; border-radius: calc(var(--kp-radius) + 4px); background: color-mix(in srgb, var(--kp-primary) 10%, white); font-size: 16px; }
.kp-callout .kp-ico { flex: none; margin-top: 3px; color: var(--kp-primary); }
.kp-card-primary .kp-callout, .kp-card-dark .kp-callout, .kp-card-glassdark .kp-callout { background: rgba(255,255,255,.16); }
.kp-card-primary .kp-callout .kp-ico, .kp-card-dark .kp-callout .kp-ico, .kp-card-glassdark .kp-callout .kp-ico { color: #fff; }
.kp-agenda-num li .kp-num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--kp-primary) 12%, white); color: var(--kp-primary); }

/* ---------- Menschen: Team, Video-Statements, Videoszene ---------- */
.kp-person-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.kp-person { perspective: 1200px; }
.kp-person-inner { position: relative; transform-style: preserve-3d; transition: transform .5s; }
.kp-person-flip { cursor: pointer; }
.kp-person-flip:hover .kp-person-inner, .kp-person.flipped .kp-person-inner, .kp-person-flip:focus-visible .kp-person-inner { transform: rotateY(180deg); }
.kp-person-front, .kp-person-back { backface-visibility: hidden; background: var(--kp-surface); border-radius: var(--kp-radius); overflow: hidden; box-shadow: var(--kp-shadow); }
.kp-person-back { position: absolute; inset: 0; transform: rotateY(180deg); padding: 20px 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; font-size: 15px; overflow: auto; }
.kp-person-media { aspect-ratio: 4 / 5; background: #eef2f6; }
.kp-person-media img, .kp-person-media svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.kp-person-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; font-family: var(--kp-font-head, var(--kp-font)); font-weight: 600; }
.kp-person-flipicon { color: var(--kp-muted); flex: none; }
.kp-vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
.kp-vcard { margin: 0; background: var(--kp-surface); border-radius: var(--kp-radius); overflow: hidden; box-shadow: var(--kp-shadow); display: flex; flex-direction: column; }
.kp-vcard-head { display: grid; gap: 2px; padding: 14px 18px 10px; }
.kp-vcard-head strong { font-family: var(--kp-font-head, var(--kp-font)); font-size: 17px; }
.kp-vcard-head span { color: var(--kp-muted); font-size: 13px; }
.kp-vcard video, .kp-vcard .kp-embed { width: 100%; display: block; background: #0c121c; }
.kp-vcard-text { padding: 14px 18px; font-size: 15px; }
.kp-transcript { margin: 0 14px 14px; font-size: 14px; }
.kp-vscene { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 18px; box-shadow: var(--kp-shadow); }
.kp-vscene-stage video, .kp-vscene-stage .kp-photo-empty { width: 100%; border-radius: var(--kp-radius); background: #0c121c; max-height: 60vh; }
.kp-vscene-meta { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; }
.kp-vscene-step { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-vscene-text { margin-top: 10px; }

/* ---------- Große Zahl ---------- */
.kp-bignum { text-align: center; padding: 28px 24px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-primary) 8%, white); }
.kp-bignum-photo { background-size: cover; background-position: center; color: #fff; }
.kp-bignum-photo .kp-eyebrow, .kp-bignum-photo .kp-text, .kp-bignum-photo .kp-bignum-source { color: #fff; }
.kp-bignum-value { font-family: var(--kp-font-head, var(--kp-font)); font-size: clamp(56px, 12vw, 128px); line-height: 1; margin: 0; color: var(--kp-primary); display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.kp-bignum-photo .kp-bignum-value { color: #fff; }
.kp-bignum-value em { font-style: normal; font-size: .45em; }
.kp-bignum-text { max-width: 620px; margin: 18px auto 0; font-size: 18px; }
.kp-bignum-source { font-size: 12px; color: var(--kp-muted); margin: 16px 0 0; }
/* Auf Hauptfarbe oder dunklem Grund wird die Karte durchscheinend und die Schrift hell – sonst steht weißer Text auf heller Karte */
.kp-bg-primary .kp-bignum, .kp-on-dark .kp-bignum { background: rgba(255,255,255,.1); }
.kp-bg-primary .kp-bignum-value, .kp-bg-primary .kp-bignum-text, .kp-bg-primary .kp-bignum .kp-text, .kp-bg-primary .kp-bignum-source { color: #fff; }
.kp-on-dark .kp-bignum-text, .kp-on-dark .kp-bignum .kp-text { color: #fff; }

/* ---------- Punkte im Bild ---------- */
.kp-hs-stage { position: relative; border-radius: var(--kp-radius); overflow: hidden; }
/* Bildschirmfüllend: das Bild liegt randlos über der ganzen Fläche, Kopf, Leiste und
   Erklärung schweben darüber. Kein Innenabstand, keine Rundung, kein Rand. */
/* Randlos heißt auch: über die Lesebreite hinaus, ganz gleich was am Abschnitt eingestellt ist */
.kp-block:has(.kp-hs-cover) { padding: 0; margin-left: calc(50% - var(--kp-half, 50vw)); margin-right: calc(50% - var(--kp-half, 50vw)); }
/* Level-Spiel bildschirmfuellend: der Rahmen laeuft ueber die ganze Breite und
   bekommt die volle Hoehe, damit Spielfeld und Steuerleiste ohne Scrollen passen. */
.kp-block:has(.kp-game-cover) { padding: 0; margin-left: calc(50% - var(--kp-half, 50vw)); margin-right: calc(50% - var(--kp-half, 50vw)); }
.kp-game-cover { position: relative; }
.kp-game-cover iframe { height: calc(100svh - var(--kp-navh, 0px) - var(--kp-headh, 0px)); max-height: none; border-radius: 0; box-shadow: none; }
.kp-game-cover .kp-game-done { position: absolute; z-index: 3; margin: 12px 0 0 16px; color: #fff; }
.kp-hs-cover { position: relative; min-height: calc(100svh - var(--kp-navh, 0px) - var(--kp-headh, 0px)); }
.kp-hs-cover .kp-hs-stage { position: absolute; inset: 0; border-radius: 0; }
.kp-hs-cover .kp-hs-zoom { position: absolute; inset: 0; }
.kp-hs-cover .kp-hs-stage img { width: 100%; height: 100%; object-fit: cover; }
.kp-hs-cover .kp-photo-empty { height: 100%; }
.kp-hs-cover .kp-sec-head { position: absolute; left: 0; right: 0; top: 0; z-index: 4; margin: 0; max-width: none; padding: 22px 24px 40px; text-align: center; background: linear-gradient(rgba(6,10,18,.82), rgba(6,10,18,.45) 60%, transparent); pointer-events: none; }
.kp-hs-cover .kp-sec-head .kp-sec-title { color: #fff; max-width: 900px; margin: 0 auto; text-shadow: 0 1px 14px rgba(6,10,18,.6); }
.kp-hs-cover .kp-sec-head .kp-eyebrow { color: color-mix(in srgb, var(--kp-accent) 55%, white); }
/* Links unten sitzt das KI-Kennzeichen: der Hinweis rückt daneben, statt darunter zu verschwinden */
.kp-hs-cover .kp-hs-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; margin: 0; padding: 64px 24px 20px 200px; background: linear-gradient(transparent, rgba(6,10,18,.62) 45%, rgba(6,10,18,.96)); color: #fff; }
.kp-hs-cover .kp-hs-bar :where(.kp-hs-hint, .kp-hs-count) { text-shadow: 0 1px 10px rgba(6,10,18,.9), 0 0 26px rgba(6,10,18,.8); }
.kp-hs-cover .kp-hs-hint, .kp-hs-cover .kp-hs-count { color: rgba(255,255,255,.92); }
.kp-hs-cover .kp-hs-tour { color: #fff; border-color: #fff; background: transparent; }
.kp-hs-cover .kp-hs-tour:hover { background: #fff; color: var(--kp-primary); }
.kp-hs-cover .kp-hs-info { position: absolute; z-index: 5; left: 24px; top: 50%; transform: translateY(-50%); margin: 0; width: min(420px, calc(100% - 48px)); max-height: min(70%, 520px); overflow: auto; }
@media (max-width: 760px) {
  .kp-hs-cover .kp-hs-info { left: 16px; right: 16px; width: auto; top: auto; bottom: 110px; transform: none; max-height: 46%; }
  .kp-hs-cover .kp-sec-head { padding: 16px 16px 32px; }
  .kp-hs-cover .kp-hs-bar { padding: 32px 16px 56px; }
}
.kp-hs-stage img { display: block; width: 100%; }
.kp-hs-dot { position: absolute; transform: translate(-50%, -50%); width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; background: var(--kp-primary); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.3); animation: kp-pulse 2.6s infinite; }
.kp-hs-dot.open { background: var(--kp-accent); animation: none; }
@keyframes kp-pulse { 0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,.3); } 50% { box-shadow: 0 4px 14px rgba(0,0,0,.3), 0 0 0 10px color-mix(in srgb, var(--kp-primary) 22%, transparent); } }
@media (prefers-reduced-motion: reduce) { .kp-hs-dot { animation: none; } }
.kp-hs-info { margin-top: 14px; padding: 18px 20px; border-radius: var(--kp-radius); background: var(--kp-surface); box-shadow: var(--kp-shadow); animation: kp-fade .3s both; }
.kp-hs-info h3 { margin: 0 0 6px; font-size: 18px; }
.kp-hs-hint { margin: 0; color: var(--kp-muted); font-size: 14px; }
.kp-hs-detail { width: 100%; max-width: 360px; border-radius: var(--kp-radius); display: block; margin: 0 0 12px; }
.kp-hs-dot.seen { border-color: var(--kp-accent); }
/* Punkt als Tür in einen Raum (points[].target) sowie Nummern und beschriftete Fähnchen */
.kp-hs-dot.kp-hs-door { background: var(--kp-accent); font-size: 17px; animation: none; }
.kp-hs-dot.kp-hs-door.seen { background: var(--kp-primary); border-color: #fff; opacity: .85; }
.kp-hs-dot.kp-hs-m-nummer { font-size: 16px; font-weight: 700; animation: none; }
.kp-hs-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--kp-muted); }
.kp-hs-step { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-size: 17px; line-height: 1; cursor: pointer; }
.kp-hs-step:is(:hover, :focus-visible) { filter: brightness(1.08); }
.kp-hs-label { position: absolute; transform: translate(4%, -50%); margin-left: 22px; z-index: 3; max-width: 42%; padding: 5px 10px; border-radius: 6px; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-size: clamp(12px, 1.2vw, 15px); font-weight: 600; line-height: 1.25; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.kp-hs-label.left { transform: translate(-104%, -50%); margin-left: -22px; }
.kp-hs-mk-fahne .kp-hs-dot { width: 26px; height: 26px; font-size: 15px; }
.kp-hs-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 12px; }
.kp-hs-count { font-size: 13px; font-weight: 600; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-hs-tour { margin-left: auto; padding: 8px 16px; font-size: 14px; }
/* Bild zoomt sanft auf die gewählte Stelle */
.kp-hs-zoom { transition: transform .6s cubic-bezier(.2,.7,.3,1); }
/* Spotlight: alles außer der Stelle wird abgedunkelt */
.kp-hs-veil { position: absolute; inset: 0; pointer-events: none; background: rgba(10,14,20,.72); animation: kp-fade .3s both;
  -webkit-mask: radial-gradient(ellipse var(--w) var(--h) at var(--x) var(--y), transparent 60%, #000 100%);
  mask: radial-gradient(ellipse var(--w) var(--h) at var(--x) var(--y), transparent 60%, #000 100%); }
.kp-hs-frame { position: absolute; transform: translate(-50%, -50%); border: 3px solid var(--kp-accent); border-radius: 10px; pointer-events: none; animation: kp-frame-in .45s cubic-bezier(.2,.7,.3,1) both; }
@keyframes kp-frame-in { from { opacity: 0; transform: translate(-50%, -50%) scale(1.25); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
/* Sprechblase direkt am Punkt */
.kp-hs-pop { position: absolute; z-index: 3; width: min(300px, 70%); transform: translate(12px, 12px); background: var(--kp-surface); color: var(--kp-text); border-radius: var(--kp-radius); box-shadow: 0 12px 34px rgba(10,14,20,.35); padding: 14px 16px; animation: kp-pop-in .28s cubic-bezier(.2,.8,.3,1) both; }
.kp-hs-pop.left { transform: translate(calc(-100% - 12px), 12px); }
.kp-hs-pop.up { transform: translate(12px, calc(-100% - 12px)); }
.kp-hs-pop.left.up { transform: translate(calc(-100% - 12px), calc(-100% - 12px)); }
.kp-hs-pop h3 { margin: 0 0 4px; font-size: 16px; }
.kp-hs-pop .kp-text { font-size: 14px; }
.kp-hs-pop img { width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; }
@keyframes kp-pop-in { from { opacity: 0; scale: .9; } to { opacity: 1; scale: 1; } }
@media (max-width: 760px) { .kp-hs-pop { width: 76%; } .kp-hs-tour { margin-left: 0; } }

/* Schichten über einem Bild */
.kp-ly-stage { position: relative; border-radius: var(--kp-radius); overflow: hidden; }
.kp-ly-stage > img { display: block; width: 100%; }
.kp-ly-over, .kp-ly-tint { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s; }
.kp-ly-over.on, .kp-ly-tint.on { opacity: 1; }
.kp-ly-tint { background: var(--c); mix-blend-mode: multiply; }
.kp-ly-tint.on { opacity: .45; }
.kp-ly-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.kp-ly-buttons .kp-btn { padding: 8px 16px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .kp-hs-zoom, .kp-ly-over, .kp-ly-tint { transition: none; } .kp-hs-pop, .kp-hs-frame, .kp-hs-veil { animation: none; } }

/* ---------- Comic-Strip ---------- */
.kp-strip-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 16px; }
.kp-panel { margin: 0; }
.kp-panel-art { position: relative; border: 3px solid var(--kp-text); border-radius: 10px; overflow: hidden; background: #eef2f6; aspect-ratio: 1 / 1; }
.kp-panel-art img, .kp-panel-art svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.kp-panel-art svg, .kp-person-media svg { object-fit: contain; background: #eef2f6; }
.kp-panel-bubble { position: absolute; left: 8px; right: 8px; top: 8px; background: #fff; border: 2px solid var(--kp-text); border-radius: 14px; padding: 8px 12px; font-size: 14px; line-height: 1.35; }
.kp-panel-bubble::after { content: ""; position: absolute; left: 24px; bottom: -10px; width: 14px; height: 14px; background: #fff; border-right: 2px solid var(--kp-text); border-bottom: 2px solid var(--kp-text); transform: rotate(45deg); }
.kp-panel-bubble.think { border-radius: 20px; }
.kp-panel-bubble.think::after { border-radius: 50%; left: 20px; bottom: -12px; width: 10px; height: 10px; transform: none; }
.kp-panel figcaption { font-size: 13px; color: var(--kp-muted); margin-top: 8px; }

/* ---------- Stil-Paket „Foto“: ruhig, fast farblos, große Bilder ---------- */
.kp-style-foto .kp-main h1 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
.kp-style-foto .kp-hero-title { font-size: 42px; font-weight: 800; letter-spacing: -.02em; }
.kp-style-foto .kp-hero-card, .kp-style-foto .kp-guide-card { border-radius: 0; box-shadow: 0 24px 60px rgba(12,18,28,.16); }
.kp-style-foto .kp-hero-media, .kp-style-foto .kp-guide-media, .kp-style-foto .kp-person-front, .kp-style-foto .kp-person-back, .kp-style-foto .kp-vcard, .kp-style-foto .kp-ch-card { border-radius: 0; }
.kp-style-foto .kp-card, .kp-style-foto .kp-agenda-col, .kp-style-foto .kp-quiz, .kp-style-foto .kp-selfcheck, .kp-style-foto .kp-branch, .kp-style-foto .kp-predict, .kp-style-foto .kp-vscene { border-radius: 0; border: 1px solid var(--kp-line); box-shadow: none; }
.kp-style-foto .kp-btn { border-radius: 0; letter-spacing: .02em; }
.kp-style-foto .kp-eyebrow { letter-spacing: .18em; }
.kp-style-foto .kp-accent { font-style: normal; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
.kp-style-foto .kp-statement-text { font-weight: 800; }

/* ---------- Stil-Paket „Comic“: fast farblose Szene, ein Signalrot ----------
   Vorbild sind gezeichnete Lernwelten in Grau: Raum, Figuren und Flaechen bleiben
   farblos, die Signalfarbe steht nur dort, wo es etwas zu tun oder zu sehen gibt.
   Darum hier keine Farbe als Schmuck, keine zweite Akzentfarbe, keine weichen Ecken. */
.kp-style-comic { --kp-line: #DCDCE0; --kp-muted: #6E6E76; --kp-title: var(--kp-text); }
/* Ganz feines Rautenmuster im Hintergrund, wie mattes Papier */
.kp-style-comic:not(.kp-dark) body {
  background-image: repeating-linear-gradient(45deg, rgba(20,20,26,.022) 0 1px, transparent 1px 22px),
                    repeating-linear-gradient(-45deg, rgba(20,20,26,.022) 0 1px, transparent 1px 22px);
}
/* Schrift: kraeftig und eng gesetzt, Ruhe entsteht durch Weissraum statt durch Dekor */
.kp-style-comic .kp-main h1, .kp-style-comic .kp-hero-title { font-weight: 700; letter-spacing: -.02em; }
.kp-style-comic .kp-sec-title { font-weight: 700; letter-spacing: -.01em; }
.kp-style-comic .kp-eyebrow { letter-spacing: .16em; }
/* Flaechen: eine duenne Linie, fast rechte Ecken, kein Schlagschatten */
.kp-style-comic .kp-card, .kp-style-comic .kp-agenda-col, .kp-style-comic .kp-quiz, .kp-style-comic .kp-selfcheck, .kp-style-comic .kp-branch,
.kp-style-comic .kp-predict, .kp-style-comic .kp-hero-card, .kp-style-comic .kp-guide-card, .kp-style-comic .kp-person-front, .kp-style-comic .kp-person-back,
.kp-style-comic .kp-vcard, .kp-style-comic .kp-ch-card, .kp-style-comic .kp-dialog { border-radius: 2px; border: 1px solid var(--kp-line); box-shadow: none; }
/* Knoepfe: rechteckig, satte Signalfarbe, kein Versatz beim Ueberfahren */
.kp-style-comic .kp-btn { border-radius: 0; border: 1px solid transparent; box-shadow: none; font-weight: 700; letter-spacing: .04em; }
.kp-style-comic .kp-btn:hover:not(:disabled) { transform: none; box-shadow: none; filter: brightness(.9); }
/* Auswahl zeigt sich als rote Kante, nicht als Farbflaeche */
.kp-style-comic .kp-answer, .kp-style-comic .kp-branch-option { border-radius: 2px; border-width: 1px; }
.kp-style-comic .kp-answer:hover, .kp-style-comic .kp-branch-option:hover { border-color: var(--kp-primary); }
/* Sprechblasen: leicht statt comichaft fett */
.kp-style-comic .kp-bubble { border-width: 1px; border-color: var(--kp-line); border-radius: 2px; box-shadow: 0 8px 22px rgba(16,20,28,.10); }
.kp-style-comic .kp-bubble::before { border-right-color: var(--kp-line); }
.kp-style-comic .kp-stage-bubble { border-radius: 2px; border-width: 1px; }
/* Merksatz als weisse Karte mit roter Haarlinie, Einschub ebenso */
.kp-style-comic .kp-note { background: #fff; border: 1px solid var(--kp-line); border-radius: 0; padding: 16px 20px; }
.kp-style-foto .kp-note { background: #fff; border: 1px solid var(--kp-line); border-left-width: 1px; border-radius: var(--kp-radius); padding: 16px 20px; }
/* Comic und Foto zeichnen den Hinweis als Kasten: der Kasten laeuft ueber die ganze Lesebreite wie alle anderen Kaesten, nur der Text bleibt auf 70 Zeichen */
.kp-style-comic .kp-note.kp-text, .kp-style-foto .kp-note.kp-text { max-width: none; }
.kp-style-comic .kp-callout { background: var(--kp-surface); border: 1px solid var(--kp-primary); border-radius: 2px; }
/* Bilder ohne runde Ecken, Punkte im Bild als satter Pin */
.kp-style-comic .kp-fig img, .kp-style-comic .kp-hs-stage, .kp-style-comic .kp-avatar, .kp-style-comic .kp-lightbox img { border-radius: 0; }
.kp-style-comic .kp-avatar { overflow: hidden; border: 1px solid var(--kp-line); }
.kp-style-comic .kp-hs-dot { border-width: 1px; box-shadow: 0 2px 10px rgba(16,20,28,.35); }
/* Schliessen im Bildfenster: roter Kreis mit weissem Kreuz, wie in der Vorlage */
.kp-style-comic .kp-lightbox-close { background: var(--kp-primary); color: #fff; }
/* Buehne: Raum und Kulisse bleiben grau, damit Rot die einzige Farbe im Bild ist */
.kp-style-comic .kp-stage-art { --kp-primary: #8D8D95; --kp-accent: #BCBCC3; }
/* Kulissenfotos werden entsaettigt: im Comic-Stil ist der Raum grau, egal ob
   gezeichnet oder fotografiert. Gezeichnete Kulissen sind ohnehin grau, die Regel
   aendert an ihnen nichts. */
.kp-style-comic .kp-stage-photo { filter: grayscale(1) contrast(1.08) brightness(1.06); }
/* Im Comic-Stil sind alle Fotos grau (Titelbereich, Bilder, Begleitfigur, Kapitelkarten, Galerie); nur die Figuren bleiben farbig */
.kp-style-comic :is(.kp-hero-media, .kp-fig-frame, .kp-guide-media, .kp-ch-card, .kp-gallery, .kp-compare, .kp-cert-motif) img { filter: grayscale(1) contrast(1.05); }
/* Getoenter Abschnitt bleibt grau statt rosa: Rot ist auch als schwache Flaeche Farbe */
.kp-style-comic .kp-block.kp-bg-tint { background: #ECECEF; }
.kp-style-comic .kp-stage { border-radius: 2px; }
/* Randlose Szene: bei design.width "full" fuellt die Buehne die ganze Bildschirmbreite.
   Der Block ist ueber die negativen Raender schon 100vw breit, nur seine Polsterung
   zieht den Inhalt wieder herein. Genau die wird hier fuer die Buehne aufgehoben,
   waehrend die Steuerung darunter ihre Lesebreite behaelt. */
.kp-style-comic .kp-b-dialog.kp-w-full { padding: 0 0 var(--kp-pad, 44px); }
.kp-style-comic .kp-b-dialog.kp-w-full .kp-dialog { border: 0; background: none; border-radius: 0; }
.kp-style-comic .kp-w-full .kp-stage { border-radius: 0; max-height: 78vh; }
/* Rasterbloecke duerfen breiter laufen als der Fliesstext: Karten, Kaertchen und
   Zeitleisten gewinnen dadurch, lange Textzeilen wuerden dagegen schwerer lesbar. */
.kp-style-comic .kp-w-wide:not([class*="kp-bg-"]), .kp-style-comic .kp-page-head.kp-head-wide { margin-left: max(-90px, calc(50% - var(--kp-half, 50vw) + 32px)); margin-right: max(-90px, calc(50% - var(--kp-half, 50vw) + 32px)); }
.kp-style-comic .kp-b-dialog.kp-w-full .kp-dlg-actions {
  max-width: var(--kp-maxw, 1000px); margin-left: auto; margin-right: auto; padding-left: 24px; padding-right: 24px;
}
/* Figuren bleiben farbig, aber gedaempft, damit sie neben Grau und dem einen Rot nicht schreien.
   Die Kleidung kommt aus cast[].color ueber --kp-shirt; ohne Figur gilt der ruhige Standardton. */
.kp-style-comic .kp-avatar svg, .kp-style-comic .kp-guide-avatar svg, .kp-style-comic .kp-dial-face svg { filter: saturate(.8); }
/* Kopfleiste neutral: Rot nur als schmale Signalkante, nicht als Farbflaeche */
.kp-style-comic .kp-head { background: #1A1A1C; box-shadow: inset 0 -3px 0 var(--kp-primary); }
/* Grosse Schrift bleibt schwarz. Rot traegt nur die kleinen Marken: Augenbraue und Abschnittstitel */
.kp-style-comic .kp-card h3, .kp-style-comic .kp-agenda-col h3, .kp-style-comic .kp-statement-text,
.kp-style-comic .kp-hero-title, .kp-style-comic .kp-agenda-title, .kp-style-comic .kp-guide-name { color: var(--kp-text); }
/* Auf dunklem Abschnitt bleibt die grosse Schrift weiss, sonst stuende Schwarz auf Anthrazit */
.kp-style-comic .kp-on-dark :is(.kp-card h3, .kp-agenda-col h3, .kp-statement-text, .kp-hero-title, .kp-agenda-title, .kp-guide-name) { color: #fff; }
/* Ausgezeichnetes Wort: rot, aber aufrecht und ohne Farbflaeche dahinter */
.kp-style-comic .kp-accent { font-style: normal; color: var(--kp-primary); background: none; }
/* Kein Markerband hinter dem ausgezeichneten Wort: in der Signalfarbe wirkt es wie ein Textmarker */
.kp-fx-premium.kp-style-comic :is(h1, h2) .kp-accent { background-image: none; animation: none; }
/* Dunkle oder rote Karte (auch auf hellem Abschnitt): grosse Schrift weiss, das ausgezeichnete Wort aufgehellt */
.kp-style-comic :is(.kp-card-dark, .kp-card-glassdark, .kp-card-primary) :is(.kp-hero-title, .kp-guide-name) { color: #fff; }
.kp-style-comic :is(.kp-card-dark, .kp-card-glassdark, .kp-card-primary) .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
/* Leeres Bildfeld bleibt grau statt rosa */
.kp-style-comic .kp-photo-empty { background: #E8E8EB; }
/* Zieh- und Sortierkaertchen: gleiche duenne Linie, gleiche fast rechten Ecken */
.kp-style-comic .kp-sort-item, .kp-style-comic .kp-mdd-row, .kp-style-comic .kp-mdd-pool, .kp-style-comic .kp-mdd-drop { border-radius: 2px; border-width: 1px; }
.kp-style-comic .kp-mdd-card { border-radius: 2px; border-width: 1px; }

@media (max-width: 760px) {
  .kp-strip-grid { grid-template-columns: 1fr 1fr; }
  .kp-bignum { padding: 28px 16px; }
  .kp-person-back { font-size: 14px; padding: 14px; }
  .kp-hs-dot { width: 30px; height: 30px; font-size: 17px; }
}

/* ---------- Modernes Erscheinungsbild (theme.look, Standard) ---------- */
/* Schrift wächst mit dem Fenster, Karten nur für Interaktives, weiche Übergänge */
.kp-modern .kp-main h1 { font-size: clamp(calc(var(--kp-fs, 17px) * 1.6), calc(1.6vw + 20px), calc(var(--kp-fs, 17px) * 2.55)); line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
.kp-modern :where(.kp-hero-title) { font-size: clamp(30px, calc(2.4vw + 18px), 50px); line-height: 1.06; letter-spacing: -.025em; text-wrap: balance; }
.kp-modern.kp-style-kr .kp-hero-title { font-size: clamp(32px, calc(2.6vw + 18px), 54px); }
.kp-modern.kp-style-foto .kp-hero-title { font-size: clamp(34px, calc(3vw + 18px), 60px); letter-spacing: -.03em; }
.kp-modern :where(.kp-sec-title) { font-size: clamp(24px, calc(1.4vw + 16px), 38px); line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; }
.kp-modern.kp-style-kr .kp-sec-title { font-size: clamp(26px, calc(1.6vw + 16px), 42px); }
.kp-modern .kp-statement-text { font-size: clamp(26px, calc(2.2vw + 16px), 46px); line-height: 1.16; letter-spacing: -.015em; text-wrap: balance; }
.kp-modern .kp-text h2 { font-size: clamp(22px, calc(1vw + 16px), 30px); line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; }
.kp-modern .kp-text h3, .kp-modern .kp-q { text-wrap: balance; }
.kp-modern .kp-text p, .kp-modern .kp-text li { text-wrap: pretty; }
.kp-modern .kp-text { line-height: 1.7; }
/* Weniger Kästen: Aufklapper als Linien, Karten ohne Rahmen, Interaktives mit weichem Schatten */
.kp-modern { --kp-soft: 0 1px 2px rgba(16,24,40,.04), 0 14px 36px -14px rgba(16,24,40,.16); }
.kp-modern.kp-dark { --kp-soft: 0 1px 2px rgba(0,0,0,.4), 0 14px 36px -14px rgba(0,0,0,.6); }
.kp-modern details.kp-acc { background: transparent; border: 0; border-top: 1px solid var(--kp-line); border-radius: 0; margin: 0; padding: 0 2px; }
.kp-modern details.kp-acc:last-of-type { border-bottom: 1px solid var(--kp-line); }
.kp-modern .kp-card { border-color: transparent; box-shadow: var(--kp-soft); }
.kp-modern .kp-quiz, .kp-modern .kp-branch, .kp-modern .kp-sortcats, .kp-modern .kp-motion, .kp-modern .kp-process { border-color: transparent; box-shadow: var(--kp-soft); }
/* Kleine Rückmeldungen beim Bedienen */
.kp-modern .kp-btn { transition: transform .15s, box-shadow .15s, background-color .15s; }
.kp-modern .kp-btn:active:not(:disabled) { transform: scale(.97); }
.kp-modern .kp-answer:active, .kp-modern .kp-branch-option:active { transform: scale(.99); }
.kp-modern .kp-feedback.ok { animation: kp-fade .35s both, kp-pop .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes kp-pop { from { transform: scale(.96); } to { transform: none; } }
/* Seitenwechsel als weiche Überblendung (View Transitions, wo der Browser sie kann) */
.kp-modern .kp-main { view-transition-name: kp-main; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-old(kp-main) { animation: kp-vt-out .2s ease both; }
::view-transition-new(kp-main) { animation: kp-vt-in .34s cubic-bezier(.2,.7,.3,1) both; }
@keyframes kp-vt-out { to { opacity: 0; transform: translateY(-8px); } }
@keyframes kp-vt-in { from { opacity: 0; transform: translateY(14px); } }
.kp-back::view-transition-old(kp-main) { animation-name: kp-vt-out-back; }
.kp-back::view-transition-new(kp-main) { animation-name: kp-vt-in-back; }
@keyframes kp-vt-out-back { to { opacity: 0; transform: translateY(8px); } }
@keyframes kp-vt-in-back { from { opacity: 0; transform: translateY(-14px); } }
/* Bewegtes Foto im Abschnitt: langsamer Zoom oder Schwenk (design.bgMotion) */
.kp-block.kp-bgm { background: none; overflow: hidden; }
.kp-bgmove { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.kp-bgmove::before { content: ''; position: absolute; inset: 0; background: var(--kp-bgimg) var(--kp-bgpos, center) / cover no-repeat; }
.kp-bgmove::after { content: ''; position: absolute; inset: 0; background: var(--kp-veil); }
.kp-bgm-zoom .kp-bgmove::before { animation: kp-kb-zoom 26s ease-in-out infinite alternate; }
.kp-bgm-pan .kp-bgmove::before { inset: 0 -6%; animation: kp-kb-pan 30s ease-in-out infinite alternate; }
@keyframes kp-kb-zoom { from { transform: scale(1); } to { transform: scale(1.12); } }
@keyframes kp-kb-pan { from { transform: translateX(-3%) scale(1.04); } to { transform: translateX(3%) scale(1.04); } }
.kp-bgm > .kp-block-inner { position: relative; z-index: 1; }
.kp-bgm > .kp-decor { z-index: 1; }
@media (prefers-reduced-motion: reduce) {
  .kp-bgmove::before { animation: none !important; }
  ::view-transition-old(kp-main), ::view-transition-new(kp-main) { animation: none !important; }
}
/* ---------- Effekte „hochwertig“ (theme.effects, Standard) ----------
   Nach dem Muster hochwertiger Storyline-Kurse: jedes Element fährt mit Abbremsen herein (750 ms),
   Listen gestaffelt (--kp-i), Karten heben sich beim Überfahren mit weichem Leuchten in der Akzentfarbe,
   Möglichkeiten schieben einen Akzentbalken hervor, Knöpfe bekommen einen Glanz. Tastatur-Fokus sieht
   aus wie Überfahren. „Bewegung reduzieren“ schaltet alle Bewegungen ab, das Leuchten bleibt. */
:root { --kp-ease-out: cubic-bezier(.22, 1, .36, 1); }
.kp-fx-premium { --kp-glow: 0 14px 34px -14px color-mix(in srgb, var(--kp-accent) 60%, transparent), 0 0 0 1px color-mix(in srgb, var(--kp-accent) 28%, transparent); }
@keyframes kp-fx-rise { from { opacity: 0; transform: translateY(22px); } }
@keyframes kp-fx-slide { from { opacity: 0; transform: translateX(-36px); } }
@keyframes kp-fx-settle { from { opacity: .2; transform: scale(1.08); } }
@keyframes kp-fx-mark { from { background-size: 0% 100%; } }
@keyframes kp-fx-ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--kp-ok, #1f7a4d) 45%, transparent); } to { box-shadow: 0 0 0 14px transparent; } }
@keyframes kp-fx-tick { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
.kp-fx-premium .fx-reveal { transition: none; }
.kp-fx-premium .fx-reveal.fx-in { animation: kp-fx-rise .75s var(--kp-ease-out) backwards; animation-delay: calc(var(--kp-i, 0) * 90ms); }
.kp-fx-premium .fx-reveal.fx-now { animation: none; }
/* Karten: anheben und leuchten, Bilder zoomen im Rahmen */
.kp-fx-premium :is(.kp-card, .kp-ch-card, .kp-agenda-col, .kp-team > *) { transition: transform .4s var(--kp-ease-out), box-shadow .4s var(--kp-ease-out); }
.kp-fx-premium :is(.kp-card, .kp-ch-card, .kp-agenda-col, .kp-team > *):is(:hover, :focus-within) { transform: translateY(-6px); box-shadow: var(--kp-glow); }
.kp-fx-premium .kp-ch-card img { transition: transform .9s var(--kp-ease-out); }
.kp-fx-premium .kp-ch-card:hover img { transform: scale(1.06); }
.kp-fx-premium .kp-hero-media img { animation: kp-fx-settle 1.6s var(--kp-ease-out) backwards; }
/* Knöpfe: Glanz, der einmal darüberläuft, und ein Leuchtring */
.kp-fx-premium .kp-btn { position: relative; overflow: hidden; isolation: isolate; transition: transform .25s var(--kp-ease-out), box-shadow .25s var(--kp-ease-out), background-color .2s; }
.kp-fx-premium .kp-btn:not(.kp-sec)::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.32) 50%, transparent 70%); transform: translateX(-120%); transition: transform .8s var(--kp-ease-out); }
.kp-fx-premium .kp-btn:not(.kp-sec):hover::after { transform: translateX(120%); }
.kp-fx-premium .kp-btn:is(:hover, :focus-visible):not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--kp-primary) 75%, transparent), 0 0 0 3px color-mix(in srgb, var(--kp-accent) 32%, transparent); }
/* Antworten und Möglichkeiten: Akzentbalken schiebt sich hervor, gewählt leuchtet */
.kp-fx-premium :is(.kp-answer, .kp-branch-option) { position: relative; transition: transform .3s var(--kp-ease-out), border-color .2s, box-shadow .3s var(--kp-ease-out); }
.kp-fx-premium :is(.kp-answer, .kp-branch-option)::before { content: ""; position: absolute; left: -2px; top: -2px; bottom: -2px; width: 0; border-radius: var(--kp-radius) 0 0 var(--kp-radius); background: var(--kp-accent); transition: width .3s var(--kp-ease-out); }
.kp-fx-premium :is(.kp-answer, .kp-branch-option:not(:disabled)):is(:hover, :focus-within, :focus-visible)::before { width: 6px; }
.kp-fx-premium :is(.kp-answer, .kp-branch-option:not(:disabled)):is(:hover, :focus-within, :focus-visible) { transform: translateX(6px); box-shadow: var(--kp-glow); }
.kp-fx-premium :is(.kp-branch-option.chosen, .kp-answer.kp-chosen, .kp-answer:has(input:checked)) { box-shadow: 0 0 0 3px color-mix(in srgb, var(--kp-accent) 35%, transparent), var(--kp-glow); }
.kp-fx-premium :is(.kp-branch-option.chosen, .kp-answer.kp-chosen, .kp-answer:has(input:checked))::before { width: 6px; }
/* Flipcards: Leuchten, und ein Häkchen auf schon umgedrehten Karten (wie „besucht“ in Storyline) */
.kp-fx-premium .kp-flip { position: relative; }
.kp-fx-premium .kp-flip :is(.kp-flip-front, .kp-flip-back) { transition: box-shadow .35s var(--kp-ease-out); }
.kp-fx-premium .kp-flip:is(:hover, :focus-visible) :is(.kp-flip-front, .kp-flip-back) { box-shadow: var(--kp-glow); }
.kp-fx-premium .kp-flip.kp-seen::after { content: "✓"; position: absolute; top: -8px; right: -8px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-size: 14px; font-weight: 700; box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--kp-accent) 70%, transparent); animation: kp-fx-tick .45s var(--kp-ease-out) both; }
/* Checkliste, Punkte im Bild, Etappenband, Akzentwort als Textmarker */
.kp-fx-premium .kp-cl-list label { transition: transform .3s var(--kp-ease-out), background-color .25s; }
.kp-fx-premium .kp-cl-list label:hover { transform: translateX(4px); background: color-mix(in srgb, var(--kp-accent) 9%, var(--kp-bg)); }
.kp-fx-premium .kp-cl-list input:checked { animation: kp-fx-tick .4s var(--kp-ease-out); }
.kp-fx-premium .kp-hs-dot { transition: box-shadow .3s var(--kp-ease-out), transform .3s var(--kp-ease-out); }
.kp-fx-premium .kp-hs-dot:is(:hover, :focus-visible) { box-shadow: 0 0 0 6px color-mix(in srgb, var(--kp-accent) 35%, transparent), 0 0 26px color-mix(in srgb, var(--kp-accent) 70%, transparent); }
.kp-fx-premium .kp-band { animation: kp-fx-slide .75s var(--kp-ease-out) backwards; }
.kp-fx-premium :is(h1, h2) .kp-accent { background-image: linear-gradient(transparent 64%, color-mix(in srgb, var(--kp-accent) 26%, transparent) 64%); background-repeat: no-repeat; background-size: 100% 100%; animation: kp-fx-mark 1.1s .35s var(--kp-ease-out) backwards; }
.kp-fx-premium .kp-feedback.ok { animation: kp-fade .35s both, kp-pop .5s cubic-bezier(.3,1.5,.5,1) both, kp-fx-ring 1s .1s ease-out; }
/* Akzentwort auf Foto oder dunklem Grund: kein Textmarker (die halbtransparente Fläche lag über dem Foto und machte das Wort unlesbar), das Wort hell */
.kp-fx-premium :is(.kp-on-dark, .kp-bg-image, .kp-hs-cover, .kp-card-dark, .kp-card-glassdark, .kp-card-primary) :is(h1, h2, h3) .kp-accent { background-image: none; animation: none; }
:is(.kp-on-dark, .kp-bg-image, .kp-hs-cover, .kp-card-dark, .kp-card-glassdark, .kp-card-primary) :is(h1, h2, h3, .kp-statement-text) .kp-accent { color: color-mix(in srgb, var(--kp-accent) 40%, white); }
.kp-style-comic :is(.kp-on-dark, .kp-bg-image, .kp-hs-cover, .kp-card-dark, .kp-card-glassdark) .kp-accent { color: color-mix(in srgb, var(--kp-accent) 40%, white); } /* Signalrot auf dunklem Foto erreicht keinen Kontrast */
@media (prefers-reduced-motion: reduce) {
  .kp-fx-premium .fx-reveal.fx-in, .kp-fx-premium .kp-hero-media img, .kp-fx-premium .kp-band, .kp-fx-premium :is(h1, h2) .kp-accent, .kp-fx-premium .kp-flip.kp-seen::after, .kp-fx-premium .kp-cl-list input:checked { animation: none !important; }
  .kp-fx-premium :is(.kp-card, .kp-ch-card, .kp-agenda-col, .kp-team > *, .kp-answer, .kp-branch-option, .kp-btn, .kp-cl-list label, .kp-hs-dot):is(:hover, :focus-within, :focus-visible) { transform: none !important; }
  .kp-fx-premium .kp-ch-card:hover img, .kp-fx-premium .kp-btn::after { transform: none !important; }
}
/* ---------- Filmlook der Bühne (stage.film) ----------
   Regeln aus dem Videoschnitt: Titelkarte, Bauchbinde statt Sprechblase, Untertitel unten, sanfter Push-in je Einstellung,
   weicher Schnitt, Vignette und leichte Farbstimmung, Steuerleiste wie ein Videoplayer, Abspann. */
.kp-film { overflow: hidden; border-radius: var(--kp-radius); background: #0b0f17; }
.kp-film > .kp-stage { aspect-ratio: 16 / 9; border-radius: 0; box-shadow: none; animation: kp-film-push 18s ease-out forwards, kp-fade .45s ease both; }
.kp-film.kp-film-idle > .kp-stage, .kp-film.kp-film-done > .kp-stage { animation: none; }
@keyframes kp-film-push { from { transform: scale(1); } to { transform: scale(1.045); } }
.kp-film > .kp-stage::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(6,8,14,.42) 100%); }
.kp-film.kp-mood-angespannt > .kp-stage::after { background: radial-gradient(120% 90% at 50% 40%, rgba(40,60,90,.06) 50%, rgba(6,8,14,.55) 100%); }
.kp-film.kp-mood-positiv > .kp-stage::after { background: radial-gradient(120% 90% at 50% 40%, rgba(255,214,150,.08) 50%, rgba(6,8,14,.38) 100%); }
.kp-film .kp-stage-caption { display: none; }
.kp-film .kp-stage-back { filter: saturate(.92); transition: filter .9s ease; }
.kp-film[data-focus="left"] .kp-stage-back, .kp-film[data-focus="right"] .kp-stage-back { filter: saturate(.9) blur(.8px); }
/* Bauchbinde: Name und Rolle der sprechenden Person, fährt von links ein */
.kp-lower-third { position: absolute; left: 4%; bottom: 17%; z-index: 4; display: grid; padding: 8px 18px 9px 14px; border-left: 4px solid var(--c, var(--kp-accent)); background: rgba(12,16,24,.78); color: #fff; backdrop-filter: blur(4px); animation: kp-lt-in .5s var(--kp-ease-out, ease-out) both; }
.kp-lower-third b { font-size: clamp(14px, 1.5vw, 17px); letter-spacing: .01em; }
.kp-lower-third span { font-size: clamp(11px, 1.1vw, 13px); opacity: .8; letter-spacing: .06em; text-transform: uppercase; }
@keyframes kp-lt-in { from { opacity: 0; transform: translateX(-24px); } }
.kp-film .kp-stage-sub { bottom: 4%; max-width: 84%; background: rgba(0,0,0,.62); border-radius: 6px; font-size: clamp(14px, 1.55vw, 19px); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.kp-film .kp-stage-sub b { display: none; }
.kp-film.kp-cc-off .kp-stage-sub { display: none; }
/* Titelkarte und Abspann */
.kp-film-card { position: absolute; inset: 0; z-index: 7; display: grid; place-content: center; gap: 10px; padding: 6%; text-align: center; color: #fff; background: linear-gradient(160deg, rgba(8,10,16,.72), rgba(8,10,16,.9)); animation: kp-fade .6s ease both; }
.kp-film-card .kp-film-eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .75; }
.kp-film-card h3 { margin: 0; font-size: clamp(22px, 3.2vw, 38px); line-height: 1.15; font-family: var(--kp-heading, inherit); }
.kp-film-card p { margin: 0; opacity: .8; font-size: clamp(13px, 1.3vw, 16px); }
.kp-film-play { width: 76px; height: 76px; margin: 14px auto 0; border-radius: 50%; border: 0; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-size: 30px; cursor: pointer; display: grid; place-items: center; box-shadow: 0 12px 32px -10px color-mix(in srgb, var(--kp-accent) 80%, transparent); transition: transform .25s var(--kp-ease-out, ease-out); }
.kp-film-play:is(:hover, :focus-visible) { transform: scale(1.08); }
/* Steuerleiste wie im Videoplayer */
.kp-film-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #0b0f17; color: #fff; border-radius: 0 0 var(--kp-radius) var(--kp-radius); }
.kp-film-wrap .kp-film { border-radius: var(--kp-radius) var(--kp-radius) 0 0; }
.kp-film-bar button { font: inherit; width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 15px; }
.kp-film-bar button:is(:hover, :focus-visible):not(:disabled) { background: rgba(255,255,255,.14); }
.kp-film-bar button:disabled { opacity: .35; cursor: default; }
.kp-film-bar button[aria-pressed="true"] { color: var(--kp-accent); }
.kp-film-progress { flex: 1; display: flex; gap: 3px; height: 6px; }
.kp-film-progress i { flex: 1; border-radius: 3px; background: rgba(255,255,255,.22); }
.kp-film-progress i.done { background: var(--kp-accent); }
.kp-film-progress i.now { background: var(--kp-accent); animation: kp-film-tick 1.2s ease-in-out infinite alternate; }
@keyframes kp-film-tick { from { opacity: .55; } to { opacity: 1; } }
.kp-film-time { font-size: 12px; opacity: .8; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.kp-film .kp-stage { cursor: pointer; }
.kp-film.kp-choosing .kp-stage, .kp-film.kp-film-done .kp-stage, .kp-film.kp-film-idle .kp-stage { cursor: default; }
.kp-film-wrap:fullscreen { background: #000; display: grid; place-content: center; }
.kp-film-wrap:fullscreen .kp-film { width: min(100vw, 170vh); border-radius: 0; }
.kp-film-wrap:fullscreen .kp-film-bar { width: min(100vw, 170vh); border-radius: 0; }
.kp-film-wrap:fullscreen .kp-dlg-history { display: none; }
/* Fotofiguren: leichte Bewegung beim Sprechen, Foto je Haltung */
.kp-stage .kp-actor .kp-avatar.kp-talking img { animation: kp-photo-talk 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes kp-photo-talk { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018) translateY(-.6%); } }
/* Lippen am Ton: --kp-mouth (0 bis 1) aus der Lautstärke der Aufnahme */
.kp-lips .kp-avatar.kp-talking .kp-mouth { animation: none; transform-box: fill-box; transform-origin: center; transform: scaleY(calc(.55 + var(--kp-mouth, 0) * 1.3)); transition: transform .06s linear; }
.kp-lips .kp-stage .kp-actor .kp-avatar.kp-talking img { animation: none; transform: scale(calc(1 + var(--kp-mouth, 0) * .022)); transition: transform .08s linear; }
@media (prefers-reduced-motion: reduce) {
  .kp-film > .kp-stage, .kp-lower-third, .kp-film-card, .kp-film-progress i.now, .kp-stage .kp-actor .kp-avatar.kp-talking img { animation: none !important; }
  .kp-lips .kp-avatar.kp-talking .kp-mouth, .kp-lips .kp-stage .kp-actor .kp-avatar.kp-talking img { transform: none !important; }
}

/* ---------- Abschnitt erscheint nach einer Uebung ---------- */
@keyframes kp-reveal-in {
  from { opacity: 0; transform: translateY(26px) scale(.985); filter: blur(5px); }
  60% { filter: blur(0); }
  to { opacity: 1; transform: none; filter: none; }
}
.kp-reveal-in { animation: kp-reveal-in .62s cubic-bezier(.22,1,.36,1) both; }
.kp-reveal-in > .kp-block-inner > * { animation: kp-reveal-in .5s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(.08s + var(--kp-i, 0) * .06s); }
@media (prefers-reduced-motion: reduce) {
  .kp-reveal-in, .kp-reveal-in > .kp-block-inner > * { animation: none !important; }
}

/* ---------- Lage der Kopfleiste: unten oder links ---------- */
/* Steht am Ende, damit diese Regeln die frueheren zu .kp-foot sicher ueberschreiben. */
/* Ohne eigene Farbe ist die Leiste unten und links dezent hell mit farbigen Symbolen. */
.kp-nav-unten, .kp-nav-links { --kp-nav-bg: var(--kp-surface); --kp-nav-ink: var(--kp-primary); }
.kp-navbar { display: flex; flex-direction: column; background: var(--kp-nav-bg); color: var(--kp-nav-ink); z-index: 18; }
.kp-navrow { display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
.kp-navbar .kp-head { flex: 1; min-width: 0; background: transparent; color: inherit; padding: 0; }
.kp-navbar .kp-foot { position: static; background: transparent; border: 0; padding: 0; gap: 10px; flex: none; justify-content: flex-end; }
.kp-navbar .kp-custom-foot { flex: none; }
.kp-navbar .kp-next-preview { display: none; }
.kp-navbar .kp-btn { padding: 8px 18px; font-size: 15px; border-color: currentColor; }
.kp-navbar .kp-btn.kp-sec { color: inherit; }
.kp-navbar .kp-lock { font-size: 13px; opacity: .8; }
.kp-navbar .kp-progress { background: rgba(127,127,127,.18); }
.kp-nav-unten .kp-navbar { position: sticky; bottom: 0; box-shadow: 0 -1px 0 rgba(16,24,40,.1), 0 -6px 20px rgba(16,24,40,.06); }
.kp-nav-unten .kp-navbar .kp-progress { order: -1; }
.kp-nav-links #app { padding-left: var(--kp-navw); }
.kp-nav-links .kp-navbar { position: fixed; inset: 0 auto 0 0; width: var(--kp-navw); overflow: auto; box-shadow: 1px 0 0 rgba(16,24,40,.1), 6px 0 20px rgba(16,24,40,.06); }
.kp-nav-links .kp-navrow { flex-direction: column; align-items: stretch; flex: 1; padding: 18px 16px; }
.kp-nav-links .kp-navbar .kp-head { flex: 1; flex-direction: column; align-items: stretch; gap: 8px; }
.kp-nav-links .kp-navbar .kp-course { flex: none; white-space: normal; order: -1; font-size: 16px; margin-bottom: 6px; }
.kp-nav-links .kp-head-chapter { margin: 6px 0 0; padding: 6px 0 0; border-left: 0; border-top: 1px solid currentColor; display: block; }
.kp-nav-links .kp-navbar .kp-foot { flex-direction: column; align-items: stretch; justify-content: flex-start; }
.kp-nav-links .kp-navbar .kp-head-count { order: 9; }
.kp-nav-links .kp-ai-mark { left: calc(var(--kp-navw) + 12px); }
@media (max-width: 860px) {
  /* Auf schmalen Bildschirmen wird aus der Leiste links die Leiste unten */
  .kp-nav-links #app { padding-left: 0; }
  .kp-nav-links .kp-navbar { position: sticky; inset: auto; width: auto; overflow: visible; box-shadow: 0 -1px 0 rgba(16,24,40,.1); }
  .kp-nav-links .kp-navrow, .kp-nav-links .kp-navbar .kp-head, .kp-nav-links .kp-navbar .kp-foot { flex-direction: row; align-items: center; padding: 8px 16px; }
  .kp-nav-links .kp-navbar .kp-head { padding: 0; }
  .kp-nav-links .kp-navbar .kp-course { order: 0; font-size: 14px; white-space: nowrap; margin: 0; }
  .kp-nav-links .kp-ai-mark { left: 12px; }
}
@media (max-width: 700px) {
  /* Auf dem Handy bricht die Leiste um: Kopfzeile oben, Navigation darunter über die volle Breite, der Hinweis in eigener Zeile */
  .kp-navbar .kp-course { display: none; }
  .kp-navrow, .kp-nav-links .kp-navrow { flex-wrap: wrap; padding: 8px 12px; }
  .kp-navbar .kp-foot, .kp-nav-links .kp-navbar .kp-foot { flex: 1 1 100%; flex-wrap: wrap; justify-content: space-between; min-width: 0; }
  .kp-navbar .kp-lock { flex: 1 1 100%; order: 9; white-space: normal; }
  .kp-navbar .kp-btn { padding: 8px 14px; }
}
@media print { .kp-navbar { display: none !important; } }

/* ---------- Stil-Paket Editorial: Magazin mit Serifen-Titeln, Haarlinien, Pull-Quotes und Duotone-Bildern ---------- */
/* Vorbild sind Magazin-Doppelseiten: viel Weissraum, grosse Serifen-Ueberschrift mit kursivem Akzent,
   feine Linien statt Schatten, Zitate als Pull-Quote mit grossem Anfuehrungszeichen, Bilder im Duotone
   (Regeln bei .kp-treat-duotone). Karten und Knoepfe ohne Rundung. */
.kp-style-editorial { --kp-shadow: none; --kp-radius: 0px; }
.kp-style-editorial .kp-main h1, .kp-style-editorial .kp-hero-title, .kp-style-editorial .kp-sec-title, .kp-style-editorial .kp-q, .kp-style-editorial .kp-card h3, .kp-style-editorial .kp-ms-box h2 { font-weight: 500; letter-spacing: -.01em; }
.kp-style-editorial .kp-main h1 { font-size: clamp(34px, 4vw, 48px); line-height: 1.08; padding-bottom: 10px; border-bottom: 1px solid var(--kp-text); }
.kp-style-editorial .kp-hero-title { font-size: clamp(36px, 4.6vw, 58px); line-height: 1.05; }
.kp-style-editorial :is(h1, h2, h3) .kp-accent { font-style: italic; font-weight: 400; color: var(--kp-accent-ink, var(--kp-accent)); background: none; }
.kp-style-editorial .kp-eyebrow { letter-spacing: .22em; font-size: 11px; color: var(--kp-text); padding-bottom: 6px; border-bottom: 1px solid var(--kp-text); display: inline-block; }
.kp-style-editorial .kp-page-head { margin-bottom: 20px; }
.kp-style-editorial .kp-block-inner > .kp-text:first-child > p:first-of-type::first-letter { font-family: var(--kp-font-head, var(--kp-font)); font-size: 3.2em; float: left; line-height: .82; padding: 4px 8px 0 0; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-style-editorial .kp-card, .kp-style-editorial .kp-agenda-col, .kp-style-editorial .kp-quiz, .kp-style-editorial .kp-reflect, .kp-style-editorial .kp-plan, .kp-style-editorial .kp-cert, .kp-style-editorial .kp-hero-card, .kp-style-editorial .kp-guide-card, .kp-style-editorial .kp-cmp-card, .kp-style-editorial .kp-done-item, .kp-style-editorial .kp-obj { border: 0; border-top: 1px solid var(--kp-text); border-radius: 0; box-shadow: none; background: transparent; }
.kp-style-editorial .kp-hero-card { background: var(--kp-surface); border-top: 3px solid var(--kp-accent); }
.kp-style-editorial .kp-cmp-card { background: var(--kp-bg); } /* deckt die Achse hinter der Karte ab */
.kp-style-editorial .kp-cmp-side { background: var(--kp-surface); }
.kp-style-editorial .kp-btn { border-radius: 0; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; padding: 12px 24px; }
.kp-style-editorial .kp-statement { max-width: 760px; padding: 26px 0 26px 58px; border-left: 3px solid var(--kp-accent); text-align: left; position: relative; }
/* Das Anfuehrungszeichen steht links neben dem Text, nicht auf dem ersten Buchstaben */
.kp-style-editorial .kp-statement::before { content: "„"; position: absolute; left: 12px; top: -28px; font-family: var(--kp-font-head, Georgia, serif); font-size: 96px; line-height: 1; color: var(--kp-accent); opacity: .35; }
.kp-style-editorial .kp-statement-text { font-weight: 400; font-style: italic; font-size: clamp(26px, 3vw, 38px); line-height: 1.22; color: var(--kp-text); }
/* Pull-Quote auf dunklem Foto oder dunklem Abschnitt: helle Schrift, sonst steht die dunkle Kursivschrift auf dem Schleier */
.kp-style-editorial .kp-on-dark .kp-statement-text, .kp-style-editorial .kp-on-dark .kp-statement-sub, .kp-style-editorial .kp-on-dark .kp-statement .kp-eyebrow, .kp-style-editorial .kp-on-dark .kp-statement .kp-author { color: #fff; }
.kp-style-editorial .kp-on-dark .kp-statement-text .kp-accent { color: #F2B8B5; }
.kp-style-editorial .kp-statement .kp-ico-lg { display: none; }
.kp-style-editorial .kp-statement-quote .kp-statement-text::before { content: none; }
.kp-style-editorial .kp-bignum { background: transparent; border-top: 1px solid var(--kp-text); border-bottom: 1px solid var(--kp-text); }
.kp-style-editorial .kp-bignum-value { font-weight: 400; }
.kp-style-editorial .kp-fig figcaption { font-style: italic; text-align: left; border-left: 2px solid var(--kp-accent); padding-left: 10px; }
.kp-style-editorial .kp-head { background: var(--kp-surface); color: var(--kp-text); border-bottom: 1px solid var(--kp-text); }
.kp-style-editorial .kp-head .kp-iconbtn { color: var(--kp-text); background: transparent; border: 1px solid var(--kp-line); }
.kp-style-editorial .kp-progress { background: var(--kp-line); } .kp-style-editorial .kp-progress div { background: var(--kp-accent); }
.kp-style-editorial .kp-foot { border-top: 1px solid var(--kp-text); }
.kp-style-editorial .kp-flip-front { background: var(--kp-primary); border-radius: 0; }
.kp-style-editorial .kp-band { border-radius: 0; }

/* ---------- Stil-Paket Nacht: dunkles Marineblau mit Leuchtakzent ---------- */
/* Farbwelt: Grund #071225, Karte #0e1c31, Blau #2B7FFF, Gruen #2EE6A8.
   Knoepfe und Pillen laufen von Blau nach Gruen; ihre Schrift ist dunkel,
   weil Weiss auf dem gruenen Ende nur 1,6 : 1 erreicht (dunkel: 5,1 bis 11,8 : 1). */
.kp-style-nacht.kp-dark {
  --kp-title: var(--kp-text); /* Titel und Namen in Hellgrau, das Blau bleibt Knoepfen und Auswahl */
  --kp-bg: #071225; --kp-surface: #0e1c31; --kp-text: #e9f1fb; --kp-muted: #93a6c0;
  --kp-line: rgba(126,178,240,.16);
  --kp-shadow: 0 1px 2px rgba(0,0,0,.5), 0 24px 60px -22px rgba(0,0,0,.75);
  --kp-ink: #04111f;
  --kp-flow: linear-gradient(95deg, var(--kp-primary), var(--kp-accent));
}
.kp-style-nacht.kp-dark body {
  background-color: var(--kp-bg);
  background-image:
    radial-gradient(120% 68% at 50% -12%, rgba(43,127,255,.20), transparent 62%),
    radial-gradient(90% 60% at 85% 108%, rgba(46,230,168,.10), transparent 62%);
  background-attachment: fixed;
}
/* Flaechen: dunkle Karte mit feiner Lichtkante statt Schatten */
.kp-style-nacht .kp-card, .kp-style-nacht .kp-agenda-col, .kp-style-nacht .kp-quiz, .kp-style-nacht .kp-selfcheck,
.kp-style-nacht .kp-predict, .kp-style-nacht .kp-vcard, .kp-style-nacht .kp-ch-card, .kp-style-nacht .kp-hero-card,
.kp-style-nacht .kp-guide-card, .kp-style-nacht .kp-process, .kp-style-nacht .kp-sortcats, .kp-style-nacht .kp-dial-info,
.kp-style-nacht .kp-tri-card, .kp-style-nacht .kp-pb-body, .kp-style-nacht .kp-cb-case, .kp-style-nacht .kp-files a {
  /* Karten heben sich sichtbar vom Grund ab (vorher 4,5 % Weiss, drei Karten nebeneinander wirkten flach) */
  background-image: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
  border: 1px solid var(--kp-line);
  box-shadow: none;
}
.kp-style-nacht .kp-block.kp-bg-tint { background: #0b1729; }
.kp-style-nacht .kp-block.kp-bg-dark { background: #040c18; }
.kp-style-nacht .kp-block.kp-bg-gradient { background: linear-gradient(135deg, #0d1d33, #071225); }
/* Knoepfe und Pillen: Verlauf von Blau nach Gruen, Schrift dunkel */
.kp-style-nacht .kp-btn:not(.kp-sec):not(:disabled) {
  background: var(--kp-flow); color: var(--kp-ink); border: 0; font-weight: 700;
  box-shadow: 0 10px 30px -12px rgba(43,127,255,.7);
}
.kp-style-nacht .kp-btn:not(.kp-sec):not(:disabled):hover { filter: brightness(1.08); }
.kp-style-nacht .kp-btn.kp-sec { background: transparent; color: var(--kp-text); border: 1px solid var(--kp-line); }
.kp-style-nacht .kp-btn.kp-sec:hover { border-color: var(--kp-accent); color: var(--kp-accent); }
/* Die kleine Zeile ueber einer Ueberschrift wird zur Pille mit Leuchtpunkt */
.kp-style-nacht .kp-eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 7px 16px; border: 1px solid var(--kp-line); border-radius: 999px;
  color: var(--kp-text); letter-spacing: .10em;
  background: rgba(255,255,255,.04);
}
.kp-style-nacht .kp-eyebrow::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--kp-accent); box-shadow: 0 0 10px var(--kp-accent);
}
/* Akzentwort im Titel laeuft im selben Verlauf. box-decoration-break: clone gibt jeder
   Zeile ihren eigenen Verlauf - ohne das bekommt eine zweite Zeile nur das dunkle Ende.
   Der Verlauf startet im helleren Blau (6,2 : 1), damit auch sein Anfang lesbar bleibt. */
.kp-style-nacht .kp-accent,
.kp-fx-premium.kp-style-nacht :is(h1, h2) .kp-accent {
  font-style: normal; font-weight: inherit;
  background-image: linear-gradient(95deg, #4d93ff, var(--kp-accent));
  background-size: 100% 100%; animation: none;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
/* Ohne Verlauf im Text (aeltere Browser) bleibt die Akzentfarbe stehen */
@supports not ((background-clip: text) or (-webkit-background-clip: text)) {
  .kp-style-nacht .kp-accent { background: none; color: var(--kp-accent); }
}
.kp-style-nacht .kp-band { background: var(--kp-flow); color: var(--kp-ink); }
/* Fortschritt, Balken und Ringe im Verlauf */
.kp-style-nacht .kp-progress i, .kp-style-nacht .kp-readbar b, .kp-style-nacht .kp-pb-bar i,
.kp-style-nacht .kp-alb-bar i, .kp-style-nacht .kp-meter-bar i { background: var(--kp-flow); }
/* Antworten und Moeglichkeiten: ruhige Flaeche, Akzentkante beim Ueberfahren */
.kp-style-nacht .kp-answer, .kp-style-nacht .kp-branch-option, .kp-style-nacht .kp-order-item,
.kp-style-nacht .kp-sort-item, .kp-style-nacht .kp-mdd-card, .kp-style-nacht .kp-mdd-row {
  border: 1px solid var(--kp-line);
}
.kp-style-nacht .kp-answer:hover, .kp-style-nacht .kp-branch-option:hover { border-color: var(--kp-accent); }
/* Hervorgehobene Karte: Leuchtkante wie im Vorbild */
.kp-style-nacht .kp-card.kp-card-primary, .kp-style-nacht .kp-agenda-col.is-on, .kp-style-nacht .kp-cmp-right {
  border-color: color-mix(in srgb, var(--kp-accent) 60%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--kp-accent) 25%, transparent), 0 26px 60px -26px rgba(46,230,168,.5);
}
/* Flaechen, die sonst in der Hauptfarbe mit weisser Schrift liegen: Weiss auf #2B7FFF
   erreicht nur 3,8 : 1. Sie bekommen deshalb den Verlauf mit dunkler Schrift. */
.kp-style-nacht :is(.kp-flip-front, .kp-mem-card, .kp-band, .kp-cb-head, .kp-cb-merk, .kp-mission-wait,
  .kp-video-dummy, .kp-cb-ok, .kp-cb-acc.open .kp-cb-acc-btn) { background: var(--kp-flow); color: var(--kp-ink); }
.kp-style-nacht :is(.kp-scale label:has(input:checked), .kp-yesno label:has(input:checked),
  .kp-cb-tabs button[aria-pressed="true"], .kp-narr button.playing, .kp-narr .kp-narr-opt.on) {
  background: var(--kp-flow); color: var(--kp-ink); border-color: transparent;
}
.kp-style-nacht .kp-steps > div::before { background: var(--kp-flow); color: var(--kp-ink); }
.kp-style-nacht .kp-flip-back { background-image: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,0)); border: 1px solid var(--kp-line); }
/* Ein ganzer Abschnitt in der Hauptfarbe wird zur tiefen Flaeche statt zur Leuchtflaeche */
.kp-style-nacht .kp-block.kp-bg-primary { background: linear-gradient(135deg, #10305c, #0a1b33); color: var(--kp-text); }
.kp-style-nacht .kp-hero { background: linear-gradient(135deg, #10305c, #0a1b33); }
.kp-style-nacht .kp-bignum { background: #0b1729; }
.kp-style-nacht .kp-fn button { background: color-mix(in srgb, var(--kp-primary) 24%, transparent); color: var(--kp-text); }
/* Comic: Rot auf rosa Toenung erreicht nur 3,9 : 1 (Sichtpruefung); auf Grau bleibt das Signalrot bei 4,6 : 1 */
.kp-style-comic .kp-fn button { background: #EDEDF0; color: var(--kp-primary); }
.kp-style-nacht .kp-hs-dot { box-shadow: 0 0 0 6px rgba(43,127,255,.18); }

/* Nacht: Schaetzfrage und Kennzahl stehen ohne Kasten direkt auf dem dunklen Grund, die Schrift voll ausgeleuchtet */
.kp-style-nacht .kp-predict { background: none; border: 0; padding: 8px 0; color: #F2F7FF; }
.kp-style-nacht .kp-predict .kp-q, .kp-style-nacht .kp-predict-text { color: #F2F7FF; }
.kp-style-nacht .kp-predict-reveal { background: color-mix(in srgb, var(--kp-accent) 12%, var(--kp-surface)); color: #F2F7FF; }
.kp-style-nacht .kp-bignum:not(.kp-bignum-photo) { background: none; border: 0; box-shadow: none; padding: 16px 0; }

/* ---------- Stil-Paket Praxis: warme Comic-Variante mit Begleitfigur ----------
   Vorbild: Praxis-E-Learnings mit gezeichneter Begleitfigur (Rot #A5160F, Koralle #D94C43,
   Rosé-Beige #EAD9D3, Weiß). Roter Seitenkopf mit Kreisformen an der Unterkante, Abschnitte
   im Wechsel Weiß/Beige/Hellgrau, Chat-Blasen in Rot (die anderen) und Beige (die Figur),
   Porträts im weißen Kreis. Aus den Folien-Kursen desselben Vorbilds: Titel in Marineblau,
   eckige rote Knöpfe, Einschub „Wichtig!“ in Zartrosa mit rotem Kreis-Symbol, Fenster mit
   roter Kante und rundem roten Schließen-Knopf, große Figur neben dem Text.
   Kontraste: Weiß auf Rot 7,9 : 1, Marine auf Weiß 11,4 : 1, Text auf Beige 11,6 : 1,
   Rot auf Beige 5,6 : 1, Rot auf Zartrosa 5,6 : 1, Zwischenton auf Beige 4,8 : 1. */
.kp-style-praxis {
  --kp-title: #153B60; /* Titel und Namen in Marineblau, das Rot gehört Kopf, Knöpfen, Blasen und Akzentwort */
  --kp-tint: #EAD9D3; --kp-coral: #D94C43; --kp-grey: #F3F3F3; --kp-pink: #F2D6D8;
  --kp-line: #E6DCD8; --kp-muted: #6A5853;
  --kp-shadow: 0 2px 12px rgba(60,20,12,.08);
}
/* Seitenkopf: rotes Band über die ganze Breite, Titel weiß, Kreise ragen unten heraus */
.kp-style-praxis .kp-page-head, .kp-style-praxis .kp-page-head.kp-head-wide {
  position: relative; background: var(--kp-primary); color: #fff;
  margin: calc(var(--kp-main-pt, 48px) * -1) calc(50% - var(--kp-half, 50vw)) 88px;
  padding: 44px max(var(--kp-side), calc(var(--kp-half, 50vw) - (var(--kp-maxw, 1000px) / 2) + var(--kp-side))) 92px;
}
.kp-style-praxis .kp-page-head h1 { color: #fff; max-width: 720px; }
.kp-style-praxis .kp-page-head .kp-eyebrow { color: #fff; opacity: .9; }
.kp-style-praxis .kp-page-head .kp-accent { color: #FFD6CF; }
.kp-style-praxis .kp-page-head::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -46px; height: 100px; pointer-events: none;
  background:
    radial-gradient(closest-side, var(--kp-primary) 97%, transparent) 1.5% 70% / 120px 66px no-repeat,
    radial-gradient(closest-side, var(--kp-tint) 97%, transparent) 17% 40% / 170px 78px no-repeat,
    radial-gradient(closest-side, var(--kp-coral) 97%, transparent) 35% 0% / 42px 42px no-repeat,
    radial-gradient(closest-side, var(--kp-tint) 97%, transparent) 53% 25% / 92px 92px no-repeat,
    radial-gradient(closest-side, var(--kp-coral) 97%, transparent) 68% 100% / 190px 104px no-repeat,
    radial-gradient(closest-side, var(--kp-coral) 97%, transparent) 100% 80% / 140px 100px no-repeat;
}
@media (max-width: 760px) {
  .kp-style-praxis .kp-page-head, .kp-style-praxis .kp-page-head.kp-head-wide { margin-bottom: 56px; padding: 28px 16px 60px; }
  .kp-style-praxis .kp-page-head::after { bottom: -30px; height: 64px; background-size: 70px 40px, 100px 48px, 26px 26px, 56px 56px, 110px 62px, 80px 60px; }
}
/* Abschnitte: Beige für Figur und Erzählung, Hellgrau für Übungen */
.kp-style-praxis .kp-block.kp-bg-tint { background: var(--kp-tint); }
.kp-style-praxis .kp-block.kp-bg-gradient { background: var(--kp-grey); }
.kp-style-praxis .kp-accent { font-style: normal; color: var(--kp-primary); }
.kp-fx-premium.kp-style-praxis :is(h1, h2) .kp-accent { background-image: none; animation: none; }
.kp-style-praxis .kp-on-dark .kp-accent, .kp-style-praxis .kp-bg-primary .kp-accent { color: #FFD6CF; }
.kp-style-praxis .kp-btn { border-radius: 2px; font-weight: 700; }
.kp-style-praxis .kp-btn.kp-sec { background: #fff; color: var(--kp-primary); border-color: var(--kp-primary); }
.kp-style-praxis :is(.kp-main h1, .kp-sec-title, .kp-q) { font-weight: 700; letter-spacing: -.01em; }
/* Einschub „Wichtig!“: Zartrosa, rote Schrift, Symbol im roten Kreis */
.kp-style-praxis .kp-callout { background: var(--kp-pink); color: var(--kp-primary); border-radius: 0; padding: 16px 20px; align-items: center; }
.kp-style-praxis .kp-callout .kp-ico { width: 34px; height: 34px; padding: 7px; margin: 0; border-radius: 50%; background: var(--kp-primary); color: #fff; }
/* Punkte im Bild und ihre Fenster: rote Kreise, Fenster mit roter Kante, roter Titel */
.kp-style-praxis .kp-hs-dot { background: var(--kp-primary); border-color: #fff; }
.kp-style-praxis :is(.kp-hs-info, .kp-hs-pop) { border: 3px solid var(--kp-primary); border-radius: 0; box-shadow: 0 10px 30px rgba(60,20,12,.12); }
.kp-style-praxis :is(.kp-hs-info, .kp-hs-pop) h3 { color: var(--kp-primary); }
.kp-style-praxis .kp-lightbox-close { background: var(--kp-primary); color: #fff; }
.kp-style-praxis .kp-card, .kp-style-praxis .kp-process, .kp-style-praxis .kp-quiz, .kp-style-praxis .kp-agenda-col { border: 0; border-radius: 4px; box-shadow: var(--kp-shadow); }
/* Chat: die anderen schreiben in Rot, die Figur antwortet in Beige; kein Handyrahmen */
.kp-style-praxis .kp-chat-phone { border: 0; background: none; border-radius: 0; }
.kp-style-praxis .kp-chat-head { border-bottom: 0; padding-left: 0; }
.kp-style-praxis .kp-chat-av { background: var(--kp-primary); color: #fff; }
.kp-style-praxis .kp-chat-log { background: none; padding: 8px 0; gap: 10px; }
.kp-style-praxis .kp-chat-msg { border-radius: 22px; padding: 14px 18px; }
.kp-style-praxis .kp-chat-them { background: var(--kp-primary); color: #fff; border: 0; border-top-left-radius: 6px; }
.kp-style-praxis .kp-chat-me { background: var(--kp-tint); color: var(--kp-text); border: 0; border-bottom-right-radius: 4px; }
.kp-style-praxis .kp-chat-choices, .kp-style-praxis .kp-chat-end { border-top: 0; padding-left: 0; padding-right: 0; }
.kp-style-praxis .kp-chat-opt { border-radius: 999px; padding: 10px 18px; }
