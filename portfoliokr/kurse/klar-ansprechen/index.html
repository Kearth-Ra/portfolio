.kp-vd-lb { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.kp-vd-lb svg { width: 16px; height: 16px; }
.kp-video-dummy blockquote { margin: 10px 0 0; font-size: clamp(15px, 1.8vw, 18px); font-style: italic; line-height: 1.55; }
.kp-video-dummy small { display: block; margin-top: 12px; opacity: .75; }
.kp-mission-wait { margin: 0; padding: 22px 24px; border-radius: var(--kp-radius); background: var(--kp-primary); color: #fff; font-weight: 600; }
.kp-lottie.kp-small { max-width: 240px; }
.kp-lottie.kp-medium { max-width: 480px; }
@media (max-width: 760px) {
  .kp-avatar { width: 52px; height: 52px; }
  .kp-bubble { max-width: 80%; font-size: 16px; }
  .kp-seq-step.has-img { grid-template-columns: 1fr; }
  .kp-seq-stage { padding: 18px; }
}

/* ---------- Typografie, Themenzeilen, Akzentwörter ---------- */
body { overflow-x: hidden; }
.kp-main h1, .kp-q, .kp-hero-title, .kp-guide-name, .kp-agenda-title, .kp-card h3, .kp-text h2, .kp-text h3, .kp-score { font-family: var(--kp-font-head, var(--kp-font)); }
.kp-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--kp-accent-ink, var(--kp-accent)); margin: 0 0 10px; }
.kp-hello { margin: 0 0 6px; font-size: 15px; color: var(--kp-muted); }
/* Ausgezeichnete Woerter nehmen die abgedunkelte Akzentfarbe. Der Player rechnet sie
   ohnehin aus (--kp-accent-ink, mindestens 4,5 : 1 auf Hintergrund und Weiss). Wo der
   rohe Akzent den Kontrast schon schafft, ist ink mit ihm identisch, dort aendert sich
   nichts. Nur zu helle Akzente werden lesbar. */
.kp-accent { font-style: italic; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-guide-name .kp-accent, .kp-agenda-title .kp-accent, .kp-ch-title .kp-accent, .kp-q .kp-accent { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-page-head { margin-bottom: 20px; }
.kp-page-head h1 { margin-bottom: 0; }
.kp-ico { width: 22px; height: 22px; flex: none; vertical-align: middle; }
.kp-ico-lg { width: 40px; height: 40px; color: var(--kp-primary); }
.kp-block-inner > .kp-narr:first-child { margin-top: -4px; }

/* ---------- Gestaltung pro Block: Hintergrund, Breite, Abstand ---------- */
.kp-block[class*="kp-bg-"], .kp-block.kp-w-full {
  margin-left: calc(50% - var(--kp-half, 50vw)); margin-right: calc(50% - var(--kp-half, 50vw));
  padding: var(--kp-pad, 44px) max(var(--kp-side), calc(var(--kp-half, 50vw) - (var(--kp-maxw, 1000px) / 2) + var(--kp-side)));
}
/* Breit: bis 60 px ueber die Lesebreite hinaus, aber nie naeher als 16 px an den Fensterrand (sonst rollt die Seite seitlich) */
.kp-block.kp-w-wide:not([class*="kp-bg-"]) { margin-left: max(-60px, calc(50% - var(--kp-half, 50vw) + 32px)); margin-right: max(-60px, calc(50% - var(--kp-half, 50vw) + 32px)); }
/* Beginnt die Seite mit einem breiten Baustein, steht die Titelzeile buendig mit ihm, sonst springt die linke Kante */
.kp-page-head.kp-head-wide { margin-left: max(-60px, calc(50% - var(--kp-half, 50vw) + 32px)); margin-right: max(-60px, calc(50% - var(--kp-half, 50vw) + 32px)); }
/* Ein randloser Abschnitt als erstes auf der Seite reicht bis an die obere Kante:
   sonst bliebe ueber dem Foto ein heller Streifen aus dem Innenabstand von .kp-main. */
.kp-main > .kp-block:first-child[class*="kp-bg-"],
.kp-main > .kp-block:first-child.kp-w-full,
.kp-main > .kp-block:first-child:has(.kp-hero-cover),
.kp-main > .kp-block:first-child:has(.kp-hs-cover),
.kp-main > .kp-block:first-child:has(.kp-game-cover) { margin-top: calc(var(--kp-main-pt, 32px) * -1); }
/* Ein bildschirmfüllender Abschnitt als letzter Block schließt auch unten bündig ab */
.kp-main > .kp-block:last-child:has(.kp-hero-cover),
.kp-main > .kp-block:last-child:has(.kp-hs-cover),
.kp-main > .kp-block:last-child:has(.kp-game-cover) { margin-bottom: calc(var(--kp-main-pb, 48px) * -1); }
.kp-block.kp-sp-large { margin-top: 56px; margin-bottom: 56px; }
.kp-block.kp-bg-tint { background: color-mix(in srgb, var(--kp-primary) 6%, var(--kp-surface)); }
.kp-block.kp-bg-gradient { background: linear-gradient(135deg, color-mix(in srgb, var(--kp-accent) 16%, white), color-mix(in srgb, var(--kp-primary) 8%, white)); }
.kp-block.kp-bg-primary { background: var(--kp-primary); color: #fff; }
.kp-block.kp-bg-primary > .kp-block-inner > .kp-text, .kp-block.kp-bg-primary .kp-eyebrow { color: #fff; }
.kp-block.kp-bg-primary .kp-accent { color: color-mix(in srgb, var(--kp-accent) 55%, white); }
.kp-block.kp-bg-image { background: var(--kp-veil, linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.80))), var(--kp-bgimg) var(--kp-bgpos, center) / cover no-repeat; position: relative; }
/* Der Schleier liegt senkrecht und lässt das Foto durch: er soll den Text tragen,
   nicht das Bild zudecken. Für die Lesbarkeit sorgt zusätzlich der Textschatten. */
.kp-block.kp-ov-light { --kp-veil: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.80)); }
.kp-block.kp-ov-dark { --kp-veil: linear-gradient(180deg, rgba(8,12,20,.44), rgba(8,12,20,.62)); } /* heller als frueher (.58/.76): das Foto bleibt erkennbar, den Kontrast holt der Fleck hinter dem Text (Wunsch Kerstin) */
.kp-block.kp-ov-primary { --kp-veil: linear-gradient(180deg, color-mix(in srgb, var(--kp-primary) 62%, transparent), color-mix(in srgb, var(--kp-primary) 80%, transparent)); }
.kp-block.kp-ov-none { --kp-veil: linear-gradient(rgba(0,0,0,.06), rgba(0,0,0,.06)); }
/* Text über einem Foto bekommt einen weichen Schatten statt eines dunkleren Schleiers */
.kp-bg-image.kp-on-dark :where(h1, h2, h3, p, li, .kp-statement-text, .kp-sec-title, .kp-eyebrow, .kp-label) { text-shadow: 0 1px 14px rgba(6,10,18,.55); }
.kp-bg-image:not(.kp-on-dark) :where(h1, h2, h3, .kp-statement-text, .kp-sec-title) { text-shadow: 0 1px 14px rgba(255,255,255,.7); }
/* Ein Schleier, der das ganze Foto sicher abdunkelt, macht es unsichtbar. Deshalb bleibt
   das Bild hell und nur direkt hinter dem Text liegt ein weicher Fleck – dort steht die
   Schrift, dort braucht sie den Kontrast, am Rand bleibt das Foto zu sehen. */
.kp-bg-image.kp-on-dark :where(.kp-statement, .kp-sec-head) { position: relative; }
.kp-bg-image.kp-on-dark :where(.kp-statement, .kp-sec-head)::before {
  content: ''; position: absolute; inset: -18px -28px; z-index: -1; border-radius: 40px;
  background: radial-gradient(70% 90% at 50% 50%, rgba(6,10,18,.72), rgba(6,10,18,.45) 55%, transparent 78%);
}
/* Am Handy hat der Abschnitt nur 16 px Rand: der Fleck bleibt innerhalb, sonst rollt die Seite seitlich */
@media (max-width: 700px) { .kp-bg-image.kp-on-dark :where(.kp-statement, .kp-sec-head)::before { inset: -14px -12px; } }
/* Karten auf einem Foto werden durchscheinend, sonst decken sie das Bild zu */
.kp-bg-image .kp-flip-front { background: color-mix(in srgb, var(--kp-primary) 72%, transparent); backdrop-filter: blur(6px) saturate(1.1); }
.kp-bg-image .kp-flip-back { background: color-mix(in srgb, var(--kp-surface) 88%, transparent); backdrop-filter: blur(8px); }
.kp-bg-image :where(.kp-card, .kp-agenda-col) { background: color-mix(in srgb, var(--kp-surface) 88%, transparent); backdrop-filter: blur(8px); }
.kp-block.kp-bg-dark { background: #10161f; position: relative; }
/* Heller Text auf dunklem Grund */
.kp-on-dark, .kp-on-dark .kp-text, .kp-on-dark h1, .kp-on-dark h2, .kp-on-dark h3, .kp-on-dark .kp-sec-title, .kp-on-dark .kp-statement-text, .kp-on-dark .kp-bignum-value, .kp-on-dark .kp-label { color: #fff; }
.kp-on-dark .kp-eyebrow, .kp-on-dark .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
.kp-on-dark .kp-text a, .kp-on-dark .kp-bignum-source { color: #fff; }
.kp-on-dark .kp-btn.kp-sec { color: #fff; border-color: #fff; }
.kp-on-dark .kp-card, .kp-on-dark .kp-agenda-col, .kp-on-dark .kp-quiz, .kp-on-dark .kp-selfcheck, .kp-on-dark .kp-predict, .kp-on-dark .kp-vcard, .kp-on-dark .kp-person-front, .kp-on-dark .kp-person-back { color: var(--kp-text); }
.kp-on-dark .kp-card h3, .kp-on-dark .kp-agenda-col h3, .kp-on-dark .kp-quiz .kp-q, .kp-on-dark .kp-agenda-title { color: var(--kp-title); }
/* Großes Symbol als ruhige Deko im Weißraum */
.kp-decor { position: absolute; right: 4%; top: 10%; opacity: .12; pointer-events: none; color: var(--kp-primary); }
.kp-decor .kp-ico { width: 150px; height: 150px; stroke-width: 1.1; }
.kp-on-dark .kp-decor { color: #fff; opacity: .18; }
@media (max-width: 760px) { .kp-decor { display: none; } }
.kp-block[class*="kp-bg-"] + .kp-block[class*="kp-bg-"] { margin-top: -30px; }

/* ---------- Titelbereich ---------- */
.kp-hero2 { display: grid; grid-template-columns: 1fr 1.15fr; align-items: center; }
.kp-hero-media { grid-column: 2; grid-row: 1; border-radius: var(--kp-radius); overflow: hidden; min-height: 340px; }
.kp-hero-media img { display: block; width: 100%; height: 100%; min-height: 340px; max-height: 520px; object-fit: cover; }
.kp-hero-card { grid-column: 1; grid-row: 1; position: relative; z-index: 1; margin-right: -90px; background: var(--kp-surface); padding: 34px 36px; border-radius: var(--kp-radius); box-shadow: 0 18px 50px rgba(16,24,40,.12); }
.kp-hero-card-right .kp-hero2, .kp-hero-card-right { grid-template-columns: 1.15fr 1fr; }
.kp-hero-card-right .kp-hero-media { grid-column: 1; }
.kp-hero-card-right .kp-hero-card { grid-column: 2; margin-right: 0; margin-left: -90px; }
.kp-hero-overlay { grid-template-columns: 1fr; }
.kp-hero-overlay .kp-hero-media { grid-column: 1; }
.kp-hero-overlay .kp-hero-media img { max-height: 560px; min-height: 420px; }
.kp-hero-overlay .kp-hero-card { grid-column: 1; margin: 0 0 0 40px; max-width: 500px; align-self: center; }
/* Titelseite, die den ganzen Bildschirm füllt: Foto als Grund, Karte und Startknopf darauf */
/* Der Innenabstand des Abschnitts würde das Foto einrücken: bei einer Titelseite entfällt er,
   das Foto liegt darunter und nur die Karte hält die Lesebreite ein. */
.kp-block:has(.kp-hero-cover) { padding: 0; margin-left: calc(50% - var(--kp-half, 50vw)); margin-right: calc(50% - var(--kp-half, 50vw)); }
.kp-hero-cover { position: relative; grid-template-columns: 1fr; min-height: calc(100svh - var(--kp-navh, 0px) - var(--kp-headh, 0px)); }
.kp-hero-cover .kp-hero-media { position: absolute; inset: 0; grid-column: 1; grid-row: 1; height: 100%; min-height: 0; border-radius: 0; }
.kp-hero-cover .kp-hero-media img { height: 100%; width: 100%; min-height: 0; max-height: none; }
.kp-hero-cover .kp-hero-card { position: relative; grid-column: 1; grid-row: 1; align-self: center; justify-self: start; max-width: min(560px, 100%); margin: 0 var(--kp-side) 0 max(var(--kp-side), calc(var(--kp-half, 50vw) - (var(--kp-maxw, 1000px) / 2) + var(--kp-side))); }
.kp-hero-cover .kp-hero-start { margin-top: 26px; }
.kp-hero-cover .kp-hero-start .kp-btn { padding: 15px 44px; font-size: 16px; letter-spacing: .02em; }
.kp-hero-cover .kp-hero-meta { margin-top: 14px; }
@media (max-width: 760px) {
  .kp-hero-cover .kp-hero-card { justify-self: stretch; padding: 24px 22px; }
  .kp-hero-cover { min-height: calc(100svh - var(--kp-navh, 0px) - var(--kp-headh, 0px)); }
}
.kp-hero-title { font-size: 34px; line-height: 1.15; margin: 0 0 14px; color: var(--kp-title); }
.kp-hero-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; color: var(--kp-muted); font-size: 14px; }
.kp-hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.kp-photo-empty { width: 100%; height: 100%; min-height: 240px; display: grid; place-content: center; justify-items: center; gap: 8px; color: var(--kp-muted); background: linear-gradient(135deg, color-mix(in srgb, var(--kp-accent) 22%, white), color-mix(in srgb, var(--kp-primary) 14%, white)); font-size: 14px; }
.kp-photo-empty .kp-ico { width: 48px; height: 48px; opacity: .6; }

/* ---------- Begleitfigur ---------- */
.kp-guide { display: grid; grid-template-columns: 1fr 1.1fr; align-items: center; }
.kp-guide-media { border-radius: var(--kp-radius); overflow: hidden; background: #eef2f6; }
.kp-guide-media img, .kp-guide-media video { display: block; width: 100%; max-height: 440px; object-fit: cover; }
.kp-guide-avatar svg { display: block; width: 100%; max-height: 380px; }
.kp-guide-card { position: relative; z-index: 1; margin-left: -70px; margin-top: 60px; background: var(--kp-surface); padding: 28px 30px; border-radius: var(--kp-radius); box-shadow: 0 14px 40px rgba(16,24,40,.10); }
.kp-guide-right { grid-template-columns: 1.1fr 1fr; }
.kp-guide-right .kp-guide-media { grid-column: 2; grid-row: 1; }
.kp-guide-right .kp-guide-card { grid-column: 1; grid-row: 1; margin-left: 0; margin-right: -70px; }
.kp-guide-name { font-size: 22px; margin: 0 0 10px; color: var(--kp-title); }
.kp-guide-quote { font-size: 16px; }

/* ---------- Agenda und Ziele ---------- */
.kp-agenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
/* Herausforderung statt Zielliste: ein Satz, was zu schaffen ist, über den Spalten */
.kp-agenda-challenge { margin: 0 0 18px; font-family: var(--kp-font-head, var(--kp-font)); font-size: 22px; line-height: 1.3; font-weight: 700; color: var(--kp-title); }
/* Serie richtiger Antworten und Vergleich mit dem eigenen letzten Versuch */
.kp-streak { display: inline-block; margin-left: 10px; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: color-mix(in srgb, var(--kp-ok) 14%, transparent); color: var(--kp-ok); }
.kp-prev { margin: 6px 0 0; font-size: 15px; color: var(--kp-muted); }
.kp-prev b { color: var(--kp-text); } .kp-prev.up b { color: var(--kp-ok); } .kp-prev.down b { color: var(--kp-no); }
/* Suchbild-Runden: gleiches Format, je Runde ein neues Bild */
.kp-hs-rounds { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--kp-muted); }
.kp-chat-face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--kp-bg); display: inline-block; }
.kp-chat-face svg { width: 100%; height: 100%; display: block; }

.kp-agenda-col { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 26px 28px; box-shadow: var(--kp-shadow); }
.kp-agenda-title { font-size: 20px; margin: 0 0 14px; color: var(--kp-title); }
.kp-agenda ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.kp-agenda li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.5; }
.kp-agenda li .kp-ico { color: var(--kp-accent); margin-top: 1px; }

/* ---------- Selbstcheck ---------- */
.kp-selfcheck { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 24px 26px; }
.kp-sc-rows { display: grid; gap: 4px; }
.kp-sc-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--kp-line); }
.kp-yesno { display: inline-flex; background: var(--kp-bg); border-radius: 999px; padding: 3px; }
.kp-yesno label { position: relative; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--kp-muted); }
.kp-yesno input { position: absolute; opacity: 0; pointer-events: none; }
.kp-yesno label:has(input:checked) { background: var(--kp-primary); color: #fff; }
.kp-yesno label:has(input:focus-visible) { outline: 3px solid var(--kp-accent); }
.kp-sc-missing .kp-sc-row:not(:has(input:checked)) { background: #fbeceb; }
.kp-sc-result { margin-top: 18px; padding: 16px 18px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-accent) 14%, white); }

/* ---------- Scroll-Darstellung ---------- */
.kp-readbar { position: sticky; top: 0; z-index: 6; height: 0; background: transparent; }
.kp-readbar b { display: block; height: 3px; width: 0; background: var(--kp-accent); transition: width .1s; }
.kp-layout-scroll .kp-main { --kp-main-pt: 48px; }
.kp-layout-scroll .kp-block, .kp-layout-scroll .kp-row { margin-bottom: var(--kp-gap-scroll, 32px); }
.kp-layout-scroll .kp-foot { position: static; justify-content: center; gap: 16px; background: transparent; border: 0; padding: 20px 20px 64px; }
.kp-layout-scroll .kp-foot [data-next] { padding: 14px 34px; font-size: 17px; }

/* ---------- Stil-Paket „KR Consulting“: editoriale Serifen, weiche Karten ohne Balken und Schatten ---------- */
.kp-style-kr .kp-main h1, .kp-style-kr .kp-hero-title { font-weight: 400; letter-spacing: -.01em; color: var(--kp-title); }
.kp-style-kr .kp-main h1 { font-size: 38px; }
.kp-style-kr .kp-hero-title { font-size: 40px; }
.kp-style-kr .kp-q, .kp-style-kr .kp-guide-name, .kp-style-kr .kp-agenda-title, .kp-style-kr .kp-card h3 { font-weight: 500; }
.kp-style-kr .kp-card, .kp-style-kr .kp-agenda-col, .kp-style-kr .kp-quiz, .kp-style-kr .kp-branch, .kp-style-kr .kp-selfcheck,
.kp-style-kr .kp-reflect, .kp-style-kr .kp-plan, .kp-style-kr .kp-survey, .kp-style-kr .kp-seq, .kp-style-kr .kp-dialog, .kp-style-kr .kp-cert,
.kp-style-kr details.kp-acc, .kp-style-kr .kp-steps > div { border: 0; box-shadow: none; background: color-mix(in srgb, var(--kp-primary) 5%, white); border-radius: 18px; }
.kp-style-kr .kp-hero-card, .kp-style-kr .kp-guide-card { box-shadow: 0 20px 60px rgba(26,58,92,.10); border-radius: 18px; }
.kp-style-kr .kp-note { border-left: 0; border-radius: 18px; background: color-mix(in srgb, var(--kp-accent) 16%, white); }
.kp-style-kr .kp-quote { border-left: 0; padding-left: 0; font-family: var(--kp-font-head, var(--kp-font)); font-size: 26px; color: var(--kp-primary); }
.kp-style-kr .kp-btn { border-radius: 999px; }
.kp-style-kr .kp-answer, .kp-style-kr .kp-branch-option { border-radius: 14px; border-color: transparent; background: #fff; }
.kp-style-kr .kp-head { background: var(--kp-nav-bg); }

/* ---------- Stil-Paket „Soft Pastell“: großzügige Karten mit farbiger Kante, Überschriften in Großbuchstaben ---------- */
.kp-style-pastell .kp-main h1, .kp-style-pastell .kp-hero-title, .kp-style-pastell .kp-guide-name, .kp-style-pastell .kp-agenda-title { text-transform: uppercase; letter-spacing: .02em; }
.kp-style-pastell .kp-main h1 { font-size: 28px; }
.kp-style-pastell .kp-hero-card, .kp-style-pastell .kp-guide-card, .kp-style-pastell .kp-agenda-col, .kp-style-pastell .kp-card { border: 0; border-left: 5px solid var(--kp-primary); border-radius: 4px; box-shadow: 0 16px 44px rgba(16,24,40,.12); }
.kp-style-pastell .kp-main { background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--kp-primary) 5%, transparent)); }
.kp-style-pastell .kp-hero-media, .kp-style-pastell .kp-guide-media { border-radius: 4px; }

/* ---------- Stil-Paket „TBW“: Petrol und Lime, Balken oben ---------- */
.kp-style-tbw .kp-eyebrow { color: #3D3C3C; display: flex; align-items: center; gap: 10px; }
.kp-style-tbw .kp-eyebrow::before { content: ""; width: 14px; height: 14px; background: var(--kp-accent); }
.kp-style-tbw .kp-page-head h1::after { content: ""; display: block; width: 56px; height: 6px; background: var(--kp-accent); margin-top: 14px; }
.kp-style-tbw .kp-card, .kp-style-tbw .kp-agenda-col, .kp-style-tbw .kp-hero-card, .kp-style-tbw .kp-guide-card { border: 1px solid #E8E8E8; border-top: 6px solid var(--kp-primary); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.kp-style-tbw .kp-accent { color: var(--kp-primary); font-weight: 700; }

@media (max-width: 760px) {
  .kp-hero2, .kp-hero-card-right, .kp-guide, .kp-guide-right { grid-template-columns: 1fr; }
  .kp-hero-media, .kp-hero-card-right .kp-hero-media, .kp-guide-right .kp-guide-media { grid-column: 1; grid-row: 1; min-height: 0; }
  .kp-hero-media img { min-height: 220px; }
  .kp-hero-card, .kp-hero-card-right .kp-hero-card, .kp-hero-overlay .kp-hero-card { grid-column: 1; grid-row: 2; margin: -40px 12px 0; padding: 24px; }
  .kp-guide-card, .kp-guide-right .kp-guide-card { grid-column: 1; grid-row: 2; margin: -40px 12px 0; }
  .kp-hero-title { font-size: 28px; }
  .kp-block.kp-w-wide:not([class*="kp-bg-"]), .kp-style-comic .kp-w-wide:not([class*="kp-bg-"]), .kp-page-head.kp-head-wide { margin-left: 0; margin-right: 0; }
  .kp-block[class*="kp-bg-"], .kp-block.kp-w-full { padding: 32px 16px; }
  .kp-sc-row { grid-template-columns: 1fr; gap: 8px; }
}

/* ---------- Feinschliff: Typografie, Fokus, Bewegung ---------- */
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
.kp-text, .kp-q, .kp-ch-text, .kp-statement-sub { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
.kp-main h1, .kp-hero-title, .kp-sec-title, .kp-statement-text, .kp-q, .kp-ch-title, .kp-guide-name, .kp-agenda-title { text-wrap: balance; }
.kp-text p, .kp-text li { text-wrap: pretty; }
/* Fliesstext laeuft ueber die volle Abschnittsbreite wie Karten und Uebungen darueber (Wunsch Kerstin), keine eigene Lesebreite von 70ch */
.kp-text strong { color: color-mix(in srgb, var(--kp-primary) 80%, var(--kp-text)); }
.kp-text ul { padding-left: 1.2em; } .kp-text li { margin: .3em 0; } .kp-text li::marker { color: var(--kp-accent); }
:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--kp-accent) 35%, white); }

@media (prefers-reduced-motion: reduce) { .kp-toast, .kp-lightbox { animation: none !important; } }
/* Meilenstein am Kapitelende */
.kp-milestone { position: fixed; inset: 0; z-index: 42; display: grid; place-items: center; padding: 20px; background: rgba(10,14,22,.45); backdrop-filter: blur(3px); animation: kp-fade .25s both; transition: opacity .25s; }
.kp-milestone.out { opacity: 0; pointer-events: none; }
.kp-ms-box { background: var(--kp-surface); color: var(--kp-text); border-radius: 18px; padding: 30px 30px 26px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: kp-ms-in .5s cubic-bezier(.2,.8,.2,1) both; }
.kp-ms-box h2 { margin: 4px 0 8px; font-size: 26px; line-height: 1.2; font-family: var(--kp-font-head, var(--kp-font)); }
.kp-ms-ring { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; }
.kp-ms-ring svg { width: 100%; height: 100%; display: block; }
.kp-ms-ring .kp-ring-bg, .kp-ms-ring .kp-ring-on { stroke-width: 6; }
.kp-ms-ring .kp-ring-on { stroke: var(--kp-accent); }
.kp-ms-ring > span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--kp-ok); }
.kp-ms-next { color: var(--kp-muted); margin: 0 0 18px; }
@keyframes kp-ms-in { from { opacity: 0; transform: translateY(18px) scale(.96); } }
@media (prefers-reduced-motion: reduce) { .kp-milestone, .kp-ms-box { animation: none; } }

/* Kopfzeile mit Kapitel */
.kp-head-chapter { font-weight: 400; opacity: .72; margin-left: 10px; padding-left: 10px; border-left: 1px solid currentColor; }
.kp-head-count { font-variant-numeric: tabular-nums; opacity: .85; }

/* Abschnittskopf für Übersicht und Kernaussagen */
.kp-sec-head { max-width: 720px; margin-bottom: 26px; }
.kp-sec-title { font-family: var(--kp-font-head, var(--kp-font)); font-size: 30px; line-height: 1.2; margin: 0 0 10px; color: var(--kp-title); }
.kp-style-kr .kp-sec-title { font-weight: 400; font-size: 34px; }

/* Kapitelübersicht */
.kp-ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
.kp-ch-card { display: flex; flex-direction: column; background: var(--kp-surface); border-radius: var(--kp-radius); overflow: hidden; box-shadow: var(--kp-shadow); transition: transform .2s, box-shadow .2s; }
.kp-ch-card:hover { transform: translateY(-3px); box-shadow: 0 18px 44px rgba(16,24,40,.12); }
.kp-ch-media { aspect-ratio: 16 / 7; background: linear-gradient(135deg, color-mix(in srgb, var(--kp-primary) 88%, black), color-mix(in srgb, var(--kp-accent) 70%, var(--kp-primary))); position: relative; }
.kp-ch-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.kp-ch-num { position: absolute; right: 18px; bottom: 6px; font-family: var(--kp-font-head, var(--kp-font)); font-size: 64px; line-height: 1; color: rgba(255,255,255,.9); }
.kp-ch-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.kp-ch-body .kp-eyebrow { margin: 0; }
.kp-ch-title { font-family: var(--kp-font-head, var(--kp-font)); font-size: 21px; line-height: 1.25; margin: 0; color: var(--kp-title); }
.kp-ch-text { margin: 0; color: var(--kp-muted); font-size: 15px; line-height: 1.5; }
.kp-ch-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--kp-muted); margin-top: auto; padding-top: 6px; }
.kp-ch-meta > span { display: inline-flex; align-items: center; gap: 5px; }
.kp-ch-meta .kp-ico { width: 16px; height: 16px; }
.kp-ch-status { padding: 2px 10px; border-radius: 999px; background: var(--kp-bg); }
.kp-ch-status.done { background: #e9f5ee; color: var(--kp-ok); font-weight: 600; }
.kp-ch-body .kp-btn { align-self: flex-start; margin-top: 8px; }
.kp-ch-card.is-done .kp-ch-media { filter: saturate(.7); }
/* Kapitelübersicht als ruhige Liste: Trennlinien statt Karten, Stand als kleiner Ring */
.kp-chl { border-top: 1px solid var(--kp-line); }
/* Die ruhige Liste steht in einer schmalen Spalte, Überschrift und Zeilen bündig */
.kp-ch-quiet { max-width: 760px; margin-left: auto; margin-right: auto; }
.kp-chl-item { display: flex; align-items: center; gap: 18px; width: 100%; padding: 18px 8px; font: inherit; color: inherit; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--kp-line); cursor: pointer; transition: background .15s; }
.kp-chl-item:hover:not(:disabled) { background: color-mix(in srgb, var(--kp-primary) 5%, transparent); }
.kp-chl-item:disabled { cursor: not-allowed; opacity: .55; }
.kp-chl-num { flex: none; width: 26px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--kp-muted); }
.kp-chl-main { flex: 1; min-width: 0; display: block; }
.kp-chl-title { display: block; font-size: 16px; font-weight: 600; color: var(--kp-title); line-height: 1.35; }
.kp-chl-text { display: block; margin-top: 3px; font-size: 14px; line-height: 1.45; color: var(--kp-muted); }
.kp-chl-meta { flex: none; font-size: 13px; color: var(--kp-muted); font-variant-numeric: tabular-nums; }
.kp-chl-ring { flex: none; width: 22px; height: 22px; }
.kp-chl-ring circle { fill: none; stroke-width: 1.6; }
.kp-chl-ring-bg { stroke: var(--kp-line); }
.kp-chl-ring-on { stroke: var(--kp-accent); stroke-linecap: round; }
.kp-chl-ring-fill { fill: var(--kp-ok); stroke: var(--kp-ok); }
.kp-chl-ring-check { fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.kp-on-dark .kp-chl { border-color: rgba(255,255,255,.22); }
.kp-on-dark .kp-chl-item { border-color: rgba(255,255,255,.22); }
.kp-on-dark .kp-chl-title { color: #fff; }
.kp-on-dark .kp-chl-num, .kp-on-dark .kp-chl-text, .kp-on-dark .kp-chl-meta { color: rgba(255,255,255,.75); }
.kp-on-dark .kp-chl-ring-bg { stroke: rgba(255,255,255,.35); }
.kp-on-dark .kp-chl-item:hover:not(:disabled) { background: rgba(255,255,255,.08); }
@media (max-width: 560px) { .kp-chl-meta { display: none; } }
.kp-style-kr .kp-ch-card { box-shadow: none; background: color-mix(in srgb, var(--kp-primary) 5%, white); border-radius: 18px; }
.kp-style-tbw .kp-ch-card { border-top: 6px solid var(--kp-primary); border-radius: 4px; }

/* Kernbotschaft */
.kp-statement { text-align: center; max-width: 820px; margin: 0 auto; padding: 18px 0; }
.kp-statement .kp-ico-lg { color: var(--kp-accent); margin-bottom: 10px; }
.kp-statement-text { font-family: var(--kp-font-head, var(--kp-font)); font-size: clamp(24px, 3.4vw, 36px); line-height: 1.25; font-weight: 600; margin: 0; color: var(--kp-title); }
.kp-style-kr .kp-statement-text { font-weight: 400; }
.kp-statement-sub { margin: 16px auto 0; max-width: 620px; color: var(--kp-muted); }
.kp-statement-quote { text-align: left; padding-left: 0; }
.kp-statement-quote .kp-statement-text::before { content: "„"; display: block; font-size: 1.9em; line-height: .6; color: var(--kp-accent); }
.kp-bg-primary .kp-statement-text, .kp-bg-primary .kp-statement-sub { color: #fff; }

/* Denkpause */
.kp-predict { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 24px 26px; border: 1px dashed color-mix(in srgb, var(--kp-accent) 60%, white); }
.kp-predict .kp-eyebrow { display: flex; align-items: center; gap: 6px; }
.kp-predict .kp-eyebrow .kp-ico { width: 18px; height: 18px; }
.kp-predict-text { min-height: 90px; }
.kp-estimate { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
.kp-estimate input { flex: 1; accent-color: var(--kp-primary); height: 28px; }
.kp-estimate-val { min-width: 90px; text-align: right; font-size: 26px; font-weight: 700; color: var(--kp-primary); font-variant-numeric: tabular-nums; }
.kp-answer.kp-chosen { border-color: var(--kp-accent); }
.kp-predict-reveal { margin-top: 16px; padding: 18px 20px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-accent) 12%, white); animation: kp-fade .4s both; }
.kp-predict-mine { margin: 0 0 10px; display: grid; gap: 2px; font-weight: 600; }
.kp-predict-mine span { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--kp-muted); font-weight: 700; }
.kp-style-kr .kp-predict { border: 0; background: color-mix(in srgb, var(--kp-accent) 9%, white); border-radius: 18px; }
.kp-style-kr .kp-predict-reveal { background: #fff; }
/* Dunkler Modus: Auflösung auf getönter Kartenfläche, sonst steht helle Schrift auf fast weißem Grund */
.kp-dark .kp-predict-reveal { background: color-mix(in srgb, var(--kp-accent) 14%, var(--kp-surface)); color: var(--kp-text); }

/* Kernaussagen */
.kp-tk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.kp-tk-list li { display: grid; grid-template-columns: 52px 1fr; gap: 16px; align-items: start; background: var(--kp-surface); border-radius: var(--kp-radius); padding: 18px 20px; box-shadow: var(--kp-shadow); }
.kp-tk-num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--kp-primary); color: #fff; font-family: var(--kp-font-head, var(--kp-font)); font-size: 20px; }
.kp-tk-list h3 { font-size: 18px; margin: 8px 0 4px; }
.kp-tk-list .kp-text { font-size: 16px; color: var(--kp-muted); }
.kp-takeaways .kp-quiz-actions { margin-top: 18px; }
.kp-takeaways .kp-btn .kp-ico { width: 18px; height: 18px; margin-right: 4px; }

/* Selbsterklärung: Begründung vor der Auflösung, danach neben der des Kurses */
.kp-why { margin-top: 10px; display: grid; gap: 6px; }
.kp-why label { display: grid; gap: 6px; }
.kp-why-text { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 12px; min-height: 44px; field-sizing: content; border: 1px solid var(--kp-line); border-radius: calc(var(--kp-radius) * .6); background: var(--kp-surface); color: var(--kp-text); resize: vertical; }
.kp-why-missing { font-size: 14px; color: var(--kp-no); }
.kp-why-cmp { display: grid; gap: 12px; margin-top: 12px; }
.kp-why-mine { margin-top: 12px; padding: 12px 16px; border-left: 3px solid var(--kp-accent); background: color-mix(in srgb, var(--kp-primary) 5%, var(--kp-surface)); border-radius: 0 calc(var(--kp-radius) * .6) calc(var(--kp-radius) * .6) 0; }
.kp-why-mine p, .kp-why-mine .kp-label { margin: 0; } .kp-why-mine p { margin-top: 4px; font-style: italic; }
.kp-why-cmp .kp-note .kp-label { display: block; margin-bottom: 4px; }
@media (min-width: 720px) { .kp-why-cmp:has(.kp-note) { grid-template-columns: 1fr 1fr; } .kp-why-cmp .kp-why-mine { margin-top: 0; } }
/* Kernaussagen zum Aufdecken: erst überlegen, dann lesen */
.kp-tk-hint { margin: -10px 0 16px; color: var(--kp-muted); font-size: 15px; } .kp-tk-hint b { color: var(--kp-text); font-weight: 600; }
.kp-tk-closed { border: 1px dashed var(--kp-line); box-shadow: none; background: transparent; }
.kp-tk-closed > div { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; } /* Knopf neben dem Titel, damit die Liste nicht wächst */
.kp-tk-closed h3 { margin: 0; }
.kp-tk-open { font-size: 14px; padding: 7px 14px; }
.kp-tk-in { animation: kp-reveal-in .4s var(--kp-ease-out, ease-out) both; }
/* Vorsatz auf Zertifikat und Ergebnisseite */
.kp-plan-card { margin: 14px auto 6px; max-width: 560px; text-align: left; padding: 14px 18px; border-left: 3px solid var(--kp-accent); background: color-mix(in srgb, var(--kp-primary) 5%, var(--kp-surface)); border-radius: 0 calc(var(--kp-radius) * .6) calc(var(--kp-radius) * .6) 0; }
.kp-plan-card p { margin: 4px 0 0; font-style: italic; line-height: 1.5; }
.kp-cert-actions { justify-content: center; flex-wrap: wrap; gap: 10px; }
.kp-cert-hint { margin: 8px 0 0; font-size: 14px; color: var(--kp-muted); }
.kp-style-comic :is(.kp-why-mine, .kp-plan-card) { background: var(--kp-surface); border: 1px solid var(--kp-line); border-left: 3px solid var(--kp-primary); }
.kp-style-kr .kp-tk-list li { box-shadow: none; background: color-mix(in srgb, var(--kp-primary) 5%, white); border-radius: 18px; }

/* Quellen und Fußnoten */
.kp-sources { font-size: 13px; color: var(--kp-muted); border-top: 1px solid var(--kp-line); padding-top: 14px; }
.kp-sources-title { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 0; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
.kp-sources-title::-webkit-details-marker { display: none; }
.kp-sources-title::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .2s; }
.kp-sources[open] .kp-sources-title::before { transform: rotate(45deg); }
.kp-sources[open] .kp-sources-title { margin-bottom: 8px; }
.kp-sources ol { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; line-height: 1.5; }
.kp-sources li { border-radius: 4px; transition: background .4s; }
.kp-sources li.kp-flash { background: color-mix(in srgb, var(--kp-accent) 25%, white); }
.kp-sources a { color: inherit; word-break: break-all; }
.kp-fn { line-height: 0; }
.kp-fn button { font: inherit; font-size: .72em; font-weight: 700; border: 0; background: color-mix(in srgb, var(--kp-accent) 18%, white); color: var(--kp-primary); border-radius: 4px; padding: 1px 4px; margin-left: 1px; cursor: pointer; vertical-align: super; }

/* Bild: Rahmen, Vergrößern, Nachweis */
.kp-fig-frame { position: relative; display: block; width: fit-content; max-width: 100%; margin: 0 auto; }
.kp-fig.kp-small .kp-fig-frame { max-width: 40%; } .kp-fig.kp-medium .kp-fig-frame { max-width: 70%; }
.kp-fig.kp-small img, .kp-fig.kp-medium img { max-width: 100%; }
.kp-fig-frame img { cursor: zoom-in; }
.kp-zoom { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: var(--kp-text); display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .2s; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.kp-zoom svg { width: 18px; height: 18px; }
.kp-fig-frame:hover .kp-zoom, .kp-zoom:focus-visible { opacity: 1; }
@media (hover: none) { .kp-zoom { opacity: .85; } }
.kp-credit { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
.kp-credit-over { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #fff; background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 4px; }
.kp-hero-media, .kp-guide-media { position: relative; }
.kp-lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(12,18,28,.86); display: grid; place-items: center; padding: 28px; animation: kp-fade .2s both; }
.kp-lightbox figure { margin: 0; max-width: min(1200px, 100%); }
.kp-lightbox img { max-width: 100%; max-height: 84vh; display: block; border-radius: 8px; margin: 0 auto; }
.kp-lightbox figcaption { color: #e4e9ef; font-size: 14px; text-align: center; margin-top: 10px; }
.kp-lightbox-close { position: absolute; top: 16px; right: 18px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 18px; cursor: pointer; }

/* Rückmeldung am Kapitelende */
.kp-toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 10px; background: var(--kp-primary); color: #fff; padding: 12px 20px; border-radius: 999px; box-shadow: 0 14px 40px rgba(16,24,40,.25); font-weight: 600; animation: kp-toast-in .35s both; transition: opacity .5s, transform .5s; }
.kp-toast .kp-ico { color: color-mix(in srgb, var(--kp-accent) 60%, white); }
.kp-toast.out { opacity: 0; transform: translate(-50%, 12px); }
@keyframes kp-toast-in { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* Vorschau auf die nächste Seite (Scroll-Darstellung) */
.kp-next-preview { display: none; }
.kp-layout-scroll .kp-foot { flex-wrap: wrap; }
.kp-layout-scroll .kp-next-preview { display: grid; gap: 4px; width: 100%; text-align: center; margin-bottom: 10px; }
.kp-next-preview span { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-next-preview strong { font-family: var(--kp-font-head, var(--kp-font)); font-weight: 500; font-size: 24px; color: var(--kp-title); }

@media (max-width: 760px) {
  .kp-head-chapter { display: none; }
  .kp-main { padding-left: var(--kp-side); padding-right: var(--kp-side); }
  .kp-layout-scroll .kp-main { --kp-main-pt: 24px; }
  .kp-predict, .kp-selfcheck, .kp-quiz, .kp-branch { padding: 18px 16px; }
  .kp-predict-reveal { padding: 14px; }
  .kp-agenda-col { padding: 20px; }
  .kp-tk-list li { grid-template-columns: 40px 1fr; padding: 16px; }
  .kp-tk-num { width: 36px; height: 36px; font-size: 17px; }
  .kp-estimate-val { font-size: 20px; min-width: 70px; }
  .kp-toast { bottom: 84px; max-width: calc(100vw - 32px); }
  .kp-fig.kp-small .kp-fig-frame, .kp-fig.kp-medium .kp-fig-frame { max-width: 100%; }
}
@media print { .kp-head, .kp-foot, .kp-progress, .kp-readbar, .kp-zoom, .kp-narr { display: none !important; } }
.kp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.kp-lang select { font: inherit; font-size: 13px; font-weight: 600; color: inherit; background: rgba(127,127,127,.16); background: color-mix(in srgb, currentColor 14%, transparent); border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
.kp-lang select option { color: #1d2530; }

/* ---------- Barrierefreiheit: Mindestgrößen (WCAG 2.2, 2.5.8) und Lesbarkeit ---------- */
.kp-iconbtn, .kp-btn, .kp-lang select, .kp-toc-item, .kp-files a, .kp-proc-nav button, .kp-answer, .kp-branch-option { min-height: 24px; }
.kp-iconbtn { min-height: 32px; padding: 7px 12px; }
.kp-fn button { min-width: 24px; min-height: 24px; padding: 2px 6px; }
.kp-sort-move button, .kp-order-item .kp-move button { min-width: 28px; min-height: 28px; }
.kp-zoom, .kp-hs-dot { min-width: 34px; min-height: 34px; }
.kp-drawer-head button { min-width: 32px; min-height: 32px; }
.kp-fig figcaption, .kp-caption, .kp-sources, .kp-credit, .kp-vcard-head span, .kp-panel figcaption, .kp-bignum-source, .kp-ch-text { font-size: 14px; }
.kp-text { line-height: 1.65; }

/* ---------- Layout: zwei Spalten, Abschnittsformen, Logo, Bildbehandlung ---------- */
.kp-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--kp-gap, 30px); align-items: start; margin-bottom: var(--kp-gap, 30px); }
.kp-row > .kp-block { margin-bottom: 0; }
/* In der Zweispaltigkeit darf ein Block mit Hintergrund nicht randlos werden:
   die negativen Raender von kp-bg-* und kp-w-full wuerden beide Spalten auf die
   volle Fensterbreite ziehen und uebereinanderlegen. */
.kp-row > .kp-block[class*="kp-bg-"], .kp-row > .kp-block.kp-w-full {
  margin-left: 0; margin-right: 0; padding: var(--kp-pad, 44px) 28px;
}
/* Der buendige Anschluss zweier farbiger Abschnitte gilt nur untereinander.
   Nebeneinander zieht er die zweite Spalte 30 Pixel hoch, bis sie in die
   Ueberschrift darueber laeuft. */
.kp-row > .kp-block[class*="kp-bg-"] + .kp-block[class*="kp-bg-"] { margin-top: 0; }
@media (max-width: 760px) { .kp-row { grid-template-columns: 1fr; } }
.kp-shape { position: absolute; left: 0; right: 0; bottom: -1px; height: 44px; pointer-events: none; }
.kp-shape-welle { background: radial-gradient(60% 44px at 50% 100%, var(--kp-bg) 99%, transparent 100%); }
.kp-shape-schraege { background: linear-gradient(to bottom right, transparent 49.6%, var(--kp-bg) 50%); }
.kp-shape-bogen { border-bottom-left-radius: 50% 44px; border-bottom-right-radius: 50% 44px; box-shadow: 0 22px 0 22px var(--kp-bg); }
.kp-logo { height: 26px; width: auto; flex: none; margin-right: 4px; }
.kp-treat-rund img { border-radius: 999px; aspect-ratio: 1; object-fit: cover; }
.kp-treat-weich img { border-radius: calc(var(--kp-radius) * 2); }
.kp-treat-kante img { border-radius: 0; }
.kp-treat-duo img { filter: grayscale(1) contrast(1.05); }
/* Bildbehandlung „digital“: feines Raster und ein Hauch Farbversatz an den Rändern.
   Gibt allen Fotos eines Kurses dieselbe Handschrift, ohne die Bilder selbst zu bearbeiten. */
.kp-treat-digital .kp-fig-frame { position: relative; overflow: hidden; border-radius: inherit; }
.kp-treat-digital img { filter: saturate(1.12) contrast(1.06); }
.kp-treat-digital .kp-fig-frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.10) 1px 3px);
  box-shadow: inset 2px 0 0 rgba(0,229,255,.30), inset -2px 0 0 rgba(255,0,110,.30); mix-blend-mode: normal; }
/* Stil Foto: Bilder ohne eigene Behandlung bekommen das feine Raster (eine Handschrift je Kurs, wie Duotone im Editorial) */
.kp-style-foto .kp-fig:not([class*="kp-treat-"]) .kp-fig-frame { position: relative; overflow: hidden; border-radius: inherit; }
.kp-style-foto .kp-fig:not([class*="kp-treat-"]) img { filter: saturate(1.12) contrast(1.06); }
.kp-style-foto .kp-fig:not([class*="kp-treat-"]) .kp-fig-frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.10) 1px 3px);
  box-shadow: inset 2px 0 0 rgba(0,229,255,.30), inset -2px 0 0 rgba(255,0,110,.30); }
.kp-treat-duo .kp-fig-frame::after { content: ""; position: absolute; inset: 0; background: var(--kp-primary); mix-blend-mode: screen; opacity: .35; border-radius: inherit; pointer-events: none; }
/* Duotone: Schatten in der Hauptfarbe, Lichter in der Akzentfarbe, reines CSS (Datei bleibt unveraendert).
   Grundflaeche Hauptfarbe, das Graustufenbild mit lighten darueber (Dunkles wird zur Hauptfarbe),
   dann die Akzentfarbe mit darken (Helles wird zur Akzentfarbe). Setzt eine dunkle Hauptfarbe voraus. */
.kp-treat-duotone .kp-fig-frame, .kp-style-editorial .kp-fig:not([class*="kp-treat-"]) .kp-fig-frame { position: relative; overflow: hidden; border-radius: inherit; background: var(--kp-primary); isolation: isolate; }
.kp-treat-duotone .kp-fig-frame img, .kp-style-editorial .kp-fig:not([class*="kp-treat-"]) .kp-fig-frame img { display: block; filter: grayscale(1) contrast(1.12); mix-blend-mode: lighten; }
.kp-treat-duotone .kp-fig-frame::after, .kp-style-editorial .kp-fig:not([class*="kp-treat-"]) .kp-fig-frame::after { content: ""; position: absolute; inset: 0; background: var(--kp-accent); mix-blend-mode: darken; border-radius: inherit; pointer-events: none; }
.kp-treat-duotone .kp-ai-badge, .kp-style-editorial .kp-fig .kp-ai-badge { mix-blend-mode: normal; z-index: 1; }
.kp-treat-duo .kp-fig-frame { position: relative; }

/* ---------- Dunkles Design ---------- */
.kp-dark { --kp-bg: #0f141b; --kp-surface: #171e27; --kp-text: #e8ecf1; --kp-muted: #a4afbd; --kp-line: #2a3542; --kp-shadow: 0 1px 3px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4); }
.kp-dark body { background: var(--kp-bg); color: var(--kp-text); }
.kp-dark .kp-answer, .kp-dark .kp-branch-option, .kp-dark .kp-order-item, .kp-dark .kp-match-row, .kp-dark .kp-sort-item, .kp-dark .kp-proc-nav button { background: var(--kp-surface); color: var(--kp-text); }
.kp-dark .kp-right { background: #14301f !important; } .kp-dark .kp-wrong { background: #33181a !important; }
.kp-dark .kp-feedback.ok { background: #14301f; color: #7fd4a3; } .kp-dark .kp-feedback.no { background: #33181a; color: #f2a0a0; }

.kp-dark .kp-block.kp-bg-tint { background: #141b24; }
.kp-dark .kp-block.kp-bg-gradient { background: linear-gradient(135deg, #1a2430, #141b24); }
.kp-dark .kp-card, .kp-dark .kp-agenda-col, .kp-dark .kp-quiz, .kp-dark .kp-selfcheck, .kp-dark .kp-predict, .kp-dark .kp-vcard,
.kp-dark .kp-person-front, .kp-dark .kp-person-back, .kp-dark .kp-ch-card, .kp-dark .kp-hero-card, .kp-dark .kp-guide-card,
.kp-dark .kp-dial-info, .kp-dark .kp-motion, .kp-dark .kp-process, .kp-dark .kp-sortcats, .kp-dark .kp-files a { background: var(--kp-surface); color: var(--kp-text); }
.kp-dark .kp-card h3, .kp-dark .kp-q, .kp-dark .kp-sec-title, .kp-dark .kp-hero-title, .kp-dark .kp-guide-name, .kp-dark .kp-agenda-title, .kp-dark .kp-ch-title, .kp-dark .kp-main h1 { color: var(--kp-text); }
.kp-dark .kp-btn.kp-sec { color: var(--kp-text); border-color: var(--kp-text); }
.kp-dark .kp-fill input, .kp-dark .kp-notes, .kp-dark .kp-search-box input, .kp-dark .kp-match-row select { background: #101720; color: var(--kp-text); border-color: var(--kp-line); }
.kp-dark .kp-bignum { background: #141b24; }
.kp-dark .kp-panel-bubble { background: #eef2f6; color: #1d2530; }

/* ---------- Auswahlrad ---------- */
.kp-dial-stage { display: grid; grid-template-columns: minmax(280px, 1fr) 1fr; gap: 28px; align-items: center; }
.kp-dial-ring { position: relative; width: 100%; aspect-ratio: 1; max-width: 380px; margin: 0 auto; border-radius: 50%; background: color-mix(in srgb, var(--kp-primary) 7%, var(--kp-surface)); }
.kp-dial-center { position: absolute; inset: 26%; border-radius: 50%; background: var(--kp-surface); display: grid; place-items: center; text-align: center; padding: 10px; font-size: 14px; color: var(--kp-muted); box-shadow: var(--kp-shadow); }
.kp-dial-dot { position: absolute; transform: translate(-50%, -50%); width: 84px; border: 0; background: none; cursor: pointer; display: grid; gap: 4px; justify-items: center; font: inherit; color: inherit; padding: 2px; }
.kp-dial-face { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; background: #eef2f6; border: 3px solid transparent; transition: border-color .2s, transform .2s; }
.kp-dial-face img, .kp-dial-face svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.kp-dial-dot.current .kp-dial-face { border-color: var(--kp-accent); transform: scale(1.1); }
.kp-dial-dot:hover .kp-dial-face { transform: scale(1.06); }
.kp-dial-label { font-size: 12px; line-height: 1.2; text-align: center; }
.kp-dial-info { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 22px 24px; box-shadow: var(--kp-shadow); animation: kp-fade .3s both; }
.kp-dial-info h3 { margin: 0 0 8px; font-size: 20px; font-family: var(--kp-font-head, var(--kp-font)); }
@media (max-width: 760px) { .kp-dial-stage { grid-template-columns: 1fr; } .kp-dial-dot { width: 64px; } .kp-dial-face { width: 48px; height: 48px; } }

/* ---------- Animationsbibliothek ---------- */
.kp-anim { margin: 0; text-align: center; }
.kp-anim-title { font-family: var(--kp-font-head, var(--kp-font)); font-size: 22px; margin-bottom: 14px; color: var(--kp-title); }
.kp-anim-svg { width: 100%; max-width: 820px; height: auto; max-height: min(360px, 50vh); color: var(--kp-text); }
.kp-draw { stroke-dasharray: 1; stroke-dashoffset: 1; }

@keyframes kp-draw { to { stroke-dashoffset: 0; } }
.kp-anim-step { opacity: 0; }

.kp-anim.run .kp-ring2 { animation-delay: 1.2s; }
@keyframes kp-pulse-ring { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(2.2); } }

@keyframes kp-slide-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.kp-anim-check svg { width: 28px; height: 28px; flex: none; }
.kp-anim-compare { display: flex; align-items: center; justify-content: center; gap: 18px; }
.kp-anim-side { flex: 1; max-width: 240px; padding: 26px 18px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-primary) 8%, white); font-weight: 600; }
.kp-anim-side.after { background: var(--kp-primary); color: #fff; opacity: .25; }

@keyframes kp-fade-in-strong { to { opacity: 1; } }
.kp-anim-morph { font-size: 28px; color: var(--kp-accent); }
.kp-anim.run .kp-anim-morph { animation: kp-nudge 1.6s ease-in-out infinite; }
@keyframes kp-nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
.kp-anim-count { font-family: var(--kp-font-head, var(--kp-font)); font-size: clamp(48px, 10vw, 104px); color: var(--kp-primary); line-height: 1; }
.kp-anim-count span { font-size: .4em; margin-left: 6px; }
.kp-anim-svg text { font-family: var(--kp-font); }
.kp-anim-beam, .kp-anim-pan { transform-box: view-box; transform-origin: 180px 104px; }
.kp-anim.run .kp-anim-beam { animation: kp-tip 1.6s cubic-bezier(.3,.8,.4,1) .5s forwards; }
.kp-anim.run .kp-pan-l { animation: kp-pan-up 1.6s cubic-bezier(.3,.8,.4,1) .5s forwards; }
.kp-anim.run .kp-pan-r { animation: kp-pan-down 1.6s cubic-bezier(.3,.8,.4,1) .5s forwards; }
@keyframes kp-tip { to { transform: rotate(7deg); } }
@keyframes kp-pan-up { to { transform: translateY(-15px); } }
@keyframes kp-pan-down { to { transform: translateY(15px); } }
.kp-anim-riser { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); }
.kp-anim.run .kp-anim-riser { animation: kp-rise .7s cubic-bezier(.2,.7,.3,1) forwards; animation-delay: var(--d, 0s); }
@keyframes kp-rise { to { transform: scaleY(1); } }
/* Szenen-Vorlagen: Uhr, Kalender, Nachricht */
.kp-anim-clockface { max-width: 220px; }
.kp-clock-h, .kp-clock-m { transform-box: view-box; transform-origin: 120px 120px; }
.kp-anim.run .kp-clock-m { animation: kp-clock-m 2.2s cubic-bezier(.45,0,.2,1) forwards; }
.kp-anim.run .kp-clock-h { animation: kp-clock-h 2.2s cubic-bezier(.45,0,.2,1) forwards; }
@keyframes kp-clock-m { to { transform: rotate(1080deg); } }
@keyframes kp-clock-h { to { transform: rotate(90deg); } }
.kp-anim-scene-label { font-family: var(--kp-font-head, var(--kp-font)); font-size: clamp(22px, 2.4vw, 30px); color: var(--kp-primary); margin: 14px 0 0; }
.kp-anim-cal { position: relative; width: 240px; height: 210px; margin: 0 auto; perspective: 900px; }
.kp-cal-sheet { position: absolute; inset: 0; display: grid; place-items: center; padding: 44px 16px 16px; background: var(--kp-surface); border-radius: var(--kp-radius); box-shadow: var(--kp-shadow); border-top: 38px solid var(--kp-primary); transform-origin: top center; backface-visibility: hidden; }
.kp-cal-sheet b { font-family: var(--kp-font-head, var(--kp-font)); font-size: clamp(26px, 3vw, 36px); line-height: 1.1; color: var(--kp-primary); text-align: center; }
.kp-cal-rings { position: absolute; top: -48px; left: 0; right: 0; display: flex; justify-content: space-around; }
.kp-cal-rings i { width: 12px; height: 22px; border-radius: 6px; background: var(--kp-bg); border: 3px solid var(--kp-line); }
.kp-anim.run .kp-cal-sheet:not(:last-child) { animation: kp-cal-flip .6s cubic-bezier(.5,0,.8,.3) forwards; animation-delay: var(--d, 0s); }
@keyframes kp-cal-flip { to { transform: rotateX(105deg); opacity: 0; } }
.kp-anim-msg { display: flex; justify-content: center; text-align: left; }
.kp-msg-phone { width: 100%; max-width: 340px; display: grid; gap: 10px; padding: 18px 14px; border-radius: 26px; background: var(--kp-surface); border: 2px solid var(--kp-line); box-shadow: var(--kp-shadow); }
.kp-msg { opacity: 0; display: grid; justify-items: start; gap: 2px; }
.kp-msg.kp-msg-me { justify-items: end; }
.kp-msg small { font-size: 11px; font-weight: 700; color: var(--kp-muted); text-transform: uppercase; letter-spacing: .05em; padding: 0 6px; }
.kp-msg-bubble { position: relative; max-width: 86%; padding: 9px 13px; border-radius: 16px 16px 16px 4px; background: color-mix(in srgb, var(--kp-primary) 10%, var(--kp-surface)); }
.kp-msg-me .kp-msg-bubble { border-radius: 16px 16px 4px 16px; background: var(--kp-primary); color: #fff; }
.kp-msg-bubble p { margin: 0; font-size: 15px; line-height: 1.4; opacity: 0; }
.kp-msg-typing { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
.kp-msg-typing i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; }
.kp-anim.run .kp-msg { animation: kp-slide-in .35s ease forwards; animation-delay: var(--d, 0s); }
.kp-anim.run .kp-msg-bubble p { animation: kp-fade .3s ease forwards; animation-delay: calc(var(--d, 0s) + .75s); }
.kp-anim.run .kp-msg-typing { animation: kp-typing-off .01s linear forwards; animation-delay: calc(var(--d, 0s) + .75s); }
.kp-anim.run .kp-msg-typing i { animation: kp-typing .75s ease-in-out infinite; }
.kp-anim.run .kp-msg-typing i:nth-child(2) { animation-delay: .15s; }
.kp-anim.run .kp-msg-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes kp-typing { 50% { transform: translateY(-4px); opacity: 1; } }
@keyframes kp-typing-off { to { opacity: 0; visibility: hidden; } }
/* Szenario-Werte */
.kp-meters { display: grid; gap: 8px; margin-top: 14px; }
.kp-meter { display: grid; grid-template-columns: minmax(96px, 170px) 1fr; gap: 12px; align-items: center; font-size: 14px; }
/* Bildstufen: das Bild zum Wert wechselt mit dem Stand (die Vase setzt sich wieder zusammen) */
.kp-meter.kp-meter-staged { grid-template-columns: 96px minmax(96px, 170px) 1fr; }
.kp-meter-pic img { width: 96px; height: 72px; object-fit: cover; border-radius: calc(var(--kp-radius) * .5); display: block; }
.kp-meter-label { font-weight: 600; }
.kp-meter-label b { font-weight: 700; margin-left: 4px; }
.kp-meter-label b.up { color: var(--kp-ok); }
.kp-meter-label b.down { color: var(--kp-no); }
.kp-meter-bar { height: 10px; border-radius: 5px; background: var(--kp-line); overflow: hidden; }
.kp-meter-bar i { display: block; height: 100%; background: var(--c, var(--kp-primary)); border-radius: 5px; animation: kp-meter-in .7s cubic-bezier(.2,.7,.3,1) both; transform-origin: left; }
@keyframes kp-meter-in { from { transform: scaleX(.85); opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .kp-meter-bar i { animation: none; } }
/* ---------- Klickpfad (Software-Simulation) ---------- */
.kp-sim { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 24px; }
.kp-modern .kp-sim { border-color: transparent; box-shadow: var(--kp-soft); }
.kp-sim-modes { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 999px; background: color-mix(in srgb, var(--kp-primary) 8%, var(--kp-surface)); }
.kp-sim-modes button { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 999px; padding: 7px 16px; background: transparent; color: var(--kp-primary); cursor: pointer; }
.kp-sim-modes button[aria-pressed="true"] { background: var(--kp-primary); color: #fff; }
.kp-sim-task { display: grid; gap: 2px; margin: 0 0 12px; font-size: calc(var(--kp-fs, 17px) + 1px); font-weight: 600; }
.kp-sim-task span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--kp-accent-ink, var(--kp-muted)); }
.kp-sim-task:focus { outline: none; }
.kp-sim-stage { position: relative; border-radius: calc(var(--kp-radius) / 2); overflow: hidden; border: 1px solid var(--kp-line); cursor: crosshair; user-select: none; }
.kp-sim-zeigen .kp-sim-stage { cursor: default; }
.kp-sim-stage img { display: block; width: 100%; height: auto; }
.kp-sim-noimg { padding: 60px 20px; text-align: center; color: var(--kp-muted); background: var(--kp-bg); }
.kp-sim-target { position: absolute; padding: 0; border: 0; background: transparent; border-radius: 6px; cursor: pointer; }
.kp-sim-target:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
.kp-sim-target.show { box-shadow: 0 0 0 3px var(--kp-accent), 0 0 0 9999px rgba(12,18,28,.28); animation: kp-sim-pulse 1.6s ease-in-out infinite; }
@keyframes kp-sim-pulse { 50% { box-shadow: 0 0 0 6px var(--kp-accent), 0 0 0 9999px rgba(12,18,28,.28); } }
.kp-sim-cursor { position: absolute; width: 30px; height: 30px; left: var(--tx); top: var(--ty); pointer-events: none; animation: kp-sim-move 1.1s cubic-bezier(.3,.7,.3,1) both; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.kp-sim-cursor svg { width: 100%; height: 100%; display: block; }
@keyframes kp-sim-move { from { left: 50%; top: 92%; opacity: 0; } 20% { opacity: 1; } to { left: var(--tx); top: var(--ty); } }
.kp-sim-msg { min-height: 8px; margin-top: 10px; }
.kp-sim-msg .kp-feedback:focus, .kp-sim > .kp-feedback:focus { outline: none; }
.kp-sim-prog { height: 4px; margin-top: 14px; border-radius: 2px; background: var(--kp-line); overflow: hidden; }
.kp-sim-prog b { display: block; height: 100%; background: var(--kp-accent); transition: width .3s; }
.kp-sim-miss { margin: 6px 0 0; padding-left: 20px; }
@media (prefers-reduced-motion: reduce) {
  .kp-sim-target.show { animation: none; }
  .kp-sim-cursor { animation: none; }
}
/* ---------- Szenen-Bühne im Dialog ---------- */
.kp-dialog.kp-staged { padding: 0; border: 0; background: none; }
.kp-stage { position: relative; aspect-ratio: 800 / 360; overflow: hidden; border-radius: var(--kp-radius); background: var(--kp-bg); color: var(--kp-text); isolation: isolate; box-shadow: var(--kp-shadow); }
.kp-stage-cam { position: absolute; inset: 0; transform-origin: 50% 85%; transition: transform .9s cubic-bezier(.3,.7,.3,1); }
[data-focus="left"] > .kp-stage .kp-stage-cam { transform: scale(1.06) translateX(2.5%); }
[data-focus="right"] > .kp-stage .kp-stage-cam { transform: scale(1.06) translateX(-2.5%); }
.kp-stage-art, .kp-stage-photo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.kp-stage-photo { object-fit: cover; }
.kp-stage-front { z-index: 2; pointer-events: none; }
.kp-stage-cast { position: absolute; inset: 0; z-index: 1; }
.kp-actor { position: absolute; bottom: -2%; width: 30%; max-width: 300px; aspect-ratio: 1; transition: transform .5s ease, filter .5s ease; }
.kp-actor-left { left: calc(9% + var(--slot, 0) * 17%); }
.kp-actor-right { right: calc(9% + var(--slot, 0) * 17%); }
.kp-stage .kp-actor .kp-avatar { width: 100%; height: 100%; border: 0; border-radius: 0; background: none; box-shadow: none; overflow: visible; }
.kp-stage .kp-actor .kp-avatar svg, .kp-stage .kp-actor .kp-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.kp-stage .kp-actor .kp-avatar img { border-radius: 50% 50% 0 0; }
.kp-stage .kp-actor-right .kp-avatar svg { transform: scaleX(-1); }
:is([data-focus="left"], [data-focus="right"]) .kp-actor:not(.kp-speaking) { filter: saturate(.85) brightness(.97); }
.kp-actor.kp-speaking { transform: translateY(-2%); }
.kp-stage-caption { position: absolute; left: 16px; top: 14px; z-index: 4; margin: 0; padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--kp-surface) 88%, transparent); color: var(--kp-text); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; box-shadow: var(--kp-shadow); }

/* Figuren atmen leicht, auch während Lernende überlegen */

/* Kamera je Zeile (line.shot): totale, schulter (über die Schulter der zuhörenden Figur), nah */
.kp-stage .kp-actor { transition: transform .5s ease, filter .5s ease, left .8s cubic-bezier(.3,.7,.3,1), right .8s cubic-bezier(.3,.7,.3,1), width .8s cubic-bezier(.3,.7,.3,1), bottom .8s cubic-bezier(.3,.7,.3,1); }

@media (min-width: 641px) {

}
/* Entscheidung im Bild */
.kp-stage-choices { position: absolute; bottom: 4%; z-index: 5; width: 42%; max-height: 66%; overflow: auto; display: grid; gap: 8px; animation: kp-choices-in .45s ease-out both; }
.kp-sc-right { right: 3%; }
.kp-sc-left { left: 3%; }
.kp-stage-prompt { margin: 0 0 2px; padding: 4px 12px; justify-self: start; border-radius: 999px; background: rgba(12,16,24,.72); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.kp-stage-choice { font: inherit; font-size: clamp(14px, 1.4vw, 16px); line-height: 1.35; text-align: left; padding: 10px 14px; border: 2px solid transparent; border-radius: 14px; background: rgba(12,16,24,.8); color: #fff; cursor: pointer; backdrop-filter: blur(6px); transition: background .15s, border-color .15s, transform .15s; }

.kp-sc-left .kp-stage-choice:hover, .kp-sc-left .kp-stage-choice:focus-visible { transform: translateX(3px); }
.kp-stage-choice:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
/* Begründung im Bild: dunkles Feld an der Stelle der Möglichkeiten */
.kp-stage-why { width: 46%; padding: 12px 14px; border-radius: 14px; background: rgba(12,16,24,.88); color: #fff; }
.kp-stage-why .kp-stage-prompt { background: rgba(255,255,255,.14); }

.kp-stage-why .kp-quiz-actions { margin-top: 8px; } .kp-stage-why .kp-btn { padding: 8px 14px; font-size: 14px; }
@media (max-width: 640px) { .kp-stage-why { width: auto; color: var(--kp-text); background: var(--kp-surface); border: 1px solid var(--kp-line); } .kp-stage-why .kp-label { color: var(--kp-muted); } }
@media (min-width: 641px) {
  .kp-choosing .kp-stage-bubble { max-width: 34%; top: 13%; }

}
@keyframes kp-choices-in { from { opacity: 0; transform: translateY(10px); } }
@media (max-width: 640px) {
  .kp-stage-choices { position: static; width: auto; max-height: none; margin-top: 12px; animation: none; }

}

}
/* Tiefe: Kulisse und Statisten auf eigener Ebene, sie bewegen sich schwächer als die Figuren (Parallaxe) */
.kp-stage-back { position: absolute; inset: 0; transform-origin: 50% 85%; transition: transform .9s cubic-bezier(.3,.7,.3,1), filter .9s ease; }
[data-focus="left"] > .kp-stage .kp-stage-back { transform: scale(1.03) translateX(1.2%); }
[data-focus="right"] > .kp-stage .kp-stage-back { transform: scale(1.03) translateX(-1.2%); }
.kp-stage-wrap.kp-shot-totale > .kp-stage .kp-stage-back { transform: none; }
.kp-stage-wrap.kp-shot-nah[data-focus="left"] > .kp-stage .kp-stage-back { transform: translateX(8%) scale(1.18); filter: blur(2px); }
.kp-stage-wrap.kp-shot-nah[data-focus="right"] > .kp-stage .kp-stage-back { transform: translateX(-8%) scale(1.18); filter: blur(2px); }
.kp-stage-wrap.kp-shot-schulter > .kp-stage .kp-stage-back { transform: scale(1.06); filter: blur(1.5px); }

@keyframes kp-drift { from { transform: scale(1.02); } to { transform: scale(1.08) translate(-1.5%, -1%); } }

.kp-extra-1 { left: 51%; width: 13%; bottom: 17%; }
.kp-extra-2 { left: 69%; }
.kp-extra-2 .kp-avatar svg { transform: scaleX(-1); }
/* Untertitel statt Sprechblase */
.kp-stage-sub { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); max-width: 78%; padding: 8px 16px; border-radius: 10px; background: rgba(12,16,24,.8); color: #fff; text-align: center; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.4; animation: kp-sub-in .3s ease-out both; }
.kp-stage-sub b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--c, #fff) 40%, #fff); margin-bottom: 2px; }

@media (min-width: 641px) {

  /* Bei „nah“ steht das Gesicht groß im Bild: Untertitel auf die freie Seite */

  .kp-shot-nah[data-focus="right"] .kp-stage-sub { left: 4%; transform: none; max-width: 44%; text-align: left; }
}
/* Erzähler: Abblende, Text auf dunklem Grund, danach Aufblende */
.kp-stage-narr { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; padding: 6% 12%; text-align: center; background: rgba(8,10,16,.86); color: #fff; animation: kp-narr-in 1s ease both; }
.kp-narr-label { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: color-mix(in srgb, var(--kp-accent) 65%, #fff); animation: kp-narr-txt .6s .45s both; }

@media (max-width: 640px) {

}

}
@media (prefers-reduced-motion: reduce) {
  .kp-stage-cam { transition: none; transform: none !important; }

/* ---------- Motion-Zeitleiste ---------- */
.kp-motion { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 22px 24px; box-shadow: var(--kp-shadow); }
.kp-motion-stage { display: grid; gap: 14px; margin: 14px 0; }
.kp-motion-step { display: grid; grid-template-columns: 110px 1fr; gap: 16px; opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .5s; }
.kp-motion-step.on { opacity: 1; transform: none; }
.kp-motion-year { font-family: var(--kp-font-head, var(--kp-font)); font-size: 26px; color: var(--kp-accent-ink, var(--kp-accent)); font-weight: 700; }
.kp-motion-step h4 { margin: 4px 0; font-size: 18px; }
.kp-motion-bar { height: 4px; background: var(--kp-line); border-radius: 999px; overflow: hidden; }
.kp-motion-bar i { display: block; height: 100%; width: 0; background: var(--kp-accent); transition: width .1s linear; }
@media (max-width: 760px) { .kp-motion-step { grid-template-columns: 70px 1fr; gap: 10px; } .kp-motion-year { font-size: 20px; } }

/* ---------- Schätzung gegen Wirklichkeit ---------- */
.kp-gap { display: grid; gap: 10px; margin-bottom: 14px; }
.kp-gap-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; font-size: 14px; }
.kp-gap-row > span { color: var(--kp-muted); font-weight: 600; }
.kp-gap-row i { display: block; height: 30px; width: 0; border-radius: 6px; background: color-mix(in srgb, var(--kp-primary) 35%, white); position: relative; animation: kp-gap-grow .8s cubic-bezier(.2,.7,.3,1) forwards; }
.kp-gap-row.real i { background: var(--kp-primary); animation-delay: .35s; }
.kp-gap-row b { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #fff; white-space: nowrap; }
.kp-gap-row:not(.real) b { color: var(--kp-text); right: -6px; transform: translate(100%, -50%); }
@keyframes kp-gap-grow { to { width: var(--w); } }

/* ---------- Zitat mit Urheber, lebende Figuren ---------- */
.kp-author { margin: 12px 0 0; font-size: 14px; font-weight: 600; color: var(--kp-muted); display: grid; gap: 1px; }
.kp-author span { font-weight: 400; font-size: 13px; }
.kp-avatar .kp-eyes { animation: kp-blink 6s infinite; transform-origin: center; }
.kp-avatar.kp-talking .kp-mouth { animation: kp-talk .42s ease-in-out infinite alternate; transform-origin: center; }
@keyframes kp-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes kp-talk { from { transform: scaleY(.7); } to { transform: scaleY(1.35); } }
@media (prefers-reduced-motion: reduce) {
  .kp-avatar .kp-eyes, .kp-avatar.kp-talking .kp-mouth, .kp-anim.run *, .kp-gap-row i { animation: none !important; }
  .kp-gap-row i { width: var(--w); }
  .kp-anim-bar i { height: var(--h); }
  .kp-anim-step, .kp-anim-check li, .kp-anim-side.after { opacity: 1; }
  .kp-draw { stroke-dashoffset: 0; }
  .kp-anim-riser { transform: scaleY(1); }
  .kp-clock-m { transform: rotate(1080deg); } .kp-clock-h { transform: rotate(90deg); }
  .kp-cal-sheet:not(:last-child) { display: none; }
  .kp-msg, .kp-msg-bubble p { opacity: 1; } .kp-msg-typing { display: none; }
}

/* ---------- Suche im Kurs ---------- */
.kp-search-box input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--kp-line); border-radius: 8px; }
.kp-search-res { margin-top: 12px; display: grid; gap: 8px; }
.kp-search-hit { display: grid; gap: 2px; text-align: left; font: inherit; background: var(--kp-bg); border: 0; border-radius: 8px; padding: 10px 12px; cursor: pointer; color: inherit; }
.kp-search-hit:hover { background: color-mix(in srgb, var(--kp-primary) 10%, white); }
.kp-search-hit b { font-size: 15px; }
.kp-search-hit em { font-style: normal; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--kp-muted); }
.kp-search-hit span { font-size: 14px; color: var(--kp-muted); line-height: 1.45; }
.kp-search-hit mark { background: color-mix(in srgb, var(--kp-accent) 35%, white); color: inherit; }
@media (max-width: 760px) { .kp-only-wide { display: none; } }

/* ---------- Sortieren, Prozess, Weiter-Sperre, Anhang ---------- */
/* Stellen im Text finden: Schriftstück links, Einordnung rechts */
.kp-ft-split { display: grid; grid-template-columns: 1fr minmax(240px, 320px); gap: 18px; align-items: start; }
.kp-ft-doc { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 24px 26px; }
.kp-ft-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 20px; margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--kp-line); }
.kp-ft-meta dt { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-muted); }
.kp-ft-meta dd { margin: 0; }
.kp-ft-body { font-size: 15px; line-height: 1.6; }
.kp-ft-body p { margin: 0 0 12px; }
.kp-ft-body ul { margin: 0 0 12px; padding-left: 20px; }
.kp-ft-spot { font: inherit; color: inherit; background: none; border: 0; padding: 0 2px; margin: 0 -2px; border-radius: 3px; cursor: pointer; text-align: left; box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--kp-accent) 45%, transparent); transition: background .15s; }
.kp-ft-spot:hover { background: color-mix(in srgb, var(--kp-accent) 16%, transparent); }
.kp-ft-spot.is-found { background: var(--kp-no); color: #fff; text-decoration: line-through; box-shadow: none; cursor: default; }
.kp-ft-spot.is-ok { background: color-mix(in srgb, var(--kp-ok) 18%, transparent); box-shadow: none; cursor: default; }
.kp-ft-panel { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 22px 20px; display: grid; gap: 10px; align-content: start; }
.kp-ft-ptitle { margin: 0; font-family: var(--kp-font-head, var(--kp-font)); font-size: 19px; font-weight: 700; line-height: 1.2; color: var(--kp-no); }
.kp-ft-ptitle.is-ok { color: var(--kp-ok); }
.kp-ft-ptitle.is-quiet { color: var(--kp-muted); }
.kp-ft-panel .kp-text { font-size: 14px; line-height: 1.5; }
.kp-ft-panel .kp-text p { margin: 0 0 8px; }
.kp-ft-count { margin: 0; font-size: 13px; font-weight: 700; color: var(--kp-muted); font-variant-numeric: tabular-nums; }
.kp-ft-panel.is-done { border-color: var(--kp-ok); }
@media (max-width: 760px) { .kp-ft-split { grid-template-columns: 1fr; } }
/* Anfrage aufbauen: links die Bausteine, rechts der Entwurf */
.kp-pb-split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
.kp-pb-card { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
.kp-pb-label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-muted); }
.kp-pb-quality { font-weight: 400; letter-spacing: .06em; }
.kp-pb-quality b { color: var(--kp-primary); }
.kp-pb-ask { margin: 6px 0 4px; font-family: var(--kp-font-head, var(--kp-font)); font-size: 21px; font-weight: 700; line-height: 1.3; color: var(--kp-title); }
.kp-pb-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.kp-pb-btn { font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .04em; padding: 11px 16px; color: var(--kp-primary); background: var(--kp-surface); border: 1.5px solid var(--kp-primary); border-radius: 4px; cursor: pointer; transition: background .15s, color .15s, transform .15s; }
.kp-pb-btn:hover:not(:disabled) { transform: translateY(-1px); background: color-mix(in srgb, var(--kp-primary) 8%, transparent); }
.kp-pb-btn.is-on { background: var(--kp-accent); border-color: var(--kp-accent); color: var(--kp-on-accent, #fff); cursor: default; }
.kp-pb-lines { border-top: 1px solid var(--kp-line); padding-top: 12px; display: grid; gap: 8px; }
.kp-pb-line { margin: 0; color: var(--kp-muted); line-height: 1.45; }
.kp-pb-line.is-new { color: var(--kp-text); font-weight: 700; }
.kp-pb-empty { margin: 0; border-top: 1px solid var(--kp-line); padding-top: 12px; color: var(--kp-muted); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.kp-pb-body { font-size: 15px; line-height: 1.55; flex: 1; }
.kp-pb-body p { margin: 0 0 10px; }
.kp-pb-body ul { margin: 0; padding-left: 20px; }
.kp-pb-bar { height: 16px; border: 1.5px solid var(--kp-line); border-radius: 999px; overflow: hidden; background: var(--kp-surface); }
.kp-pb-bar i { display: block; height: 100%; background: var(--kp-accent); border-radius: 999px; transition: width .4s cubic-bezier(.2,.7,.2,1); }
.kp-pb-note { margin: 0; font-weight: 700; color: var(--kp-muted); }
@media (max-width: 760px) { .kp-pb-split { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .kp-pb-bar i { transition: none; } .kp-pb-btn:hover:not(:disabled) { transform: none; } }
/* Stück für Stück entscheiden: Kartenfeld links, offene Frage rechts */
.kp-tri-split { display: grid; grid-template-columns: 1fr minmax(280px, 380px); gap: 18px; align-items: stretch; }
.kp-tri-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; align-content: start; background: color-mix(in srgb, var(--kp-primary) 5%, var(--kp-surface)); border-radius: var(--kp-radius); padding: 16px; }
.kp-tri-card { position: relative; display: grid; gap: 4px; padding: 14px 14px 16px; font: inherit; text-align: left; background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: calc(var(--kp-radius) * .7); cursor: pointer; box-shadow: 0 1px 2px rgba(16,24,40,.06); transition: transform .15s, box-shadow .15s, opacity .2s; }
.kp-tri-card:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--kp-shadow); }
.kp-tri-card.is-active { border-color: var(--kp-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--kp-accent) 35%, transparent); }
.kp-tri-card:disabled { cursor: default; opacity: .72; }
.kp-tri-doc { display: block; width: 24px; height: 28px; margin-bottom: 4px; color: var(--kp-muted); opacity: .7; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.kp-tri-name { font-weight: 700; color: var(--kp-title); line-height: 1.3; }
.kp-tri-sub { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--kp-muted); }
.kp-tri-badge { position: absolute; right: 10px; top: 10px; padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--kp-muted); }
.kp-tri-in .kp-tri-badge { background: var(--kp-ok); }
.kp-tri-out .kp-tri-badge { background: var(--kp-no); }
.kp-tri-out .kp-tri-name, .kp-tri-out .kp-tri-sub { text-decoration: line-through; }
.kp-tri-wrong { border-color: var(--kp-no); }
.kp-tri-fix { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--kp-no); }
/* Entscheidungsfeld: Hauptfarbe mit Schwarz abgedunkelt, damit Weiß und die hellen Zwischentöne darauf in jedem Stil 4,5 : 1 erreichen
   (reines Hellblau im Stil Nacht gab nur 2,7 bis 3,8 : 1, Signalrot im Comic-Stil 1,9 : 1 für die Themenzeile) */
.kp-tri-panel { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 26px 24px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-primary) 55%, #0b0f16); color: #fff; }
.kp-style-comic .kp-tri-panel { background: #1A1A1C; }
.kp-tri-eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: color-mix(in srgb, var(--kp-accent) 55%, white); }
.kp-tri-title { margin: 0; font-family: var(--kp-font-head, var(--kp-font)); font-size: 22px; line-height: 1.2; font-weight: 700; }
.kp-tri-sub2 { margin: 0; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.72); }
.kp-tri-frage { margin: 14px 0 0; font-weight: 700; }
.kp-tri-fb { color: rgba(255,255,255,.92); font-size: 15px; }
.kp-tri-fb a { color: #fff; }
.kp-tri-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.kp-tri-buttons button { font: inherit; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; padding: 14px 8px; color: #fff; background: transparent; border: 2px solid #fff; border-radius: 4px; cursor: pointer; transition: background .15s, color .15s; }
.kp-tri-buttons button:hover { background: #fff; color: var(--kp-primary); }
.kp-tri-panel .kp-quiz-actions { margin-top: 8px; }
.kp-tri-panel .kp-btn { border-color: #fff; background: #fff; color: var(--kp-primary); }
.kp-tri-panel .kp-btn.kp-sec { background: transparent; color: #fff; }
.kp-tri-panel .kp-lock { color: rgba(255,255,255,.8); }
/* Mehrere Möglichkeiten beim Entscheiden: Knöpfe untereinander, gewählte Karte neutral markiert */
.kp-tri-buttons.kp-tri-multi { grid-template-columns: 1fr; }
.kp-tri-set .kp-tri-badge { background: var(--kp-primary); }
/* Postfach-Optik: Karten als Zeilen eines Posteingangs */
.kp-tri-mail .kp-tri-board { grid-template-columns: 1fr; gap: 0; padding: 0; background: var(--kp-surface); border: 1px solid var(--kp-line); overflow: hidden; }
.kp-tri-mail .kp-tri-card { grid-template-columns: 28px 1fr; column-gap: 12px; border: 0; border-bottom: 1px solid var(--kp-line); border-radius: 0; padding: 12px 16px; }
.kp-tri-mail .kp-tri-card:last-child { border-bottom: 0; }
.kp-tri-mail .kp-tri-card:hover:not(:disabled) { transform: none; background: color-mix(in srgb, var(--kp-primary) 5%, var(--kp-surface)); box-shadow: none; }
.kp-tri-mail .kp-tri-card.is-active { box-shadow: inset 3px 0 0 var(--kp-accent); }
.kp-tri-mail .kp-tri-doc { grid-row: 1 / span 3; width: 24px; height: 18px; margin: 3px 0 0; }
.kp-tri-mail .kp-tri-card > :not(.kp-tri-doc):not(.kp-tri-badge) { grid-column: 2; }
.kp-tri-from { font-size: 13px; font-weight: 700; color: var(--kp-text); padding-right: 110px; }
.kp-tri-ticket .kp-tri-from { font-family: var(--kp-mono, ui-monospace, monospace); font-weight: 600; font-size: 12px; color: var(--kp-muted); }
.kp-tri-stars { margin: 8px 0 0; font-size: 20px; letter-spacing: 2px; color: #f5b301; } .kp-tri-stars small { display: block; font-size: 12px; letter-spacing: 0; color: rgba(255,255,255,.8); }
.kp-tri-mail .kp-tri-name { font-weight: 600; color: var(--kp-text); }
.kp-tri-prev { font-size: 13px; color: var(--kp-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Folgen-Regler ---------- */
.kp-lev-split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, 1fr); gap: 20px; align-items: stretch; }
.kp-lev-ctrl { display: grid; gap: 14px; align-content: start; }
.kp-lev-row { display: grid; gap: 4px; }
.kp-lev-name { font-weight: 600; }
.kp-lev-row .kp-estimate { margin: 0; }
.kp-lev-row .kp-estimate-val { font-size: 20px; min-width: 76px; }
.kp-lev-out { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 22px 24px; border-radius: var(--kp-radius); background: var(--kp-surface); border: 1px solid var(--kp-line); }
.kp-lev-label { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-muted); }
.kp-lev-num { margin: 0; font-size: 18px; color: var(--kp-muted); }
.kp-lev-num b { font-size: 48px; line-height: 1; color: var(--kp-primary); font-variant-numeric: tabular-nums; }
