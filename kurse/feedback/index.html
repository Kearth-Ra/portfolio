.kp-style-micro .kp-flip.kp-seen .kp-flip-front::after { content: '✓'; font-size: 14px; }
.kp-style-micro .kp-eyebrow { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-style-micro .kp-bg-tint { background: #E6F6F8; }
.kp-style-micro .kp-process .kp-num, .kp-style-micro .kp-proc-item .kp-num { background: var(--kp-accent); color: var(--kp-on-accent, #fff); }
@media (max-width: 860px) {
  .kp-ml-side { display: none; }
  .kp-nav-links.kp-style-micro .kp-navbar .kp-course, .kp-nav-links.kp-style-micro .kp-navbar .kp-head-count, .kp-nav-links.kp-style-micro .kp-navbar .kp-head .kp-iconbtn[data-drawer="toc"] { display: inline-flex; }
  .kp-nav-links.kp-style-micro .kp-navbar .kp-course { display: block; flex: 1 1 0; min-width: 0; } /* schrumpft mit Auslassungspunkten; mit flex: none und nowrap lief ein langer Kurstitel am Handy über den Rand */
  .kp-nav-links.kp-style-micro .kp-navbar .kp-head { background: var(--kp-ml-dark); flex: 1 1 100%; min-width: 0; } /* unten als Leiste: volle Breite statt Inhaltsbreite, sonst schob ein langer Kurstitel die Kopfzeile über den Rand */
}
/* Am Handy bricht der Fuß um wie in allen Stilen; die feste Breite oben (flex: none) schob den Sperrhinweis über den Rand */
@media (max-width: 700px) { .kp-nav-links.kp-style-micro .kp-navbar .kp-foot { flex: 1 1 100%; flex-wrap: wrap; min-width: 0; } }

/* ---------- Microlearning im Lektions-Look (theme.sideLook 'lektion', Vorbild Articulate Rise): Kopf der Leiste in der Hauptfarbe,
   darunter weiße Lektionsliste mit Abschnittsüberschriften und Statuskreisen; jede Seite trägt das Band „Lektion 1 von 7“ mit Strich unter dem Titel ---------- */
.kp-ml-lektion.kp-style-micro { --kp-ml-dark: var(--kp-primary); --kp-ml-dark2: var(--kp-primary); --kp-ml-line: #E7E3EA; --kp-maxw: min(820px, 100%); }
.kp-nav-links.kp-ml-lektion.kp-style-micro .kp-navbar { background: #fff; color: var(--kp-text); --kp-nav-bg: #fff; --kp-nav-ink: var(--kp-text); box-shadow: 1px 0 0 var(--kp-ml-line), 4px 0 18px rgba(16,24,40,.06); }
.kp-nav-links.kp-ml-lektion.kp-style-micro .kp-navbar .kp-head { background: var(--kp-primary); }
.kp-nav-links.kp-ml-lektion.kp-style-micro .kp-navrow { gap: 0; } /* sonst steht zwischen Kopf und Titelblock ein weißer Spalt */
.kp-ml-lektion .kp-ml-top { background: var(--kp-primary); color: #fff; padding: 18px 20px 20px; border-bottom: 4px solid color-mix(in srgb, var(--kp-primary) 70%, #000); }
.kp-ml-lektion .kp-ml-title { font-size: 22px; font-weight: 800; line-height: 1.2; }
.kp-ml-lektion .kp-ml-chapters { background: #fff; padding: 8px 0 12px; }
.kp-ml-sec { margin: 0; }
.kp-ml-sec ol { list-style: none; margin: 0; padding: 0; }
.kp-ml-sec-name { margin: 0; padding: 18px 20px 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-muted); }
.kp-ml-lektion .kp-ml-ch { margin: 0; background: none; }
.kp-ml-lektion .kp-ml-ch button { padding: 11px 16px 11px 20px; font-size: 13.5px; line-height: 1.35; }
.kp-ml-lektion .kp-ml-ch button:hover:not(:disabled) { background: color-mix(in srgb, var(--kp-primary) 6%, #fff); }
.kp-ml-lektion .kp-ml-ch.current { background: color-mix(in srgb, var(--kp-primary) 9%, #fff); box-shadow: inset 4px 0 0 var(--kp-primary); }
.kp-ml-lektion .kp-ml-ch.current button { font-weight: 700; }
.kp-ml-ring { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #C9C2CE; box-sizing: border-box; }
.kp-ml-ring.now { border-color: var(--kp-primary); background: conic-gradient(var(--kp-primary) 50%, transparent 0); background-clip: content-box; padding: 2px; }
.kp-ml-lektion .kp-ml-mark { flex: none; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--kp-primary); color: #fff; font-size: 11px; }
.kp-ml-lektion .kp-ml-mark.kp-ml-q { background: none; color: var(--kp-primary); border: 2px solid var(--kp-primary); box-sizing: border-box; }
.kp-ml-lektion .kp-ml-info { border-top: 1px solid var(--kp-ml-line); padding: 14px 20px; }
.kp-nav-links.kp-ml-lektion.kp-style-micro .kp-navbar .kp-foot { background: #fff; border-top: 1px solid var(--kp-ml-line); }
.kp-ml-lektion.kp-style-micro .kp-navbar .kp-btn.kp-sec { color: var(--kp-text); border-color: #C9C2CE; }
.kp-ml-lektion.kp-style-micro .kp-navbar .kp-foot .kp-lock { color: var(--kp-muted); }
/* Band auf jeder Seite: Lektionszähler kursiv, großer weißer Titel, kurzer Strich darunter */
.kp-ml-lektion.kp-style-micro .kp-page-head.kp-ml-chapstart { padding: 40px var(--kp-side) 30px; margin-bottom: 32px; }
.kp-ml-lesson { display: block; margin: 0 0 14px; font-size: 13px; font-weight: 700; font-style: italic; color: rgba(255,255,255,.9); }
.kp-ml-lektion.kp-style-micro .kp-page-head.kp-ml-chapstart h1 { font-size: clamp(28px, 3vw, 38px); font-weight: 800; line-height: 1.15; }
.kp-ml-lektion.kp-style-micro .kp-page-head.kp-ml-chapstart h1::after { content: ''; display: block; width: 112px; height: 3px; margin-top: 18px; background: rgba(255,255,255,.85); }
.kp-ml-lektion.kp-style-micro .kp-page-head.kp-ml-chapstart .kp-accent { color: #fff; }
.kp-ml-lektion.kp-style-micro .kp-flip-front { background: var(--kp-primary); }
.kp-ml-lektion.kp-style-micro .kp-bg-tint { background: color-mix(in srgb, var(--kp-primary) 7%, #fff); }
.kp-ml-lektion.kp-style-micro .kp-main details { border: 1px solid var(--kp-ml-line); }
@media (max-width: 860px) { .kp-nav-links.kp-ml-lektion.kp-style-micro .kp-navbar .kp-head { background: var(--kp-primary); } .kp-ml-lektion.kp-style-micro .kp-page-head.kp-ml-chapstart { padding: 32px var(--kp-side) 28px; } }

/* ---------- Foto-Look nach Vorbild youknow: Kulisse, Geraeterahmen, Glitch, Karussell, Linkkarte, Titel mittig, Bot-Chat ---------- */
/* Kulisse: das eigene Bild liegt stark unscharf und vergroessert hinter dem Abschnitt, davor ein dunkler Schleier.
   Der Abschnitt ist randlos (ueber [class*="kp-bg-"]), das scharfe Bild steht mittig mit Schatten darauf. */
.kp-block.kp-bg-ambient { position: relative; overflow: hidden; isolation: isolate; background: #1b1a26; color: #fff; }
.kp-block.kp-bg-ambient::before { content: ""; position: absolute; inset: -60px; z-index: -2; background: var(--kp-bgimg, none) center / cover no-repeat; filter: blur(34px) saturate(1.25); transform: scale(1.12); }
.kp-block.kp-bg-ambient::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(12,10,22,.42), rgba(12,10,22,.62)); }
.kp-bg-ambient .kp-block-inner { position: relative; }
.kp-bg-ambient :is(.kp-fig, .kp-hotspots:not(.kp-hs-cover), .kp-ivwrap, .kp-textimage .kp-fig) { max-width: min(100%, 960px); margin-left: auto; margin-right: auto; }
.kp-bg-ambient :is(.kp-fig-frame, .kp-hs-stage, .kp-iv) { box-shadow: 0 30px 70px -20px rgba(0,0,0,.7); }
.kp-bg-ambient .kp-device { filter: drop-shadow(0 30px 50px rgba(0,0,0,.55)); }
.kp-bg-ambient figcaption, .kp-bg-ambient .kp-credit, .kp-bg-ambient .kp-hs-hint, .kp-bg-ambient .kp-hs-count { color: rgba(255,255,255,.82); }
.kp-bg-ambient .kp-hs-bar { background: transparent; }

/* Geraeterahmen: das Bild haengt wie ein Bildschirm im Raum */
.kp-device { position: relative; display: block; }
.kp-device-screen { position: relative; overflow: hidden; }
.kp-device-screen > .kp-fig-frame, .kp-device-screen > .kp-hs-stage { border-radius: inherit; }
.kp-device-monitor { padding: 12px 12px 14px; background: linear-gradient(180deg, #2a2d33, #121418); border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 24px 50px -18px rgba(0,0,0,.6); }
.kp-device-monitor .kp-device-screen { border-radius: 3px; background: #000; }
.kp-device-monitor .kp-device-foot { display: block; width: 28%; height: 14px; margin: 14px auto -28px; background: linear-gradient(180deg, #1a1c21, #2a2d33); border-radius: 0 0 8px 8px; box-shadow: 0 6px 0 -2px #0f1013, 0 18px 24px -10px rgba(0,0,0,.6); }
.kp-device-monitor .kp-device-foot::after { content: ""; position: absolute; left: 50%; bottom: -22px; width: 46%; height: 6px; transform: translateX(-50%); background: #1a1c21; border-radius: 999px; }
.kp-b-image .kp-device-monitor, .kp-b-textimage .kp-device-monitor, .kp-hotspots .kp-device-monitor { margin-bottom: 30px; }
.kp-device-tablet { padding: 18px; background: linear-gradient(160deg, #35383f, #16181c); border-radius: 26px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 24px 50px -18px rgba(0,0,0,.6); }
.kp-device-tablet .kp-device-screen { border-radius: 12px; background: #000; }
.kp-device-tablet .kp-device-foot { position: absolute; left: 50%; top: 7px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #0a0b0d; box-shadow: inset 0 0 0 1.5px #3b4047; }
.kp-device-whiteboard { padding: 9px; background: linear-gradient(180deg, #e9eaed, #c9ccd2); border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 18px 40px -16px rgba(0,0,0,.45); }
.kp-device-whiteboard .kp-device-screen { border-radius: 2px; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.kp-device-whiteboard .kp-device-foot, .kp-device-whiteboard .kp-device-foot::after { content: ""; position: absolute; left: 2px; right: 2px; top: 2px; bottom: 2px; pointer-events: none; }
.kp-device-whiteboard .kp-device-foot { background:
  linear-gradient(#1d1f24, #1d1f24) left top / 10px 10px no-repeat, linear-gradient(#1d1f24, #1d1f24) right top / 10px 10px no-repeat,
  linear-gradient(#1d1f24, #1d1f24) left bottom / 10px 10px no-repeat, linear-gradient(#1d1f24, #1d1f24) right bottom / 10px 10px no-repeat; opacity: .7; }
.kp-framed .kp-fig-frame img { border-radius: 0; }
.kp-framed .kp-zoom { display: none; }

/* Glitch: Farbversatz (Rot/Cyan) und Streifen nur an den Raendern, die Bildmitte bleibt sauber. Rein statisch, nichts bewegt sich. */
.kp-treat-glitch .kp-fig-frame { position: relative; overflow: hidden; isolation: isolate; border-radius: inherit; }
.kp-treat-glitch img { filter: saturate(1.15) contrast(1.05); }
.kp-treat-glitch .kp-fig-frame::before, .kp-treat-glitch .kp-fig-frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; background: var(--kp-img, none) center / cover no-repeat; mix-blend-mode: screen; opacity: .85;
  -webkit-mask: linear-gradient(90deg, #000 0, transparent 16%, transparent 84%, #000 100%); mask: linear-gradient(90deg, #000 0, transparent 16%, transparent 84%, #000 100%); }
.kp-treat-glitch .kp-fig-frame::before { transform: translateX(-7px) scaleX(1.03); filter: saturate(0) brightness(1.1) sepia(1) hue-rotate(-50deg) saturate(6); }
.kp-treat-glitch .kp-fig-frame::after { transform: translateX(7px) scaleX(1.03); filter: saturate(0) brightness(1.1) sepia(1) hue-rotate(150deg) saturate(6); }
.kp-treat-glitch .kp-zoom { z-index: 2; }
.kp-treat-glitch .kp-fig-frame img { -webkit-mask: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%), repeating-linear-gradient(180deg, #000 0 3px, rgba(0,0,0,.55) 3px 4px); -webkit-mask-composite: source-over; mask: linear-gradient(90deg, rgba(0,0,0,.55) 0, #000 7%, #000 93%, rgba(0,0,0,.55) 100%); }

/* Flipcards als Karussell: eine Karte in der Mitte, ‹ 1 von 3 ›, duenne Fortschrittslinie */
.kp-flipcar { max-width: 460px; margin: 0 auto; }
.kp-flipcar .kp-flip { display: none; height: 260px; }
.kp-flipcar .kp-flip.kp-flip-tall { height: 340px; }
.kp-flipcar .kp-flip.on { display: block; animation: kp-fade .35s both; }
.kp-flipcar .kp-flip-front, .kp-flipcar .kp-flip-back { padding: 26px; font-size: 20px; }
.kp-flipcar .kp-flip-back { font-size: 17px; font-weight: 400; text-align: left; justify-content: flex-start; }
.kp-flipcar-nav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin-top: 18px; }
.kp-flipcar-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font: inherit; font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.kp-flipcar-btn:disabled { opacity: .35; cursor: default; }
.kp-flipcar-btn:not(:disabled):hover { filter: brightness(.92); }
.kp-flipcar-pos { display: grid; justify-items: center; gap: 6px; font-size: 13px; font-style: italic; color: var(--kp-muted); }
.kp-flipcar-bar { display: block; width: 100%; max-width: 160px; height: 2px; background: var(--kp-line); }
.kp-flipcar-bar b { display: block; height: 100%; background: var(--kp-accent); transition: width .3s; }

/* Linkkarte: Vorschau auf einen Artikel draussen */
.kp-linkcard { display: block; max-width: 640px; margin: 0 auto; color: inherit; text-decoration: none; background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); overflow: hidden; box-shadow: var(--kp-shadow); transition: transform .25s, box-shadow .25s; }
a.kp-linkcard:hover, a.kp-linkcard:focus-visible { transform: translateY(-2px); box-shadow: var(--kp-glow, var(--kp-shadow)); }
.kp-lc-media img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.kp-lc-body { padding: 18px 22px 20px; }
.kp-lc-title { margin: 4px 0 8px; font-size: 20px; line-height: 1.25; color: var(--kp-title, var(--kp-primary)); }
.kp-lc-text { font-size: 15px; color: var(--kp-muted); }
.kp-lc-text p { margin: 0; }
.kp-lc-more { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-lc-more b { font-weight: 700; }
.kp-lc-empty { opacity: .8; }
.kp-on-dark .kp-linkcard { color: var(--kp-text); }

/* Titelbereich mittig: keine Karte, Titel und Startknopf auf dem Foto, dunkler Schleier dahinter */
.kp-hero-center { grid-template-columns: 1fr; }
.kp-hero-center .kp-hero-media { grid-column: 1; grid-row: 1; }
.kp-hero-center .kp-hero-media img { min-height: 460px; max-height: 620px; }
.kp-hero-center .kp-hero-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,12,20,.28), rgba(10,12,20,.52)); pointer-events: none; }
.kp-hero-center .kp-hero-card, .kp-hero-cover.kp-hero-center .kp-hero-card { grid-column: 1; grid-row: 1; align-self: center; justify-self: center; max-width: min(820px, 100%); margin: 0 var(--kp-side); padding: 24px; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; text-align: center; color: #fff; }
.kp-hero-center .kp-hero-title { color: #fff; font-size: clamp(34px, 5.2vw, 64px); line-height: 1.05; text-shadow: 0 2px 24px rgba(0,0,0,.45); }
.kp-hero-center :is(.kp-text, .kp-hello, .kp-hero-meta, .kp-hero-meta span, .kp-ico-lg) { color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,.45); }
.kp-hero-center .kp-eyebrow, .kp-hero-center .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
.kp-hero-center .kp-text { max-width: 640px; margin-left: auto; margin-right: auto; }
.kp-hero-center .kp-hero-meta { justify-content: center; }
.kp-hero-center .kp-hero-start .kp-btn, .kp-hero-cover.kp-hero-center .kp-hero-start .kp-btn { background: #fff; color: #16181d; border-radius: 999px; padding: 15px 40px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.kp-hero-center .kp-hero-start .kp-btn:hover { background: #f1f1f4; }
.kp-hero-cover.kp-hero-center .kp-hero-media img { max-height: none; min-height: 0; }
@media (max-width: 760px) { .kp-hero-center .kp-hero-card { grid-row: 1; margin: 0 8px; padding: 18px; } .kp-hero-center .kp-hero-media img { min-height: 380px; } }
/* Erklaerkarte im Bild bleibt dunkel beschriftet, auch auf dunklem Abschnitt oder Kulisse */
.kp-on-dark :is(.kp-hs-pop, .kp-hs-info), .kp-on-dark :is(.kp-hs-pop, .kp-hs-info) :is(h3, .kp-text, p, li) { color: var(--kp-text); text-shadow: none; }

/* Chat als Bot-Fenster: Kopfzeile in der Hauptfarbe, Prompt-Vorschlaege, Eingabezeile mit Senden-Pfeil, Tipp-Punkte */
.kp-chat-bot { border-radius: 6px; }
.kp-chat-bot .kp-chat-head { background: var(--kp-primary); color: var(--kp-on-primary, #fff); border-bottom: 0; padding: 14px 18px; }
.kp-chat-bot .kp-chat-head small { color: inherit; opacity: .8; }
.kp-chat-boticon { width: 26px; height: 26px; flex: none; }
.kp-chat-bot .kp-chat-log { background: var(--kp-surface); min-height: 180px; }
.kp-chat-bot .kp-chat-them { background: color-mix(in srgb, var(--kp-text) 7%, var(--kp-surface)); border-color: transparent; border-radius: 12px; }
.kp-chat-bot .kp-chat-me { background: var(--kp-primary); color: var(--kp-on-primary, #fff); border-color: transparent; border-radius: 12px; }
.kp-chat-bot .kp-chat-choices { border-top: 0; padding-bottom: 8px; }
.kp-chat-bot .kp-chat-ask { font-size: 13px; color: var(--kp-muted); }
.kp-chat-bot .kp-chat-opt { border-radius: 999px; border-color: color-mix(in srgb, var(--kp-primary) 45%, var(--kp-line)); }
.kp-chat-input { display: flex; align-items: center; gap: 12px; margin: 0 16px 16px; padding: 10px 12px 10px 16px; border: 1px solid var(--kp-line); border-radius: 999px; color: var(--kp-muted); font-size: 14px; }
.kp-chat-input span { flex: 1; }
.kp-chat-input i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--kp-primary); color: var(--kp-on-primary, #fff); }
.kp-chat-input i .kp-ico { width: 16px; height: 16px; }
.kp-chat-dots { display: flex; gap: 4px; padding: 0 16px; max-height: 0; margin: 0; opacity: 0; overflow: hidden; animation: kp-chat-dots-on .01s linear forwards, kp-chat-dots-off .01s linear forwards; animation-delay: var(--d, 0s), calc(var(--d, 0s) + .9s); }
.kp-chat-dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; animation: kp-typing .75s ease-in-out infinite; }
.kp-chat-dots i:nth-child(2) { animation-delay: .15s; } .kp-chat-dots i:nth-child(3) { animation-delay: .3s; }
.kp-chat-bot .kp-chat-new { animation: kp-fade .3s both; animation-delay: var(--d, 0s); }
@keyframes kp-chat-dots-on { to { opacity: 1; max-height: 60px; padding: 14px 16px; } }
@keyframes kp-chat-dots-off { to { opacity: 0; max-height: 0; padding: 0; margin: -8px 0 0; } }
@media (prefers-reduced-motion: reduce) { .kp-chat-dots { display: none; } .kp-chat-bot .kp-chat-new { animation: none; } }

/* Foto-Stil dunkel (Vorbild youknow): Violettgrau statt Marine, weisse Karten mit farbiger Oberkante, Magenta als Signal.
   Kommt ueber das Paket „fotodunkel“ (Stil foto + mode dunkel); die Farben hier ueberschreiben die von .kp-dark. */
.kp-style-foto.kp-dark { --kp-bg: #2E2B3F; --kp-surface: #3A3650; --kp-text: #F4F2F8; --kp-muted: #C3BED3; --kp-line: #4D4866; --kp-title: #F4F2F8; }
.kp-style-foto.kp-dark :is(.kp-card, .kp-flip-back, .kp-linkcard, .kp-cmp-card, .kp-note, .kp-chat-phone, .kp-strang-item) { background: #fff; color: #1f1d2b; border-color: transparent; border-top: 3px solid var(--kp-accent); }
.kp-style-foto.kp-dark :is(.kp-card, .kp-flip-back, .kp-cmp-card, .kp-note) :is(h3, .kp-text, p, li) { color: #1f1d2b; }
.kp-style-foto.kp-dark .kp-strang-item :is(h3, .kp-text, p, li, strong) { color: #1f1d2b; }
.kp-style-foto.kp-dark .kp-strang-item { border-left: 0; }
.kp-style-foto.kp-dark .kp-card h3, .kp-style-foto.kp-dark .kp-lc-title { color: #1f1d2b; }
.kp-style-foto.kp-dark .kp-chat-phone { border-top: 0; }
.kp-style-foto.kp-dark .kp-chat-bot .kp-chat-log { background: #fff; }
.kp-style-foto.kp-dark .kp-chat-bot .kp-chat-them { background: #ECEBF1; color: #1f1d2b; }
.kp-style-foto.kp-dark .kp-chat-opt { background: #fff; color: #1f1d2b; }
.kp-style-foto.kp-dark .kp-chat-phone :is(.kp-chat-ask, .kp-chat-input, .kp-chat-note, .kp-chat-end, .kp-chat-head small) { color: #5C5870; }
.kp-style-foto.kp-dark .kp-chat-bot .kp-chat-head small { color: inherit; }
.kp-style-foto.kp-dark .kp-flip-front { background: #fff; color: #1f1d2b; border-top: 3px solid var(--kp-accent); }
.kp-style-foto.kp-dark .kp-hs-pop, .kp-style-foto.kp-dark .kp-hs-info { border-bottom: 3px solid var(--kp-accent); }
.kp-style-foto.kp-dark .kp-eyebrow { color: color-mix(in srgb, var(--kp-accent) 60%, white); }
.kp-style-foto.kp-dark .kp-fig:not([class*="kp-treat-"]) .kp-fig-frame::after { display: none; }

/* ---------- Runde 8 (Vorbild LXT Authoring): warmer Verlauf, Stimme in der Karte, Symbol-Kacheln, Lesezeit je Seite ---------- */
/* Mehrfarb-Verlauf: drei weiche Farbflecken statt eines geraden Verlaufs. Ton warm (Pfirsich, Koralle), kalt (Blau, Türkis) oder haus (aus Haupt- und Akzentfarbe). */
.kp-block.kp-bg-mesh { --kp-m1: color-mix(in srgb, var(--kp-primary) 22%, white); --kp-m2: color-mix(in srgb, var(--kp-accent) 28%, white); --kp-m3: color-mix(in srgb, var(--kp-accent) 14%, white); --kp-m0: color-mix(in srgb, var(--kp-primary) 5%, white);
  background: radial-gradient(ellipse 60% 70% at 15% 20%, var(--kp-m1), transparent 70%), radial-gradient(ellipse 55% 65% at 85% 25%, var(--kp-m2), transparent 70%), radial-gradient(ellipse 70% 55% at 50% 100%, var(--kp-m3), transparent 70%), var(--kp-m0); }
.kp-block.kp-bg-mesh.kp-tone-warm { --kp-m1: #FFD6C2; --kp-m2: #FFB3A3; --kp-m3: #FFE4B8; --kp-m0: #FFF5EF; }
.kp-block.kp-bg-mesh.kp-tone-kalt { --kp-m1: #CFE6FF; --kp-m2: #BDEDEE; --kp-m3: #DCDFFF; --kp-m0: #F2F7FF; }
.kp-dark .kp-block.kp-bg-mesh { --kp-m1: color-mix(in srgb, var(--kp-primary) 30%, var(--kp-bg)); --kp-m2: color-mix(in srgb, var(--kp-accent) 24%, var(--kp-bg)); --kp-m3: color-mix(in srgb, var(--kp-accent) 12%, var(--kp-bg)); --kp-m0: var(--kp-bg); }
.kp-dark .kp-block.kp-bg-mesh.kp-tone-warm { --kp-m1: #4A2A22; --kp-m2: #5A2F2A; --kp-m3: #4A3A22; }
.kp-dark .kp-block.kp-bg-mesh.kp-tone-kalt { --kp-m1: #1F2F48; --kp-m2: #1C3B40; --kp-m3: #27294A; }

/* Stimme in der Begleitfigur-Karte: Play, Wellenform aus Balken, Dauer; Sprechblase oben rechts in der Karte */
.kp-guide-card { position: relative; }
.kp-guide-audio { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-top: 16px; }
.kp-guide-bubble { position: absolute; top: 18px; right: 20px; opacity: .55; }
.kp-guide-bubble .kp-ico { width: 30px; height: 30px; }
.kp-ga-play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--kp-primary); color: var(--kp-on-primary, #fff); font: inherit; font-size: 13px; cursor: pointer; display: grid; place-items: center; }
.kp-ga-play:hover { filter: brightness(.92); }
.kp-ga-wave { display: flex; align-items: center; gap: 2px; height: 28px; }
.kp-ga-wave i { flex: 1 0 2px; min-width: 2px; max-width: 4px; border-radius: 2px; background: color-mix(in srgb, var(--kp-text) 30%, transparent); transition: background .2s; }
.kp-ga-wave i.on { background: var(--kp-primary); }
.kp-guide-audio.playing .kp-ga-wave i.on { background: var(--kp-accent-ink, var(--kp-accent)); }
.kp-ga-time { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--kp-muted); }
.kp-card-primary .kp-ga-wave i, .kp-card-dark .kp-ga-wave i, .kp-card-glassdark .kp-ga-wave i { background: rgba(255,255,255,.35); }
.kp-card-primary .kp-ga-wave i.on, .kp-card-dark .kp-ga-wave i.on, .kp-card-glassdark .kp-ga-wave i.on { background: #fff; }
.kp-card-primary .kp-ga-play, .kp-card-dark .kp-ga-play, .kp-card-glassdark .kp-ga-play { background: #fff; color: var(--kp-primary); }
.kp-card-primary .kp-ga-time, .kp-card-dark .kp-ga-time, .kp-card-glassdark .kp-ga-time, .kp-card-primary .kp-guide-bubble, .kp-card-dark .kp-guide-bubble, .kp-card-glassdark .kp-guide-bubble { color: #fff; }

/* Symbol-Kacheln: grosses Symbol ueber dem Kartentitel; ohne Text wird die Karte zur Kachel */
.kp-card-icon { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 14px; border-radius: calc(var(--kp-radius) + 2px); background: color-mix(in srgb, var(--kp-primary) 7%, var(--kp-surface)); color: var(--kp-primary); }
.kp-card-icon .kp-ico-lg { width: 36px; height: 36px; color: inherit; }
.kp-card-tile { text-align: center; }
.kp-card-tile .kp-card-icon { margin-left: auto; margin-right: auto; width: 84px; height: 84px; }
.kp-card-tile .kp-card-icon .kp-ico-lg { width: 46px; height: 46px; }
.kp-card-tile h3 { margin-bottom: 0; }
.kp-on-dark .kp-card-icon { background: rgba(255,255,255,.1); color: #fff; }

/* Lesezeit je Seite unter dem Titel */
.kp-readtime { display: inline-flex; align-items: center; gap: 6px; margin: 6px 0 0; font-size: 13px; color: var(--kp-muted); }
.kp-readtime .kp-ico { width: 16px; height: 16px; }

/* ---------- Bildschirmseiten (settings.screen): jede Seite füllt den Bildschirm, nichts zum Scrollen ----------
   Vorbild youknow: Folien statt Webseiten. Seiten mit Text und Übung werden geteilt: Titel und Text links, die Übung
   rechts auf einer getönten Fläche bis an die Ränder (page.arrange, b.slot). Alles andere steht senkrecht mittig.
   --kp-screen-h ist die Fläche zwischen den Leisten, --kp-area-half die halbe Breite neben einer Leiste links. */
.kp-screen { --kp-area-half: var(--kp-half, 50vw); --kp-screen-h: calc(100svh - var(--kp-navh, 0px) - var(--kp-headh, 0px) - var(--kp-footh, 0px) - var(--kp-pnavh, 0px));
  --kp-split-max: 1840px; --kp-split-pad: max(var(--kp-side), calc(var(--kp-area-half) - var(--kp-split-max) / 2 + var(--kp-side)));
  --kp-stage-bg: color-mix(in srgb, var(--kp-text) 6%, var(--kp-bg)); }
.kp-screen .kp-main.kp-fit-main { min-height: var(--kp-screen-h); display: flex; flex-direction: column; justify-content: center; }
.kp-screen .kp-fit { width: 100%; }
/* Video im Baustein „Video, Audio, Galerie“: auf einer Folie höchstens so hoch, dass Titel und Bildunterschrift mitpassen (wie .kp-iv video) */
.kp-screen .kp-media video { display: block; width: auto; max-width: 100%; max-height: calc(var(--kp-screen-h) - 260px); margin-inline: auto; }
.kp-screen .kp-main.kp-solo-main > .kp-block:first-child { min-height: var(--kp-screen-h); margin-bottom: calc(var(--kp-main-pb, 32px) * -1); display: flex; flex-direction: column; justify-content: center; }
.kp-screen .kp-main.kp-solo-main > .kp-block:first-child > .kp-block-inner { width: 100%; }
.kp-screen .kp-main.kp-split-main { min-height: var(--kp-screen-h); max-width: none; }
.kp-split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); min-height: var(--kp-screen-h);
  margin: calc(var(--kp-main-pt, 48px) * -1) calc(var(--kp-side) * -1) calc(var(--kp-main-pb, 32px) * -1); }
.kp-split-text { align-self: center; min-width: 0; padding: 40px 56px 40px var(--kp-split-pad); }
.kp-split-stage { display: flex; flex-direction: column; justify-content: center; min-width: 0; background: var(--kp-stage-bg); padding: 40px var(--kp-split-pad) 40px 56px; }
.kp-split-flip { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.kp-split-flip .kp-split-stage { order: -1; padding: 40px 56px 40px var(--kp-split-pad); }
.kp-split-flip .kp-split-text { padding: 40px var(--kp-split-pad) 40px 56px; }
.kp-split .kp-block.kp-w-wide, .kp-split .kp-block.kp-w-full, .kp-split .kp-block[class*="kp-bg-"] { margin-left: 0; margin-right: 0; }
.kp-split .kp-block[class*="kp-bg-"], .kp-split .kp-block.kp-w-full { padding: var(--kp-pad, 32px); }
.kp-split .kp-page-head { margin-left: 0; margin-right: 0; }
.kp-screen :is(.kp-split-text, .kp-split-stage, .kp-split-unten, .kp-fit) > .kp-block:last-child { margin-bottom: 0; }
/* Platz „unten“ (b.slot): zweite Zeile über beide Spalten, auf dem Seitengrund; die Bühne bleibt oben getönt */
.kp-split.kp-has-unten { grid-template-rows: minmax(0, 1fr) auto; }
.kp-split-unten { grid-column: 1 / -1; padding: 22px var(--kp-split-pad) 30px; display: flex; flex-direction: column; justify-content: center; }
.kp-split-unten > .kp-b-statement .kp-statement-center { max-width: 1100px; margin: 0 auto; }
.kp-split-unten > .kp-b-statement .kp-statement-text { font-size: clamp(22px, 1.7vw + 8px, 36px); font-weight: 700; }
.kp-split.kp-has-unten .kp-split-stage { padding-bottom: 28px; }
/* Solange unten nichts sichtbar ist (Kernsatz hinter einer Bedingung), nimmt die Zeile keinen Platz */
.kp-split-unten:not(:has(> .kp-block:not([hidden]))) { display: none; }
.kp-split-stage > .kp-b-image .kp-fig-frame { width: 100%; }
.kp-style-foto .kp-fig.kp-drawing .kp-fig-frame::after, .kp-style-editorial .kp-fig.kp-drawing .kp-fig-frame::after { display: none; }
.kp-style-foto .kp-fig.kp-drawing img, .kp-style-editorial .kp-fig.kp-drawing .kp-fig-frame img { filter: none; mix-blend-mode: normal; }
.kp-split-stage > .kp-b-image .kp-fig-frame img { width: 100%; height: auto; max-height: calc(var(--kp-screen-h) - 120px); object-fit: contain; }
/* Ein Foto allein auf der Bühne füllt die Fläche randlos (Vorbild: Küche, Teich); mit Geräterahmen bleibt es eingepasst */
.kp-split-stage.kp-stage-fill { padding: 0; }
.kp-stage-fill > .kp-b-image { flex: 1; position: relative; min-height: 320px; }
.kp-stage-fill > .kp-b-image :is(.kp-block-inner, .kp-fig) { position: absolute; inset: 0; }
.kp-stage-fill > .kp-b-image .kp-fig-frame { height: 100%; }
.kp-stage-fill > .kp-b-image .kp-fig-frame img { width: 100%; height: 100%; max-height: none; object-fit: cover; border-radius: 0; }

}
/* Szenario-Auftrag (hero.layout „auftrag“, Vorbild cosmicegg): Foto über die ganze Fläche, Auftrag im dunklen eckigen Kasten unten links,

.kp-hero-auftrag .kp-hero-media { grid-column: 1; grid-row: 1; }

  .kp-hero2.kp-hero-auftrag .kp-hero-card, .kp-hero-cover.kp-hero-auftrag .kp-hero-card { justify-self: stretch; max-width: none; margin: 0 12px 84px; padding: 18px 20px; }
  .kp-hero2.kp-hero-auftrag > .kp-auftrag-start { justify-self: stretch; margin: 0 12px 12px; }
  .kp-auftrag-start .kp-btn { width: 100%; padding: 18px; }
}

/* Sortieren als Ablage (sortcats.look „ablage“, Vorbild Fallbeispiel Datenschutz): gestrichelte Ablagefelder links nebeneinander,
   Vorrat als versetzte Kärtchen rechts, rundes Greifsymbol in der Akzentfarbe, OK-Knopf als Umrisspille. */
.kp-sortcats.kp-sort-ablage { display: grid; grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr); grid-template-areas: "q q" "intro intro" "hint hint" "cats pool" "act pool" "fb fb"; column-gap: 48px; padding: 32px 40px; }
.kp-sort-ablage > .kp-q { grid-area: q; } .kp-sort-ablage > .kp-text { grid-area: intro; } .kp-sort-ablage > .kp-sort-hint { grid-area: hint; color: var(--kp-text); font-size: 16px; margin-bottom: 28px; }
.kp-sort-ablage > .kp-sort-cats { grid-area: cats; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; align-self: start; }
.kp-sort-ablage > .kp-sort-pool { grid-area: pool; border: 0; padding: 0 0 0 16px; margin: 0; min-height: 0; background: none; }
.kp-sort-ablage > .kp-quiz-actions { grid-area: act; margin-top: 28px; align-self: start; align-items: flex-start; }
.kp-sort-ablage > .kp-feedback { grid-area: fb; }
.kp-sort-ablage .kp-sort-pool ul { flex-direction: column; flex-wrap: nowrap; gap: 16px; align-items: flex-start; }
.kp-sort-ablage .kp-sort-pool li.kp-sort-item { width: min(232px, 100%); }
.kp-sort-ablage .kp-sort-pool li.kp-sort-item:nth-child(3n+2) { margin-left: -36px; }
.kp-sort-ablage .kp-sort-pool li.kp-sort-item:nth-child(3n) { margin-left: 18px; }
.kp-sort-ablage .kp-sort-cat { border: 2px dashed color-mix(in srgb, var(--kp-text) 22%, transparent); border-radius: 0; background: none; padding: 16px 22px 28px; }
.kp-sort-ablage .kp-sort-cat.kp-over { border-color: var(--kp-accent); background: color-mix(in srgb, var(--kp-accent) 6%, transparent); }
.kp-sort-ablage .kp-sort-cat-title { justify-content: center; font-weight: 500; }
.kp-sort-ablage .kp-sort-cat-title .kp-num { display: none; }
.kp-sort-ablage .kp-sort-cat ul { min-height: 160px; background: color-mix(in srgb, var(--kp-text) 8%, var(--kp-surface)); gap: 0; }
.kp-sort-ablage .kp-sort-empty { display: none; }
.kp-sort-ablage .kp-sort-item { position: relative; justify-content: center; text-align: center; min-height: 42px; padding: 8px 14px 8px 30px; background: var(--kp-surface); border: 1px solid var(--kp-accent); border-radius: 0; font-size: 15px; font-weight: 500; }
.kp-sort-ablage .kp-sort-cat .kp-sort-item { background: color-mix(in srgb, var(--kp-text) 8%, var(--kp-surface)); }
.kp-sort-grip { position: absolute; left: -15px; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--kp-accent); color: var(--kp-on-accent, #fff); box-shadow: 0 0 0 3px color-mix(in srgb, var(--kp-accent) 30%, transparent); }
.kp-sort-grip .kp-ico { width: 18px; height: 18px; }
.kp-sort-ablage .kp-sort-item.kp-right { border-color: var(--kp-ok); } .kp-sort-ablage .kp-sort-item.kp-wrong { border-color: var(--kp-no); }
.kp-sort-ablage .kp-sort-item.kp-right .kp-sort-grip { background: var(--kp-ok); } .kp-sort-ablage .kp-sort-item.kp-wrong .kp-sort-grip { background: var(--kp-no); }
.kp-sort-ablage .kp-sort-move { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.kp-sort-ablage .kp-sort-move button { min-width: 24px; min-height: 24px; font-size: 12px; }
@media (hover: hover) { .kp-sort-ablage .kp-sort-move { opacity: 0; transition: opacity .15s; } .kp-sort-ablage .kp-sort-item:is(:hover, :focus-within) .kp-sort-move { opacity: 1; } }
.kp-sort-ablage .kp-quiz-actions .kp-btn { min-width: 232px; padding: 13px 28px; border-radius: 999px; background: var(--kp-surface); color: var(--kp-accent-ink, var(--kp-accent)); border: 2px solid var(--kp-accent); font-size: 17px; font-weight: 700; box-shadow: none; }
.kp-sort-ablage .kp-quiz-actions .kp-btn:not(:disabled):hover { background: var(--kp-accent); color: var(--kp-on-accent, #fff); }
@media (max-width: 760px) {
  .kp-sortcats.kp-sort-ablage { grid-template-columns: minmax(0, 1fr); grid-template-areas: "q" "intro" "hint" "pool" "cats" "act" "fb"; padding: 20px 18px; }
  .kp-sort-ablage > .kp-sort-pool { padding: 0 0 20px 16px; }
  .kp-sort-ablage .kp-sort-pool li.kp-sort-item:is(:nth-child(3n+2), :nth-child(3n)) { margin-left: 0; }
  .kp-sort-ablage .kp-sort-cat ul { min-height: 90px; }
}
@media (prefers-reduced-motion: reduce) { .kp-sort-ablage .kp-sort-move { transition: none; } }
.kp-slide-mitte .kp-slide-panel:has(.kp-sort-ablage) { width: min(1120px, 100%); }

/* Folie „Plakat“ (page.arrange „plakat“, Vorbild PUMA „Structure your talk“): dunkles Foto über die ganze Folie mit Schleier
   von links, riesiger Titel in kursiven Versalien, Text weiß, die Übung rechts direkt auf dem Foto */
.kp-slide-plakat { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(24px, 4vw, 64px); align-items: center; padding: 40px var(--kp-split-pad); background: #1b1d21; color: #fff; }
.kp-slide-plakat.kp-has-bg::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--kp-slidebg) var(--kp-bgpos, center) / cover no-repeat; filter: grayscale(.35); }
.kp-slide-plakat::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(12,13,16,.86) 0%, rgba(12,13,16,.62) 45%, rgba(12,13,16,.5) 100%); }
.kp-slide-plakat .kp-slide-panel :is(h1, .kp-eyebrow, .kp-text, .kp-text p, .kp-statement-text, .kp-caption, .kp-q) { color: #fff; }
.kp-slide-plakat .kp-page-head h1 { font-size: clamp(38px, 5.2vw, 84px); overflow-wrap: anywhere; hyphens: auto; line-height: .95; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.01em; margin: 0 0 28px; text-shadow: 0 2px 24px rgba(0,0,0,.35); }
.kp-slide-plakat .kp-page-head .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); background: none; text-decoration: none; border: 0; box-shadow: none; }
.kp-slide-plakat .kp-btn:not(.kp-sec) { background: var(--kp-accent); border-color: var(--kp-accent); color: var(--kp-on-accent, #fff); border-radius: 0; text-transform: uppercase; letter-spacing: .04em; font-size: 14px; }
.kp-slide-plakat .kp-btn.kp-sec { color: #fff; border-color: rgba(255,255,255,.6); background: transparent; }
.kp-slide-plakat .kp-slide-panel .kp-text { font-size: clamp(16px, 1.3vw, 19px); }
.kp-slide-plakat .kp-slide-panel > .kp-block, .kp-slide-plakat .kp-plakat-stage > .kp-block { background: none; box-shadow: none; padding: 0; margin: 0 0 18px; }
.kp-plakat-stage { min-width: 0; }
.kp-plakat-stage .kp-quiz { background: none; border: 0; box-shadow: none; padding: 0; color: #fff; }
.kp-plakat-stage .kp-quiz > :is(.kp-q, .kp-label) { color: #fff; }
@media (max-width: 900px) { .kp-slide-plakat { grid-template-columns: minmax(0, 1fr); padding: 32px var(--kp-side); } }

/* Reihenfolge am Pfeil (quiz order, look „pfeil“) */
.kp-quiz:has(.kp-pfeil) { display: flex; flex-direction: column; }
.kp-quiz:has(.kp-pfeil) > * { order: 3; }
.kp-quiz:has(.kp-pfeil) > .kp-q { order: 0; } .kp-quiz:has(.kp-pfeil) > .kp-pfeil { order: 1; }
.kp-quiz:has(.kp-pfeil) > .kp-label { order: 2; align-self: center; margin: 4px 0 14px; padding: 6px 16px; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-size: 14px; letter-spacing: 0; text-transform: none; }
.kp-pfeil { position: relative; padding: 0 0 0 46px; margin: 0 0 12px; }
.kp-pfeil::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 30px; width: 2px; background: currentColor; opacity: .85; }
.kp-pfeil::after { content: ""; position: absolute; left: 9px; bottom: 26px; border: 6px solid transparent; border-top: 9px solid currentColor; border-bottom: 0; opacity: .85; }
.kp-pfeil-end { display: block; margin-left: -46px; width: 30px; text-align: center; font-size: 13px; font-weight: 800; font-style: italic; letter-spacing: .06em; text-transform: uppercase; }
.kp-pfeil-top { margin-bottom: 14px; } .kp-pfeil-bottom { margin-top: 14px; }
.kp-pfeil .kp-order { gap: 10px; margin: 0; justify-items: start; }
.kp-pfeil .kp-order-item { width: fit-content; max-width: 100%; padding: 8px 12px; background: #fff; color: #1a1a1c; border: 0; border-radius: 0; box-shadow: 0 6px 18px rgba(0,0,0,.18); font-size: 15px; cursor: grab; }
.kp-pfeil .kp-order-item .kp-grip { display: none; }
.kp-pfeil .kp-order-item .kp-move button { color: #1a1a1c; }
@media (hover: hover) { .kp-pfeil .kp-order-item .kp-move { opacity: 0; } .kp-pfeil .kp-order-item:is(:hover, :focus-within) .kp-move { opacity: 1; } }
.kp-pfeil .kp-order-item.kp-right { box-shadow: inset 4px 0 0 var(--kp-ok), 0 6px 18px rgba(0,0,0,.18); }
.kp-pfeil .kp-order-item.kp-wrong { box-shadow: inset 4px 0 0 var(--kp-no), 0 6px 18px rgba(0,0,0,.18); }
.kp-order-pos { margin-left: 10px; font-size: 12px; font-weight: 700; color: var(--kp-no); white-space: nowrap; }

/* Dezente Leiste (chrome.navPos „menue“, Vorbild PUMA Talent Development): schmal, dunkelgrau, Symbole links,
   „Menü“ in der Mitte klappt das Inhaltsverzeichnis links auf und wieder zu, rechts nur Pfeile. */
.kp-nav-dezent { --kp-nav-bg: #34373c; --kp-nav-ink: #f2f3f5; }
.kp-nav-dezent .kp-navbar { box-shadow: none; }
.kp-nav-dezent .kp-navbar .kp-progress { height: 3px; background: rgba(255,255,255,.12); }
.kp-nav-dezent .kp-navrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 0; padding: 0; min-height: 44px; }
.kp-nav-dezent .kp-dz-head { display: contents; }
.kp-dz-tools { display: flex; align-items: center; gap: 2px; padding-left: 6px; min-width: 0; }
.kp-dz-btn, .kp-dz-arrow { display: grid; place-items: center; width: 52px; min-height: 44px; border: 0; background: transparent; color: inherit; cursor: pointer; opacity: .85; }
.kp-dz-btn .kp-ico, .kp-dz-arrow .kp-ico { width: 22px; height: 22px; }
.kp-dz-btn:hover, .kp-dz-arrow:not(:disabled):hover, .kp-dz-menu:hover { opacity: 1; background: rgba(255,255,255,.08); }
.kp-dz-btn:focus-visible, .kp-dz-arrow:focus-visible, .kp-dz-menu:focus-visible { outline: 2px solid currentColor; outline-offset: -4px; }
.kp-dz-arrow:disabled { opacity: .3; cursor: default; }
.kp-dz-arrow.kp-dz-map { width: auto; gap: 8px; grid-auto-flow: column; padding: 0 16px 0 12px; border-radius: 999px; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-weight: 700; font-size: 14px; opacity: 1; white-space: nowrap; }
@media (max-width: 600px) { .kp-dz-arrow.kp-dz-map span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .kp-dz-arrow.kp-dz-map { padding: 0; width: 52px; } }
.kp-dz-arrow.kp-dz-map:hover { filter: brightness(1.08); background: var(--kp-accent); }
.kp-dz-back .kp-ico { transform: scaleX(-1); }
.kp-dz-menu { display: inline-flex; align-items: center; gap: 8px; padding: 0 28px; border: 0; background: transparent; color: inherit; font: inherit; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; opacity: .92; }
.kp-dz-menu .kp-ico { width: 20px; height: 20px; }
.kp-dz-menu[aria-expanded="true"] { background: rgba(255,255,255,.12); opacity: 1; }
.kp-nav-dezent .kp-navbar .kp-foot { justify-content: flex-end; align-items: center; gap: 0; padding: 0 4px 0 0; background: rgba(0,0,0,.18); }
.kp-nav-dezent .kp-navbar .kp-foot .kp-lock { font-size: 12px; padding: 0 10px; opacity: .75; }
.kp-nav-dezent .kp-ai-mark .kp-ai-btn { background: transparent; border-color: rgba(255,255,255,.35); color: inherit; }
.kp-nav-dezent .kp-ai-word { display: none; }
.kp-nav-dezent :is(.kp-drawer, .kp-backdrop) { bottom: var(--kp-navh, 0px); }
@media (max-width: 600px) {
  .kp-nav-dezent .kp-navrow { flex-wrap: nowrap; }
  .kp-nav-dezent .kp-navbar .kp-foot { flex: none; flex-wrap: nowrap; justify-content: flex-end; }
  .kp-nav-dezent .kp-navbar .kp-foot .kp-lock { display: none; }
  .kp-dz-menu { padding: 0 14px; }
  .kp-dz-btn, .kp-dz-arrow { width: 44px; }
}
.kp-slide-mitte.kp-has-bg .kp-sort-ablage { box-shadow: none; padding: 16px 20px; }
/* ---------- Linke Leiste einklappen: runder Knopf an der Kante, eingeklappt oben links; unter 861 px liegt die Leiste unten, dort kein Knopf ---------- */
.kp-nav-toggle { display: none; }
@media (min-width: 861px) {
  .kp-nav-links .kp-nav-toggle { display: grid; place-items: center; position: fixed; z-index: 45; top: 50vh; left: calc(var(--kp-navw) - 16px); width: 32px; height: 32px; margin-top: -16px; padding: 0; border-radius: 50%; border: 1px solid var(--kp-line, #dcdce0); background: var(--kp-surface, #fff); color: var(--kp-text); cursor: pointer; box-shadow: 0 2px 8px rgba(16,24,40,.18); }
  .kp-nav-links .kp-nav-toggle:hover { filter: brightness(.95); }
  .kp-nav-links .kp-nav-toggle:focus-visible { outline: 3px solid var(--kp-accent-ink, var(--kp-primary)); outline-offset: 2px; }
  .kp-nav-links .kp-nav-toggle svg { width: 16px; height: 16px; transform: rotate(180deg); }
  .kp-nav-links.kp-nav-zu, .kp-nav-links.kp-nav-zu.kp-ml-scroll.kp-style-micro { --kp-navw: 0px; } /* der Scroll-Look setzt 280 px mit zwei Klassen und steht weiter hinten */
  .kp-nav-links.kp-nav-zu .kp-navbar { display: none; }
  .kp-nav-links.kp-nav-zu .kp-nav-toggle { left: 0; width: 24px; height: 40px; margin-top: -20px; border-left: 0; border-radius: 0 20px 20px 0; } /* schmale Lasche am Rand, damit sie nicht in den Inhalt ragt */
  .kp-nav-links.kp-nav-zu .kp-nav-toggle svg { transform: none; }
}
/* ---------- Leiste oben und unten einklappen (Wunsch Kerstin 11.10.2026): Knopf an der Kante der Leiste, eingeklappt eine Lasche am
   Rand; oben verschwinden Kopfzeile und Fortschritt (die Weiter-Knöpfe unter dem Inhalt bleiben), unten die ganze Leiste. Pfeiltasten
   und die Lasche führen weiter. Unter 861 px kein Knopf. ---------- */
@media (min-width: 861px) {
  .kp-nav-oben .kp-nav-toggle, .kp-nav-unten .kp-nav-toggle { display: grid; place-items: center; position: fixed; z-index: 45; right: 50%; margin-right: -16px; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid var(--kp-line, #dcdce0); background: var(--kp-surface, #fff); color: var(--kp-text); cursor: pointer; box-shadow: 0 2px 8px rgba(16,24,40,.18); }
  .kp-nav-oben .kp-nav-toggle { top: calc(var(--kp-headh, 0px) - 16px); }
  .kp-nav-unten .kp-nav-toggle { bottom: calc(var(--kp-navh, 0px) - 16px); }
  .kp-nav-oben .kp-nav-toggle svg, .kp-nav-unten .kp-nav-toggle svg { width: 16px; height: 16px; }
  .kp-nav-oben .kp-nav-toggle svg { transform: rotate(-90deg); }
  .kp-nav-unten .kp-nav-toggle svg { transform: rotate(90deg); }
  .kp-nav-oben .kp-nav-toggle:hover, .kp-nav-unten .kp-nav-toggle:hover { filter: brightness(.95); }
  .kp-nav-oben .kp-nav-toggle:focus-visible, .kp-nav-unten .kp-nav-toggle:focus-visible { outline: 3px solid var(--kp-accent-ink, var(--kp-primary)); outline-offset: 2px; }
  .kp-nav-oben.kp-nav-zu :is(.kp-head, .kp-progress), .kp-nav-unten.kp-nav-zu .kp-navbar { display: none; }
  .kp-nav-oben.kp-nav-zu .kp-nav-toggle, .kp-nav-unten.kp-nav-zu .kp-nav-toggle { width: 44px; height: 22px; border-radius: 0 0 22px 22px; border-top: 0; margin-right: -22px; }
  .kp-nav-oben.kp-nav-zu .kp-nav-toggle { top: 0; }
  .kp-nav-unten.kp-nav-zu .kp-nav-toggle { bottom: 0; border-radius: 22px 22px 0 0; border-top: 1px solid var(--kp-line, #dcdce0); border-bottom: 0; }
  .kp-nav-oben.kp-nav-zu .kp-nav-toggle svg { transform: rotate(90deg); }
  .kp-nav-unten.kp-nav-zu .kp-nav-toggle svg { transform: rotate(-90deg); }
  .kp-nav-unten.kp-nav-zu :is(.kp-drawer, .kp-backdrop) { bottom: 0; }
  /* Oben eingeklappt: das Kennzeichen unten links liegt über den Weiter-Knöpfen unter dem Inhalt, deshalb über deren Höhe */
  .kp-nav-oben.kp-nav-zu .kp-ai-mark.kp-ai-fixed { bottom: calc(12px + var(--kp-footh, 0px)); }
}
/* Praxis auf Folien und geteilten Seiten: das rote Band mit den Kreisen gehört zur normalen Seite über die ganze Breite.
   In einer Spalte oder auf einer Folie wird daraus der Titel in Marine mit kurzem roten Balken darüber, auf roten
   und dunklen Flächen weiß; auf der Folie „Mitte“ mit Foto bleibt das dunkle Titelband der Folie. */
.kp-style-praxis :is(.kp-split-text, .kp-slide) .kp-page-head, .kp-style-praxis :is(.kp-split-text, .kp-slide) .kp-page-head.kp-head-wide { margin: 0 0 20px; padding: 0; background: none; color: var(--kp-text); }
.kp-style-praxis :is(.kp-split-text, .kp-slide) .kp-page-head::after { content: none; }
.kp-style-praxis :is(.kp-split-text, .kp-slide) .kp-page-head::before { content: ""; display: block; width: 56px; height: 6px; margin-bottom: 14px; background: var(--kp-primary); }
.kp-style-praxis :is(.kp-split-text, .kp-slide) .kp-page-head h1 { color: var(--kp-title); max-width: none; }
.kp-style-praxis :is(.kp-split-text, .kp-slide) .kp-page-head :is(.kp-eyebrow, .kp-accent) { color: var(--kp-primary); opacity: 1; }
.kp-style-praxis :is(.kp-slide-karte .kp-slide-panel, .kp-slide-plakat, .kp-buehne-top) .kp-page-head :is(h1, .kp-eyebrow, .kp-accent) { color: #fff; }
.kp-style-praxis :is(.kp-slide-karte .kp-slide-panel, .kp-buehne-top) .kp-page-head::before { background: #fff; }
.kp-style-praxis .kp-slide-plakat .kp-page-head::before { background: var(--kp-coral); }
.kp-style-praxis .kp-slide-plakat .kp-page-head .kp-accent { color: color-mix(in srgb, var(--kp-coral) 55%, white); }
.kp-style-praxis .kp-slide-mitte.kp-has-bg .kp-page-head { background: rgba(32, 34, 38, .8); padding: 14px 22px; margin-bottom: 10px; }
.kp-style-praxis .kp-slide-mitte.kp-has-bg .kp-page-head::before { content: none; }
.kp-style-praxis .kp-slide-mitte.kp-has-bg .kp-page-head :is(h1, .kp-eyebrow, .kp-accent) { color: #fff; }

/* Folien in allen Stilen (Prüfung 10.10.2026): Suchbild auf Bildschirmseiten auf die freie Höhe begrenzen – die Bühne
   schrumpft mit dem Bild, die Punkte in Prozent bleiben an ihrer Stelle; Kontraste der Folienbausteine in dunklen Stilen */
.kp-screen .kp-hotspots:not(.kp-hs-cover):not(.kp-framed) .kp-hs-stage { width: fit-content; max-width: 100%; margin-inline: auto; }
.kp-screen .kp-hotspots:not(.kp-hs-cover):not(.kp-framed) .kp-hs-zoom > img { width: auto; max-width: 100%; max-height: calc(var(--kp-screen-h, 100svh) - 230px); }
/* Schaubild als Zeichnung: eine SVG nur mit viewBox hat keine eigene Breite und schrumpfte in der fit-content-Bühne auf 0 px */
.kp-screen .kp-hotspots.kp-hs-drawing:not(.kp-hs-cover):not(.kp-framed) .kp-hs-stage { width: min(100%, calc((var(--kp-screen-h, 100svh) - 230px) * var(--kp-hs-ar, 2.4))); }
.kp-screen .kp-buehne-stage .kp-hotspots.kp-hs-drawing:not(.kp-hs-cover):not(.kp-framed) .kp-hs-stage { width: min(100%, calc((var(--kp-screen-h, 100svh) - 330px) * var(--kp-hs-ar, 2.4))); }
.kp-screen.kp-style-praxis .kp-main:not(.kp-split-main) .kp-hotspots.kp-hs-drawing:not(.kp-hs-cover):not(.kp-framed) .kp-hs-stage { width: min(100%, calc((var(--kp-screen-h, 100svh) - 420px) * var(--kp-hs-ar, 2.4))); }
.kp-screen .kp-hotspots.kp-hs-drawing.kp-hs-drawing.kp-hs-drawing.kp-hs-drawing:not(.kp-hs-cover):not(.kp-framed) .kp-hs-zoom > img { width: 100%; height: auto; max-height: none; }
.kp-screen .kp-buehne-stage .kp-hotspots:not(.kp-hs-cover):not(.kp-framed) .kp-hs-zoom > img { max-height: calc(var(--kp-screen-h, 100svh) - 330px); }
.kp-screen.kp-style-praxis .kp-main:not(.kp-split-main) .kp-hotspots:not(.kp-hs-cover):not(.kp-framed) .kp-hs-zoom > img { max-height: calc(var(--kp-screen-h, 100svh) - 420px); }
/* Lernkarte: die Bühne hat ihre Breite schon aus Höhe und Seitenverhältnis, das Bild füllt sie ganz (sonst stand der Kartenstand neben dem Bild) */
.kp-screen .kp-hotspots.kp-map.kp-map.kp-map:not(.kp-hs-cover):not(.kp-framed) .kp-hs-zoom > img { width: 100%; height: auto; max-height: none; }
.kp-sort-ablage .kp-sort-move button { color: var(--kp-text); background: var(--kp-surface); }
.kp-quiz:has(.kp-pfeil) > .kp-label .kp-badge { background: transparent; border: 1px solid currentColor; color: inherit; }
.kp-dark .kp-hs-count { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
.kp-style-nacht .kp-tabs.kp-tabs-lz > .kp-tabbar button.active { background: var(--kp-flow); color: var(--kp-ink); }
.kp-style-nacht .kp-slide-karte .kp-slide-panel { background: color-mix(in srgb, var(--kp-primary) 62%, #071225); }
.kp-style-nacht.kp-nav-dezent { --kp-nav-bg: #0c1a2f; --kp-nav-ink: #E9F1FB; }
/* Comic auf Folien: eine Signalfarbe nur für Knöpfe und Auswahl, Flächen grau oder fast schwarz, alle Fotos grau */
.kp-style-comic .kp-hero-auftrag { --kp-auftrag: #1A1A1C; }
.kp-style-comic .kp-slide-karte .kp-slide-panel, .kp-style-comic .kp-slide-buehne { background: #1A1A1C; }
.kp-style-comic .kp-slide-karte { background: linear-gradient(135deg, #E4E4E7, var(--kp-bg)); }
.kp-style-comic .kp-slide-kreis { background: linear-gradient(115deg, #DCDCE0 0%, #EBEBED 55%, var(--kp-bg) 78%); }
.kp-style-comic .kp-slide-kreis .kp-slide-panel > .kp-block:not(.kp-b-gate):not(.kp-b-sources):not([hidden]) { border-left-color: var(--kp-text); }
.kp-style-comic .kp-slide-welle .kp-slide-panel { background: var(--kp-surface); }
.kp-style-comic .kp-slide-welle:not(.kp-has-bg) { background: linear-gradient(135deg, #DCDCE0, var(--kp-bg)); }
.kp-style-comic .kp-slide-form::before { background: var(--kp-slidebg, none) var(--kp-bgpos, center) / cover no-repeat, #DCDCE0; }
.kp-style-comic .kp-slide.kp-has-bg:is(.kp-slide-mitte, .kp-slide-welle), .kp-style-comic .kp-buehne-stage { background-color: #8a8a8f; background-blend-mode: luminosity; }
.kp-style-comic :is(.kp-slide-karte, .kp-slide-form, .kp-slide-plakat).kp-has-bg::before, .kp-style-comic .kp-kreis-pic { filter: grayscale(1) contrast(1.05); }
.kp-style-comic :is(.kp-flip-img, .kp-lz-img, .kp-answer-img, .kp-hs-stage img, .kp-match-img) { filter: grayscale(1) contrast(1.05); }
/* Editorial auf Folien: die Initiale gehört zum langen Fließtext, nicht zu zwei Sätzen in einer Folienspalte */
.kp-style-editorial :is(.kp-split, .kp-slide) .kp-block-inner > .kp-text:first-child > p:first-of-type::first-letter { font-family: inherit; font-size: inherit; float: none; line-height: inherit; padding: 0; color: inherit; }
/* Ordner, helle Bühne, Strang und Selbsteinschätzung mit Profil in den Stilen mit eigenen Regeln */
.kp-style-comic .kp-slide-ordner:not(.kp-has-bg) { background: linear-gradient(135deg, #E4E4E7, var(--kp-bg)); }
.kp-style-comic .kp-ordner-sheet { border-width: 1px; }
.kp-style-comic :is(.kp-ordner-tab, .kp-ordner-sheet) { border-color: #6E6E76; border-radius: 2px; }
.kp-style-comic .kp-ordner-tab.current { border-color: var(--kp-accent); }
.kp-style-comic .kp-ordner-tab.current::after { background: #DCDCE0; }
.kp-style-comic .kp-ordner-sheet { box-shadow: -8px 10px 0 -1px #E4E4E7, -8px 10px 0 0 #6E6E76; }
.kp-style-comic .kp-buehne-ambient { background-color: #1A1A1C; }
