.kp-kf-face > svg.kp-ico, .kp-kf-face > .kp-ico { width: 26px; height: 26px; }
.kp-kf-bubble { position: relative; max-height: calc(100svh - var(--kp-navh, 0px) - var(--kp-footh, 0px) - var(--kp-headh, 0px) - 60px); overflow: auto; padding: 18px 20px 16px; background: var(--kp-surface); color: var(--kp-text); border: 1px solid var(--kp-line); border-radius: 18px 18px 4px 18px; box-shadow: 0 14px 40px rgba(0,0,0,.2); }
.kp-kf-bubble .kp-kf-q { font-size: 1.05em; margin: 0 26px 0 0; }
.kp-kf-bubble .kp-kf-opts { margin-top: 12px; gap: 8px; }
.kp-kf-bubble .kp-kf-opt { padding: 8px 14px; }
.kp-kf-x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--kp-muted); font: inherit; cursor: pointer; }
.kp-kf-x:hover, .kp-kf-x:focus-visible { background: color-mix(in srgb, var(--kp-text) 8%, transparent); color: var(--kp-text); }
.kp-kf-end { margin-top: 12px; text-align: right; }
.kp-kf-chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 999px; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.18); animation: kp-kf-pop .35s both; }
.kp-kf-chip .kp-ico { width: 18px; height: 18px; }
@media (max-width: 600px) { .kp-kf-dock { right: 10px; left: 10px; max-width: none; bottom: calc(var(--kp-navh, 0px) + var(--kp-footh, 0px) + 10px); } .kp-kf-face { width: 44px; height: 44px; } }
@media (prefers-reduced-motion: reduce) { .kp-kf-pop, .kp-kf-chip { animation: none; } }
.kp-kf-opts { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 0; }
.kp-kf-opt { font: inherit; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--kp-line); background: var(--kp-surface); color: var(--kp-text); cursor: pointer; }
.kp-kf-opt:hover, .kp-kf-opt:focus-visible { border-color: var(--kp-accent); }
.kp-kf-opt.on { border-color: var(--kp-accent); background: color-mix(in srgb, var(--kp-accent) 14%, var(--kp-surface)); font-weight: 700; }
.kp-kf-skala .kp-kf-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.kp-kf-skala .kp-kf-opt { border-radius: calc(var(--kp-radius) * .6); text-align: center; }
.kp-kf-reply { margin: 16px 0 0; padding: 14px 16px; border-radius: calc(var(--kp-radius) * .6); background: var(--kp-surface); border: 1px solid var(--kp-line); animation: kp-fade .3s both; }
.kp-kf-others { margin: 16px 0 0; padding: 14px 16px; border-radius: calc(var(--kp-radius) * .6); background: var(--kp-surface); border: 1px solid var(--kp-line); color: var(--kp-text); animation: kp-fade .3s both; }

.kp-kf-bar { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--kp-text) 12%, transparent); overflow: hidden; }
.kp-kf-bar i { display: block; height: 100%; width: var(--w); border-radius: inherit; background: color-mix(in srgb, var(--kp-text) 45%, transparent); }
.kp-kf-mine .kp-kf-bar i { background: var(--kp-accent); }

@media (max-width: 600px) { .kp-kf-others li { grid-template-columns: minmax(0, 1fr) 3.2em; } .kp-kf-bar { grid-column: 1 / -1; grid-row: 2; } }
/* Antwort, Fakt und Erzählfeld von „Kurz gefragt“ sind helle Karten: auf dunklem Grund (kp-on-dark) erben sie sonst Weiß (Führen mit KI 24.10.2026) */
html:not(#kp-frei) .kp-on-dark :is(.kp-kf-reply, .kp-kf-fact, .kp-kf-others), html:not(#kp-frei) .kp-on-dark :is(.kp-kf-reply, .kp-kf-fact, .kp-kf-others) :is(p, li, strong, b, em, span, .kp-text) { color: var(--kp-text); }
.kp-kf-reply:focus { outline: none; } .kp-kf-reply:focus-visible { outline: 2px solid var(--kp-accent); }
.kp-kf-reply .kp-text > :first-child { margin-top: 0; } .kp-kf-reply .kp-text > :last-child { margin-bottom: 0; }

/* ---------- Über dich, eigenes Ziel, Lernbuch ---------- */
.kp-ud-roles { border: 0; padding: 0; margin: 16px 0; }
/* Lagen als Wahlknöpfe nebeneinander: kurze Antworten, die Seite bleibt ein Bildschirm */
.kp-ud-roles .kp-answers { display: flex; flex-wrap: wrap; gap: 8px; }
.kp-ud-roles .kp-answer { flex: 0 1 auto; margin: 0; }
/* Willkommenskarte zum Lernbuch */
.kp-lbw { position: fixed; inset: 0; z-index: 43; display: grid; place-items: center; padding: 20px; background: rgba(10,14,22,.5); backdrop-filter: blur(4px); animation: kp-fade .25s both; transition: opacity .25s; }
.kp-lbw.out { opacity: 0; pointer-events: none; }
.kp-lbw-box { position: relative; overflow: hidden; background: var(--kp-surface); color: var(--kp-text); border-radius: 22px; padding: 30px 32px 24px 32px; max-width: 520px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,.38); animation: kp-lbw-in .55s cubic-bezier(.2,.8,.2,1) both; }
.kp-lbw-box::before { content: ''; position: absolute; top: -90px; right: -90px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--kp-accent) 42%, transparent), transparent 70%); pointer-events: none; }
.kp-lbw-art { width: 104px; height: 104px; margin: -6px 0 6px; }
.kp-lbw-art svg { width: 100%; height: 100%; display: block; overflow: visible; }
.kp-lbw-cover { fill: url(#kp-lbw-g); }
.kp-lbw-page { fill: var(--kp-bg, #fff); stroke: var(--kp-line); stroke-width: 1.5; }
.kp-lbw-lines path { stroke: var(--kp-line); stroke-width: 3; stroke-linecap: round; fill: none; stroke-dasharray: 40; stroke-dashoffset: 40; animation: kp-lbw-line .6s ease-out forwards; }
.kp-lbw-lines path:nth-child(2) { animation-delay: .25s; } .kp-lbw-lines path:nth-child(3) { animation-delay: .5s; }
.kp-lbw-rings circle { fill: var(--kp-surface); stroke: var(--kp-primary); stroke-width: 2.5; }
.kp-lbw-pen path { fill: var(--kp-accent); } .kp-lbw-tip { fill: var(--kp-text) !important; opacity: .8; }
.kp-lbw-pen { transform-origin: 70px 90px; animation: kp-lbw-pen .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: .2s; }
.kp-lbw-eyebrow { margin: 0; }
.kp-lbw-box h2 { margin: 2px 0 8px; font-size: 30px; line-height: 1.15; font-family: var(--kp-font-head, var(--kp-font)); color: var(--kp-title, var(--kp-primary)); }
.kp-lbw-lead { margin: 0 0 16px; font-size: 1.05em; }
.kp-lbw-list { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
.kp-lbw-list li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--kp-primary) 6%, var(--kp-surface)); animation: kp-lbw-row .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.25s + var(--kp-i, 0) * .1s); }
.kp-lbw-list strong { display: block; margin-bottom: 2px; } .kp-lbw-list li > span:last-child > span { font-size: .95em; opacity: .85; }
.kp-lbw-ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--kp-accent); color: var(--kp-on-accent, #fff); }
.kp-lbw-ico svg { width: 22px; height: 22px; }
.kp-lbw-actions { display: flex; gap: 10px; flex-wrap: wrap; } .kp-lbw-actions .kp-btn { width: auto; }
.kp-lbw-where { margin: 14px 0 0; font-size: .9em; opacity: .8; display: flex; align-items: center; gap: 6px; }
.kp-lbw-where svg { width: 16px; height: 16px; }
@keyframes kp-lbw-in { from { opacity: 0; transform: translateY(24px) scale(.94); filter: blur(6px); } }
@keyframes kp-lbw-row { from { opacity: 0; transform: translateX(-10px); } }
@keyframes kp-lbw-line { to { stroke-dashoffset: 0; } }
@keyframes kp-lbw-pen { from { transform: translate(18px, -18px) rotate(8deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .kp-lbw, .kp-lbw-box, .kp-lbw-list li, .kp-lbw-pen, .kp-lbw-lines path { animation: none; stroke-dashoffset: 0; } }
@media (max-width: 520px) { .kp-lbw-box { padding: 22px 18px 18px; } .kp-lbw-box h2 { font-size: 24px; } }
.kp-notes-page { margin: 0 0 6px; }
.kp-ud-guide { display: flex; align-items: center; gap: 10px; }
.kp-ud-guide small { display: block; opacity: .75; font-size: .85em; }
.kp-ud-face { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; background: var(--kp-surface); display: grid; place-items: center; }
.kp-ud-face img, .kp-ud-face svg { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Markieren im Text: Sätze als Knöpfe im Fließtext, markiert mit Textmarker in der Akzentfarbe */
.kp-mk-text { line-height: 1.95; }
.kp-mk-s { all: unset; cursor: pointer; padding: 2px 4px; margin: 0 1px; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-bottom: 2px solid var(--kp-line); transition: background .15s, border-color .15s; }
.kp-mk-s:hover { background: color-mix(in srgb, var(--kp-accent) 12%, transparent); }
.kp-mk-s.is-on { background: color-mix(in srgb, var(--kp-accent) 30%, transparent); border-bottom-color: var(--kp-accent); }
.kp-mk-s:focus-visible { outline: 2px solid var(--kp-accent); outline-offset: 2px; }
.kp-mk-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.kp-mk-count { font-weight: 600; }
.kp-mk-hint { margin: 8px 0 0; }
.kp-mk-after { margin-top: 12px; outline: none; }
/* Merkkarte und Kartenstapel */
.kp-mkc-card { position: relative; perspective: 1200px; max-width: 720px; }
.kp-mkc-foot { max-width: 720px; }
/* Auf einer Bildschirmseite steht die Merkkarte mittig, sonst bleibt die rechte Hälfte der Folie leer */
.kp-screen .kp-b-merkkarte > .kp-block-inner { max-width: 720px; margin-left: auto; margin-right: auto; }
.kp-mkc-face { min-height: 168px; padding: 24px 28px; border-radius: calc(var(--kp-radius, 12px) + 4px); background: var(--kp-surface, #fff); border: 1px solid var(--kp-line); box-shadow: 0 10px 28px rgba(15, 25, 45, .1); display: flex; flex-direction: column; justify-content: center; gap: 8px; outline: none; }
.kp-mkc-face:focus-visible { outline: 2px solid var(--kp-accent); outline-offset: 3px; }
.kp-mkc-front { background: color-mix(in srgb, var(--kp-primary) 8%, var(--kp-surface, #fff)); }
.kp-mkc-tag { font-size: .78em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--kp-accent-ink, var(--kp-primary)) 72%, var(--kp-text)); }
.kp-mkc-q { font-size: 1.3em; font-weight: 600; line-height: 1.35; margin: 0; color: var(--kp-title, var(--kp-primary)); }
.kp-mkc-small { margin: 0; font-size: .92em; color: var(--kp-muted, #5b6472); }
.kp-mkc.is-open .kp-mkc-back { animation: kp-mkc-turn .5s var(--kp-ease-out, ease-out) both; transform-origin: 50% 50%; }
@keyframes kp-mkc-turn { from { transform: rotateY(80deg); opacity: .2; } to { transform: none; opacity: 1; } }
.kp-mkc-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.kp-deck-bar { max-width: 720px; }
.kp-mkc-stack { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.kp-mkc-stack svg { width: 18px; height: 18px; }
.kp-deck-start { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; margin-top: 12px; }
.kp-deck-fan { position: relative; width: 150px; height: 110px; flex: none; }
.kp-deck-fan-card { position: absolute; left: 30px; top: 6px; width: 90px; height: 100px; border-radius: 10px; background: var(--kp-surface, #fff); border: 1px solid var(--kp-line); box-shadow: 0 6px 16px rgba(15, 25, 45, .12); transform: rotate(calc((var(--i) - (var(--n) - 1) / 2) * 9deg)) translateX(calc((var(--i) - (var(--n) - 1) / 2) * 6px)); transform-origin: 50% 120%; }
.kp-deck-fan-card:last-child { background: color-mix(in srgb, var(--kp-primary) 12%, var(--kp-surface, #fff)); }
.kp-deck-count { margin: 0 0 12px; font-weight: 600; }
.kp-deck-stand { margin: 0 0 6px; font-weight: 600; }
.kp-deck-bar { height: 6px; border-radius: 3px; background: var(--kp-line); margin-bottom: 16px; overflow: hidden; }
.kp-deck-bar i { display: block; height: 100%; width: var(--w); background: var(--kp-accent); transition: width .3s; }
.kp-deck-actions { justify-content: flex-start; }
.kp-deck-done { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; outline: none; }
.kp-deck-score { margin: 0; font-size: 2.4em; line-height: 1; color: var(--kp-title, var(--kp-primary)); }
.kp-deck-retry { list-style: none; padding: 0; margin: 8px 0 12px; display: grid; gap: 8px; }
.kp-deck-retry li { padding: 12px 16px; border: 1px solid var(--kp-line); border-radius: var(--kp-radius, 12px); background: var(--kp-surface, #fff); }
.kp-deck-retry .kp-text p { margin: 4px 0 0; }
.kp-deck-seen { margin-top: 20px; }
.kp-deck-seen-list { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.kp-deck-seen-list li { position: relative; }
.kp-deck-seen-list li.is-known { border-color: color-mix(in srgb, var(--kp-accent) 45%, var(--kp-line)); }
.kp-deck-mark { display: block; font-size: .78em; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--kp-muted, #5b6472); margin-bottom: 4px; }
.kp-deck-seen-list li.is-known .kp-deck-mark { color: color-mix(in srgb, var(--kp-accent) 60%, var(--kp-text)); }
/* Formular, das sich füllt */
.kp-form-sheet { position: relative; margin-top: 12px; padding: 22px 24px 20px; background: var(--kp-surface, #fff); color: var(--kp-text); border: 1px solid var(--kp-line); border-radius: 4px; box-shadow: 0 1px 0 var(--kp-line), 0 14px 30px rgba(15, 25, 45, .1); }
.kp-form-doc { width: 100%; border-collapse: collapse; }
.kp-form-doc caption { text-align: left; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 3px solid var(--kp-primary); }
.kp-form-title { display: block; font-size: 1.15em; font-weight: 700; color: var(--kp-title, var(--kp-primary)); }
.kp-form-meta { display: block; font-size: .85em; color: var(--kp-muted, #5b6472); margin-top: 2px; }
.kp-form-doc th, .kp-form-doc td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--kp-line); }
.kp-form-doc th { width: 28%; font-weight: 600; }
.kp-form-doc td .kp-text p { margin: 0 0 4px; }
.kp-form-key { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; cursor: pointer; padding: 6px 10px; margin: -6px -10px; border-radius: 6px; color: var(--kp-title, var(--kp-primary)); font-weight: 600; }
.kp-form-key:hover { background: color-mix(in srgb, var(--kp-accent) 12%, transparent); }
.kp-form-key:focus-visible { outline: 2px solid var(--kp-accent); outline-offset: 2px; }
.kp-form-plus { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-weight: 700; line-height: 1; flex: none; line-height: 22px; font-size: 16px; }
.kp-form-empty { display: inline-block; color: var(--kp-muted, #5b6472); font-style: italic; border-bottom: 1px dotted var(--kp-line); }
.kp-form-doc tr.is-last { background: color-mix(in srgb, var(--kp-accent) 8%, transparent); }
.kp-form-doc tr.is-filled td { animation: kp-form-fill .4s ease-out both; }
@keyframes kp-form-fill { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.kp-form-stamp { position: absolute; right: 18px; bottom: 14px; padding: 4px 12px; border: 3px solid var(--kp-accent); border-radius: 6px; color: var(--kp-accent-ink, var(--kp-accent)); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; transform: rotate(-8deg); opacity: .85; pointer-events: none; }
.kp-form-status { margin: 10px 0 0; font-weight: 600; }
.kp-form-why { display: flex; gap: 14px; align-items: flex-start; margin-top: 12px; padding: 14px 18px; border-radius: var(--kp-radius, 12px); background: color-mix(in srgb, var(--kp-primary) 7%, var(--kp-surface, #fff)); border: 1px solid var(--kp-line); }
.kp-form-face { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex: none; background: var(--kp-surface, #fff); }
.kp-form-face img, .kp-form-face svg { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
.kp-form-why .kp-text p:last-child { margin-bottom: 0; }
.kp-form-after { margin-top: 12px; }
@media (max-width: 640px) {
  .kp-form-sheet { padding: 16px; }
  .kp-form-doc, .kp-form-doc tbody, .kp-form-doc tr, .kp-form-doc th, .kp-form-doc td { display: block; width: auto; }
  .kp-form-doc th { padding-bottom: 2px; border-bottom: 0; }
  .kp-form-stamp { position: static; display: inline-block; margin-top: 10px; }
}
@media (prefers-reduced-motion: reduce) { .kp-mkc.is-open .kp-mkc-back, .kp-form-doc tr.is-filled td { animation: none; } }
/* Dein Weg auf der Ergebnisseite */
.kp-weg { margin: 24px 0; padding: 20px 22px; background: var(--kp-surface); border-radius: var(--kp-radius); box-shadow: var(--kp-shadow); text-align: left; }
.kp-weg h2 { margin: 0 0 12px; font-size: 1.15em; color: var(--kp-title, var(--kp-primary)); }
.kp-weg-row { padding: 10px 0; border-top: 1px solid var(--kp-line); }
.kp-weg-row p, .kp-weg-row ul { margin: 4px 0 0; }
.kp-weg-list, .kp-weg-words { list-style: none; padding: 0; }
.kp-weg-list li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 0; }
.kp-weg-list em, .kp-weg-cmp em { font-style: normal; font-weight: 600; }
.kp-weg-up { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-weg-words li { padding: 4px 0; } .kp-weg-words q { quotes: '„' '“'; }
.kp-ud-q { display: block; font-weight: 700; margin: 0 0 8px; }
.kp-ud-field { display: block; margin: 0 0 16px; }
.kp-ud-field textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid var(--kp-line); border-radius: calc(var(--kp-radius) * .6); background: var(--kp-surface); color: var(--kp-text); resize: vertical; }
.kp-ud-missing { margin: 0 0 12px; color: var(--kp-accent-ink, var(--kp-accent)); font-weight: 600; }
.kp-ud-note { margin: 10px 0 0; font-size: 13px; color: var(--kp-muted); }
.kp-ud-card { display: grid; gap: 12px; margin: 12px 0 16px; padding: 16px 18px; border: 1px solid var(--kp-line); border-radius: var(--kp-radius); background: var(--kp-surface); }
.kp-ud-row p { margin: 2px 0 0; line-height: 1.5; white-space: pre-wrap; }
.kp-goal-card { margin: 0 0 16px; padding: 12px 14px; border-radius: calc(var(--kp-radius) * .6); background: color-mix(in srgb, var(--kp-accent) 12%, var(--kp-surface)); border: 1px solid color-mix(in srgb, var(--kp-accent) 35%, var(--kp-surface)); color: var(--kp-text); }
.kp-goal-card p { margin: 2px 0 0; font-weight: 600; line-height: 1.45; }
.kp-goal-card .kp-label { color: var(--kp-text); opacity: .75; }
.kp-ml-side .kp-goal-side { margin: 14px 0 0; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: inherit; font-size: 14px; }
.kp-ml-side .kp-goal-side .kp-label { color: inherit; }
.kp-ms-box .kp-goal-card, .kp-resume-box .kp-goal-card, .kp-goal-back .kp-goal-card { text-align: left; }
.kp-ms-goalq, .kp-goal-q { margin: 0 0 14px; font-weight: 600; }
.kp-goal-back { max-width: 560px; margin: 20px auto 6px; }
.kp-resume-own { margin: 0 0 14px; } .kp-resume-own q { font-style: italic; }
.kp-lb-entry { padding: 10px 0; border-bottom: 1px solid var(--kp-line); }
.kp-lb-q { display: block; font-size: 13px; font-weight: 700; color: var(--kp-muted); }
.kp-lb-entry p { margin: 4px 0; line-height: 1.5; }
.kp-lb-go { font: inherit; font-size: 13px; border: 0; background: none; padding: 0; color: var(--kp-accent-ink, var(--kp-accent)); cursor: pointer; text-decoration: underline; }
.kp-lb-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
/* Rückbezug auf eigene Worte: leicht getönt, damit die Person sich wiedererkennt */
.kp-echo-own { background: color-mix(in srgb, var(--kp-accent) 14%, transparent); border-radius: 4px; padding: 0 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.kp-echo[data-empty] { display: none; }
/* Nur am Handy oder nur am großen Bildschirm (design.device, „Direkt bearbeiten“ → Mehr → Sichtbar) */
@media (max-width: 600px) { .kp-block.kp-dev-gross { display: none !important; } }
@media (min-width: 601px) { .kp-block.kp-dev-handy { display: none !important; } }
/* ---------- Matrix ---------- */
.kp-mx-split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, 1fr); gap: 20px; align-items: start; }
.kp-mx-wrap { position: relative; width: min(100%, calc(min(420px, 52vh) * 4 / 3 + 26px)); padding: 0 0 26px 26px; box-sizing: border-box; }
.kp-mx-field { position: relative; aspect-ratio: 4 / 3; width: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; border: 1px solid var(--kp-line); border-radius: var(--kp-radius); background: var(--kp-surface); overflow: hidden; }
.kp-mx-field.is-armed { cursor: crosshair; }
.kp-mx-quad { display: flex; align-items: flex-start; justify-content: flex-start; padding: 10px 12px; font-size: 13px; font-weight: 700; color: var(--kp-muted); pointer-events: none; }
.kp-mx-quad-0, .kp-mx-quad-2 { border-right: 1px dashed var(--kp-line); }
.kp-mx-quad-0, .kp-mx-quad-1 { border-bottom: 1px dashed var(--kp-line); }
.kp-mx-quad-1 { justify-content: flex-end; text-align: right; }
.kp-mx-quad-2 { align-items: flex-end; }
.kp-mx-quad-3 { align-items: flex-end; justify-content: flex-end; text-align: right; }
.kp-mx-ax { position: absolute; font-size: 12px; font-weight: 600; color: var(--kp-muted); }
.kp-mx-xl { left: 26px; bottom: 4px; } .kp-mx-xh { right: 0; bottom: 4px; }
.kp-mx-yh, .kp-mx-yl { left: 4px; writing-mode: vertical-rl; transform: rotate(180deg); }
.kp-mx-yh { top: 0; } .kp-mx-yl { bottom: 26px; }
.kp-mx-dot { position: absolute; display: inline-grid; place-items: center; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; font-size: 12px; font-weight: 700; pointer-events: none; z-index: 2; }
.kp-mx-mine { background: var(--kp-text); color: var(--kp-surface); }
.kp-mx-exp { background: var(--kp-surface); color: var(--kp-accent-ink, var(--kp-accent)); border: 2px solid var(--kp-accent); }
.kp-mx-legend .kp-mx-dot { position: static; margin: 0 4px 0 0; }
.kp-mx-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.kp-mx-lines line { stroke: var(--kp-accent); stroke-width: .5; stroke-dasharray: 1.5 1.5; vector-effect: non-scaling-stroke; }
.kp-mx-drop { position: absolute; z-index: 3; width: 50%; height: 50%; opacity: 0; font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--kp-text); cursor: crosshair; pointer-events: none; } /* nur für die Tastatur: die Maus legt frei ab */
.kp-mx-dot.kp-mx-move { pointer-events: auto; z-index: 4; border: 0; padding: 0; font: inherit; font-size: 12px; font-weight: 700; cursor: grab; touch-action: none; }
.kp-mx-dot.kp-mx-move:active { cursor: grabbing; }
.kp-mx-dot.kp-mx-move.is-sel { box-shadow: 0 0 0 3px var(--kp-surface), 0 0 0 5px var(--kp-accent); }
.kp-mx-dot.kp-mx-move:focus-visible { outline: 2px solid var(--kp-accent); outline-offset: 3px; }
.kp-mx-drop:focus-visible { opacity: 1; background: color-mix(in srgb, var(--kp-accent) 14%, transparent); outline: 2px solid var(--kp-accent); outline-offset: -4px; }
.kp-mx-drop-0 { left: 0; top: 0; } .kp-mx-drop-1 { right: 0; top: 0; } .kp-mx-drop-2 { left: 0; bottom: 0; } .kp-mx-drop-3 { right: 0; bottom: 0; }
.kp-mx-side { display: grid; gap: 10px; }
.kp-mx-eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--kp-muted); }
.kp-mx-help { margin: 0; font-size: 15px; }
.kp-mx-chips { display: grid; gap: 8px; }
.kp-mx-chip { display: flex; align-items: center; gap: 10px; font: inherit; text-align: left; padding: 9px 12px; border: 1px solid var(--kp-line); border-radius: 10px; background: var(--kp-surface); color: var(--kp-text); cursor: pointer; }
.kp-mx-chip span { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--kp-line); font-size: 12px; font-weight: 700; }
.kp-mx-chip.is-placed span { background: var(--kp-text); color: var(--kp-surface); }
.kp-mx-chip.is-sel { border-color: var(--kp-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--kp-accent) 35%, transparent); }
.kp-mx-list { margin: 0; padding-left: 1.2em; display: grid; gap: 10px; }
.kp-mx-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.kp-mx-tag.ok { background: color-mix(in srgb, var(--kp-ok) 18%, var(--kp-surface)); }

/* ---------- Bereichsschätzung ---------- */

/* ---------- Umschreiben: Vorher, deine Fassung, Musterfassung ---------- */

.kp-sortcats { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 22px 24px; box-shadow: var(--kp-shadow); }

.kp-sort-pool ul, .kp-sort-cat ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
.kp-sort-cat ul { flex-direction: column; }
.kp-sort-item { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--kp-line); border-radius: 10px; padding: 10px 12px; cursor: grab; font-size: 15px; }
.kp-sort-item.kp-dragging { opacity: .4; }

.kp-sort-item.kp-wrong { border-color: var(--kp-no); background: #fbeceb; }

.kp-sort-move { display: flex; gap: 4px; margin-left: auto; }
.kp-sort-move button { min-width: 28px; min-height: 28px; border: 1px solid var(--kp-line); background: var(--kp-bg); border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; color: var(--kp-primary); }
.kp-sort-move button:disabled { opacity: .35; cursor: default; }
.kp-sort-cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kp-sort-cat { border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 12px; background: var(--kp-bg); }

.kp-process { background: var(--kp-surface); border-radius: var(--kp-radius); padding: 22px 24px; box-shadow: var(--kp-shadow); }
.kp-proc-nav { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; }
.kp-proc-nav button { display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; background: var(--kp-bg); border: 1px solid var(--kp-line); border-radius: 999px; padding: 7px 14px; cursor: pointer; color: var(--kp-text); min-height: 32px; }
.kp-proc-nav button span { width: 22px; height: 22px; border-radius: 50%; background: var(--kp-line); color: var(--kp-text); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.kp-proc-nav button.current { border-color: var(--kp-primary); background: color-mix(in srgb, var(--kp-primary) 10%, white); font-weight: 600; }
.kp-proc-nav button.current span, .kp-proc-nav button.done span { background: var(--kp-primary); color: #fff; }
.kp-proc-body { display: grid; grid-template-columns: 1fr; gap: 18px; }
.kp-proc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }

.kp-proc-item .kp-proc-media { grid-column: 2; }
.kp-proc-num { width: 32px; height: 32px; border-radius: 50%; background: var(--kp-primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.kp-proc-item .kp-proc-title { margin: 4px 0 4px; }
.kp-proc-item .kp-text p { margin: 0; }
.kp-proc-new { animation: kp-fade .45s var(--kp-ease-out, ease-out) both; }
html .kp-process.kp-proc-strang { background: none; box-shadow: none; padding: 0; border: 0; }
.kp-strang { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 34px; max-width: 920px; }
.kp-strang-item { position: relative; background: var(--kp-surface); color: var(--kp-text); border: 1px solid var(--kp-line); border-left: 4px solid var(--kp-accent); border-radius: 4px; box-shadow: var(--kp-shadow); overflow: visible; }
.kp-strang-item + .kp-strang-item::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 2px; height: 34px; margin-left: -1px; background: color-mix(in srgb, var(--kp-text) 35%, transparent); }

.kp-strang-body .kp-proc-title { margin: 0 0 10px; font-size: 1.1em; color: var(--kp-title, var(--kp-primary)); }
.kp-strang-go { justify-content: center; margin-top: 22px; }
.kp-screen .kp-strang-media img { max-height: min(260px, 24vh); }
.kp-proc-count { opacity: .75; font-weight: 400; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { .kp-proc-new { animation: none; } }
.kp-proc-body:has(.kp-proc-media) { grid-template-columns: 1fr 1fr; align-items: center; }
.kp-proc-media img { width: 100%; border-radius: var(--kp-radius); display: block; object-fit: cover; }
.kp-proc-title { font-size: 20px; margin: 0 0 8px; font-family: var(--kp-font-head, var(--kp-font)); }
.kp-gate { text-align: center; padding: 22px; border-top: 1px solid var(--kp-line); border-bottom: 1px solid var(--kp-line); }

.kp-block.kp-hidden { display: none; }
.kp-files ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

.kp-files em { font-style: normal; color: var(--kp-muted); font-size: 14px; }
.kp-file-dl { margin-left: auto; color: var(--kp-primary); font-weight: 600; font-size: 14px; }

/* ---------- Karten in Farbe, Einschub, nummerierte Agenda ---------- */
.kp-card-primary { background: var(--kp-primary) !important; color: #fff; }
.kp-card-primary .kp-hero-title, .kp-card-primary .kp-guide-name, .kp-card-primary .kp-text, .kp-card-primary .kp-hero-meta { color: #fff; }
.kp-card-primary .kp-eyebrow, .kp-card-primary .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
.kp-card-primary .kp-ico-lg, .kp-card-primary .kp-hero-meta .kp-ico { color: #fff; }
.kp-card-dark { background: #10161f !important; color: #fff; }
.kp-card-dark .kp-hero-title, .kp-card-dark .kp-guide-name, .kp-card-dark .kp-text, .kp-card-dark .kp-hero-meta, .kp-card-dark .kp-ico-lg { color: #fff; }
.kp-card-dark .kp-eyebrow, .kp-card-dark .kp-accent { color: color-mix(in srgb, var(--kp-accent) 55%, white); }
.kp-card-glass { background: rgba(255,255,255,.82) !important; backdrop-filter: blur(10px); }
/* Helle Karte (weiß oder Glas) auf dunklem Abschnitt: die Schrift bleibt dunkel, sonst steht Weiß auf Weiß (Sichtpruefung) */
.kp-on-dark :is(.kp-card-white, .kp-card-glass), .kp-on-dark :is(.kp-card-white, .kp-card-glass) :is(.kp-text, .kp-hero-title, .kp-guide-name, .kp-hero-meta, .kp-label, h1, h2, h3, .kp-callout) { color: var(--kp-text); }
.kp-on-dark :is(.kp-card-white, .kp-card-glass) .kp-eyebrow, .kp-on-dark :is(.kp-card-white, .kp-card-glass) .kp-accent { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-on-dark :is(.kp-card-white, .kp-card-glass) .kp-text a { color: var(--kp-accent-ink, var(--kp-primary)); }
.kp-card-glassdark { background: rgba(14,20,30,.62) !important; backdrop-filter: blur(10px); color: #fff; }
.kp-card-glassdark .kp-hero-title, .kp-card-glassdark .kp-guide-name, .kp-card-glassdark .kp-text, .kp-card-glassdark .kp-hero-meta, .kp-card-glassdark .kp-ico-lg { color: #fff; }
.kp-card-glassdark .kp-eyebrow, .kp-card-glassdark .kp-accent { color: color-mix(in srgb, var(--kp-accent) 55%, white); }
.kp-callout { display: flex; gap: 12px; align-items: flex-start; margin-top: 18px; padding: 14px 18px; border-radius: calc(var(--kp-radius) + 4px); background: color-mix(in srgb, var(--kp-primary) 10%, white); font-size: 16px; }
.kp-callout .kp-ico { flex: none; margin-top: 3px; color: var(--kp-primary); }
.kp-card-primary .kp-callout, .kp-card-dark .kp-callout, .kp-card-glassdark .kp-callout { background: rgba(255,255,255,.16); }
/* Dunkler Modus: der Einschub mischt die Hauptfarbe mit der Kartenfläche statt mit Weiß, sonst stand helle Schrift auf fast Weiß */
.kp-dark .kp-callout { background: color-mix(in srgb, var(--kp-primary) 18%, var(--kp-surface)); color: var(--kp-text); }
.kp-card-primary .kp-callout .kp-ico, .kp-card-dark .kp-callout .kp-ico, .kp-card-glassdark .kp-callout .kp-ico { color: #fff; }
.kp-agenda-num li .kp-num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--kp-primary) 12%, white); color: var(--kp-primary); }

/* ---------- Menschen: Team, Video-Statements, Videoszene ---------- */
.kp-person-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.kp-person { perspective: 1200px; }
.kp-person-inner { position: relative; transform-style: preserve-3d; transition: transform .5s; }
.kp-person-flip { cursor: pointer; }
.kp-person-flip:hover .kp-person-inner, .kp-person.flipped .kp-person-inner, .kp-person-flip:focus-visible .kp-person-inner { transform: rotateY(180deg); }
.kp-person-front, .kp-person-back { backface-visibility: hidden; background: var(--kp-surface); border-radius: var(--kp-radius); overflow: hidden; box-shadow: var(--kp-shadow); }
.kp-person-back { position: absolute; inset: 0; transform: rotateY(180deg); padding: 20px 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; font-size: 15px; overflow: auto; }
.kp-person-media { aspect-ratio: 4 / 5; background: #eef2f6; }
.kp-person-media img, .kp-person-media svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.kp-person-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; font-family: var(--kp-font-head, var(--kp-font)); font-weight: 600; }
.kp-person-flipicon { color: var(--kp-muted); flex: none; }
/* Kapitelzähler am Kapitelanfang (settings.chapterCounter): Ring rechts neben dem Titel, füllt sich von Kapitel zu Kapitel */
.kp-page-head.kp-has-chring { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: clamp(20px, 4vw, 56px); align-items: center; }
.kp-page-head.kp-has-chring > * { grid-column: 1; }
.kp-page-head.kp-has-chring > .kp-chring { grid-column: 2; grid-row: 1 / span 6; }
.kp-chring { position: relative; width: clamp(92px, 11vw, 136px); aspect-ratio: 1; }
.kp-chring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.kp-chring circle { fill: none; stroke-width: 10; }
.kp-chring-bg { stroke: color-mix(in srgb, var(--kp-text) 14%, transparent); }
.kp-chring-fill { stroke: var(--kp-accent); stroke-linecap: round; stroke-dasharray: var(--u); stroke-dashoffset: var(--o); animation: kp-chring-in 1.1s var(--kp-ease-out, ease-out) both .2s; }
@keyframes kp-chring-in { from { stroke-dashoffset: var(--u); } }
.kp-chring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: .12em; font-family: var(--kp-font-head, var(--kp-font)); font-weight: 700; font-size: clamp(22px, 2.6vw, 32px); color: var(--kp-title, var(--kp-text)); font-variant-numeric: tabular-nums; }
.kp-chring-num small { font-size: .8em; font-weight: 400; color: var(--kp-muted); }
.kp-on-dark .kp-chring-num, .kp-page-head.kp-on-dark .kp-chring-num { color: inherit; }
.kp-style-comic .kp-chring-fill { stroke-linecap: butt; }
.kp-style-nacht .kp-chring-num { color: var(--kp-text); }
@media (max-width: 600px) { .kp-chring { width: 72px; } .kp-chring circle { stroke-width: 12; } .kp-chring-num { font-size: 20px; } }
@media (prefers-reduced-motion: reduce) { .kp-chring-fill { animation: none; } }
/* Team zum Aufklappen (team.look 'aufklappen'): Foto breit ohne Karte, Name mit rundem Plus darunter */
.kp-team-open .kp-person-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px clamp(24px, 4vw, 56px); }
/* Karte wie in Rise (Vorbilder „Generationenvielfalt“, „Arbeitsschutz für alle“): Foto oben, weiße Leiste mit Name links und „+“ rechts */
.kp-person-open { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); box-shadow: var(--kp-shadow, 0 8px 24px rgba(16, 18, 24, .08)); overflow: hidden; }
.kp-team-open .kp-person-media { aspect-ratio: 3 / 2; border-radius: 0; overflow: hidden; }
.kp-person-open .kp-person-more > summary, .kp-person-open .kp-person-cap { justify-content: space-between; text-align: left; margin: 0; padding: 14px 16px; color: var(--kp-text); border-radius: 0; }
.kp-person-open .kp-person-more > .kp-text { margin: 0 16px 16px; }
/* Auf der Bühne einer geteilten Folie stehen die Personen nebeneinander (bis drei), das Foto etwas höher als breit */
.kp-split-stage > .kp-b-team .kp-team-open .kp-person-grid { grid-template-columns: repeat(min(var(--n, 2), 3), minmax(0, 1fr)); gap: 24px; }
.kp-split-stage > .kp-b-team .kp-team-open .kp-person-media { aspect-ratio: 5 / 6; }
@media (max-width: 600px) { .kp-split-stage > .kp-b-team .kp-team-open .kp-person-grid { grid-template-columns: minmax(0, 1fr); } .kp-split-stage > .kp-b-team .kp-team-open .kp-person-media { aspect-ratio: 3 / 2; } }
/* Team als Karussell (Vorbild Rise): aktive Karte mittig, Nachbarn angeschnitten und abgedunkelt, runde Pfeile am Rand.
   --tc-w gilt zweimal: als Kartenbreite (Prozent der Spur) und in der Verschiebung (Prozent der Spur), deshalb passen beide zusammen.
   Die Verschiebung steht ausmultipliziert: Chromium rechnet --at * (min(…) + 24px) falsch (436 statt 484 px je Schritt) */
.kp-team-car { --tc-w: min(540px, 68%); --tc-gap: 24px; }
.kp-team-car .kp-sec-head { text-align: center; max-width: 820px; margin: 0 auto 20px; }
.kp-team-car .kp-sec-head .kp-sec-title { max-width: none; }
.kp-tc-view { position: relative; overflow: hidden; padding: 10px 0 14px; }
.kp-tc-track { display: flex; gap: var(--tc-gap); width: 100%; transform: translateX(calc(50% - var(--tc-w) / 2 - var(--at, 0) * var(--tc-w) - var(--at, 0) * var(--tc-gap))); transition: transform .5s var(--kp-ease-out, ease); }
.kp-tc-card { flex: 0 0 var(--tc-w); min-width: 0; background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); box-shadow: var(--kp-shadow, 0 10px 30px rgba(16, 18, 24, .1)); overflow: hidden; opacity: .5; transform: scale(.94); transition: opacity .4s, transform .5s var(--kp-ease-out, ease); cursor: pointer; }
.kp-tc-card.on { opacity: 1; transform: none; cursor: default; }
.kp-tc-media { aspect-ratio: 3 / 2; overflow: hidden; background: var(--kp-line); position: relative; }
.kp-tc-media img, .kp-tc-media svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.kp-tc-body { padding: 16px 20px 20px; font-size: .95em; line-height: 1.5; }
.kp-tc-who { margin: 0 0 4px; font-weight: 700; }
.kp-tc-body strong { color: inherit; }
.kp-tc-body .kp-text p { margin: 0 0 8px; } .kp-tc-body .kp-text p:last-child { margin-bottom: 0; }
.kp-tc-btn { position: absolute; top: 50%; translate: 0 -50%; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--kp-line); background: var(--kp-surface); color: var(--kp-text); box-shadow: 0 6px 18px rgba(16, 18, 24, .14); display: grid; place-items: center; cursor: pointer; padding: 0; }
.kp-tc-btn svg { width: 20px; height: 20px; }
.kp-tc-prev { left: 8px; } .kp-tc-prev svg { rotate: 180deg; }
.kp-tc-next { right: 8px; }
.kp-tc-btn:disabled { opacity: .35; cursor: default; }
.kp-tc-btn:not(:disabled):hover { background: var(--kp-accent); color: var(--kp-on-accent, #fff); border-color: var(--kp-accent); }
.kp-tc-btn:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
.kp-tc-dots { display: flex; justify-content: center; gap: 8px; }
.kp-tc-dots { gap: 2px; }
.kp-tc-dot { width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; background: radial-gradient(circle, var(--kp-line) 0 5px, transparent 5.5px); cursor: pointer; }
.kp-tc-dot[aria-current="true"] { background: radial-gradient(circle, var(--kp-accent) 0 5px, transparent 5.5px); }
.kp-tc-dot:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
.kp-split-stage > .kp-b-team .kp-team-car, .kp-screen .kp-team-car { --tc-w: min(460px, 68%); }
.kp-screen .kp-tc-body { font-size: .9em; line-height: 1.45; padding: 14px 18px 16px; }
.kp-screen .kp-team-car .kp-sec-head { margin-bottom: 10px; }
.kp-screen .kp-team-car .kp-sec-title { font-size: clamp(22px, 2.3vw, 30px); }
@media (max-width: 760px) { .kp-team-car { --tc-w: 82%; --tc-gap: 14px; } .kp-tc-btn { width: 38px; height: 38px; } }
@media (prefers-reduced-motion: reduce) { .kp-tc-track, .kp-tc-card { transition: none; } }
.kp-style-comic .kp-tc-media img { filter: grayscale(1) contrast(1.05); }
/* Die Hochwertig-Effekte heben jedes Kind eines Teams bei Fokus an; die Spur des Karussells bleibt liegen */
.kp-fx-premium .kp-team.kp-team-car > *:is(:hover, :focus-within) { transform: none; box-shadow: none; }
.kp-person-more > summary, .kp-person-cap { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0 0; color: var(--kp-muted); font-weight: 600; font-size: .95em; text-align: center; }
.kp-person-more > summary { list-style: none; cursor: pointer; border-radius: 999px; }
.kp-person-more > summary::-webkit-details-marker { display: none; }
.kp-person-more > summary:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 3px; }
.kp-person-plus { position: relative; flex: none; width: 30px; height: 30px; border-radius: 50%; background: color-mix(in srgb, var(--kp-text) 55%, var(--kp-bg)); transition: transform .3s var(--kp-ease-out, ease), background .2s; }
.kp-person-plus::before, .kp-person-plus::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 2px; margin: -1px 0 0 -6px; background: var(--kp-bg); border-radius: 2px; }
.kp-person-plus::after { transform: rotate(90deg); transition: transform .3s; }
.kp-person-more > summary:hover .kp-person-plus { background: var(--kp-accent); }
