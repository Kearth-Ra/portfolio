<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback, das ankommt (Lektionen zum Scrollen)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root {
  --kp-side: clamp(24px, 4vw, 64px);
  --kp-primary: #1f3a5f; --kp-accent: #c8781a; --kp-bg: #f5f6f8; --kp-surface: #ffffff;
  --kp-text: #1d2530; --kp-muted: #5d6877; --kp-line: #dde1e7;
  --kp-title: var(--kp-primary); /* Farbe von Titeln und Namen; Comic und Nacht setzen sie auf die Textfarbe (Signalfarbe nur fuer Interaktion) */
  --kp-ok: #1f7a4d; --kp-no: #b3261e; --kp-radius: 10px;
  --kp-font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --kp-nav-bg: var(--kp-primary); --kp-nav-ink: #ffffff; --kp-navw: 230px;
  --kp-shadow: 0 1px 3px rgba(16,24,40,.08), 0 8px 24px rgba(16,24,40,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* Fokus nie unter einer festen Leiste (WCAG 2.2, 2.4.11): beim Rollen zum fokussierten Element halten Kopf- und Fußleiste Abstand.
   Die Höhen misst measureNav(); Selbsttest-Fall „WCAG 2.2: Zielgröße …“ und Sichtprüfung a11yTargetCheck(). */
html { scroll-padding-top: calc(var(--kp-headh, 0px) + 8px); scroll-padding-bottom: calc(var(--kp-navh, 0px) + 8px); }
body { font-family: var(--kp-font); background: var(--kp-bg); color: var(--kp-text); }
#app { display: flex; flex-direction: column; min-height: 100%; }
img { max-width: 100%; }

/* ---------- Grundgerüst ---------- */
.kp-head { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--kp-nav-bg); color: var(--kp-nav-ink); font-size: 14px; }
.kp-course { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Obere Kopfleiste am Handy: Titel in eine eigene Zeile, Knoepfe darunter umbrechen - sonst ragt die Leiste ueber den Rand */
/* Am Handy eine Zeile: Inhalt, Kurstitel, Kennzeichen, Zähler; Übersicht, Suche, Glossar, Notizen und Trainer stehen dann oben im Inhaltsverzeichnis */
@media (max-width: 600px) {
  .kp-head { padding: 8px 12px; gap: 8px; }
  .kp-head .kp-iconbtn:not([data-drawer="toc"]) { display: none; }
  .kp-head .kp-head-chapter { display: none; }
  .kp-head .kp-logo { display: none; }
}
.kp-drawer-tools { display: none; }
@media (max-width: 600px) { .kp-drawer-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; } .kp-drawer-tools .kp-iconbtn { color: var(--kp-primary); background: color-mix(in srgb, var(--kp-primary) 10%, transparent); } }
.kp-iconbtn { font: inherit; background: rgba(127,127,127,.16); background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.kp-iconbtn:hover { background: rgba(127,127,127,.3); background: color-mix(in srgb, currentColor 28%, transparent); }
.kp-progress { height: 4px; background: rgba(0,0,0,.08); }
.kp-progress div { height: 100%; background: var(--kp-accent); transition: width .35s; }
.kp-main { flex: 1; width: 100%; max-width: var(--kp-maxw, 1000px); margin: 0 auto; --kp-main-pt: 48px; --kp-main-pb: 32px; padding: var(--kp-main-pt) var(--kp-side) var(--kp-main-pb); font-size: var(--kp-fs, 17px); }
.kp-main h1 { font-size: 30px; line-height: 1.22; margin: 0 0 20px; }
.kp-block { margin-bottom: var(--kp-gap, 24px); }
/* Ein Abstandssystem: Der Abstand zwischen Bausteinen kommt allein aus --kp-gap (Dichte). Innenabstaende des letzten
   Elements duerfen nicht nach aussen durchschlagen, sonst ist der Abstand je Bausteintyp verschieden (Sichtpruefung). */
.kp-block-inner > :last-child, .kp-block-inner > :last-child > :last-child { margin-bottom: 0; }
.kp-block:last-child { margin-bottom: 0; }
.kp-text { font-size: var(--kp-fs, 17px); line-height: 1.65; }
.kp-text h2 { font-size: 24px; margin: 1.2em 0 .4em; }
.kp-text h3 { font-size: 20px; margin: 1.2em 0 .4em; }
.kp-text > :first-child { margin-top: 0; }
.kp-text > :last-child { margin-bottom: 0; }
.kp-text a { color: var(--kp-primary); }
.kp-fig { margin: 0; }
.kp-fig img { display: block; max-width: 100%; border-radius: var(--kp-radius); margin: 0 auto; }
.kp-fig.kp-small img { max-width: 40%; }
.kp-fig.kp-medium img { max-width: 70%; }
.kp-fig figcaption { color: var(--kp-muted); font-size: 13px; margin-top: 8px; text-align: center; }
.kp-textimage { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
.kp-textimage.kp-left .kp-fig { order: -1; }
.kp-textimage.kp-ti-medium { grid-template-columns: 3fr 2fr; }
.kp-textimage.kp-ti-small { grid-template-columns: 3fr 1fr; }
.kp-textimage.kp-left.kp-ti-medium { grid-template-columns: 2fr 3fr; }
.kp-textimage.kp-left.kp-ti-small { grid-template-columns: 1fr 3fr; }
.kp-label { color: var(--kp-muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
.kp-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--kp-line); color: var(--kp-text); margin-left: 6px; letter-spacing: 0; text-transform: none; }
.kp-divider { border: 0; border-top: 1px solid var(--kp-line); margin: 8px 0; }
.kp-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; background: var(--kp-surface); border-top: 1px solid var(--kp-line); position: sticky; bottom: 0; z-index: 5; }
.kp-btn { font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 8px; border: 2px solid var(--kp-primary); background: var(--kp-primary); color: #fff; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.kp-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--kp-shadow); }
.kp-btn.kp-sec { background: transparent; color: var(--kp-primary); }
.kp-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.kp-lock { color: var(--kp-muted); font-size: 13px; text-align: center; }
[data-footer][hidden] { display: none !important; }
.kp-hero { background: var(--kp-primary); color: #fff; border-radius: var(--kp-radius); padding: 48px 40px; }
.kp-hero h1, .kp-hero h2 { color: #fff; margin-top: 0; }
.kp-hero p { font-size: 19px; opacity: .9; max-width: 640px; }

/* ---------- Schublade: Inhalt, Glossar, Notizen ---------- */
.kp-drawer { position: fixed; inset: 0 auto 0 0; width: 340px; max-width: 86vw; background: var(--kp-surface); box-shadow: 0 0 40px rgba(0,0,0,.18); transform: translateX(-100%); transition: transform .25s; z-index: 20; display: flex; flex-direction: column; }
.kp-drawer.open { transform: none; }
.kp-drawer:not(.open) { box-shadow: none; } /* der Schatten der geschlossenen Schublade fiel sonst links ins Bild */
.kp-drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--kp-line); font-weight: 600; }
.kp-drawer-head button { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--kp-muted); }
.kp-drawer-body { overflow-y: auto; padding: 12px 16px 24px; }
.kp-backdrop { position: fixed; inset: 0; background: rgba(16,24,40,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 19; }
.kp-backdrop.open { opacity: 1; pointer-events: auto; }
.kp-toc-chapter { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--kp-muted); margin: 14px 0 6px; }
.kp-toc-item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; font: inherit; padding: 8px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: inherit; }
.kp-toc-item:hover { background: var(--kp-bg); }
.kp-toc-item.current { background: var(--kp-bg); font-weight: 600; }
.kp-toc-item:disabled { color: var(--kp-muted); cursor: not-allowed; }
.kp-toc-state { width: 18px; text-align: center; font-size: 12px; }
.kp-toc-fs { margin: 0 0 12px; }
.kp-toc-fs .kp-btn { width: 100%; }
.kp-fs-btn kbd { font: inherit; font-size: 12px; line-height: 1.4; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; opacity: .75; }
@media (hover: none) { .kp-fs-btn kbd { display: none; } }
.kp-notes { width: 100%; min-height: 220px; font: inherit; padding: 10px; border: 1px solid var(--kp-line); border-radius: 8px; resize: vertical; }
.kp-glossar-term { font-weight: 600; margin-top: 12px; }
.kp-glossar-def { color: var(--kp-muted); }
.kp-gloss { border-bottom: 1px dotted var(--kp-accent); cursor: help; }

/* ---------- Fragen ---------- */
.kp-quiz { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 24px; }
.kp-q { font-size: 20px; line-height: 1.35; margin: 0 0 16px; }
.kp-quiz .kp-fig { margin-bottom: 16px; }
.kp-answers { display: grid; gap: 10px; margin-bottom: 18px; }
.kp-answer { display: flex; gap: 12px; align-items: center; padding: 13px 16px; background: var(--kp-surface); border: 2px solid var(--kp-line); border-radius: var(--kp-radius); cursor: pointer; font-size: 16px; transition: border-color .15s, transform .15s; }
.kp-answer:hover { border-color: var(--kp-primary); transform: translateX(2px); }
.kp-answer input { width: 18px; height: 18px; accent-color: var(--kp-primary); flex: none; }
.kp-right { border-color: var(--kp-ok) !important; background: #e9f5ee !important; }
.kp-wrong { border-color: var(--kp-no) !important; background: #fbeceb !important; }
.kp-feedback { padding: 13px 16px; border-radius: var(--kp-radius); font-weight: 600; animation: kp-fade .35s both; margin-top: 4px; }
.kp-feedback.ok { background: #e9f5ee; color: var(--kp-ok); }
.kp-feedback.no { background: #fbeceb; color: var(--kp-no); }
.kp-feedback.neutral { background: var(--kp-bg); color: var(--kp-text); }
.kp-quiz-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.kp-fill { font-size: 17px; line-height: 2.2; margin: 0 0 16px; }
.kp-fill input { font: inherit; padding: 3px 10px; border: 2px solid var(--kp-line); border-radius: 6px; min-width: 130px; }
.kp-solution { color: var(--kp-ok); font-size: 14px; }
.kp-order { display: grid; gap: 8px; margin-bottom: 18px; }
.kp-order-item { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--kp-surface); border: 2px solid var(--kp-line); border-radius: var(--kp-radius); }
.kp-order-item .kp-grip { color: var(--kp-muted); cursor: grab; }
.kp-order-item.dragging { opacity: .4; }
.kp-order-item .kp-move { margin-left: auto; display: flex; gap: 4px; }
.kp-order-item .kp-move button { border: 1px solid var(--kp-line); background: #fff; border-radius: 6px; cursor: pointer; padding: 2px 8px; }
.kp-match { display: grid; gap: 10px; margin-bottom: 18px; }
/* Zahl mit Toleranz */
.kp-numeric { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 12px; margin: 0 0 16px; }
.kp-numeric label { display: grid; gap: 4px; }
.kp-numeric input { font: inherit; font-size: 20px; width: 11ch; padding: 8px 12px; border: 2px solid var(--kp-line); border-radius: 6px; background: var(--kp-surface); color: var(--kp-text); }
.kp-num-unit { font-style: normal; font-size: 18px; padding-bottom: 10px; color: var(--kp-muted); }
/* Lückentext mit Auswahl */
.kp-fill select { font: inherit; padding: 4px 8px; border: 2px solid var(--kp-line); border-radius: 6px; background: var(--kp-surface); color: var(--kp-text); max-width: 100%; }
/* „Weiß ich nicht“ als eigene, zurückgenommene Antwort */
.kp-answer.kp-answer-dk { border-style: dashed; color: var(--kp-muted); }
.kp-answers.kp-ans-cards .kp-answer.kp-answer-dk { grid-column: 1 / -1; flex-direction: row; justify-content: center; padding: 12px; }
.kp-answers.kp-ans-cards .kp-answer.kp-answer-dk input { position: static; background: transparent; border-color: currentColor; box-shadow: none; width: 20px; height: 20px; }
.kp-feedback.kp-fb-dk { background: color-mix(in srgb, var(--kp-primary) 10%, var(--kp-surface)); color: var(--kp-text); }
/* Zuordnen mit Linien */
.kp-match-lines { margin-bottom: 18px; }
.kp-ml-hint { font-size: 14px; color: var(--kp-muted); margin: 0 0 10px; }
.kp-ml-done .kp-ml-hint { display: none; }
.kp-ml-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px clamp(48px, 12%, 140px); }
.kp-ml-col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.kp-ml-item { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; font: inherit; text-align: left; background: var(--kp-surface); color: var(--kp-text); border: 2px solid var(--kp-line); border-radius: var(--kp-radius); cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.kp-ml-right { text-align: right; justify-content: flex-end; }
.kp-ml-item:not(:disabled):hover { border-color: var(--kp-primary); }
.kp-ml-item:focus-visible { outline: 3px solid var(--kp-primary); outline-offset: 2px; }
.kp-ml-item.kp-ml-pick { border-color: var(--kp-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--kp-accent) 30%, transparent); }
.kp-ml-left[data-to]:not([data-to="-1"]) { border-color: var(--kp-primary); }
.kp-ml-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.kp-ml-svg path { fill: none; stroke: var(--kp-primary); stroke-width: 3; stroke-linecap: round; }
.kp-ml-svg path.kp-ml-ok { stroke: var(--kp-ok); } .kp-ml-svg path.kp-ml-no { stroke: var(--kp-no); stroke-dasharray: 6 6; }
.kp-ml-sol { margin: 12px 0 0; padding-left: 1.2em; font-size: 15px; } .kp-ml-sol:empty { display: none; }
@media (max-width: 600px) { .kp-ml-grid { gap: 10px 24px; } .kp-ml-item { padding: 8px 10px; min-height: 44px; font-size: 15px; } }
.kp-match-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; padding: 10px 14px; background: var(--kp-surface); border: 2px solid var(--kp-line); border-radius: var(--kp-radius); }
.kp-match-row select { font: inherit; padding: 8px 10px; border: 1px solid var(--kp-line); border-radius: 6px; background: #fff; }
.kp-mem-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.kp-mem-card { min-height: 92px; padding: 10px; font: inherit; font-size: 15px; line-height: 1.3; border: 2px solid var(--kp-line); border-radius: var(--kp-radius); background: var(--kp-primary); color: #fff; cursor: pointer; transition: transform .25s, background .25s; }
.kp-mem-card .kp-mem-face { display: block; }
.kp-mem-card:not(.up) .kp-mem-face { font-size: 28px; font-weight: 700; opacity: .8; }
.kp-mem-card.up { background: var(--kp-surface); color: var(--kp-text); cursor: default; }
.kp-mem-card.kp-mem-def.up { font-size: 14px; }
.kp-mem-card.kp-right { border-color: var(--kp-ok, #2e7d32); }
.kp-mem-card:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
.kp-mem-status { margin: 4px 0 0; color: var(--kp-muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .kp-mem-card { transition: none; } }
.kp-match-left { display: flex; align-items: center; gap: 10px; }
.kp-match-img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; }
.kp-mdd { margin-bottom: 18px; }
.kp-mdd-pool { list-style: none; margin: 0 0 14px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 58px; border: 2px dashed var(--kp-line); border-radius: var(--kp-radius); }
.kp-mdd-pool.kp-over, .kp-mdd-drop.kp-over { border-color: var(--kp-primary); background: color-mix(in srgb, var(--kp-primary) 8%, white); }
.kp-mdd-rows { display: grid; gap: 10px; }
.kp-mdd-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; background: var(--kp-surface); border: 2px solid var(--kp-line); border-radius: var(--kp-radius); }
.kp-mdd-left { display: flex; align-items: center; gap: 8px; }
.kp-mdd-drop { list-style: none; margin: 0; padding: 6px; min-height: 46px; border: 2px dashed var(--kp-line); border-radius: var(--kp-radius); display: flex; flex-wrap: wrap; gap: 8px; }
.kp-mdd-card { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border: 2px solid var(--kp-line); border-radius: 999px; cursor: grab; }
.kp-mdd-card.kp-dragging { opacity: .4; }
.kp-mdd-move { display: flex; gap: 4px; }
.kp-mdd-move button { min-width: 28px; min-height: 28px; border: 1px solid var(--kp-line); background: var(--kp-surface); color: var(--kp-text); border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; }
.kp-dark .kp-mdd-row, .kp-dark .kp-mdd-card { background: var(--kp-surface); color: var(--kp-text); }
.kp-hotspot { position: relative; display: inline-block; max-width: 100%; margin-bottom: 16px; }
.kp-hotspot img { display: block; max-width: 100%; border-radius: var(--kp-radius); cursor: crosshair; }
.kp-marker { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid var(--kp-primary); background: rgba(255,255,255,.35); pointer-events: none; }
.kp-marker.kp-right { border-color: var(--kp-ok) !important; background: rgba(31,122,77,.2) !important; }
.kp-marker.kp-wrong { border-color: var(--kp-no) !important; background: rgba(179,38,30,.2) !important; }
.kp-pool > .kp-quiz + .kp-quiz { margin-top: 18px; }
.kp-result { text-align: center; padding-top: 20px; }
.kp-score { font-size: 66px; font-weight: 700; color: var(--kp-primary); margin: 6px 0; }
.kp-score-ring { position: relative; width: 190px; height: 190px; margin: 6px auto 10px; }
.kp-score-ring svg { width: 100%; height: 100%; display: block; }
.kp-score-ring .kp-score { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font-size: 44px; }
.kp-ring-bg { fill: none; stroke: var(--kp-line); stroke-width: 9; }
.kp-ring-on { fill: none; stroke: var(--kp-ok); stroke-width: 9; stroke-linecap: round; animation: kp-ring-in 1.3s cubic-bezier(.2,.7,.2,1) both; }
.kp-score-ring.is-no .kp-ring-on { stroke: var(--kp-no); }
@keyframes kp-ring-in { from { stroke-dashoffset: var(--kp-ring-u); } }
.kp-nextcourse { max-width: 620px; margin: 30px auto 0; text-align: left; background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 20px 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; box-shadow: var(--kp-shadow); }
.kp-nextcourse .kp-label { grid-column: 1 / -1; }
.kp-nc-img { width: 120px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: calc(var(--kp-radius) - 2px); }
.kp-nc-body { display: grid; gap: 8px; justify-items: start; }
.kp-nc-body .kp-q { margin: 0; }
.kp-nc-link { text-decoration: none; display: inline-block; }
@media (max-width: 560px) { .kp-nextcourse { grid-template-columns: 1fr; } .kp-nc-img { width: 100%; } }
.kp-done { max-width: 620px; margin: 26px auto 0; }
.kp-done-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kp-done-item { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 14px 10px; display: grid; justify-items: center; gap: 4px; }
.kp-done-item .kp-ico { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-done-item b { font-size: 20px; color: var(--kp-primary); }
.kp-done-item span { font-size: 13px; color: var(--kp-muted); }
@media (prefers-reduced-motion: reduce) { .kp-ring-on, .kp-obj-bar div { animation: none; } }
.kp-review { text-align: left; max-width: 620px; margin: 24px auto 0; display: grid; gap: 6px; }
.kp-review div { display: flex; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--kp-surface); }

/* ---------- Szenario und Zertifikat ---------- */
.kp-branch { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 24px; }
.kp-branch-options { display: grid; gap: 10px; }
.kp-branch-option { font: inherit; text-align: left; padding: 14px 18px; border: 2px solid var(--kp-line); border-radius: var(--kp-radius); background: var(--kp-surface); cursor: pointer; transition: border-color .15s, transform .15s; }
.kp-branch-option:hover:not(:disabled) { border-color: var(--kp-accent); transform: translateX(3px); }
.kp-branch-option.chosen { border-color: var(--kp-accent); background: color-mix(in srgb, var(--kp-accent) 10%, white); }
.kp-branch-option:disabled { cursor: default; }
.kp-branch-option.chosen:disabled { color: var(--kp-text); opacity: 1; } /* die gewählte Möglichkeit bleibt lesbar (Browser grauen disabled sonst auf 30 %) */
.kp-cert { text-align: center; background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 30px 24px; box-shadow: var(--kp-shadow); }
.kp-cert-icon { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-cert-icon .kp-ico-lg { width: 46px; height: 46px; color: inherit; }
.kp-cert input:not([type=radio]):not([type=checkbox]) { font: inherit; padding: 8px 12px; border: 1px solid var(--kp-line); border-radius: 6px; min-width: 260px; margin: 8px 0 14px; }
.kp-cert-motif { display: grid; grid-template-columns: minmax(0, 220px) 1fr; padding: 0; overflow: hidden; text-align: left; }
.kp-cert-pic { position: relative; min-height: 200px; background: var(--kp-primary); }
.kp-cert-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.kp-cert-pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--kp-primary) 75%, transparent)); }
.kp-cert-motif .kp-cert-body { padding: 30px 28px; }
/* Zeichnung als Motiv (Storyset-Figur): ganz zeigen, auf getöntem Grund, ohne Schleier (sonst nur ein angeschnittenes Gesicht) */
.kp-cert-pic.kp-cert-drawing { background: color-mix(in srgb, var(--kp-primary) 10%, var(--kp-bg)); }
.kp-cert-pic.kp-cert-drawing img { object-fit: contain; object-position: 50% 100%; padding: 24px 24px 0; }
.kp-cert-pic.kp-cert-drawing::after { display: none; }
.kp-cert-name { font-size: 20px; font-weight: 700; margin: 4px 0 14px; }
@media (max-width: 640px) { .kp-cert-motif { grid-template-columns: 1fr; } .kp-cert-pic { min-height: 140px; } }

/* ---------- Medien ---------- */
.kp-media video, .kp-media audio { width: 100%; border-radius: var(--kp-radius); }
.kp-media video { background: #000; }
.kp-embed { position: relative; padding-top: 56.25%; border-radius: var(--kp-radius); overflow: hidden; background: #000; }
.kp-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.kp-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.kp-gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: var(--kp-radius); cursor: zoom-in; transition: transform .2s; }
.kp-gallery img:hover { transform: scale(1.03); }
.kp-lightbox { position: fixed; inset: 0; background: rgba(10,14,20,.9); display: flex; align-items: center; justify-content: center; z-index: 30; }
.kp-lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; }
.kp-compare { position: relative; overflow: hidden; border-radius: var(--kp-radius); user-select: none; }
.kp-compare > img { display: block; width: 100%; }
.kp-compare .kp-after { position: absolute; inset: 0 auto 0 0; overflow: hidden; border-right: 3px solid #fff; }
.kp-compare .kp-after img { display: block; height: 100%; max-width: none; object-fit: cover; }
.kp-compare input { position: absolute; left: 0; bottom: 10px; width: 100%; }
.kp-caption { color: var(--kp-muted); font-size: 14px; margin-top: 8px; }

/* ---------- Bausteine ---------- */
.kp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.kp-card { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 18px 20px; box-shadow: var(--kp-shadow); }
.kp-card h3 { margin: 0 0 8px; font-size: 18px; color: var(--kp-title); }
.kp-card > :last-child { margin-bottom: 0; }
details.kp-acc { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 0 18px; margin-bottom: 10px; }
details.kp-acc > summary { cursor: pointer; padding: 14px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.kp-acc > summary::-webkit-details-marker { display: none; }
details.kp-acc > summary::after { content: "+"; color: var(--kp-accent); font-size: 22px; line-height: 1; }
details.kp-acc[open] > summary::after { content: "–"; }
details.kp-acc > div { padding-bottom: 16px; animation: kp-fade .3s both; }
.kp-tabs > .kp-tabbar { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--kp-line); margin-bottom: 16px; }
.kp-tabs > .kp-tabbar button { font: inherit; font-weight: 600; padding: 10px 16px; border: 0; background: none; cursor: pointer; color: var(--kp-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.kp-tabs > .kp-tabbar button.active { color: var(--kp-primary); border-color: var(--kp-accent); }
.kp-tabs section { animation: kp-fade .3s both; }
.kp-flipgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.kp-flip { perspective: 1000px; height: 200px; cursor: pointer; }
.kp-flip-inner { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
.kp-flip:hover .kp-flip-inner, .kp-flip.flipped .kp-flip-inner { transform: rotateY(180deg); }
.kp-flip-front, .kp-flip-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--kp-radius); padding: 18px; display: flex; flex-direction: column; justify-content: center; text-align: center; box-shadow: var(--kp-shadow); overflow: auto; }
.kp-flip-front { background: var(--kp-primary); color: #fff; font-weight: 600; font-size: 18px; }
.kp-flip-back { background: var(--kp-surface); border: 1px solid var(--kp-line); transform: rotateY(180deg); }
.kp-flip.kp-flip-tall { height: 280px; }
.kp-flip-img { display: block; width: calc(100% + 36px); margin: -18px -18px 12px; height: 120px; object-fit: cover; border-radius: var(--kp-radius) var(--kp-radius) 0 0; flex: none; }
.kp-flip-back .kp-flip-img { height: 100px; }
/* Kennzeichnung von KI-Inhalten (Artikel 50 EU-KI-Verordnung): Hinweis auf der ersten Seite, Kennzeichen am Medium */
/* KI-Kennzeichen: kleines Zeichen in der Kopfzeile, Text erst auf Klick (Artikel 50 EU-KI-Verordnung); fest unten links nur bei eigener Kopfzeile */
.kp-ai-mark { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; flex: none; }
.kp-ai-mark.kp-ai-fixed { position: fixed; left: 12px; bottom: calc(12px + var(--kp-navh, 0px)); z-index: 18; flex-direction: column-reverse; gap: 8px; max-width: min(360px, calc(100vw - 24px)); }
.kp-head .kp-ai-btn { color: inherit; background: color-mix(in srgb, currentColor 9%, transparent); border-color: color-mix(in srgb, currentColor 30%, transparent); }
.kp-head .kp-ai-btn:hover, .kp-head .kp-ai-btn[aria-expanded="true"] { color: inherit; border-color: var(--kp-accent); }
.kp-head .kp-ai-text { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 24px)); z-index: 30; color: var(--kp-text); text-transform: none; letter-spacing: 0; font-weight: 400; } /* rechts angeschlagen: das Kennzeichen steht am rechten Rand der Leiste */
.kp-navbar .kp-head .kp-ai-text { top: auto; bottom: calc(100% + 8px); }
.kp-nav-links .kp-navbar .kp-head .kp-ai-text { top: calc(100% + 8px); bottom: auto; left: 0; right: auto; width: calc(var(--kp-navw) - 32px); }
@media (max-width: 860px) { .kp-nav-links .kp-navbar .kp-head .kp-ai-text { top: auto; bottom: calc(100% + 8px); left: auto; right: 0; width: min(360px, calc(100vw - 24px)); } }
/* Am Handy als Streifen über der unteren Kante, damit der Text nicht am Rand abgeschnitten wird */
@media (max-width: 520px) { .kp-head .kp-ai-text, .kp-navbar .kp-head .kp-ai-text { position: fixed; left: 12px; right: 12px; width: auto; top: auto; bottom: calc(12px + var(--kp-navh, 0px)); } }
.kp-ai-btn { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--kp-muted); background: color-mix(in srgb, var(--kp-surface) 86%, transparent); border: 1px solid var(--kp-line); border-radius: 999px; padding: 4px 11px 4px 5px; cursor: pointer; backdrop-filter: blur(4px); }
.kp-ai-btn:hover, .kp-ai-btn[aria-expanded="true"] { color: var(--kp-text); border-color: var(--kp-accent); }
.kp-ai-tag { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 999px; background: var(--kp-accent); color: var(--kp-on-accent, #fff); font-size: 9.5px; letter-spacing: 0; }
.kp-ai-text { padding: 12px 15px; background: var(--kp-surface); border-radius: var(--kp-radius); box-shadow: var(--kp-shadow); font-size: 14px; line-height: 1.5; }
.kp-ai-text b { display: block; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-dark .kp-ai-btn, .kp-dark .kp-ai-text { background: color-mix(in srgb, var(--kp-surface) 92%, transparent); }
@media (max-width: 520px) { .kp-ai-word { display: none; } }
@media print { .kp-ai-mark, .kp-head .kp-ai-text { position: static; max-width: none; width: auto; margin-top: 18px; } .kp-ai-btn { display: none; } .kp-ai-text { display: block !important; } }
.kp-fig.kp-ai .kp-fig-frame { position: relative; }
.kp-ai-badge { position: absolute; left: 10px; top: 10px; z-index: 3; padding: 4px 10px; border-radius: 999px; background: rgba(12,16,24,.82); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .03em; }
/* Gegenüberstellung: Karten mit Akzentbalken an einer senkrechten Achse.
   Klasse und Attribut heißen bewusst kp-cmp / data-cmp: kp-compare und data-compare
   gehören seit jeher dem Vorher-nachher-Regler bei Bildern. */
.kp-cmp-list { list-style: none; margin: 22px 0 0; padding: 0; position: relative; counter-reset: cmp; }
.kp-cmp-list::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; border-radius: 2px; background: linear-gradient(180deg, var(--kp-accent), color-mix(in srgb, var(--kp-accent) 35%, var(--kp-line))); }
.kp-cmp-step { position: relative; margin-bottom: 18px; padding-top: 12px; }
.kp-cmp-step:last-child { margin-bottom: 0; }
.kp-cmp-dot { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 50%; background: var(--kp-accent); color: var(--kp-on-accent, #fff); display: grid; place-items: center; font-size: 13px; font-weight: 800; box-shadow: 0 0 0 5px var(--kp-bg); z-index: 1; }
.kp-cmp-card { position: relative; background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 16px 22px 18px; box-shadow: var(--kp-shadow); margin-top: 14px; }
.kp-cmp-eyebrow { margin: 0 0 6px; font-size: 14px; color: var(--kp-accent-ink, var(--kp-accent)); text-align: center; }
.kp-cmp-card h3 { margin: 0 0 10px; font-size: clamp(17px, 1.7vw, 21px); text-align: center; }
.kp-cmp-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kp-cmp-side { background: var(--kp-bg); border-radius: calc(var(--kp-radius) - 2px); padding: 14px 16px; border-top: 3px solid var(--kp-line); }
.kp-cmp-side + .kp-cmp-side { border-top-color: var(--kp-accent); background: color-mix(in srgb, var(--kp-accent) 7%, var(--kp-surface)); }
.kp-cmp-label { margin: 0 0 6px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--kp-muted); }
.kp-cmp-new { color: var(--kp-text); } /* auf der getoenten Flaeche reicht die Akzentfarbe nicht fuer 4,5 : 1 (Sichtpruefung) */
.kp-cmp-img { display: block; width: 100%; margin-top: 16px; border-radius: var(--kp-radius); }
@media (max-width: 720px) {
  /* Am Handy: Achse links, Nummer daneben, Karte rechts davon, die beiden Seiten untereinander */
  .kp-cmp-list::before { left: 14px; }
  .kp-cmp-step { padding-top: 0; padding-left: 40px; margin-bottom: 22px; }
  .kp-cmp-dot { left: 14px; top: 14px; }
  .kp-cmp-card { margin-top: 0; padding: 18px 16px 20px; }
  .kp-cmp-sides { grid-template-columns: 1fr; gap: 10px; }
  .kp-cmp-eyebrow, .kp-cmp-card h3 { text-align: left; }
}
.kp-on-dark .kp-cmp-card { background: rgba(255,255,255,.95); color: var(--kp-text); }
/* Sammelalbum: Fundstücke, die sich mit dem Weg durch den Kurs füllen */
.kp-album { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 26px; }
.kp-alb-count { margin: 10px 0 6px; color: var(--kp-muted); }
.kp-alb-count b { color: var(--kp-accent-ink, var(--kp-accent)); font-size: 1.2em; }
.kp-alb-bar { height: 8px; border-radius: 4px; background: var(--kp-line); overflow: hidden; margin-bottom: 18px; }
.kp-alb-bar i { display: block; height: 100%; background: var(--kp-accent); transition: width .6s var(--kp-ease-out, ease-out); }
.kp-alb-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.kp-alb-item { border: 1px dashed var(--kp-line); border-radius: var(--kp-radius); padding: 12px; text-align: center; opacity: .72; }
.kp-alb-item h3 { margin: 10px 0 4px; font-size: 16px; }
.kp-alb-item .kp-text { font-size: 14px; }
.kp-alb-found { border-style: solid; border-color: var(--kp-accent); opacity: 1; background: var(--kp-bg); }
.kp-alb-pic { aspect-ratio: 4 / 3; border-radius: 8px; background: var(--kp-line); display: grid; place-items: center; overflow: hidden; }
.kp-alb-pic img { width: 100%; height: 100%; object-fit: cover; }
.kp-alb-pic span { font-size: 30px; color: var(--kp-muted); }
.kp-alb-found .kp-alb-pic span { color: var(--kp-accent); }
.kp-alb-open { margin: 0; font-size: 13px; color: var(--kp-muted); }
.kp-alb-done { margin-top: 18px; padding: 14px 16px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-accent) 12%, transparent); }
@media (prefers-reduced-motion: reduce) { .kp-alb-bar i { transition: none; } }
.kp-checklist { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 26px; }
.kp-cl-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.kp-cl-list label { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--kp-bg); cursor: pointer; line-height: 1.45; }
.kp-cl-list label { position: relative; }
.kp-cl-list input { position: absolute; left: 12px; top: 11px; width: 22px; height: 22px; margin: 0; opacity: 0; cursor: pointer; }
.kp-tick { flex: none; box-sizing: border-box; width: 22px; height: 22px; margin-top: 1px; display: grid; place-items: center; border: 2px solid var(--kp-muted); border-radius: min(6px, var(--kp-radius)); background: var(--kp-surface); transition: background-color .2s, border-color .2s; }
.kp-tick svg { width: 16px; height: 16px; fill: none; stroke: var(--kp-on-accent, #fff); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; }
.kp-cl-list input:checked + .kp-tick { background: var(--kp-accent); border-color: var(--kp-accent); }
.kp-cl-list input:checked + .kp-tick svg { stroke-dashoffset: 0; }
.kp-cl-list label.kp-just input:checked + .kp-tick { animation: kp-tick-pop .35s ease-out; }
.kp-cl-list label.kp-just input:checked + .kp-tick svg { animation: kp-tick-draw .35s ease-out .08s both; }
.kp-cl-list input:focus-visible + .kp-tick { outline: 3px solid var(--kp-accent-ink, var(--kp-accent)); outline-offset: 2px; }
@keyframes kp-tick-draw { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
@keyframes kp-tick-pop { 0% { transform: scale(.8); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .kp-cl-list label.kp-just .kp-tick, .kp-cl-list label.kp-just .kp-tick svg { animation: none !important; } }
.kp-cl-list label.done { text-decoration: line-through; color: var(--kp-muted); }
.kp-cl-status { margin: 12px 0 0; font-size: 14px; color: var(--kp-muted); }
.kp-cl-status.all { color: var(--kp-accent-ink, var(--kp-accent)); font-weight: 700; }
.kp-crit { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--kp-line); }
.kp-crit-hint { margin: 0 0 4px; font-size: 14px; color: var(--kp-muted); }
.kp-band { display: inline-block; margin: 0 0 16px; padding: 7px 26px 7px 16px; background: var(--kp-primary); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%); }
.kp-on-dark .kp-band, .kp-bg-primary .kp-band { background: #fff; color: var(--kp-primary); }
.kp-branch-option.tried { border-style: dashed; opacity: .75; }
/* Folgekarte: was in der Welt passiert, wenn die Wahl daneben lag; danach zurück zur Frage */
.kp-conseq { margin-top: 14px; padding: 18px 20px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-no) 7%, var(--kp-surface)); border: 1px solid color-mix(in srgb, var(--kp-no) 30%, var(--kp-line)); animation: kp-fade .35s both; }
.kp-conseq-later { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--kp-no); }
.kp-conseq-body { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
.kp-conseq-body:not(:has(.kp-conseq-pic)) { grid-template-columns: 1fr; }
.kp-conseq-pic { width: 120px; }
.kp-conseq-pic img { width: 120px; height: 90px; object-fit: cover; border-radius: calc(var(--kp-radius) * .6); display: block; }
.kp-conseq-avatar { width: 88px; } .kp-conseq-avatar svg { width: 88px; height: 88px; display: block; }
.kp-conseq-fb { margin: 10px 0 0; font-weight: 600; }
.kp-conseq .kp-quiz-actions { margin-top: 14px; }
.kp-conseq-good { background: color-mix(in srgb, var(--kp-ok) 7%, var(--kp-surface)); border-color: color-mix(in srgb, var(--kp-ok) 30%, var(--kp-line)); }
.kp-conseq-good .kp-conseq-later { color: var(--kp-ok); }
.kp-stage-choices .kp-conseq { margin-top: 0; background: rgba(12,16,24,.88); color: #fff; border-color: rgba(255,255,255,.2); backdrop-filter: blur(6px); }
.kp-stage-choices .kp-conseq .kp-conseq-later { color: color-mix(in srgb, var(--kp-no) 55%, #fff); }
.kp-stage-choices .kp-conseq .kp-text { color: #fff; font-size: 14px; }
.kp-stage-choice-list { display: grid; gap: 8px; }
.kp-branch-options[hidden], .kp-stage-choice-list[hidden] { display: none; } /* die Klasse setzt display: grid, sonst gewinnt sie gegen hidden */
/* Hilfe zum Holen: Figur oder Arbeitshilfe an der Entscheidung, nur auf Wunsch sichtbar */
.kp-branch-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.kp-branch-head .kp-q { flex: 1 1 320px; }
.kp-help-btn { font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--kp-line); border-radius: 999px; background: var(--kp-surface); color: var(--kp-primary); cursor: pointer; }
.kp-help-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.kp-help-btn:hover, .kp-help-btn.open { border-color: var(--kp-primary); background: color-mix(in srgb, var(--kp-primary) 8%, var(--kp-surface)); }
.kp-help { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; margin: 12px 0 16px; padding: 16px 18px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-primary) 6%, var(--kp-surface)); border: 1px solid color-mix(in srgb, var(--kp-primary) 25%, var(--kp-line)); animation: kp-fade .3s both; }
.kp-help:not(:has(.kp-help-avatar)) { grid-template-columns: 1fr; }
.kp-help-avatar { width: 72px; } .kp-help-avatar svg, .kp-help-avatar img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; display: block; }
.kp-help-name { margin: 0 0 6px; font-weight: 700; } .kp-help-name em { font-style: normal; font-weight: 400; color: var(--kp-muted); }
.kp-help .kp-text { font-size: 15px; }
.kp-stage-choices .kp-help-btn { justify-self: start; background: rgba(12,16,24,.8); color: #fff; border-color: rgba(255,255,255,.3); }
.kp-stage-choices .kp-help { margin: 0; background: rgba(12,16,24,.88); color: #fff; border-color: rgba(255,255,255,.2); }
.kp-stage-choices .kp-help .kp-text { color: #fff; font-size: 14px; }
.kp-stage-choices .kp-help-name em { color: rgba(255,255,255,.7); }
.kp-dark .kp-conseq, .kp-dark .kp-help { background: color-mix(in srgb, var(--kp-surface) 85%, #000); }
.kp-timeline { position: relative; padding-left: 28px; }
.kp-timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--kp-line); }
.kp-timeline > div { position: relative; margin-bottom: 20px; }
.kp-timeline > div::before { content: ""; position: absolute; left: -28px; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--kp-accent); box-shadow: 0 0 0 4px var(--kp-bg); }
.kp-timeline h3, .kp-steps h3 { margin: 0 0 4px; font-size: 18px; }
.kp-steps { counter-reset: kp-step; display: grid; gap: 14px; }
.kp-steps > div { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; background: var(--kp-surface); border-radius: var(--kp-radius); padding: 16px 18px; border: 1px solid var(--kp-line); }
.kp-steps > div::before { counter-increment: kp-step; content: counter(kp-step); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--kp-primary); color: #fff; font-weight: 700; }
.kp-quote { margin: 0; padding: 6px 0 6px 18px; font-size: 21px; font-style: italic; color: var(--kp-muted); }
.kp-note { background: var(--kp-surface); border: 1px solid var(--kp-line); padding: 14px 18px; border-radius: var(--kp-radius); }
.kp-note > :first-child { margin-top: 0; } .kp-note > :last-child { margin-bottom: 0; }
.kp-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.kp-hquiz { display: grid; gap: 10px; margin: 16px 0; }
.kp-hquiz [data-kurs-antwort] { font: inherit; text-align: left; padding: 14px 16px; border: 2px solid var(--kp-line); border-radius: var(--kp-radius); background: var(--kp-surface); cursor: pointer; transition: border-color .15s, transform .15s; }
.kp-hquiz [data-kurs-antwort]:hover:not(:disabled) { border-color: var(--kp-primary); transform: translateX(2px); }
.kp-hquiz [data-kurs-antwort].kp-chosen { border-color: var(--kp-primary); }

/* ---------- Effekte ---------- */
@keyframes kp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes kp-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes kp-left { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes kp-right { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes kp-zoom { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.fx-fade-in { animation: kp-fade .5s both; }
.fx-slide-up { animation: kp-up .5s both; }
.fx-slide-left { animation: kp-left .5s both; }
.fx-slide-right { animation: kp-right .5s both; }
.fx-zoom-in { animation: kp-zoom .5s both; }
.fx-delay-1 { animation-delay: .12s; } .fx-delay-2 { animation-delay: .24s; } .fx-delay-3 { animation-delay: .36s; } .fx-delay-4 { animation-delay: .48s; }
.fx-reveal { opacity: 0; transform: translateY(26px); transition: opacity .6s, transform .6s; }
.fx-reveal.fx-in { opacity: 1; transform: none; }
.fx-hover-lift { transition: transform .2s, box-shadow .2s; }
.fx-hover-lift:hover { transform: translateY(-4px); box-shadow: var(--kp-shadow); }
.fx-hover-grow { transition: transform .2s; }
.fx-hover-grow:hover { transform: scale(1.03); }
.fx-hover-glow { transition: box-shadow .2s; }
.fx-hover-glow:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--kp-accent) 35%, transparent); }
.fx-hover-underline { position: relative; }
.fx-hover-underline::after { content: ""; position: absolute; left: 0; bottom: -3px; width: 0; height: 2px; background: var(--kp-accent); transition: width .25s; }
.fx-hover-underline:hover::after { width: 100%; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } .fx-reveal { opacity: 1; transform: none; } }

@media (max-width: 760px) {
  .kp-textimage, .kp-textimage.kp-textimage[class*="kp-ti-"], .kp-grid2, .kp-match-row, .kp-mdd-row { grid-template-columns: 1fr; }
  .kp-textimage.kp-left .kp-fig { order: 0; }
  :root { --kp-side: 16px; }
  .kp-main { --kp-main-pt: 24px; --kp-main-pb: 36px; padding: var(--kp-main-pt) var(--kp-side) var(--kp-main-pb); }
  .kp-main h1 { font-size: 24px; }
  .kp-quiz, .kp-branch { padding: 18px 16px; }
  .kp-hero { padding: 32px 22px; }
  .kp-fig.kp-small img, .kp-fig.kp-medium img { max-width: 100%; }
}
@media print {
  .kp-head, .kp-foot, .kp-progress, .kp-drawer, .kp-backdrop, .kp-quiz-actions { display: none !important; }
  body { background: #fff; }
  .kp-print-page { page-break-after: always; }
  .fx-reveal { opacity: 1; transform: none; }
}

/* ---------- Ergänzungen: Barrierefreiheit, Lernen & Reflexion ---------- */
.kp-skip { position: absolute; left: -9999px; top: 8px; z-index: 40; background: #fff; color: var(--kp-primary); padding: 8px 14px; border-radius: 6px; font-weight: 600; }
.kp-skip:focus { left: 12px; }
.kp-main:focus { outline: none; }
:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
.kp-answer-text { display: grid; gap: 4px; }
.kp-answer-fb { font-size: 14px; color: var(--kp-muted); font-weight: 400; }
.kp-conf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 14px; font-size: 14px; color: var(--kp-muted); }
.kp-conf label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--kp-line); border-radius: 999px; background: var(--kp-surface); cursor: pointer; color: var(--kp-text); }

.kp-reflect, .kp-plan, .kp-survey, .kp-pretest-box, .kp-debrief, .kp-review-head { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px 24px; }
.kp-reflect textarea, .kp-plan textarea, .kp-survey textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--kp-line); border-radius: 8px; resize: vertical; min-height: 90px; background: #fff; }
.kp-plan-row { margin-bottom: 14px; }
.kp-plan-row label { display: block; font-weight: 600; margin-bottom: 6px; }
.kp-plan-row textarea { min-height: 60px; }
.kp-sample { margin-top: 14px; }
.kp-saved { color: var(--kp-ok); font-size: 14px; margin-left: 8px; }
.kp-survey-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--kp-line); }
.kp-scale { display: flex; gap: 6px; }
.kp-scale label { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--kp-line); border-radius: 50%; cursor: pointer; font-weight: 600; }

.kp-scale label:has(input:checked) { background: var(--kp-primary); color: #fff; border-color: var(--kp-primary); }
.kp-scale label:has(input:focus-visible) { outline: 3px solid var(--kp-accent); }
.kp-scale-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--kp-muted); margin: 6px 0 0; }
.kp-review-head { margin-bottom: 18px; }

.kp-objectives { max-width: 620px; margin: 24px auto 0; text-align: left; display: grid; gap: 8px; }
.kp-obj { background: var(--kp-surface); border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.kp-obj-text { display: grid; gap: 2px; }

.kp-obj > strong { font-size: 18px; color: var(--kp-primary); }
.kp-obj-bar { grid-column: 1 / -1; height: 8px; background: var(--kp-line); border-radius: 4px; overflow: hidden; }
.kp-obj-bar div { height: 100%; background: var(--kp-ok); border-radius: 4px; animation: kp-bar-in 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(.15s + var(--kp-i, 0) * .08s); }
@keyframes kp-bar-in { from { width: 0; } }
.kp-obj.weak .kp-obj-bar div { background: var(--kp-no); }

.kp-calib { max-width: 620px; margin: 18px auto 0; }
.kp-resume { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.kp-resume-box { background: var(--kp-surface); border-radius: 14px; padding: 28px; max-width: 460px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.kp-resume-box .kp-quiz-actions { justify-content: center; }
.kp-resume-wide { align-items: start; overflow: auto; }
.kp-resume-wide .kp-resume-box { max-width: 720px; width: 100%; text-align: left; margin: 24px 0; }
.kp-resume-wide .kp-resume-box > h2, .kp-resume-wide .kp-resume-box > p:first-of-type { text-align: center; }
.kp-resume-review { margin: 18px 0; padding-top: 14px; border-top: 1px solid var(--kp-line); }

.kp-review-mode { position: fixed; right: 16px; bottom: 90px; z-index: 30; display: grid; gap: 8px; justify-items: end; }
.kp-review-panel { width: 320px; background: #fff; border: 1px solid var(--kp-line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.2); padding: 14px; display: grid; gap: 8px; }

@media (max-width: 760px) {
  .kp-survey-row { grid-template-columns: 1fr; }
  .kp-review-panel { width: calc(100vw - 32px); }
}

/* ---------- Video, Dialog, Erklärsequenz, Lottie, Sprechertext ---------- */
.kp-narr { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.kp-narr button { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--kp-line); background: var(--kp-surface); color: var(--kp-primary); cursor: pointer; }
.kp-narr button.playing { background: var(--kp-primary); border-color: var(--kp-primary); color: #fff; }
.kp-narr { flex-wrap: wrap; gap: 6px; align-items: center; position: relative; }
.kp-narr .kp-narr-opt { padding: 5px 10px; color: var(--kp-muted); }

.kp-narr-panel { flex-basis: 100%; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 14px; margin-top: 6px; }
.kp-narr-panel[hidden] { display: none; } /* sonst hebt display: flex das hidden auf und Lautstärke und Tempo stehen immer offen */
.kp-narr-panel label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--kp-muted); }

.kp-narr-cc { flex-basis: 100%; margin: 6px 0 0; padding: 8px 12px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-text) 88%, transparent); color: #fff; font-size: 15px; line-height: 1.4; text-align: left; min-height: 1.4em; }
.kp-iv { position: relative; background: #000; border-radius: var(--kp-radius); overflow: hidden; }
.kp-iv video, .kp-iv-yt { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: min(520px, calc(100svh - var(--kp-navh, 0px) - 260px)); margin: 0 auto; object-fit: contain; background: #000; }
.kp-iv-yt iframe, .kp-iv-yt > div { width: 100%; height: 100%; border: 0; }
/* Frage im Video: das angehaltene Bild bleibt sichtbar, die Frage liegt als Karte darauf (Wunsch Kerstin) */
.kp-iv-overlay { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; padding: clamp(10px, 3%, 28px); background: rgba(6, 10, 20, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: kp-fade .25s both; }
.kp-iv-overlay[hidden] { display: none; }
.kp-iv-card { width: min(100%, 760px); max-height: 100%; overflow: auto; box-sizing: border-box; background: var(--kp-surface, #fff); color: var(--kp-text); border-radius: calc(var(--kp-radius, 8px) + 4px); box-shadow: 0 24px 60px rgba(0, 0, 0, .45); padding: clamp(14px, 3vw, 26px); text-align: left; animation: kp-zoom .25s both; }
.kp-iv-card .kp-quiz { border: 0; padding: 0; background: transparent; box-shadow: none; }
.kp-iv-full { position: absolute; top: 10px; right: 10px; z-index: 3; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; background: rgba(6, 10, 20, .55); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; opacity: .8; }
.kp-iv-full:hover, .kp-iv-full:focus-visible { opacity: 1; }
.kp-iv:fullscreen { display: grid; place-items: center; border-radius: 0; }
.kp-iv:fullscreen video { width: 100vw; height: 100vh; max-height: none; aspect-ratio: auto; }
.kp-iv:fullscreen .kp-iv-card { width: min(92%, 900px); font-size: 1.12em; }
.kp-iv-bar { position: relative; height: 6px; background: var(--kp-line); border-radius: 3px; margin-top: 10px; }
.kp-iv-bar b { display: block; height: 100%; width: 0; background: var(--kp-primary); border-radius: 3px; }
.kp-iv-bar i { position: absolute; top: -4px; width: 6px; height: 14px; margin-left: -3px; background: var(--kp-accent); border-radius: 3px; }
.kp-iv-chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.kp-iv-chapters button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--kp-line); border-radius: 999px; background: var(--kp-surface); cursor: pointer; }
.kp-iv-chapters button:hover { border-color: var(--kp-primary); }
.kp-iv-note { color: var(--kp-muted); font-size: 13px; margin: 6px 0 0; }
.kp-dialog { border: 1px solid var(--kp-line); border-radius: var(--kp-radius); padding: 22px; background: var(--kp-surface) center / cover no-repeat; }
.kp-dlg-lines { display: grid; gap: 14px; }
.kp-line { display: flex; align-items: flex-end; gap: 12px; animation: kp-up .35s both; }
.kp-line.right { flex-direction: row-reverse; }
.kp-avatar { width: 72px; height: 72px; flex: none; border-radius: 50%; overflow: hidden; background: #fff; border: 3px solid var(--c, var(--kp-primary)); box-shadow: var(--kp-shadow); }
.kp-avatar img, .kp-avatar svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.kp-bubble { position: relative; max-width: 72%; background: #fff; border: 2px solid #1d2530; border-radius: 18px; padding: 10px 16px; font-size: 17px; line-height: 1.45; box-shadow: 3px 3px 0 rgba(0,0,0,.15); animation: kp-zoom .3s both; transition: box-shadow .2s; }
.kp-bubble::before { content: ""; position: absolute; bottom: 14px; left: -11px; border: 9px solid transparent; border-right-color: #1d2530; border-left-width: 0; }
.kp-line.right .kp-bubble::before { left: auto; right: -11px; border-width: 9px; border-color: transparent; border-left-color: #1d2530; border-right-width: 0; }

.kp-bubble.speaking { box-shadow: 0 0 0 4px color-mix(in srgb, var(--kp-accent) 45%, transparent), 3px 3px 0 rgba(0,0,0,.15); }
.kp-dlg-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

.kp-conf-topic { margin: 0; display: grid; gap: 2px; } .kp-conf-topic b { font-size: 1.15em; color: var(--kp-title, var(--kp-primary)); }
.kp-conf-ask { margin: 0; }
.kp-conf-btns { display: flex; flex-wrap: wrap; gap: 8px; }

.kp-ia-frame { display: block; width: 100%; border: 0; background: transparent; }
.kp-ia-done { margin: 8px 0 0; font-weight: 600; color: var(--kp-accent-ink, var(--kp-primary)); }
.kp-game-done { margin: 0 0 10px; font-weight: 600; color: var(--kp-accent-ink, var(--kp-primary)); }
/* ---------- Fallsammlung (moderierte Fallarbeit) ---------- */

.kp-cb-card:hover { transform: translateY(-2px); box-shadow: var(--kp-shadow); border-color: var(--kp-accent); }

.kp-cb-top { display: flex; align-items: center; gap: 8px; }

.kp-cb-panelwrap { width: min(860px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--kp-surface); color: var(--kp-text); border-radius: calc(var(--kp-radius) + 4px); overflow: hidden; box-shadow: 0 26px 72px rgba(0,0,0,.4); }
.kp-cb-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; background: var(--kp-primary); color: #fff; }
.kp-cb-head h2 { margin: 2px 0 0; font-size: clamp(18px, 2.2vw, 22px); line-height: 1.2; color: #fff; }
.kp-cb-eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.kp-cb-x { margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.2); color: #fff; font-size: 15px; cursor: pointer; }

.kp-cb-sw small { display: block; font-size: 12px; color: var(--kp-muted); }
.kp-cb-sw.on { border-color: var(--kp-accent); background: color-mix(in srgb, var(--kp-accent) 10%, var(--kp-surface)); }
.kp-cb-sw-ic { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--kp-primary) 10%, transparent); color: var(--kp-primary); font-weight: 800; }

.kp-cb-acc { border-radius: var(--kp-radius); border: 1.5px solid color-mix(in srgb, var(--kp-accent) 55%, var(--kp-line)); overflow: hidden; }
.kp-cb-acc-btn .kp-ico { width: 18px; height: 18px; }

.kp-cb-anek-badge .kp-ico { width: 14px; height: 14px; }
.kp-cb-anek-tip { position: absolute; right: 0; top: 64px; z-index: 3; width: min(340px, 70vw); padding: 10px 13px; border-radius: var(--kp-radius); border: 1.5px solid var(--kp-accent); background: var(--kp-surface); box-shadow: var(--kp-shadow); font-size: 14px; }
