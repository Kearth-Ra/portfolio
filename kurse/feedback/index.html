.kp-style-comic .kp-strang-item { border-left-color: var(--kp-text); border-radius: 2px; box-shadow: none; }
.kp-style-comic .kp-strang-eyebrow { color: #6E6E76; }
.kp-style-comic .kp-strang-media img { filter: grayscale(1) contrast(1.05); }
.kp-style-comic .kp-sc-result { background: #EBEBED; }
.kp-style-comic .kp-prof-row { background: var(--kp-surface); border-color: var(--kp-line); }
.kp-style-comic .kp-prof-ico { color: var(--kp-text); border-color: #6E6E76; }
.kp-style-comic .kp-prof-bar i { background: var(--kp-text); }
.kp-style-comic .kp-sc-track input[type=range]::-webkit-slider-runnable-track { background: #E6E6E9; border-color: #C9C9CE; }
.kp-style-editorial :is(.kp-ordner-tab, .kp-ordner-sheet, .kp-strang-item) { border-radius: 0; }
.kp-style-editorial .kp-ordner-sheet > .kp-page-head h1 { font-style: normal; }
.kp-style-praxis :is(.kp-ordner-tab, .kp-ordner-sheet) { border-radius: 2px; }
.kp-style-praxis .kp-slide-ordner:not(.kp-has-bg) { background: var(--kp-tint, #EAD9D3); }
.kp-style-praxis .kp-ordner-sheet .kp-page-head::before { margin-left: auto; margin-right: auto; }
.kp-style-praxis .kp-buehne-hell .kp-buehne-top .kp-page-head :is(h1, .kp-eyebrow) { color: var(--kp-title); text-align: left; }
.kp-style-praxis .kp-buehne-hell .kp-buehne-top .kp-page-head .kp-accent { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-style-praxis .kp-buehne-hell .kp-buehne-top .kp-page-head::before { background: var(--kp-primary); }
.kp-style-nacht .kp-ordner-tab.current { background: var(--kp-flow); color: var(--kp-ink); border-color: transparent; }
.kp-style-nacht .kp-ordner-tab.current::after { background: color-mix(in srgb, #2EE6A8 30%, #0e1c31); }
.kp-style-nacht .kp-prof-bar i { background: var(--kp-flow); }
.kp-style-nacht .kp-strang-item { border-left-color: #2EE6A8; }
/* Microlearning: das dunkle Kapitelband läuft auf Folien und geteilten Seiten nicht über die Bildschirmbreite, sondern
   bleibt als Kasten in seiner Spalte (sonst ragt es aus dem Ordnerblatt, der Kreisfläche oder dem Kopf der Bühne) */
.kp-nav-links.kp-style-micro :is(.kp-split-text, .kp-slide) .kp-page-head.kp-ml-chapstart, .kp-style-micro :is(.kp-split-text, .kp-slide) .kp-page-head.kp-ml-chapstart { margin: 0 0 20px; padding: 22px 26px 20px; border-radius: 4px; }
.kp-style-micro :is(.kp-split-text, .kp-slide) .kp-page-head.kp-ml-chapstart > * { max-width: none; }
.kp-style-micro .kp-slide-buehne.kp-buehne-hell .kp-buehne-top .kp-page-head.kp-ml-chapstart h1 { color: #fff; }
.kp-style-micro .kp-slide-buehne.kp-buehne-hell .kp-buehne-top .kp-page-head.kp-ml-chapstart :is(.kp-eyebrow, .kp-ml-chap) { color: rgba(255,255,255,.85); }
/* Szene und Lupe je Stil: Comic grau (Figuren bleiben farbig, gedämpft), Praxis mit Marine-Rand und Beige, Nacht mit Leuchtrand */
.kp-style-comic .kp-slide-szene.kp-has-bg::before, .kp-style-comic .kp-slide-lupe.kp-has-bg::before { filter: grayscale(1) contrast(1.05); }
.kp-style-comic :is(.kp-slide-szene, .kp-slide-lupe) { background: linear-gradient(180deg, #EBEBED, #DCDCE0); }
.kp-style-comic .kp-szene-fig { filter: saturate(.8); }
.kp-style-comic :is(.kp-szene-plakette, .kp-szene-schild) { border-radius: 2px; box-shadow: none; border: 1px solid #6E6E76; }
.kp-style-comic .kp-slide-lupe { --kp-lupe-rand: #1A1A1C; }
.kp-style-comic .kp-lupe-griff { background: linear-gradient(90deg, #111, #3a3a3e 45%, #111); }
.kp-style-praxis .kp-slide-lupe { --kp-lupe-rand: var(--kp-title, #153B60); }
.kp-style-praxis .kp-lupe-griff { background: linear-gradient(90deg, #0d2742, #153B60 45%, #0b2036); }
.kp-style-praxis :is(.kp-slide-szene, .kp-slide-lupe) { background: linear-gradient(180deg, #fff, var(--kp-tint, #EAD9D3)); }
.kp-style-praxis :is(.kp-szene-plakette, .kp-lupe-glas) .kp-page-head { margin: 0; }
.kp-style-praxis .kp-szene-plakette .kp-page-head::before { width: 40px; height: 4px; margin-bottom: 8px; }
.kp-style-praxis .kp-lupe-glas .kp-page-head::before { margin-left: auto; margin-right: auto; }
.kp-style-praxis :is(.kp-szene-plakette, .kp-szene-schild) { border-radius: 2px; }
.kp-style-nacht .kp-slide-lupe { --kp-lupe-rand: #2B7FFF; }
.kp-style-nacht .kp-lupe-glas { box-shadow: inset 0 0 0 4px rgba(46,230,168,.35), 0 0 40px rgba(43,127,255,.35); }
.kp-style-editorial :is(.kp-szene-plakette, .kp-szene-schild) { border-radius: 0; }
.kp-style-micro :is(.kp-szene-plakette, .kp-lupe-glas, .kp-muster-karte, .kp-rahmen-karte, .kp-kopfband-karte) .kp-page-head.kp-ml-chapstart { background: none; padding: 0; margin: 0; color: var(--kp-text); }
.kp-style-micro :is(.kp-szene-plakette, .kp-lupe-glas, .kp-muster-karte, .kp-rahmen-karte, .kp-kopfband-karte) .kp-page-head.kp-ml-chapstart h1 { color: var(--kp-title, var(--kp-text)); }
.kp-style-micro :is(.kp-szene-plakette, .kp-lupe-glas, .kp-muster-karte, .kp-rahmen-karte, .kp-kopfband-karte) .kp-page-head.kp-ml-chapstart :is(.kp-ml-num, .kp-ml-chap, .kp-ml-num small) { color: var(--kp-muted); }
/* Muster, Verlauf, Farbglas, Stimme mit Foto je Stil */
.kp-style-comic .kp-slide-muster { background: #1A1A1C; }
.kp-style-comic .kp-muster-feld { color: #3a3a3f; }
.kp-style-comic .kp-muster-feld i:nth-child(odd)::after { background: #1A1A1C; }
.kp-style-comic :is(.kp-muster-foto, .kp-verlauf-foto, .kp-acc-bild img, .kp-st-foto img) { filter: grayscale(1) contrast(1.05); }
.kp-style-comic .kp-card-primary.kp-card-farbglas { background: rgba(26, 26, 28, .82) !important; }
.kp-style-comic .kp-statement.kp-statement-foto { background: #EBEBED; }
.kp-style-comic .kp-acc-bild[open] .kp-acc-bar { border-bottom-color: #1A1A1C; }
.kp-style-nacht .kp-card-primary.kp-card-farbglas { background: color-mix(in srgb, #2B7FFF 70%, transparent) !important; }
.kp-style-editorial :is(.kp-muster-karte, .kp-muster-feld i) { border-radius: 0; }
/* Rahmen, Bildkacheln, Bildsortierung und Bildreihe je Stil */
.kp-style-comic .kp-slide-rahmen { background: linear-gradient(135deg, #E4E4E7, var(--kp-bg)); }
.kp-style-comic .kp-rahmen-foto { filter: grayscale(1) contrast(1.05); }
.kp-style-comic .kp-rahmen-foto::before { border-color: #1A1A1C; }
.kp-style-comic .kp-rahmen-karte { box-shadow: none; border: 1px solid #6E6E76; }
.kp-style-comic .kp-rahmen-karte > .kp-page-head h1::after { background: #1A1A1C; }
.kp-style-comic :is(.kp-tiles .kp-flip-front .kp-flip-img, .kp-sort-img, .kp-order-img, .kp-pins-stage > img) { filter: grayscale(1) contrast(1.05); }
.kp-style-comic .kp-tiles :is(.kp-flip-front, .kp-flip-back) { border-top-color: #1A1A1C; box-shadow: none; border: 1px solid #6E6E76; border-top-width: 4px; }
.kp-style-comic :is(.kp-sort-bilder .kp-sort-cat-title, .kp-order-place) { background: #1A1A1C; color: #fff; }
.kp-style-comic .kp-sort-bilder .kp-sort-cat ul { background: #E4E4E7; }
.kp-style-praxis .kp-slide-rahmen { background: var(--kp-tint, #EAD9D3); }
.kp-style-praxis.kp-screen .kp-main:not(:has(.kp-split, .kp-slide)) .kp-flipgrid.kp-tiles { max-width: calc((var(--kp-screen-h, 100svh) - 440px) / var(--rows, 2) * var(--n, 3)); }
.kp-style-praxis .kp-rahmen-karte > .kp-page-head h1::after { content: none; }
.kp-style-nacht .kp-rahmen-foto::before { border-color: #2EE6A8; }
.kp-style-nacht .kp-rahmen-karte > .kp-page-head h1::after, .kp-style-nacht .kp-order-place { background: var(--kp-flow); color: var(--kp-ink); }
.kp-style-nacht .kp-sort-bilder .kp-sort-cat-title { background: var(--kp-flow); color: var(--kp-ink); }
.kp-style-nacht .kp-tile-badge { background: var(--kp-flow); color: var(--kp-ink); }
.kp-style-editorial :is(.kp-rahmen-karte, .kp-tiles .kp-flip-front, .kp-tiles .kp-flip-back) { border-radius: 0; }
.kp-style-micro .kp-on-dark .kp-btn { color: var(--kp-on-accent, #fff); }
.kp-style-micro .kp-ordner-sheet { border-width: 1px; border-color: #C5CED2; box-shadow: -8px 10px 0 -1px color-mix(in srgb, var(--kp-accent) 22%, #fff), -8px 10px 0 0 #C5CED2; }
.kp-style-micro .kp-ordner-tab:not(.current) { border-color: #C5CED2; }
/* ---------- Designprüfung 10.10.2026: Folien-Maßstab, Leiste, Verläufe, Akzent und Erkennungszeichen je Stil ----------
   1. Auf Bildschirmseiten liest man wie auf einer Folie: Titel bis 60 px, Grundschrift bis 20 px (--kp-fs aus dem Player),
      Antworten mindestens 52 px hoch, Bildkarten randlos mit Auswahlrahmen. Folien mit eigener Titelgröße (Plakat, Szene,
      Lupe, Mitte auf Foto) behalten ihre Regel, weil sie spezifischer sind. */
.kp-screen .kp-main :where(.kp-split-text, .kp-slide, .kp-fit) :where(.kp-page-head) h1 { font-size: clamp(32px, calc(1.9vw + 20px), 56px); line-height: 1.08; overflow-wrap: break-word; hyphens: auto; }
.kp-screen .kp-split-text { container-type: inline-size; }
.kp-screen .kp-main .kp-split-text :where(.kp-page-head) h1 { font-size: clamp(30px, 11cqi, 60px); }
.kp-screen .kp-muster-karte .kp-page-head h1 { font-size: clamp(26px, 2.6vw, 40px); }
.kp-screen .kp-kopfband-karte .kp-page-head h1 { font-size: clamp(24px, 2.4vw, 36px); }
.kp-screen .kp-quiz .kp-q { font-size: calc(var(--kp-fs, 17px) * 1.25); }
.kp-screen .kp-answer { min-height: 52px; font-size: var(--kp-fs, 17px); }
.kp-screen .kp-answers:not([class*="kp-ans-"]) .kp-answer input { width: 20px; height: 20px; flex: none; }
.kp-screen .kp-split-stage .kp-quiz { padding: clamp(24px, 2.4vw, 36px); }
.kp-badge { font-size: 12px; }
/* Bildkarten: Bild bis an den Rand, Auswahlpunkt auf dem Bild, gewählte Karte mit kräftigem Rahmen */
.kp-ans-cards .kp-answer { position: relative; padding: 0 0 14px; gap: 12px; overflow: hidden; }
.kp-ans-cards .kp-answer-img { border-radius: 0; }
.kp-ans-cards .kp-answer input { appearance: none; -webkit-appearance: none; position: absolute; top: 10px; left: 10px; z-index: 1; width: 26px; height: 26px; margin: 0; border: 2px solid #fff; border-radius: 50%; background: rgba(0, 0, 0, .35); box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; }
.kp-ans-cards .kp-answer input[type="checkbox"] { border-radius: 4px; }
.kp-ans-cards .kp-answer input:checked { background: var(--kp-accent); box-shadow: inset 0 0 0 4px #fff, 0 2px 8px rgba(0,0,0,.3); }
.kp-ans-cards .kp-answer-text { padding: 0 12px; font-size: var(--kp-fs, 17px); }
/* Doppelklasse: sonst gewinnt beim Fokus der Leuchtschein aus „Effekte hochwertig“ */
.kp-answers.kp-ans-cards .kp-answer.kp-answer:has(input:checked) { box-shadow: 0 0 0 3px var(--kp-accent), 0 10px 26px rgba(16, 24, 40, .18); }
.kp-ans-cards .kp-answer:has(input:focus-visible) { outline: 3px solid var(--kp-primary); outline-offset: 3px; }
/* 2. Leiste: die dezente Leiste ist eine Fläche (vorher war die rechte Hälfte dunkler), „Weiter“ ist der deutlichste Knopf */
.kp-nav-dezent .kp-navbar .kp-foot { background: transparent; gap: 6px; padding: 0 10px 0 0; }
.kp-nav-dezent .kp-dz-arrow[data-next] { width: 76px; min-height: 36px; margin: 4px 0; border-radius: max(4px, calc(var(--kp-radius, 8px) * .6)); background: var(--kp-accent); color: var(--kp-on-accent, #fff); opacity: 1; }
.kp-nav-dezent .kp-dz-arrow[data-next] .kp-ico { width: 26px; height: 26px; }
.kp-nav-dezent .kp-dz-arrow[data-next]:not(:disabled):hover { background: color-mix(in srgb, var(--kp-accent) 85%, #000); }
.kp-nav-dezent .kp-dz-arrow[data-next]:disabled { background: transparent; color: inherit; opacity: .3; }
.kp-nav-dezent .kp-dz-arrow[data-next]:focus-visible { outline: 2px solid var(--kp-nav-ink); outline-offset: 2px; }
.kp-style-nacht.kp-nav-dezent .kp-dz-arrow[data-next] { background: var(--kp-flow); color: var(--kp-ink); }
.kp-nav-dezent .kp-dz-arrow.kp-dz-map[data-next] { width: auto; padding: 0 16px 0 12px; border-radius: 999px; }
.kp-nav-dezent .kp-dz-arrow.kp-dz-map[data-next] .kp-ico { width: 20px; height: 20px; }
@media (max-width: 600px) { .kp-nav-dezent .kp-dz-arrow.kp-dz-map[data-next] { width: 52px; padding: 0; } }
/* Im dunklen Modus stand die Schrift der hellen Leiste in der Hauptfarbe auf dunkler Fläche (Foto dunkel: Magenta auf Violett) */
.kp-dark:is(.kp-nav-unten, .kp-nav-links):not(.kp-nav-dezent) { --kp-nav-ink: var(--kp-text); }
/* 3. Kreis: Verlauf in einer Farbfamilie (vorher Akzent → Hauptfarbe → Grund, das mischte sich zu Grau);
      die Übung in der schwebenden Karte trägt keine zweite Karte */
.kp-slide-kreis { background: radial-gradient(130% 100% at 0% 0%, color-mix(in srgb, var(--kp-accent) 26%, var(--kp-bg)) 0%, color-mix(in srgb, var(--kp-accent) 10%, var(--kp-bg)) 48%, var(--kp-bg) 88%); }
.kp-kreis-float .kp-quiz { background: transparent; border: 0; box-shadow: none; padding: 0; }
/* 4. Akzent sparsam: große Flächen nie in reiner Signalfarbe (Foto dunkel füllte die Karte in Magenta) */
.kp-style-foto.kp-dark .kp-slide-karte .kp-slide-panel { background: color-mix(in srgb, var(--kp-primary) 34%, #1d1a29); }
.kp-style-foto.kp-dark .kp-slide-karte .kp-slide-panel .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
/* 5. Erkennungszeichen je Stil: nicht nur Farbe und Schrift, sondern Form, Fläche und Linie
      KR: Haarlinien, Weiß, kursives Serifen-Akzentwort ohne Marker */
.kp-style-kr.kp-screen { --kp-stage-bg: #fff; }
.kp-style-kr .kp-split-stage { border-left: 1px solid color-mix(in srgb, var(--kp-primary) 16%, transparent); }
.kp-style-kr .kp-split-flip .kp-split-stage { border-left: 0; border-right: 1px solid color-mix(in srgb, var(--kp-primary) 16%, transparent); }
.kp-style-kr .kp-page-head h1::after { content: ""; display: block; width: 48px; height: 1px; margin-top: 20px; background: currentColor; }
.kp-style-kr .kp-split-stage .kp-quiz { background: #fff; border: 1px solid color-mix(in srgb, var(--kp-primary) 18%, transparent); }
.kp-fx-premium.kp-style-kr :is(h1, h2, h3) .kp-accent, .kp-style-kr :is(h1, h2, h3) .kp-accent { background: none; font-style: normal; color: var(--kp-accent-ink, var(--kp-accent)); padding: 0; }
.kp-style-kr .kp-on-dark :is(h1, h2, h3) .kp-accent { color: color-mix(in srgb, var(--kp-accent) 45%, white); }
/* Pastell: weiche, getönte Flächen statt weißer Karten, Pillen statt Kästen */
.kp-style-pastell.kp-screen { --kp-stage-bg: color-mix(in srgb, var(--kp-accent) 13%, var(--kp-bg)); }
.kp-style-pastell .kp-split-stage .kp-quiz { background: color-mix(in srgb, var(--kp-primary) 7%, var(--kp-bg)); border: 0; border-radius: 28px; box-shadow: none; }
.kp-style-pastell .kp-kreis-float { border-radius: 28px; background: color-mix(in srgb, var(--kp-primary) 7%, var(--kp-bg)); }
.kp-style-pastell .kp-answers:not([class*="kp-ans-"]) .kp-answer { border-radius: 999px; border-color: transparent; background: #fff; padding-left: 22px; }
.kp-style-pastell .kp-btn { border-radius: 999px; }
.kp-style-pastell .kp-ans-cards .kp-answer { border-radius: 22px; }
.kp-style-pastell .kp-slide-kreis .kp-slide-panel > .kp-block:not(.kp-b-gate):not(.kp-b-sources):not([hidden]) { border-left: 0; border-radius: 22px; }
/* TBW: Raster mit feinen Linien, nummerierte Antworten, eckig mit Petrol-Kante */
.kp-style-tbw .kp-split-stage { background-image: linear-gradient(color-mix(in srgb, var(--kp-primary) 8%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--kp-primary) 8%, transparent) 1px, transparent 1px); background-size: 40px 40px; }
.kp-style-tbw :is(.kp-split-stage .kp-quiz, .kp-kreis-float) { border: 1px solid #E8E8E8; border-top: 6px solid var(--kp-primary); border-radius: 0; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.kp-style-tbw .kp-answers:not([class*="kp-ans-"]) { counter-reset: kp-tbw; }
.kp-style-tbw .kp-answers:not([class*="kp-ans-"]) .kp-answer { position: relative; border-radius: 0; border-width: 1px; }
.kp-style-tbw .kp-answers:not([class*="kp-ans-"]) .kp-answer::after { counter-increment: kp-tbw; content: counter(kp-tbw, upper-alpha); order: -1; flex: none; display: grid; place-items: center; width: 28px; height: 28px; background: var(--kp-accent); color: #2b2a2a; font-weight: 700; font-size: 14px; }
.kp-style-tbw .kp-answers:not([class*="kp-ans-"]) .kp-answer input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.kp-style-tbw .kp-answers:not([class*="kp-ans-"]) .kp-answer:has(input:checked)::after { background: var(--kp-primary); color: #fff; }
.kp-style-tbw .kp-answers:not([class*="kp-ans-"]) .kp-answer:has(input:checked) { border-color: var(--kp-primary); }
.kp-style-tbw .kp-answers:not([class*="kp-ans-"]) .kp-answer:has(input:focus-visible) { outline: 3px solid var(--kp-primary); outline-offset: 2px; }
.kp-style-tbw .kp-btn { border-radius: 0; }
/* Foto: kühle Bühne, Dachzeile mit Linie, Übungskarten eckig mit Akzentkante oben wie Bildunterschriften im Magazin */
.kp-style-foto:not(.kp-dark).kp-screen { --kp-stage-bg: #E7E7EB; }
.kp-style-foto .kp-page-head .kp-eyebrow { display: flex; align-items: center; gap: 12px; letter-spacing: .14em; }
.kp-style-foto .kp-page-head .kp-eyebrow::before { content: ""; width: 32px; height: 2px; background: currentColor; flex: none; }
.kp-style-foto:not(.kp-dark) :is(.kp-split-stage .kp-quiz, .kp-kreis-float) { border: 0; border-top: 3px solid var(--kp-accent); border-radius: 0; box-shadow: 0 24px 60px rgba(16, 18, 24, .16); }


/* ---------- Bildcollage mit Nummern (cards.look 'mosaik') ---------- */
.kp-cards.kp-cards-mosaik { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: clamp(120px, 13vw, 200px); gap: 12px; }
.kp-cards-mosaik > .kp-card-mosaik:first-child { grid-column: span 2; grid-row: span 2; }
.kp-card.kp-card-mosaik { position: relative; padding: 0; overflow: hidden; border: 0; border-radius: var(--kp-radius-sm, 6px); background: var(--kp-surface); }
.kp-card-mosaik > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.kp-mz-num { position: absolute; right: 14px; bottom: 14px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; background: var(--kp-primary); color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); transition: transform .2s, background .2s; }
.kp-mz-placed .kp-mz-num, .kp-mz-num[style] { right: auto; bottom: auto; transform: translate(-50%, -50%); }
.kp-mz-num:hover, .kp-mz-num:focus-visible { background: var(--kp-accent); color: var(--kp-on-accent, #fff); }
.kp-mz-num:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.kp-card-mosaik > .kp-card-rv.on { position: absolute; left: 10px; right: 10px; bottom: 10px; margin: 0; background: var(--kp-surface); color: var(--kp-text); box-shadow: 0 8px 22px rgba(0, 0, 0, .28); }
.kp-style-comic .kp-card-mosaik > img { filter: grayscale(1) contrast(1.05); }
@media (max-width: 700px) {
  .kp-cards.kp-cards-mosaik { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 150px; }
  .kp-cards-mosaik > .kp-card-mosaik:first-child { grid-row: span 1; }
}
/* ---------- Antworten als Pillen (q.look 'pillen'): Ja, ?, Nein nebeneinander ---------- */
.kp-answers.kp-ans-pillen { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--kp-text) 7%, transparent); }
.kp-answers.kp-ans-pillen .kp-answer.kp-answer { position: relative; min-height: 0; margin: 0; padding: 9px 20px; border: 0; border-radius: 999px; background: none; box-shadow: none; font-weight: 600; cursor: pointer; }
.kp-ans-pillen .kp-answer > input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.kp-ans-pillen .kp-answer-text { padding: 0; }
.kp-answers.kp-ans-pillen .kp-answer.kp-answer:has(input:checked) { background: var(--kp-primary); color: #fff; }
.kp-answers.kp-ans-pillen .kp-answer.kp-answer:has(input:focus-visible) { outline: 3px solid var(--kp-accent); outline-offset: 1px; }
.kp-answers.kp-ans-pillen .kp-answer.kp-right { background: color-mix(in srgb, #1f8a4c 18%, var(--kp-surface)); color: var(--kp-text); }
.kp-answers.kp-ans-pillen .kp-answer.kp-wrong:has(input:checked) { background: color-mix(in srgb, #c0392b 16%, var(--kp-surface)); color: var(--kp-text); }
.kp-ans-pillen .kp-answer-fb { display: none; }
.kp-style-comic .kp-answers.kp-ans-pillen, .kp-style-comic .kp-answers.kp-ans-pillen .kp-answer.kp-answer { border-radius: 0; }
.kp-style-nacht .kp-answers.kp-ans-pillen .kp-answer.kp-answer:has(input:checked) { background: var(--kp-flow); color: var(--kp-ink); }
/* ---------- Begleitfigur mit Foto oben (guide.side 'oben') ---------- */
.kp-guide.kp-guide-oben { grid-template-columns: 1fr; align-items: stretch; max-width: 720px; }
.kp-guide-oben .kp-guide-media { border-radius: var(--kp-radius) var(--kp-radius) 0 0; }
.kp-guide-oben .kp-guide-media img, .kp-guide-oben .kp-guide-media video { aspect-ratio: 16 / 9; max-height: 380px; }
.kp-guide-oben .kp-guide-card { margin: 0; border-radius: 0 0 var(--kp-radius) var(--kp-radius); }
@media (max-width: 760px) { .kp-guide-oben .kp-guide-card { margin: 0; } }
/* ---------- Moderation neben dem Video (media.presenter) ---------- */
.kp-presenter { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); align-items: stretch; border-radius: var(--kp-radius); overflow: hidden; background: var(--kp-surface); }
.kp-pres-person { position: relative; margin: 0; min-height: 240px; background: color-mix(in srgb, var(--kp-primary) 10%, var(--kp-bg)); clip-path: polygon(0 0, 100% 0, calc(100% - 72px) 100%, 0 100%); margin-right: -72px; z-index: 1; }
.kp-pres-person img { position: absolute; left: 0; bottom: 0; width: calc(100% - 72px); height: 100%; object-fit: contain; object-position: 50% 100%; }
.kp-pres-person figcaption { position: absolute; left: 14px; bottom: 14px; padding: 6px 12px; border-radius: 4px; background: var(--kp-surface); color: var(--kp-text); font-size: 14px; line-height: 1.3; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
.kp-pres-person figcaption span { display: block; color: var(--kp-muted); font-size: 13px; }
.kp-presenter > .kp-media { margin: 0; display: flex; }
.kp-presenter > .kp-media > :is(video, .kp-embed, .kp-video-dummy) { width: 100%; height: 100%; object-fit: cover; border-radius: 0; margin: 0; }
.kp-presenter .kp-embed { aspect-ratio: auto; min-height: 100%; }
.kp-style-comic .kp-pres-person { background: #E4E4E7; }
.kp-style-comic .kp-pres-person img { filter: grayscale(1) contrast(1.05); }
@media (max-width: 700px) {
  .kp-presenter { grid-template-columns: 1fr; }
  .kp-pres-person { min-height: 200px; clip-path: none; margin-right: 0; }
}

/* ---------- Stimme statt Foto-Karte (team.look 'stimme') ---------- */
.kp-voice-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: clamp(24px, 4vw, 56px); }
.kp-voice-media { position: relative; height: clamp(180px, 22vw, 280px); display: grid; place-items: center; isolation: isolate; }
.kp-voice-media::before { content: ''; position: absolute; inset: 4% 16%; z-index: -1; border-radius: 58% 42% 55% 45% / 48% 60% 40% 52%; background: linear-gradient(160deg, color-mix(in srgb, var(--kp-primary) 28%, var(--kp-surface)), color-mix(in srgb, var(--kp-accent) 22%, var(--kp-surface))); }
.kp-voice-b1::before { border-radius: 42% 58% 38% 62% / 55% 45% 55% 45%; background: linear-gradient(200deg, color-mix(in srgb, var(--kp-accent) 26%, var(--kp-surface)), color-mix(in srgb, var(--kp-primary) 20%, var(--kp-surface))); }
.kp-voice-b2::before { border-radius: 50% 50% 38% 62% / 60% 40% 60% 40%; }
.kp-voice-media > img, .kp-voice-media > svg { position: absolute; inset: 0; margin: auto; width: 84%; height: 100%; object-fit: contain; }
.kp-voice-box .kp-ga-wave { justify-content: space-between; }
.kp-voice-box .kp-ga-wave i { flex: 0 0 3px; max-width: 3px; }
.kp-voice-media > .kp-ai-badge { left: 18%; }
.kp-voice-box { margin-top: 18px; padding: 12px 16px; border-radius: var(--kp-radius-sm, 6px); background: color-mix(in srgb, var(--kp-text) 5%, var(--kp-surface)); }
.kp-voice-box .kp-guide-audio { margin: 0; }
.kp-voice-who { margin: 0; font-weight: 600; }
.kp-voice-read > summary { justify-content: space-between; margin: 10px 0 0; text-align: left; font-weight: 400; font-size: 14px; border-radius: 6px; }
.kp-voice-read > .kp-text { margin-top: 10px; }
.kp-person-media { position: relative; }
.kp-style-comic .kp-voice-media::before { background: #E4E4E7; }
.kp-style-comic .kp-voice-media > img { filter: grayscale(1) contrast(1.05); }
@media (max-width: 700px) { .kp-voice-grid { grid-template-columns: 1fr; } }
/* Die Figuren bewegen sich leicht (Kerstin 28.10.2026: „nur eine Tonspur ohne Video, die Figuren dürfen sich aber leicht bewegen“):
   sie schweben ruhig, je Person versetzt; spricht die Person, wippt sie im Sprechtakt. Gilt für jedes Bild (Foto, PNG, SVG, Lottie),
   SVG-Illustrationen bewegen dazu ihre Teile über liveIllus(). Nicht unter „Bewegung reduzieren“, nicht bei Effekten „dezent“. */
@keyframes kp-voice-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(.6deg); } }
@keyframes kp-voice-talk { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-3px) scale(1.012, .992); } 60% { transform: translateY(-1px) scale(.996, 1.008); } }
@keyframes kp-voice-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03, .98); } }
.kp-fx-premium .kp-voice-media > :is(img, svg) { height: 94%; animation: kp-voice-float 5.6s ease-in-out infinite; transform-origin: 50% 100%; }
.kp-fx-premium .kp-voice-b1 > :is(img, svg) { animation-duration: 6.4s; animation-delay: -2.1s; }
.kp-fx-premium .kp-voice-b2 > :is(img, svg) { animation-duration: 6s; animation-delay: -3.7s; }
.kp-fx-premium .kp-voice-media::before { animation: kp-voice-breathe 7s ease-in-out infinite; }
.kp-fx-premium .kp-voice:has(.kp-guide-audio.playing) .kp-voice-media > :is(img, svg) { animation: kp-voice-talk .62s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .kp-voice-media > :is(img, svg), .kp-voice-media::before { animation: none !important; } }

/* ---------- Titelschild über der Fotokante (hero.layout 'band') ---------- */
.kp-hero2.kp-hero-band { display: flex; flex-direction: column; align-items: stretch; }
.kp-hero-band .kp-hero-media { min-height: 0; border-radius: var(--kp-radius); }
.kp-hero-band .kp-hero-media img { min-height: 0; max-height: none; height: clamp(220px, 34vw, 440px); }
.kp-band-plate { position: relative; z-index: 2; align-self: center; box-sizing: border-box; width: min(820px, calc(100% - 2 * var(--kp-side))); margin: -76px 0 0; padding: 22px 32px; background: var(--kp-surface); text-align: center; box-shadow: 0 14px 34px -18px rgba(16, 24, 40, .35); }
.kp-band-plate .kp-eyebrow { justify-content: center; margin-bottom: 6px; }
.kp-hero2.kp-hero-band .kp-band-plate .kp-hero-title { margin: 0; font-size: clamp(22px, 2.4vw, 34px); line-height: 1.15; text-transform: uppercase; letter-spacing: .02em; }
.kp-band-body { align-self: center; max-width: 760px; margin: 26px auto 0; text-align: center; }
.kp-band-body .kp-hero-meta { justify-content: center; }
.kp-band-body .kp-hero-start { margin-top: 18px; }
.kp-style-comic .kp-band-plate { box-shadow: none; border: 1px solid var(--kp-line); }
@media (max-width: 760px) { .kp-band-plate { width: calc(100% - 24px); margin-top: -40px; padding: 16px 18px; } }
/* ---------- Rundes Video vor einem Foto (vstatements.look 'kreis' mit items[].backdrop) ---------- */
.kp-vround-stage { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 3 / 2; margin: 0 0 16px; overflow: hidden; border-radius: var(--kp-radius-sm, 6px); background: var(--kp-vbg) var(--kp-vbg-pos, center) / cover no-repeat, var(--kp-surface); }
.kp-vround .kp-vround-stage .kp-vround-media { width: 64%; max-width: 300px; margin: 0; box-shadow: 0 0 0 6px rgba(255, 255, 255, .35), 0 18px 40px -16px rgba(0, 0, 0, .5); }
.kp-style-comic .kp-vround-stage { background-blend-mode: luminosity; }

/* ---------- Tagesablauf mit Punkten (cards.look 'reihe', Vorbild „DISRU… WAS?“) ---------- */
.kp-reihe-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 64px); align-items: start; margin-bottom: 18px; }
.kp-reihe-intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.kp-reihe-intro > .kp-text > :last-child { margin-bottom: 0; }
.kp-reihe-ask { margin: 0; font-weight: 700; color: var(--kp-text); line-height: 1.45; }
.kp-more-btn { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--kp-text); cursor: pointer; transition: transform .3s var(--kp-ease-out, ease), background .2s; }
.kp-more-btn span::before, .kp-more-btn span::after { content: ''; position: absolute; left: 50%; top: 50%; width: 14px; height: 2px; margin: -1px 0 0 -7px; border-radius: 2px; background: var(--kp-bg); }
.kp-more-btn span::after { transform: rotate(90deg); }
.kp-more-btn[aria-expanded="true"] { transform: rotate(45deg); background: var(--kp-accent); }
.kp-more-btn[aria-expanded="true"] span::before, .kp-more-btn[aria-expanded="true"] span::after { background: var(--kp-on-accent, #fff); }
.kp-more-btn:hover { background: var(--kp-accent); }
.kp-more-btn:hover span::before, .kp-more-btn:hover span::after { background: var(--kp-on-accent, #fff); }
.kp-more-btn:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 3px; }
.kp-reihe-more { max-width: 52%; margin: -6px 0 18px; padding: 14px 18px; border: 1px solid var(--kp-line); border-radius: var(--kp-radius-sm, 6px); background: var(--kp-surface); animation: kp-fade .35s ease-out both; }
.kp-cards.kp-cards-reihe { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: clamp(12px, 2vw, 24px); padding: clamp(18px, 3vw, 32px); border-radius: var(--kp-radius-sm, 6px); background: linear-gradient(100deg, color-mix(in srgb, var(--kp-primary) 16%, var(--kp-surface)), color-mix(in srgb, var(--kp-accent) 14%, var(--kp-surface))); }
.kp-card.kp-card-reihe { position: relative; aspect-ratio: 3 / 4; padding: 0; overflow: hidden; border: 0; border-radius: 3px; background: color-mix(in srgb, var(--kp-text) 8%, var(--kp-surface)); box-shadow: none; }
.kp-card-reihe > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.kp-card-reihe > .kp-ck-dot { right: auto; width: 36px; height: 36px; transform: translate(-50%, -50%); }
.kp-card-reihe > .kp-card-rv.on { position: absolute; left: 8px; right: 8px; bottom: 8px; margin: 0; font-size: .86em; background: var(--kp-surface); color: var(--kp-text); box-shadow: 0 8px 22px rgba(0, 0, 0, .28); }
.kp-style-comic .kp-cards.kp-cards-reihe { background: #E4E4E7; }
.kp-style-comic .kp-card-reihe > img { filter: grayscale(1) contrast(1.05); }
@media (max-width: 760px) {
  .kp-reihe-head { grid-template-columns: 1fr; }
  .kp-reihe-more { max-width: none; }
  .kp-cards.kp-cards-reihe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- Meinung zur großen Zahl (bignumber.ask) und Leuchtzahl (bignumber.look 'leuchten') ---------- */
.kp-bignum-hasask { text-align: left; }
.kp-bignum-hasask .kp-bignum-value { justify-content: center; }
.kp-bignum-hasask .kp-bignum-text { margin-left: 0; }
.kp-bn-ask { max-width: 620px; margin: 18px 0 0; }
.kp-bn-q { margin: 0 0 14px; font-weight: 700; }
.kp-bn-opts { display: flex; flex-wrap: wrap; gap: 12px 56px; }
.kp-bn-opt { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.kp-bn-opt input { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 0; color: inherit; border: 2px solid currentColor; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.kp-bn-opt input::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: currentColor; transform: scale(0); transition: transform .15s; }
.kp-bn-opt input:checked::before { transform: scale(1); }
.kp-bn-opt input:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 3px; }
.kp-bn-opt input:disabled { cursor: default; opacity: .8; }
.kp-bn-act { display: flex; justify-content: flex-end; margin-top: 8px; }
.kp-bn-ok[disabled] { opacity: .45; cursor: not-allowed; }
.kp-bn-reply { margin: 14px 0 0; padding: 12px 16px; border-radius: var(--kp-radius-sm, 6px); background: color-mix(in srgb, var(--kp-accent) 14%, var(--kp-surface)); color: var(--kp-text); font-weight: 600; animation: kp-fade .35s ease-out both; }
.kp-bn-reply:focus { outline: none; }
.kp-bignum.kp-bignum-glow { background: #050505; color: #f5f5f5; }
.kp-bignum-glow .kp-bignum-value { color: #fff; font-weight: 400; text-shadow: 0 0 6px rgba(255, 255, 255, .85), 0 0 22px rgba(255, 255, 255, .45), 0 0 48px rgba(255, 255, 255, .25); }
.kp-bignum-glow :is(.kp-text, .kp-eyebrow, .kp-bn-q, .kp-bn-opt) { color: #f5f5f5; }
.kp-bignum-glow .kp-bignum-source { color: #b8b8b8; }
.kp-bignum-glow .kp-bn-reply { background: #1c1c1c; color: #fff; }
.kp-bignum-glow .kp-bn-ok { background: #e9e9e9; color: #111; }
@media (prefers-reduced-motion: reduce) { .kp-bn-opt input::before { transition: none; } }
/* ---------- Comic-Dialog hochwertig (12.10.2026): Illustrationsbühne, weiche Blasen, Fortschritt, Ablauf-Leiste ---------- */
/* Illustrationsbühne: 16:9, Kulisse ist ein Bild (Storyset), Figuren stehen als Bild auf dem Boden, Bodenschatten statt gezeichnetem Raum */
.kp-stage-wrap.kp-illu, .kp-dialog.kp-staged:has(.kp-illu) :is(.kp-dlg-bar, .kp-dlg-history, .kp-dlg-decision) { width: min(100%, calc(min(56vh, 560px) * 16 / 9)); margin-inline: auto; }
.kp-stage-wrap.kp-illu > .kp-stage { aspect-ratio: 16 / 9; background: linear-gradient(180deg, color-mix(in srgb, var(--kp-primary) 9%, var(--kp-surface)) 0%, color-mix(in srgb, var(--kp-primary) 3%, var(--kp-surface)) 100%); }
.kp-illu .kp-stage-back:not(.kp-has-photo)::before { content: ''; position: absolute; left: 50%; top: 56%; width: 110%; aspect-ratio: 1.6; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--kp-accent) 16%, transparent), transparent 72%); }
.kp-illu .kp-stage-back::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 58%, rgba(10, 14, 24, .16)); pointer-events: none; }

.kp-illu .kp-actor::after { content: ''; position: absolute; left: 14%; right: 14%; bottom: -1.5%; height: 4%; border-radius: 50%; background: radial-gradient(closest-side, rgba(10, 14, 24, .3), transparent); z-index: -1; }
.kp-illu .kp-actor:not(.kp-speaking) { filter: brightness(.94) saturate(.92); transform: scale(.96); }
.kp-illu .kp-actor.kp-speaking { transform: translateY(-1.5%); }
.kp-illu.kp-shot-totale .kp-actor:not(.kp-speaking) { filter: none; transform: none; }
.kp-actor-flip .kp-avatar img, .kp-actor-flip .kp-avatar svg { transform: scaleX(-1); }
.kp-illu .kp-actor-right .kp-avatar svg { transform: none; }
.kp-illu .kp-actor-right.kp-actor-flip .kp-avatar svg { transform: scaleX(-1); }

/* Sprechblase auf der Illustrationsbühne: weiche Karte ohne harten Rand, Name als Pille in der Figurenfarbe */
.kp-illu .kp-stage-bubble { top: 5%; max-width: 36%; padding: 14px 18px 15px; border: 0; border-radius: 20px; background: rgba(255, 255, 255, .96); color: #1d2530; box-shadow: 0 18px 40px -14px rgba(10, 14, 24, .4), 0 1px 0 rgba(10, 14, 24, .05); font-size: clamp(15px, 1.5vw, 19px); line-height: 1.45; }

.kp-illu .kp-stage-bubble::after { border: 0; width: 20px; height: 20px; bottom: -9px; background: rgba(255, 255, 255, .96); box-shadow: 6px 6px 10px -8px rgba(10, 14, 24, .25); }
.kp-illu .kp-sb-left { left: 31%; } .kp-illu .kp-sb-left::after { left: 22px; }
.kp-illu .kp-sb-right { right: 31%; } .kp-illu .kp-sb-right::after { right: 22px; }

/* Fortschritt je Zeile unten im Bild */
.kp-stage-dots { position: absolute; left: 50%; bottom: 3.5%; transform: translateX(-50%); z-index: 4; display: flex; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(10, 14, 24, .38); backdrop-filter: blur(6px); }

/* Ablauf-Leiste unter der Bühne, solange die Szene von selbst läuft: Pause, nächste Zeile, Fortschritt, alles anzeigen */
.kp-dlg-bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.kp-dlg-bar button { font: inherit; font-size: 14px; min-width: 38px; height: 36px; padding: 0 12px; border: 1px solid var(--kp-line); border-radius: 999px; background: var(--kp-surface); color: var(--kp-text); cursor: pointer; display: grid; place-items: center; }
.kp-dlg-bar button:is(:hover, :focus-visible) { border-color: var(--kp-primary); }
.kp-dlg-bar button[aria-pressed="true"] { background: var(--kp-accent); color: var(--kp-on-accent, #fff); border-color: transparent; }
.kp-dlg-bar .kp-film-progress { flex: 1; display: flex; gap: 4px; }
.kp-dlg-bar .kp-film-progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--kp-line); transition: background .3s; }

.kp-dlg-bar .kp-film-progress i.now { background: var(--kp-accent); }

@media (max-width: 640px) { .kp-dlg-bar .kp-dlg-all { display: none; } .kp-stage-wrap.kp-illu > .kp-stage { aspect-ratio: 4 / 3; } .kp-illu .kp-actor { height: 64%; width: 36%; } .kp-illu .kp-stage-bubble, .kp-illu .kp-sb-left, .kp-illu .kp-sb-right { top: auto; left: auto; right: auto; max-width: none; } .kp-illu .kp-stage-bubble::after { display: none; } }
/* Chat-Ansicht ohne Bühne: weiche Blasen statt Comic-Rand, Name als Pille */
html:not(.kp-style-praxis):not(.kp-style-comic) .kp-dialog:not(.kp-staged) .kp-bubble { border: 0; background: var(--kp-surface); color: var(--kp-text); box-shadow: 0 10px 26px -12px rgba(16, 24, 40, .35), 0 0 0 1px var(--kp-line); border-radius: 18px 18px 18px 6px; }

.kp-line .kp-avatar img, .kp-dlg-history .kp-avatar img, .kp-chat-face img, .kp-ask-face img { object-position: 50% 0; }

/* ---------- Genially-Ansatz: Code-Schloss (schloss), Fundstücke (clue), Wahlbrett (wahlbrett), Anzeiger für klickbare Stellen (settings.clickHint) ---------- */
.kp-schloss { max-width: 760px; margin: 0 auto; padding: 24px; border-radius: var(--kp-radius); background: var(--kp-surface); border: 1px solid var(--kp-line); color: var(--kp-text); text-align: center; }
.kp-schloss .kp-sec-head { text-align: center; }
.kp-lock-svg { display: block; width: 56px; height: 56px; margin: 0 auto 10px; color: var(--kp-title, var(--kp-primary)); fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.kp-lock-shackle { transform-box: view-box; transform-origin: 33px 22px; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
.kp-lock-open .kp-lock-svg { color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-lock-open .kp-lock-shackle { transform: translateY(-5px) rotate(28deg); }
.kp-lock-dials { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 18px 0 8px; }
.kp-lock-dial { display: grid; justify-items: center; gap: 4px; }
.kp-lock-step { font: inherit; width: 44px; height: 32px; border: 1px solid var(--kp-line); border-radius: 6px; background: var(--kp-bg); color: var(--kp-text); cursor: pointer; line-height: 1; }
.kp-lock-step:focus-visible, .kp-lock-digit:focus-visible, .kp-lock-text:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 2px; }
.kp-lock-digit { width: 52px; height: 64px; text-align: center; font: inherit; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; border: 2px solid var(--kp-primary); border-radius: 8px; background: var(--kp-bg); color: var(--kp-text); }
.kp-lock-text { font: inherit; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; text-align: center; width: min(100%, 320px); min-height: 52px; padding: 8px 12px; border: 2px solid var(--kp-primary); border-radius: 8px; background: var(--kp-bg); color: var(--kp-text); }
.kp-lock-shake { animation: kp-lock-shake .42s ease; }
/* Rückmeldung mit Bewegung am Ort (Regel Klang und Bewegung): richtig federt, falsch rüttelt, nur direkt nach der Antwort (kp-fresh), nie beim Neuzeichnen */
.kp-fresh .kp-answer.kp-right, .kp-fresh .kp-claim.kp-right, .kp-fresh .kp-sort-item.kp-right { animation: kp-feder .36s var(--kp-ease-out, ease-out); }
.kp-fresh .kp-answer.kp-wrong, .kp-fresh .kp-claim.kp-wrong, .kp-fresh .kp-sort-item.kp-wrong, .kp-fresh .kp-numeric input.kp-wrong { animation: kp-ruettel .3s ease; }
@keyframes kp-feder { 35% { transform: scale(1.04); } 70% { transform: scale(.99); } to { transform: none; } }
@keyframes kp-ruettel { 20%, 60% { transform: translateX(-2px); } 40%, 80% { transform: translateX(2px); } }
@media (prefers-reduced-motion: reduce) { .kp-fresh .kp-answer, .kp-fresh .kp-claim, .kp-fresh .kp-sort-item, .kp-fresh .kp-numeric input { animation: none !important; } }
@keyframes kp-lock-shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.kp-lock-act { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.kp-lock-fb { min-height: 1.5em; margin: 10px 0 0; font-weight: 600; }
.kp-lock-fb.is-wrong { color: var(--kp-text); }
.kp-lock-hint { margin: 12px auto 0; max-width: 560px; padding: 12px 16px; border-radius: 8px; background: color-mix(in srgb, var(--kp-accent) 12%, var(--kp-surface)); text-align: left; }
.kp-lock-hint:focus { outline: none; }
.kp-lock-success { margin-top: 12px; text-align: left; }
.kp-lock-success:focus { outline: none; }
.kp-lock-inv { margin: 18px auto 0; max-width: 560px; text-align: left; padding: 14px 16px; border: 1px dashed var(--kp-line); border-radius: 8px; }
.kp-lock-inv-title { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 700; }
.kp-lock-inv-title .kp-ico { width: 20px; height: 20px; }
.kp-lock-inv ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.kp-lock-inv li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.kp-lock-inv li::before { content: ''; flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--kp-muted); transform: translateY(1px); }
.kp-lock-inv li.found::before { background: var(--kp-accent); border-color: var(--kp-accent); }
.kp-lock-miss { color: var(--kp-muted); }
.kp-lock-go { all: unset; cursor: pointer; color: var(--kp-text); text-decoration: underline; text-underline-offset: 3px; }
.kp-lock-go:focus-visible { outline: 2px solid var(--kp-accent); outline-offset: 2px; }
.kp-clue { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 10px 14px; border-radius: 8px; border: 1px dashed var(--kp-accent); background: color-mix(in srgb, var(--kp-accent) 10%, var(--kp-surface)); color: var(--kp-text); animation: kp-fade .4s both; }
.kp-clue .kp-ico { flex: none; width: 22px; height: 22px; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-wb-status { margin: 0 0 14px; font-weight: 600; color: var(--kp-muted); }
.kp-wb-status.all { color: var(--kp-text); }
.kp-wb-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: var(--kp-gap, 24px); }
.kp-wb-tile { position: relative; }
.kp-wb-btn { all: unset; box-sizing: border-box; position: relative; display: flex; flex-direction: column; gap: 8px; width: 100%; height: 100%; padding: 18px; border-radius: var(--kp-radius); background: var(--kp-surface); border: 1px solid var(--kp-line); color: var(--kp-text); cursor: pointer; box-shadow: var(--kp-shadow); transition: border-color .2s, transform .2s; }
.kp-wb-btn:hover { border-color: var(--kp-accent); }
.kp-wb-btn:focus-visible { outline: 3px solid var(--kp-accent); outline-offset: 3px; }
.kp-wb-btn[aria-expanded="true"] { border-color: var(--kp-accent); box-shadow: 0 0 0 2px var(--kp-accent); }
.kp-wb-img { display: block; margin: -18px -18px 4px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--kp-radius) var(--kp-radius) 0 0; }
.kp-wb-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.kp-wb-ico { position: relative; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: color-mix(in srgb, var(--kp-accent) 16%, var(--kp-surface)); color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-wb-ico .kp-ico { width: 28px; height: 28px; }
.kp-wb-title { font-weight: 700; font-size: 1.08em; color: var(--kp-title, var(--kp-primary)); }
.kp-wb-text { color: var(--kp-text); }
.kp-wb-kind { margin-top: auto; font-size: .9em; font-weight: 600; color: var(--kp-muted); }
.kp-wb-check { position: absolute; top: 12px; right: 12px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--kp-accent); color: var(--kp-on-accent, #fff); }
.kp-wb-check .kp-ico { width: 18px; height: 18px; }
.kp-wb-tile.done .kp-wb-btn { border-color: color-mix(in srgb, var(--kp-accent) 60%, var(--kp-line)); }
.kp-wb-panel { margin-top: var(--kp-gap, 24px); padding: 22px 24px; border-radius: var(--kp-radius); background: var(--kp-surface); border: 2px solid var(--kp-accent); color: var(--kp-text); animation: kp-fade .3s both; }
.kp-wb-panel:focus { outline: none; }
.kp-wb-panel h3 { margin: 0 0 10px; }
.kp-wb-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.kp-on-dark :is(.kp-schloss, .kp-wb-btn, .kp-wb-panel, .kp-clue) { color: var(--kp-text); }
/* Anzeiger für klickbare Stellen: was noch nicht angesehen ist, pulsiert sanft (Genially „Interactivity indicator“) */
html:not(.kp-clickhint) .kp-hs-dot { animation: none; }
.kp-clickhint .kp-hs-dot.seen:not(.kp-hs-door) { animation: none; }
.kp-clickhint .kp-hs-dot.kp-hs-door:not(.seen), .kp-clickhint .kp-hs-dot.kp-hs-m-nummer:not(.seen):not(.open) { animation: kp-pulse 2.6s infinite; }
.kp-clickhint .kp-wb-tile:not(.done) .kp-wb-ico::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--kp-accent); animation: kp-wb-pulse 2s ease-out infinite; }
@keyframes kp-wb-pulse { from { transform: scale(1); opacity: .85; } to { transform: scale(1.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .kp-lock-shake { animation: none; }
  .kp-lock-shackle { transition: none; }
  .kp-clickhint .kp-hs-dot.kp-hs-door:not(.seen), .kp-clickhint .kp-hs-dot.kp-hs-m-nummer:not(.seen):not(.open) { animation: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--kp-primary) 30%, transparent); }
  .kp-clickhint .kp-hs-dot:not(.seen):not(.open) { box-shadow: 0 0 0 4px color-mix(in srgb, var(--kp-primary) 30%, transparent); }
  .kp-clickhint .kp-wb-tile:not(.done) .kp-wb-ico::after { animation: none; }
}
@media (max-width: 760px) {
  .kp-wb-grid { grid-template-columns: 1fr; }
  .kp-schloss { padding: 18px 14px; }
  .kp-lock-digit { width: 44px; height: 56px; font-size: 28px; }
}
.kp-style-comic .kp-wb-img img { filter: grayscale(1); }

/* ---------- Fußleiste am Handy: Sperrhinweis in eigener Zeile ---------- */
/* Drei Teile in einer Zeile ließen bei 375 px zu wenig Platz, „Weiter“ wurde abgeschnitten. */
@media (max-width: 700px) {
  .kp-foot:not(.kp-navbar .kp-foot) { flex-wrap: wrap; row-gap: 8px; }
  .kp-foot:not(.kp-navbar .kp-foot) > .kp-lock { flex: 1 1 100%; order: -1; }
  .kp-foot:not(.kp-navbar .kp-foot) > .kp-btn { white-space: nowrap; flex: none; }
}
/* ---------- Wissensnugget in „Kurz gefragt“ (13.10.2026): Fakt mit Quelle erst nach der eigenen Vermutung ---------- */
.kp-kf-fact { margin-top: 14px; padding: 14px 16px; border-radius: var(--kp-radius); background: color-mix(in srgb, var(--kp-accent) 10%, var(--kp-surface)); border: 1px solid color-mix(in srgb, var(--kp-accent) 28%, var(--kp-line)); color: var(--kp-text); animation: kp-up .35s both; }
.kp-kf-fact-h { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--kp-accent-ink, var(--kp-accent)); }
.kp-kf-fact-h .kp-ico { width: 18px; height: 18px; }
.kp-kf-fact .kp-text > :last-child { margin-bottom: 0; }
.kp-kf-fact .kp-kf-src { margin: 8px 0 0; font-size: 13px; color: var(--kp-muted); }
@media (prefers-reduced-motion: reduce) { .kp-kf-fact { animation: none; } }

/* ---------- Kästen nur, wo sie etwas bedeuten (Kerstin 15.10.2026, Regel nach den bildungsinnovator-Kursen) ----------
   Frei auf der Fläche, ohne Fläche, Rahmen und Schatten: Fragen, Entscheidungen, Schätzfragen, Selbstchecks, Reflexion,
   Umsetzungsplan, Umfrage, Sortieren, Ablauf, Checkliste, Kennzahl, Kernaussagen und die übrigen Übungen als Ganzes.
   Den Kasten behalten nur die Bedienelemente darin (Antworten, Möglichkeiten, Eingabefelder, Knöpfe), Karten im Raster
   (Karten, Agenda, Personen, Karten zum Umdrehen), Dokumente (Formular, Zertifikat, Text zum Prüfen), Hinweise und alles,
   was auf Foto, dunklem Abschnitt oder Hauptfarbe steht (dort trägt die Fläche den Kontrast).
   :not(#kp-frei) hebt die Regel über die vielen Stil-Regeln für Karten; Editorial behält seine Haarlinien. */
html:not(#kp-frei):not(.kp-style-editorial) .kp-main :is(.kp-quiz, .kp-branch, .kp-predict, .kp-selfcheck, .kp-reflect, .kp-plan, .kp-survey, .kp-debrief, .kp-review-head, .kp-sortcats, .kp-process, .kp-motion, .kp-seq, .kp-checklist, .kp-album, .kp-vscene, .kp-sim, .kp-bignum:not(.kp-bignum-photo):not(.kp-bignum-glow)):not(:is(.kp-on-dark, .kp-bg-image, .kp-bg-primary, .kp-bg-dark, .kp-bg-ambient, .kp-iv-card) *) { background: none; border: 0; border-radius: 0; box-shadow: none; padding: 0; }
html:not(#kp-frei):not(.kp-style-editorial) .kp-main .kp-bignum:not(.kp-bignum-photo):not(.kp-bignum-glow):not(:is(.kp-on-dark, .kp-bg-image, .kp-bg-primary, .kp-bg-dark, .kp-bg-ambient) *) { padding: 8px 0; }
/* Ohne Kartenfläche steht die Dachzeile direkt auf dem Grund, auf der getönten Bühne der Folie reicht die reine Akzentfarbe dort nicht immer für 4,5 : 1 */
html:not(#kp-frei):not(.kp-style-editorial):not(.kp-dark) .kp-main :is(.kp-quiz, .kp-branch, .kp-predict, .kp-selfcheck, .kp-reflect, .kp-plan, .kp-survey, .kp-sortcats, .kp-process, .kp-checklist, .kp-sim):not(:is(.kp-on-dark, .kp-bg-image, .kp-bg-primary, .kp-bg-dark, .kp-bg-ambient, .kp-iv-card) *) :is(.kp-eyebrow, .kp-sim-task > span) { color: color-mix(in srgb, var(--kp-accent-ink, var(--kp-accent)) 80%, var(--kp-text)); }
/* Mehrere Fragen untereinander (Pool, Wiederholung, Einstiegstest): eine Haarlinie trennt sie statt eines Kastens je Frage */
html:not(#kp-frei):not(.kp-style-editorial) .kp-main :is(.kp-pool, .kp-review-list, .kp-pretest-list) > .kp-quiz + .kp-quiz:not(:is(.kp-on-dark, .kp-bg-image, .kp-bg-primary, .kp-bg-dark, .kp-bg-ambient) *) { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--kp-line); }
/* Kernaussagen sind eine Liste: Zeilen mit Haarlinie statt einer Karte je Aussage */

/* ---------- Empfehlung am Ende auf Bildschirmseiten (15.10.2026, Reihe „Führen mit KI“) ----------

   Auf Bildschirmseiten ist sie deshalb eine schmale Zeile: Hinweis, Titel und Knopf nebeneinander, der Begleitsatz eine Zeile, kein Bild. */
.kp-screen .kp-nextcourse.kp-nextcourse { max-width: none; margin: 16px 0 0; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; box-shadow: none; }

/* ---------- Leise Bewegung der Illustrationen (Kerstin 16.10.2026, Comic-Stil modernisieren) ----------
   Figuren auf der Illustrationsbühne atmen, die sprechende wippt leicht, die Titelzeichnung schwebt; die Teile der Zeichnungen
   bewegt liveIllus() in der SVG selbst.
   Bewegt wird der Rahmen .kp-avatar, nicht das Bild: am Bild hängt die Spiegelung (kp-actor-flip), die eine Animation dort
   überschreiben würde (die alte Sprech-Animation am Bild drehte gespiegelte Figuren beim Sprechen zurück). Nur mit Effekten
   „hochwertig“, nie unter „Bewegung reduzieren“. */
.kp-illu.kp-illu .kp-stage .kp-actor .kp-avatar.kp-avatar img { animation: none; transform: none; }
.kp-illu.kp-illu .kp-stage .kp-actor.kp-actor-flip .kp-avatar.kp-avatar img { transform: scaleX(-1); }
.kp-fx-premium .kp-illu .kp-stage .kp-actor .kp-avatar { animation: kp-illu-breathe 4.2s ease-in-out infinite; animation-delay: calc(var(--slot, 0) * -1.3s); transform-origin: 50% 100%; }
.kp-fx-premium .kp-illu .kp-stage .kp-actor-right .kp-avatar { animation-delay: calc(-2.1s - var(--slot, 0) * 1.3s); }
.kp-fx-premium .kp-illu .kp-stage .kp-actor .kp-avatar.kp-talking { animation: kp-illu-talk 1.6s ease-in-out infinite; }
.kp-fx-premium .kp-lips .kp-illu .kp-stage .kp-actor .kp-avatar.kp-talking { animation: none; transform: scale(calc(1 + var(--kp-mouth, 0) * .02)); transition: transform .08s linear; }
.kp-fx-premium .kp-hero-drawing img { animation: kp-fx-settle 1.6s var(--kp-ease-out) backwards, kp-illu-float 8s 1.6s ease-in-out infinite; }
@keyframes kp-illu-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.006, 1.016); } }
@keyframes kp-illu-talk { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-1%) rotate(-.6deg); } 75% { transform: translateY(-.4%) rotate(.5deg); } }
@keyframes kp-illu-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) {
  .kp-fx-premium .kp-illu .kp-stage .kp-actor .kp-avatar, .kp-fx-premium .kp-hero-drawing img { animation: none !important; }
}
/* ---------- Szene vor dem Start (Kerstin 16.10.2026): Dialog ohne Bühne zeigt die Figuren statt einer leeren Fläche ---------- */
.kp-dlg-cast { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 24px 40px; margin: 8px 0 20px; padding: 0; list-style: none; }
.kp-dlg-cast li { display: grid; justify-items: center; gap: 8px; margin: 0; }
.kp-dlg-cast .kp-avatar { width: 112px; height: 112px; border-radius: 50%; overflow: hidden; background: color-mix(in srgb, var(--c, var(--kp-primary)) 12%, var(--kp-surface)); }

.kp-panel-art.kp-panel-illu img { position: absolute; left: 0; right: 0; bottom: 0; height: 74%; width: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 10px 8px rgba(10, 14, 24, .16)); }
.kp-screen .kp-panel-art.kp-panel-illu { aspect-ratio: auto; height: clamp(260px, calc(var(--kp-screen-h, 80vh) - 300px), 440px); }
.kp-style-comic .kp-panel-art.kp-panel-illu { background: #EDEDEF; }
/* Kopfband dunkel: Akzentwort, Dachzeile und Quellen hell (Praxis und Folien setzten sie in der Hauptfarbe, 1,6 : 1 auf dem Band) */
.kp-slide-uebung.kp-uebung-dunkel .kp-uebung-head .kp-page-head :is(.kp-accent, .kp-eyebrow) { color: color-mix(in srgb, var(--kp-accent) 40%, white); }
.kp-on-dark .kp-sources, .kp-on-dark .kp-sources summary { color: rgba(255, 255, 255, .86); }

/* ---------- Themenbild (hotspots.map mit mapLook: 'themen', Vorbild Storyline-Kapitelmenü in einer gezeichneten Szene):
   runde Nummer im Bild, weißes Schild daneben; nur der nächste Ort trägt die Signalfarbe, alles andere bleibt grau ---------- */
.kp-tm { --kp-tm-dot: #3A3A40; --kp-tm-size: clamp(34px, 3.2vw, 48px); }
.kp-map-pin.kp-tm-pin, .kp-map-pin.kp-tm-pin:not(.kp-map-locked):hover, .kp-map-pin.kp-tm-pin:focus-visible { transform: translate(-50%, -50%); display: block; width: var(--kp-tm-size); height: var(--kp-tm-size); filter: none; outline: none; }
.kp-tm-num { position: relative; display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--kp-tm-dot); color: #fff; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(16, 20, 28, .3); font: 700 calc(var(--kp-tm-size) * .42)/1 var(--kp-font-head, inherit); font-variant-numeric: tabular-nums; transition: transform .2s var(--kp-ease-out, ease), background-color .2s; }
.kp-tm-num svg { width: 46%; height: 46%; stroke-width: 3; }
.kp-tm-label { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); width: max-content; max-width: clamp(140px, 17vw, 250px); padding: 8px 12px; background: #fff; color: #1A1A1C; border: 1px solid rgba(26, 26, 28, .2); border-radius: min(var(--kp-radius, 6px), 6px); box-shadow: 0 4px 14px rgba(16, 20, 28, .14); font-size: clamp(12px, 1vw, 15px); font-weight: 600; line-height: 1.3; text-align: left; transition: opacity .2s, border-color .2s; }
.kp-tm-left .kp-tm-label { left: auto; right: calc(100% + 10px); }
.kp-tm-pin:not(.kp-map-locked):hover .kp-tm-num { transform: scale(1.08); }
.kp-tm-pin:not(.kp-map-locked):hover .kp-tm-label { border-color: var(--kp-tm-dot); }
.kp-tm-pin:focus-visible .kp-tm-num { outline: 3px solid var(--kp-accent); outline-offset: 3px; }
.kp-tm-pin.kp-map-next .kp-tm-num { background: var(--kp-accent); color: var(--kp-on-accent, #fff); }
.kp-tm-pin.kp-map-next .kp-tm-label { border: 2px solid var(--kp-accent); }
.kp-tm-pin.kp-map-next .kp-tm-num::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--kp-accent); animation: kp-tm-ring 1.8s ease-out infinite; }
@keyframes kp-tm-ring { from { transform: scale(1); opacity: .8; } to { transform: scale(1.7); opacity: 0; } }
.kp-tm-pin.kp-map-done .kp-tm-num { background: #fff; color: var(--kp-tm-dot); border-color: var(--kp-tm-dot); }
.kp-tm-pin.kp-map-done .kp-tm-label { color: #4A4A52; }
.kp-tm-pin.kp-map-locked .kp-tm-num { background: #8A8A92; }
.kp-tm-pin.kp-map-locked .kp-tm-label { color: #55555C; }
/* Beschriftung nur beim Zeigen (Vorbild: Bild mit Nummern ohne Schilder) */
.kp-tm-quiet .kp-tm-label { opacity: 0; pointer-events: none; }
.kp-tm-quiet .kp-tm-pin:hover .kp-tm-label, .kp-tm-quiet .kp-tm-pin:focus-visible .kp-tm-label { opacity: 1; }
.kp-tm-pin:hover, .kp-tm-pin:focus-visible { z-index: 5; }
/* Legende: am Handy stehen die Schilder unter dem Bild, sonst verdecken sie die Szene */
.kp-tm-legend { display: none; }
@media (max-width: 700px) {
  .kp-tm { --kp-tm-size: 32px; }
  .kp-tm .kp-tm-label { display: none; }
  .kp-tm-legend { display: grid; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; counter-reset: tm; }
  .kp-tm-legend li { counter-increment: tm; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; font-size: 15px; }
  .kp-tm-legend li::before { content: counter(tm); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--kp-tm-dot); color: #fff; font-weight: 700; font-size: 13px; }
  .kp-tm-legend li.next::before { background: var(--kp-accent); color: var(--kp-on-accent, #fff); }
  .kp-tm-legend li.done::before { content: "✓"; background: #fff; color: var(--kp-tm-dot); box-shadow: inset 0 0 0 2px var(--kp-tm-dot); }
  /* bildschirmfüllend: am Handy würde „cover“ die Szene beschneiden und die Nummern verrutschen; ganzes Bild, Legende und Hinweis darunter */
  .kp-tm.kp-hs-cover { min-height: 0; }

.kp-style-comic .kp-tm { --kp-tm-dot: #3A3A40; }

/* ---------- Illustrationen wie bei bildungsinnovator (Kerstin 16.10.2026): Kapitelfrage als Schrift, Bild in Form, Maskottchen ---------- */
/* Kapitelfrage als Schrift (hero.layout 'frage', Vorbild „Lernstrategien“): kleine Zeilen, großes Schlagwort, Fragezeichen in der Akzentfarbe */
.kp-hero-frage { display: grid; gap: clamp(16px, 2.5vw, 28px); padding: clamp(24px, 4vw, 56px) clamp(20px, 4vw, 56px); background: radial-gradient(ellipse at 30% 35%, var(--kp-surface, #fff) 0%, color-mix(in srgb, var(--kp-text) 7%, var(--kp-bg, #f4f4f5)) 100%); border-radius: var(--kp-radius, 8px); }

.kp-frage-q { color: var(--kp-accent); margin-left: .06em; text-shadow: 0 0 .28em color-mix(in srgb, var(--kp-accent) 45%, transparent); }

}
/* Bild in Form (image.shape): eine weiche Fläche hinter der Illustration, Vorbild „EU AI Act“ (Fleck) und „Kognitive Flexibilität“ (Wolke) */
.kp-fig.kp-form .kp-fig-frame { position: relative; isolation: isolate; background: none; box-shadow: none; border-radius: 0; overflow: visible; padding: 5% 6% 3%; }

.kp-on-dark .kp-fig.kp-form .kp-fig-frame::before { background: rgba(255, 255, 255, .14); }

/* ---------- Sechs Foliendesigns nach der bildungsinnovator-Bibliothek (16.10.2026, 118 Kursvorschauen ausgewertet) ----------
   Zahlenpaar (page.arrange: zahlen), Kennzahlen als Ringe, Pyramide, Schnittmengen, Karten und Kapitel mit großer Nummer,
   Zeitleiste mit Fotos. Jede Regel nimmt --kp-title, --kp-accent, --kp-on-accent; die Stilpakete setzen ihre Regeln unten durch. */
.kp-slide-zahlen { position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: center; gap: clamp(20px, 3vh, 36px); padding: 40px var(--kp-split-pad); background: #0f1a24; color: #fff; }
.kp-slide-zahlen.kp-has-bg::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--kp-slidebg) var(--kp-bgpos, center) / cover no-repeat; }
.kp-slide-zahlen::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8,14,22,.8), rgba(8,14,22,.62) 50%, rgba(8,14,22,.84)); }
.kp-slide-zahlen:not(.kp-has-bg)::after { background: linear-gradient(135deg, color-mix(in srgb, var(--kp-primary) 55%, #0b1020), #0b1020); }
.kp-slide-zahlen .kp-page-head { margin-bottom: 0; max-width: 1100px; width: 100%; align-self: center; }

/* ---------- Dachzeile auf der getönten Bühne (17.10.2026, Umbau „Führen mit KI“ 1.1/1.3) ----------
   Auf --kp-stage-bg (6 % Textfarbe im Grund) erreichte die Akzentfarbe in der Dachzeile von Kernaussagen und Merkkarte
   nur knapp 4,5 : 1 (#177289 auf #e7e7eb). Wie bei den freien Übungen mit 20 % Textfarbe abdunkeln, nur im hellen Modus
   und nicht auf Foto oder dunklem Grund. */
html:not(#kp-frei):not(.kp-dark) :is(.kp-split-stage, .kp-uebung-stage):not(.kp-on-dark) .kp-eyebrow:not(:is(.kp-on-dark, .kp-bg-image, .kp-bg-primary, .kp-bg-dark, .kp-bg-ambient, .kp-buehne-ambient) *) { color: color-mix(in srgb, var(--kp-accent-ink, var(--kp-accent)) 80%, var(--kp-text)); }
/* ---------- Fragenzähler und dezente Leiste am Handy (17.10.2026, Umbau „KI wertschöpfend nutzen“) ----------
   Die Pille .kp-page-top (Fragenzähler, Logo) liegt oben rechts absolut; auf der Folie „Übung“ beginnt der Kopftext rechts
   ganz oben und lief unter die Pille. Der Kopf bekommt oben Platz für sie.
   Am Handy passten Symbole links, KI-Kennzeichen, „Menü“ und zwei Pfeile nicht in drei gleiche Spalten; das Kennzeichen
   lag über „Menü“. Bis 600 px nehmen die Seiten ihre Breite, „Menü“ zeigt nur das Symbol (Name bleibt für Screenreader). */
/* Notiz im dunklen Kopfband der Übungsfolie: sie behält ihre Fläche (--kp-surface), erbte aber die weiße Schrift von
   kp-on-dark (1,0 : 1, Umbau „Mitarbeiterentwicklung mit KI“). Schrift und Titel in der Textfarbe der Notizfläche. */
/* Zuordnung als Auswahlliste: lange Begriffe oder Definitionen in den Optionen machten die Liste so breit wie ihre längste
   Option, die Zeile lief über den Rand (Umbau „KI-Grundlagen“, 59 px bei 1280, 741 px bei 375). Spalten dürfen schrumpfen. */
.kp-match-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.kp-match-row > * { min-width: 0; overflow-wrap: anywhere; }
.kp-match-row select { width: 100%; max-width: 100%; min-width: 0; }
@media (max-width: 760px) { .kp-match-row { grid-template-columns: minmax(0, 1fr); } }

/* Platz für den Zähler: der Kopftext fließt um eine unsichtbare Fläche oben rechts, wo der Zähler sitzt. Ein Abstand über
   dem ganzen Kopf machte jede Übungsfolie mit Zähler 34 px höher, kurze Folien liefen über den Bildschirm (17.10.2026). */
@media (min-width: 601px) {

/* ---------- Postfach: Warnzeichen in einer Mail (Kerstin 17.10.2026, Nachbau der Storyline-Übung „Spot the red flags“) ----------
   Tablet mit Home-Knopf; Startbildschirm mit Logo, App-Symbolen und der Figur im Sechseck; Mail-App mit Ordnerleiste, Suchleiste,
   Kopf mit Uhrzeit und Symbolen; je Warnzeichen ein gestricheltes Feld direkt hinter der Textstelle, eine gestrichelte Linie führt hin;
   Etiketten rechts ohne Überschrift, abgelegte lassen ihre Lücke; die Figur steht groß über der abgedunkelten Mail, darunter das
   Sprechfeld mit schrägem Namensschild und rundem Weiter-Pfeil. Farben aus dem Kursdesign (Etiketten, Pfeil, Suchknopf = Hauptfarbe). */

.kp-mail-screen { position: relative; overflow: hidden; border-radius: 24px; background: var(--kp-mail-screen); min-height: min(520px, calc(var(--kp-screen-h, 100svh) - 140px)); isolation: isolate; font-size: clamp(12.5px, .55vw + 6.5px, 16px); }

.kp-mail-waves { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: color-mix(in srgb, var(--kp-primary) 70%, var(--kp-text)); stroke-width: 1; opacity: .7; }

/* Comic: Rahmen und Bildschirm grau, Etiketten, Pfeil und Zähler im einen Rot, Namensschild schwarz, Figur gedämpft */
.kp-style-comic .kp-mail { --kp-mail-bezel: #D4D4D8; --kp-mail-screen: #F4F4F5; --kp-mail-line: #DCDCE0; }
.kp-style-comic .kp-mail-desk { background: #CFCFD4; }
.kp-style-comic .kp-mail-waves { stroke: #6E6E76; opacity: .55; }
.kp-style-comic .kp-mail-side li.on { background: #DCDCE0; }
.kp-style-comic .kp-mail .kp-mdd-card { border-radius: 999px; border-color: #F08A97; box-shadow: none; }
.kp-style-comic .kp-mail .kp-mdd-card.kp-right { border-color: #F08A97 !important; }
.kp-style-comic .kp-mail-go { background: #1A1A1C; }
.kp-style-comic .kp-mail-name { background: #1A1A1C; color: #fff; }
.kp-style-comic .kp-mail-figure img, .kp-style-comic .kp-mail-hex img, .kp-style-comic .kp-mail-figure svg { filter: saturate(.8); }
.kp-style-comic .kp-mail-link { color: #1A1A1C; }
/* Kein Kasten um die Übung selbst: das Tablet ist der Kasten (Regel „Kästen nur, wo sie etwas bedeuten“) */
.kp-quiz:has(> .kp-mail) { background: none; border: 0; box-shadow: none; padding: 0; }
.kp-quiz:has(> .kp-mail) > :is(.kp-label, .kp-q) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* ---------- Lottie-Figuren (Kerstin 17.10.2026, Reihe Gabor K): Figuren bleiben im Comic-Stil farbig, nur gedämpft (Regel 2) ---------- */
.kp-style-comic img[data-lf] { filter: saturate(.8) !important; }
.kp-style-comic .kp-actor img[data-lf] { filter: saturate(.8) drop-shadow(0 14px 12px rgba(10, 14, 24, .22)) !important; }
/* Figuren stehen ganz im Kasten statt wie ein Foto angeschnitten (Teamkarten, Personen, Begleitfigur) */
.kp-person-media img[data-lf], .kp-guide-media img[data-lf] { object-fit: contain !important; object-position: 50% 100% !important; padding: 16px 16px 0; box-sizing: border-box; }
/* Comic: Grund hinter Figuren grau statt in der Signalfarbe getönt (Regel 1 und 2) */
.kp-style-comic .kp-guide-illu, .kp-style-comic .kp-stage-wrap.kp-illu > .kp-stage { background: linear-gradient(180deg, #E9E9EC, #F4F4F5); }
.kp-style-comic .kp-illu .kp-stage-back:not(.kp-has-photo)::before { background: radial-gradient(closest-side, rgba(255, 255, 255, .7), transparent 72%); }
/* ---------- Chat im Handy (look: 'handy') ----------
   Das Handy ist ein Gegenstand: eigene, feste Farben (Papierton, Marine), damit es in jedem Stil wie ein Telefon aussieht.
   Die Selektoren tragen .kp-hy-screen, sonst gewinnen die Chat-Regeln der Stil-Pakete (Praxis, Comic, Foto dunkel). */
.kp-hy { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(28px, 6vw, 96px); align-items: center; max-width: 1120px; margin-inline: auto; }
.kp-hy-device { --hy-h: min(620px, calc(var(--kp-screen-h, 88vh) - 48px)); height: max(460px, var(--hy-h)); aspect-ratio: 9 / 18.5; padding: 10px; border-radius: 48px; background: #121418; box-shadow: 0 0 0 2px #2b2f37, 0 34px 70px -24px rgba(0, 0, 0, .6); }
.kp-hy-screen { height: 100%; display: flex; flex-direction: column; border-radius: 38px; overflow: hidden; background: #F7F2E7; color: #1E2430; font-size: 14px; line-height: 1.4; }
.kp-hy-status { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 13px 24px 6px; font-size: 12px; font-weight: 700; }
.kp-hy-notch { position: absolute; left: 50%; top: 8px; width: 36%; height: 26px; transform: translateX(-50%); background: #121418; border-radius: 16px; }
.kp-hy-bat i { display: inline-block; width: 4px; height: 4px; margin-right: 2px; border-radius: 50%; background: currentColor; vertical-align: middle; }
.kp-hy .kp-hy-screen .kp-chat-head { padding: 8px 16px 10px; border-bottom: 1px solid #E3D9C6; gap: 10px; }
.kp-hy .kp-hy-screen .kp-chat-head b { font-size: 14px; }
.kp-hy .kp-hy-screen .kp-chat-head small { font-size: 12px; color: #4F5866; }
.kp-hy .kp-hy-screen .kp-chat-av { width: 36px; height: 36px; overflow: hidden; background: #1B2E4B; color: #fff; }
.kp-hy .kp-hy-screen .kp-chat-av img, .kp-hy .kp-hy-screen .kp-chat-av svg { width: 100%; height: 100%; object-fit: cover; }
.kp-hy .kp-hy-screen .kp-chat-log { flex: 1; max-height: none; min-height: 0; background: none; padding: 10px 12px; gap: 7px; }
.kp-hy-stamp { margin: 0 0 4px; text-align: center; font-size: 11px; color: #5F6672; }
.kp-hy .kp-hy-screen .kp-chat-msg { max-width: 84%; padding: 8px 12px; border: 0; border-radius: 16px; font-size: 13.5px; }
.kp-hy .kp-hy-screen .kp-chat-them { background: #E9DFCB; color: #1E2430; border-bottom-left-radius: 5px; }
.kp-hy .kp-hy-screen .kp-chat-me { background: #1B2E4B; color: #fff; border-bottom-right-radius: 5px; }
.kp-hy .kp-hy-screen .kp-chat-dots { color: #5F6672; }
.kp-hy .kp-hy-screen .kp-chat-undo { opacity: .55; }
.kp-hy-input { display: flex; justify-content: space-between; align-items: center; margin: 6px 12px 16px; padding: 7px 7px 7px 14px; border-radius: 999px; background: #fff; border: 1px solid #E3D9C6; color: #5F6672; font-size: 13px; }
.kp-hy-input i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #1B2E4B; color: #fff; }
.kp-hy-input svg { width: 14px; height: 14px; }
.kp-hy .kp-chat-new { animation: kp-hy-pop .35s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0s); }
@keyframes kp-hy-pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.kp-hy-side { min-width: 0; }
/* Typografie der Szene wie im Vorbild: gesperrte Dachzeile in der Akzentfarbe, Titel in Versalien in der Titelschrift (leicht),
   Lage etwas gedämpft, die kursive Haltungszeile heller; Knopf eckig in Versalien in der Akzentfarbe */
.kp-hy-eyebrow { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--kp-accent); }
.kp-hy .kp-hy-side .kp-q { margin: 0 0 18px; font-family: var(--kp-font-head, inherit); font-weight: 400; text-transform: uppercase; font-size: clamp(32px, 3.7vw, 60px); line-height: 1.04; letter-spacing: .005em; }
.kp-hy-side .kp-chat-intro { max-width: 44ch; font-size: clamp(16px, 1.2vw, 19px); line-height: 1.55; color: color-mix(in srgb, currentColor 84%, transparent); }
.kp-hy-side .kp-chat-intro em { color: color-mix(in srgb, currentColor 80%, transparent); }
.kp-hy .kp-hy-side .kp-btn.kp-hy-reply { background: var(--kp-accent); border: 0; color: var(--kp-on-accent, #111); border-radius: 2px; padding: 13px 22px; font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; box-shadow: none; }

.kp-hy-sent svg { width: 14px; height: 14px; }
.kp-hy-end .kp-text { max-width: 44ch; font-size: clamp(16px, 1.2vw, 19px); line-height: 1.55; }
.kp-hy .kp-hy-end .kp-btn.kp-sec { margin-top: 14px; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 2px; padding: 9px 16px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; opacity: .85; box-shadow: none; }
@media (max-width: 760px) { .kp-hy { grid-template-columns: 1fr; } .kp-hy-device { --hy-h: 480px; height: var(--hy-h); justify-self: center; } }
@media (prefers-reduced-motion: reduce) { .kp-hy .kp-chat-new { animation: none; } }

/* Zum Vertiefen (Articulate „überladene Folien vermeiden“, 17.10.2026): Zusatzwissen steht eingeklappt und als freiwillig
   gekennzeichnet; es zählt nicht zu den beim Öffnen sichtbaren Bausteinen und nicht zur Textmenge der Seite. */
details.kp-deep { border-top: 1px solid var(--kp-line); border-bottom: 1px solid var(--kp-line); }
details.kp-deep > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 40px 14px 0; position: relative; font-weight: 600; min-height: 44px; }
details.kp-deep > summary::-webkit-details-marker { display: none; }
details.kp-deep > summary::after { content: '+'; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 1.4em; font-weight: 400; color: var(--kp-accent-ink, var(--kp-accent)); }
details.kp-deep[open] > summary::after { content: '−'; }
details.kp-deep > summary:focus-visible { outline: 2px solid var(--kp-accent); outline-offset: 2px; }
.kp-deep-tag { font-size: .72em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; color: color-mix(in srgb, var(--kp-accent-ink, var(--kp-accent)) 80%, var(--kp-text)); }
.kp-on-dark .kp-deep-tag { color: inherit; }

/* ---------- Große Szene (17.10.2026, Vorbild Storyline-Szenen mit Textfeld unten): Figur groß im Vordergrund, wer zuhört, steht kleiner dahinter;

.kp-bs { --kp-bs-ink: color-mix(in srgb, var(--kp-primary) 82%, #0b1020); --kp-bs-line: var(--kp-accent); --kp-bs-btn: var(--kp-bs-ink); --kp-bs-spot: var(--kp-accent); --kp-bs-hexbg: #2b2a2e; --kp-bs-scr: color-mix(in srgb, var(--kp-primary) 18%, #a08a9d); --kp-bs-wave: var(--kp-bs-ink); }

.kp-bs-bar { width: min(100%, 1320px, calc((var(--kp-screen-h, 100svh) - 110px) * 16 / 9)); margin-inline: auto; }
.kp-bs-bar .kp-bs-fill { flex: 1; }
.kp-bs-stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: color-mix(in srgb, var(--kp-primary) 8%, var(--kp-surface)); isolation: isolate; }

.kp-bs-raum { background: linear-gradient(180deg, transparent 0 81%, var(--kp-bs-floor) 81%), linear-gradient(90deg, var(--kp-bs-wall1) 0 61%, var(--kp-bs-wall2) 61%); }
.kp-bs-raum::before { content: ''; position: absolute; left: 61%; top: 0; bottom: 19%; width: 1.2%; background: color-mix(in srgb, var(--kp-bs-wall1) 70%, #fff); }
.kp-bs-raum .kp-bs-bg { inset: auto 0 18.6% 0; height: 76%; object-fit: contain; object-position: 50% 100%; }
.kp-bs-credit { position: absolute; right: 8px; bottom: 6px; z-index: 2; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(255, 255, 255, .8); color: #1d2530; }
/* Punkt am Gerät wie im Original: halbdurchsichtiger Kreis mit Rand und Kern in der Akzentfarbe, pulsiert */
.kp-bs-spot { position: absolute; z-index: 2; width: max(34px, 2.9cqi); aspect-ratio: 1; height: auto; transform: translate(-50%, -50%); padding: 0; border: 2px solid var(--kp-bs-spot); border-radius: 50%; background: color-mix(in srgb, var(--kp-bs-spot) 28%, rgba(255, 255, 255, .25)); cursor: pointer; display: grid; place-items: center; animation: kp-bs-pulse 1.6s ease-out infinite; }

.kp-bs-spot:focus-visible { outline: 3px solid var(--kp-bs-ink); outline-offset: 4px; }

.kp-bs-mentor-oben { top: 2.6%; }
.kp-bs-mentor-unten { bottom: 9%; align-items: flex-end; }

.kp-bs-hex > div { width: 100%; height: 100%; clip-path: inherit; background: var(--kp-bs-hexbg); overflow: hidden; }

.kp-bs-wave { position: absolute; width: 40%; height: 62%; color: var(--kp-bs-wave); pointer-events: none; }

.kp-bs-form input::placeholder { color: #7a7a7a; }
.kp-bs-form input:focus-visible { outline: 2px solid var(--kp-bs-ink); outline-offset: 2px; }
.kp-bs-go { flex: none; width: max(44px, 4.5cqi); aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; background: var(--kp-bs-btn); color: #fff; display: grid; place-items: center; cursor: pointer; }

.kp-bs-rules li.ok { color: #145c2e; }
.kp-bs-zoom .kp-bs-device { transform-origin: var(--x) var(--y); animation: kp-bs-zoom .55s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes kp-bs-zoom { from { transform: scale(.12); opacity: .3; } to { transform: none; opacity: 1; } }
/* Comic: Sechseck und Rand schwarz, Punkt und Knopf in der Signalfarbe, Bildschirm grau, eckig */
.kp-style-comic .kp-bs { --kp-bs-wall1: #DEDEE2; --kp-bs-wall2: #EAEAED; --kp-bs-floor: #D2D2D6; --kp-bs-ink: #1A1A1C; --kp-bs-line: #1A1A1C; --kp-bs-btn: var(--kp-primary); --kp-bs-spot: var(--kp-primary); --kp-bs-scr: #C9C9CD; --kp-bs-wave: #6E6E76; }

/* ---------- Den Bildschirm nutzen (Prüfung 19.10.2026, Vorbilder aus der bildungsinnovator-Bibliothek: Bilder laufen bis an
   den Rand, Übungen stehen auf Bildern, Videos ohne graue Fläche drumherum) ---------- */
/* Übungsfolie: auf hohen Bildschirmen wächst die Übung mit (Fragezeile, Abstände der Antworten), statt klein mittig zu stehen */

.kp-uebung-foto.kp-on-dark :is(.kp-reflect, .kp-plan) .kp-q, .kp-bilduebung-panel.kp-on-dark :is(.kp-reflect, .kp-plan) .kp-q { color: var(--kp-title); }
