<script>
/* Portfolio-Fassung: nur die ersten fuenf Folien, danach Gespraechsangebot */
(function () {
  var MAIL = 'kerstinrafai@gmail.com';
  var css = '.kp-toc-fs,[data-fullscreen]{display:none!important}#kp-main:focus,#kp-main:focus-visible{outline:none!important;box-shadow:none!important}' +
    '.kr-gate{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:20px;background:rgba(20,24,30,.72)}' +
    '.kr-gate-box{position:relative;max-width:520px;width:100%;background:#fff;color:#1d2228;border-radius:6px;padding:34px 32px 26px;font:16px/1.6 "Segoe UI",system-ui,sans-serif;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}' +
    '.kr-gate-box small{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#2f5fb3;margin-bottom:10px}' +
    '.kr-gate-box h2{margin:0 0 12px;padding-right:36px;font-size:28px;line-height:1.2;font-weight:700;color:#1d2228}' +
    '.kr-gate-box p{margin:0 0 22px;color:#4a525c}' +
    '.kr-gate-x{position:absolute;top:12px;right:12px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:transparent;color:#1d2228;font:inherit;font-size:24px;line-height:1;cursor:pointer}' +
    '.kr-gate-x:hover{background:#eef1f5}' +
    '.kr-gate-row{display:flex;flex-wrap:wrap;gap:10px}' +
    '.kr-gate-row a{display:inline-flex;align-items:center;min-height:46px;padding:10px 20px;border-radius:4px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:1.5px solid #2f5fb3}' +
    '.kr-gate-row .kr-main{background:#2f5fb3;color:#fff}' +
    '.kr-gate-row .kr-sec{background:#fff;color:#2f5fb3}' +
    '.kr-gate-mail{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:16px;font-size:15px;color:#4a525c}' +
    '.kr-gate-mail b{color:#1d2228;font-weight:600;user-select:all}' +
    '.kr-gate-copy{min-height:32px;padding:4px 12px;border:1px solid #c9d1db;border-radius:4px;background:#fff;color:#1d2228;font:inherit;font-size:14px;cursor:pointer}' +
    '.kr-gate-back{margin-top:14px;padding:6px 0;border:0;background:none;color:#4a525c;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}' +
    '.kr-gate a:focus-visible,.kr-gate button:focus-visible{outline:3px solid #2f5fb3;outline-offset:2px}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  var open = false, box = null, dismissed = false;
  function topWin() { try { if (window.top && window.top.location.href) return window.top; } catch (e) {} return window; }
  function show() {
    if (open || dismissed) return; open = true;
    var subject = 'Anfrage nach der Kursprobe: ' + document.title.replace(/\s*\([^)]*\)\s*$/, '');
    var href = 'mailto:' + MAIL + '?subject=' + encodeURIComponent(subject);
    box = document.createElement('div');
    box.className = 'kr-gate';
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'kr-gate-t');
    box.innerHTML = '<div class="kr-gate-box"><button class="kr-gate-x" type="button" aria-label="Fenster schließen">✕</button>' +
      '<small>Ende der Leseprobe</small>' +
      '<h2 id="kr-gate-t">Weiter geht’s mit einem Gespräch.</h2>' +
      '<p>Das waren die ersten fünf Folien. Stellen Sie mir Ihren Bedarf vor: Thema, Zielgruppe und Umfang. Den ganzen Kurs zeige ich Ihnen gern persönlich.</p>' +
      '<div class="kr-gate-row"><a class="kr-main" href="../../index.html#kontakt" target="_top">Gespräch anfragen</a>' +
      '<a class="kr-sec" href="' + href + '" data-kr-mail>E-Mail schreiben</a></div>' +
      '<div class="kr-gate-mail">Oder direkt an <b>' + MAIL + '</b><button class="kr-gate-copy" type="button">Kopieren</button><span class="kr-gate-ok" role="status" aria-live="polite"></span></div>' +
      '<button class="kr-gate-back" type="button">Zurück zu Folie 5</button></div>';
    document.body.appendChild(box);
    box.querySelector('.kr-gate-x').addEventListener('click', function () { dismissed = true; close(); });
    box.addEventListener('click', function (e) { if (e.target === box) { dismissed = true; close(); } });
    box.querySelector('[data-kr-mail]').addEventListener('click', function (e) {
      /* Im eingebetteten Kursfenster oeffnet ein mailto-Link sonst im Rahmen und bricht ab */
      e.preventDefault();
      var w = topWin();
      try { w.location.href = href; } catch (err) { window.open(href, '_blank'); }
    });
    box.querySelector('.kr-gate-copy').addEventListener('click', function () {
      var ok = box.querySelector('.kr-gate-ok');
      function done() { ok.textContent = 'Kopiert'; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(MAIL).then(done, fallback); else fallback();
      function fallback() {
        var t = document.createElement('textarea'); t.value = MAIL; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); done(); } catch (e) { ok.textContent = 'Bitte markieren und kopieren'; }
        t.remove();
      }
    });
    box.querySelector('.kr-gate-back').addEventListener('click', function () {
      var b = document.querySelector('[data-back]');
      close(); if (b) b.click();
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); dismissed = true; close(); return; }
      if (e.key === 'Tab') {
        var f = box.querySelectorAll('a,button'), first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      e.stopPropagation();
    }, true);
    box.querySelector('.kr-main').focus();
  }
  function close() { if (box) box.remove(); box = null; open = false; }
  function check() {
    var end = document.getElementById('kr-ende') || document.querySelector('.kp-result');
    if (end && end.getClientRects().length) show();
    else if (!end) { dismissed = false; if (open) close(); }
  }
  new MutationObserver(check).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('scroll', check, { passive: true });
  check();
})();
</script>
